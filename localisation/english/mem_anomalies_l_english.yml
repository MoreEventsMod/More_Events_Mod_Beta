 
l_english:
 mem_long_structure_category:0 "Long Structure"
 mem_long_structure_category_desc:0 "Scanners have picked up a cluster of artificial materials on the surface of [Planet.GetName]. It appears an installation of some sort was built on [Planet.GetName]'s surface for some unknown purpose, in a shape of a long, straight line."
 mem_anomalies.1.name:0 "A Monument to all Your Spins"
 mem_anomalies.1.desc:0 "Although the structure appears to be shielded from environmental hazards such as radiation and asteroid impacts, our scientists had no issues getting inside.\n\n What [Leader.GetName] saw inside was quite unusual. It appears the structure is housing a massive line of simple mechanical gears, connected to gradually reduce each gear's rotation speed and a power source spinning the first. The exact reduction factor is difficult to estimate until each gear has been catalogued, but most likely our galaxy will cease to exist before the last gear will even move.\n\Who and why built this is a mystery."
 mem_anomalies.1.b:0 "Scrap the Complex"
 mem_anomalies.1.c:0 "Such is the nature of time"