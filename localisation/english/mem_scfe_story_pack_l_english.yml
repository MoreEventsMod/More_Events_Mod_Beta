# Biggest Show of the World
 mem_scfe_biggest_show_of_world_site: "Biggest Show of the World"
 mem_scfe_biggest_show_of_world_site_desc: "Automated probes surveyed remnants of structures and advanced technologies.\nFurther scans revealed that they left behind eloquent testimonies to their existence: quaint towns, orderly suburbs, a well-furnished societal framework, and serene natural landscapes, mostly preserved. Our scans reveal an eerie stillness, however, with no life forms detected."
 mem_scfe_biggest_show.1.name: "Automaton"
 mem_scfe_biggest_show.1.desc: "Since the first landing, our research team has delved into the heart of a small city nestled among the ruins, which appears to have been the nerve center of the planet. Our preliminary investigations have unearthed two pivotal revelations.\nFirstly, isolation is an illusion here. The planet teems with countless figures resembling dolls, eerily mimicking life forms. Adorned in various attires, they seem designed for assorted tasks, suggesting a substitute for a once-thriving populace. Now, they lie in a dormant state, a silent army awaiting activation.\nSecondly, the planet is astonishingly well-preserved. Despite the cessation of most facilities from energy depletion, a core maintenance system hums in the background, dutifully performing its role. Our next objective is clear: we must unearth the control hub to unravel this enigma."
 mem_scfe_biggest_show.2.name: "Show of Puppets"
 mem_scfe_biggest_show.2.desc: "In their meticulous examination of the dolls, our researchers encountered a perplexing anomaly. Against their initial suppositions, approximately 30% of the dolls bore the likeness of children, and 20% mirrored the elderly - an oddity, considering the impracticality of such forms for laborious tasks.\nEvery dwelling was inhabited exclusively by these dolls, devoid of any signs of conventional life. Even more baffling was their arrangement, meticulously placed to mimic familial units. Furthermore, the presence of factories, educational institutions, and cultural centers, all staffed by these silent sentinels, deepens the mystery. "
 mem_scfe_biggest_show.3.name: "Awakening"
 mem_scfe_biggest_show.3.desc: "In the midst of their investigations, our expedition team chanced upon a dormant energy node, a potential source of power for the planet's control systems. After a thoughtful debate, the decision was made to infuse the node with energy. The moment the system was energized, a cacophony of piercing sounds filled the air.\nIt appears that this action simultaneously roused the dolls from their slumber. Their voices, indecipherable as of yet, seemed to carry the warmth of a greeting, though it was directed towards an unknown entity rather than our crew. Intriguingly, all the dolls seemed to be invoking the same figure, who is evidently not among our team.\nWhile direct communication with the dolls remains elusive, it's clear they share a unified purpose."
 mem_scfe_biggest_show.4.name: "Show of Life"
 mem_scfe_biggest_show.4.desc: "At last, the control center was unveiled, ingeniously concealed within the planet's dense clouds. Our system analysis shed light on the planet's true purpose.\nIt transpires that this planet was a stage for a production of extraordinary scale - a show where the lead was a living person unaware of their starring role. The infrastructure of the planet meticulously mimicked the ordinary life of their civilization for the spectacle. Hidden away, we uncovered a trove of recordings, chronicling a saga spanning generations, an epic that unfolded over millennia, crafted for the eyes of one.\nEach protagonist, emerging from an isolated hamlet, led a serene life, ultimately leaving the world in ignorance of their part in this elaborate masquerade. As epochs turned, the show's narrative evolved - from the early dramas filled with political intrigue, passionate love, and adventurous trials, to the unadorned beauty of everyday existence. Life's simple pleasures and pains played out in a narrative that promised its characters, without exception, a joyous denouement. Now, the time has come to unearth the motive behind this millennia-long drama."
 mem_scfe_biggest_show.5.name: "Protagonist of the World"
 mem_scfe_biggest_show.5.desc: "Our team breached the directorial archives within the system, uncovering the twilight of a once-great civilization. This society, after reigning over a vast expanse of the galaxy, succumbed to a slow decay across millennia. As their golden age waned, overpopulation and resource exhaustion led to widespread suffering.\nIn a bold move, the leaders conceived a distraction - a grand spectacle mirroring their civilization's halcyon days, intended to eclipse the grim realities of daily life. The show, a nostalgic homage to an era of abundance, ensnared the hearts and minds of the populace, including its originators.\nOriginally featuring professional actors, the show's popularity burgeoned, compelling the casting of ordinary individuals as its stars. This culminated in the selection of an infant as the lead, a decision fueled by fervent public desire. The show garnered impassioned reviews, with audiences lavishing the protagonist with love, envy, and adulation.\nAbruptly, the broadcast ceased. It appears the civilization, in a desperate bid to sustain their final narrative, cannibalized their planets for resources until nothing remained. This show stands as their singular inheritance. But what became of the unwitting lead who lived a lifetime on display?"
 mem_scfe_biggest_show.6.name: "Bad End"
 mem_scfe_biggest_show.6.desc: "In the depths of a primeval forest, our search concluded with the discovery of the show's main character. His sparse chronicles allowed us to piece together the show's climactic turn.\nThe end was as sudden as it was dramatic. First, the dolls ceased their performance, likely a result of the home planet's failure to transmit further instructions. Then, the societal edifices crumbled, presumably from the severance of the energy lifeline. Confronted with the reality that his loved ones were automatons and his life a scripted illusion, the protagonist endured the agony of truth.\nYet, from the ashes of his world, a new resolve ignited within him to escape. Surrounding his remains lay the evidence of his determination: rudimentary contraptions, aircraft, and the skeletal frames of rockets - each a testament to his unyielding spirit.\nAlas, his final venture was also his undoing. The story that seemed eternal met a solemn end with the protagonist's death.\nAs we reflect upon his lonely saga, we're left to ponder the direction of our own narrative."
 mem_scfe_biggest_show.6.a: "What a shame..."
 r_mem_scfe_protagonist_of_the_show: "Protagonist of the Show"
 r_mem_scfe_protagonist_of_the_show_desc: "This dried up deceased xeno was the last joy, survivor, and symbol of a collapsed ancient civilization... well, it's just a corpse at this moment."
 mem_scfe_protagonist_of_the_show_relic_activated: "$r_mem_scfe_protagonist_of_the_show$"

# The First Music
 mem_scfe_first_music.1.name: "The Signal"
 mem_scfe_first_music.1.desc: "Recent violent solar storms have stripped away part of §Y[From.Planet.GetName]§!'s atmosphere. This resulted in our ability to detect previously hidden signals. In the immediate wake of the solar disturbance, the signals were heavily garbled with noise. However, as stellar conditions have returned to base level interference, the clarity of these signals has improved. Our scientists have pinpointed their origin to the planet's surface."
 mem_scfe_first_music_site: "The First Music"
 mem_scfe_first_music_site_desc: "$mem_scfe_first_music.1.desc$"
 mem_scfe_first_music.2.name: "Senior Planet"
 mem_scfe_first_music.2.desc: "Our team found out that the bedrock of this [From.Planet.GetName] is one of the oldest we have documented so far. Heat signature from the core seem weak and suggest the gradual thermal decline of the planet's core. It's possible that we are observing the final epoch [From.Planet.GetName]. With less interference due to the eerie nature of this ancient planet, the team ist proceeding to locate the signal. As far as we can tell it broadcasted from beneath the surface."
 mem_scfe_first_music.3.name: "The Spherical Object"
 mem_scfe_first_music.3.desc: "While probing the surface layers of [From.Planet.GetName] the archaeological team has unearthed a spherical device engaged in signal transmission. As the explorers drilled through dense geological layers, the signal intensified. Upon breaching a formidable layer of calcite, the source a compact, orbicular, metallic machine, alien in design was revealed. Once discovered, the machine ceased its broadcast, lapsing into silence. Attempts to understand internal mechanics were thwarted by its impenetrable shell. As it stands any chance of reactivating it seems lost.Perhaps its final transmission holds information."
 mem_scfe_first_music.3.a: "Gather the intellects of our Empire."
 mem_scfe_first_music.3.b: "Prepare the Brain Drones."
 mem_scfe_first_music.3.c: "Allocating Calculator Resources."
 mem_scfe_first_music.4.name: "Analysis of the Signal"
 mem_scfe_first_music.4.desc: "The enigmatic signals emanating from the machine were encoded in a complex cipher. The brightest minds of our [owner.GetName] have toiled ceaselessly, utilizing all the computational might in the effort to decrypt the message. The complex signal seems to be constructed in a rhythmic cadence.\nIndeed, the signal proofed to be a form of music cast into the cosmos. The waveforms, translated with the right decyphering alghorithm, are as beautiful as intrigued. While any purpose eludes our scientists and the machine which broadcasted seems ignoring any response, the lofty impact on our society after hearing the music can be felt all around [owner.GetName]."
 mem_scfe_first_music.4.a: "Fiat Lux, Let there be light."
 mem_scfe_Fiat_Lux: "Music - Fiat Lux"
 mem_scfe_Fiat_Lux_desc: "The discovery of '§YFiat Lux§!' has deeply enriched our society, and from the most luxorious planets to the poorest planets of the Empire, citizens of all ages and backgrounds are enjoying this music. Maybe this is the real power of the music."
 r_mem_scfe_music_of_the_universe: "Music Sheet of the Universe"
 r_mem_scfe_music_of_the_universe_desc: "This is a piece of music obtained from an encrypted signal. "
 mem_scfe_music_of_the_universe_modifier: "Music Sheet of the Universe"
 mem_scfe_music_of_the_universe_modifier_desc: "This music sheet must be the first in the universe..."
 SCFE_SIGNAL_ANALYSIS_OF_MACHINE_PROJECT: "Analyse the Machine's Signal"
 SCFE_SIGNAL_ANALYSIS_OF_MACHINE_PROJECT_DESC: "We should analyze the last signal of the machine, which we recorded on §Y[Root.GetName]§!. It will take a long time, but would answer many questions asked by our scientists."

 # Tomb of Space Whales
 mem_scfe_whale_tomb_site: "Tomb of the Space Whales"
 mem_scfe_whale_tomb_site_desc: "The unqiue composition of §Y[From.Planet.GetName]§!'s surface has drwan attention after first long range images surfaced. It contains numerous stratified layers brimming with the fossilized remains of ancient beings, evenly spaced, indicating the planet experienced consistent cycles of ecological flourishing and mass extinction.\n\nThe most recent cataclysm dates back 200 million years. It appears to have been abrupt, given that the planet's current biosphere is limited to protozoan organisms with a rudimentary genetic composition.\nThis planet evidently falls into the category of 'unfortunate' habitable worlds. However, a contentious issue remains: the size of the ancient fossils."
 mem_scfe_whale_tomb.1.name: "Tomb"
 mem_scfe_whale_tomb.1.desc: "The colossal entities discovered were spacefaring Tiyanki whales, known to converge upon a designated planet from a collectively acknowledged roster for their final resting place. §Y[From.Planet.GetName]§! was, regrettably, one of these selected destinations.\nThe smaller fossilized beings were the indigenous inhabitants of the planet, inadvertent casualties of the Tiyanki's death rites. Simulations of the Tiyanki's ungraceful descend predict devastion equal in destructive power to orbital bombardment.\n\nIn strata dating back 600 million years, indistinct remnants of what might have been a sentient civilization linger. A more profound investigation may well reveal further insights."
 mem_scfe_whale_tomb.2.name: "$primitive_plural$"
 mem_scfe_whale_tomb.2.desc: "Our investigation has confirmed the existence of a sentient species on this planet, who thrived even as the space whales' "funerals" were frequent occurrences. Inscriptions revealed their name as the Infelix. These primitives possessed advanced mechanical knowledge and created moving cities. Shown by several ruines that look like towers with legs. Several of these structures contain advanced Observatories with which they presumly estimated incoming Tiyanki. Powered by the near-inexhaustible amount of carcasses many of these mobile bases used fossil fuel to power themselves."
 mem_scfe_whale_tomb.3.name: "Fossil"
 mem_scfe_whale_tomb.3.desc: "Our team has detected signs of the civilization's nascent stages at a site far from the previously uncovered ruins.\n\nIt has been revealed that even in their formative years, this civilization harnessed the remains of the whales, as evidenced by the deliberate markings on the fossils. These early denizens actively exploited the Tiyanki cadavers, a stark contrast to their descendants. They depended entirely on the deceased leviathans for essential materials, going so far as to utilize the carcasses as shelters.\n\nWhile there were local variances in the sophistication of the tools applied to the whale remains, a commonality emerged: artistic expressions, such as symbols crafted from whale bones, were prevalent across most regions.\n\nThe exact significance of these symbols remains elusive, but  each deeper layer passed increases the complexity of these symbols."
 mem_scfe_whale_tomb.4.name: "Shelter"
 mem_scfe_whale_tomb.4.desc: "Our archaeological team has made an astonishing find: a structure resonating with the civilization's distinctive architectural style but possessing a technological sophistication that aligns with the space faring civilizations, a stark contrast to the primitive ruins above. It seems implausible that a civilization of such advancement would plummet to primitivism solely due to the descent of giant whales from the heavens.\n\nThis discovery refutes the prevailing theory that the Tiyanki whales' funerals were the catalyst for the planet's recurring extinctions. The team's findings suggest that while the impact of the falling whales is indeed destructive, yet it is not catastrophic enough to obliterate an entire civilization. This leaves our researchers in a state of bewilderment concerning the recent findings."
 mem_scfe_whale_tomb.5.name: "Extinction"
 mem_scfe_whale_tomb.5.desc: "The deeper our excavation team delved, the more they uncovered the remnants of a once opulent and thriving planetary empire on the cusp of space travel when it met its untimely end.\n\nThis  society wielded space-age technology and thrived by utilizing the remains of the whales as resources. They were well aware of the challenges they faced. At the height of their power, the descent of the whales was no longer a source of dread but merely a hurdle in their quest for cosmic exploration.\n\nHowever, several records and craters show signs of explosions while a regular warhead would be plausible the markings always stem from places where carcasses should be. This creates the leading theory that somehow the whale carcasses detonated."
 mem_scfe_whale_tomb.6.name: "Karma"
 mem_scfe_whale_tomb.6.desc: "Tiyanki space whales, by nature, do not combust post-mortem due to an intrinsic shielding within their bodies. The vast quantities of organic matter typically remain inert, either decomposing silently beneath the surface or transmuting into different substances. On the rare occasion that they do explode on the surface, the resultant toxic gases are negligible and ephemeral, dissipating quickly into the upper atmosphere without causing harm.\n\nHowever several documents revealed that the civilization which lived here tried to shoot down any incoming carcass. Reports suggest the first-strike provoked any Tiyanki in orbit and they responded en masse with violence. Countless Tiyanki whales converged on the planet in a vengeful charge, a vividly depicted crisis in the empire's records.\n\nThe mix of warheads and carcasses gasses formed lethal amounts of toxic air killing nearly all inhabitants of [from.planet.GetName] and ending any possibility of returning to space"
 mem_scfe_whale_tomb.6.a: "Their were just out of luck."
 mem_scfe_whale_tomb.6.b: "More Reasons to hunt those whales."
 mem_scfe_whale_tomb.6.c: "There are numerous deposits of gases remaining."
 mem_scfe_whale_tomb.6.d: "A tragic Story."
 mem_scfe_whale_tomb.6.e: "Fresh Corpses?"
 mem_scfe_whale_fossil: "Whale Fossils"
 mem_scfe_whale_fossil_desc: "The planet once used as a tomb world by Tiyanki Space Whales. There's a lot of whale fossils in its stratum, making it hard to develop its mining industry."
 mem_scfe_whale_fossil_2: "Whale Corpses"
 mem_scfe_whale_fossil_2_desc: "The planet is used as a tomb world by Tiyanki Space Whales. There's a lot of whale corpses in its stratum, making it easy to raise new tiyanki from the dead."
 mem_scfe_site_whale_lesson: "Lesson of Whale tomb world"
 mem_scfe_whale_hunt: "Whale Hunting"

 # Soul of the Art
 mem_scfe_soul_of_the_art_site: "Soul of the Art"
 mem_scfe_soul_of_the_art_site_desc: "An extraordinary tomb world boasting kilometers upon kilometers of what appears to be deliberately colored terrain has been discovered. Orbiting this planet is a multitude of debris, likely the vestiges of ships from an ancient civilization, adorned with outlandish patterns. Furthermore, consistent signals emanate from the planet, prompting our team's keen interest in exploration."
 mem_scfe_soul_of_the_art.1.name: "Fleet Remains"
 mem_scfe_soul_of_the_art.1.desc: "Analysis of the debris suggests a clash between two distinct fleets, each with unique designs, in the planet's orbit. The bulk of the wreckage is attributed to what we have dubbed the §HPainted Fleet§!, comprised of ships with elaborate, colorful patterns and a simplistic architecture, indicative of rapid mass production. Notably, these vessels lack essential amenities for their crew, such as dining facilities and sanitation. In contrast the other fleet presents an austere exterior but contains intricate symbolic adornments internally, along with remnants of Zro.\n\nThe presence of disproportionately large chambers within suggests they may have served religious functions, as inferred from the discovered decorative artifacts. Regrettably, data is  posing challenges to further elucidation. Therefore, dispatching a reconnaissance team to the planet for comprehensive examination is recommended."
 mem_scfe_soul_of_the_art.2.name: "Colorful Ruins"
 mem_scfe_soul_of_the_art.2.desc: "Our expedition team has uncovered largely unscathed remnants of a civilization on the vibrantly hued planet, showing no traces of warfare or ruinous events. The chaotic brushwork upon the terrain is too erratic to imply any deliberate pattern. Some edifices have deteriorated, but it is established that their collapse resulted from prolonged exposure to the elements and tectonic shifts, rather than aggressive destruction.\n\nScattered across the planet's surface are the wrecks of the §HPainted Fleet§! vessels. Our analysis indicates that the majority met their end due to abrupt internal electrical failures rather than from combat damage. Presently, there is no evidence of intelligent life - only the silent testimony of robotic remains, their once vivid coatings now faded and flaking, strewn amidst the colorful ruins and shipwrecks."
 mem_scfe_soul_of_the_art.3.name: "Painted Remains"
 mem_scfe_soul_of_the_art.3.desc: "Within a structure, our team has discovered robots painted in a spectrum of colors that echo the planet's surface. Unlike their counterparts exposed to the ravages of time, these robots remain preserved with minimal environmental damage.\n\nIt appears these robots ceased operations amidst chaotic artistic endeavors, painting the walls haphazardly or etching images and enigmatic symbols into the walls with chisels and hammers. Their circuits have deteriorated beyond repair.\n\nIntriguingly, the seemingly disordered painted patterns on the rocks and building exteriors are now understood to be vast repositories of information. This discovery holds the potential for us to decode and possibly reconstruct the narrative of this civilization's demise."
 mem_scfe_soul_of_the_art.4.name: "The Discord"
 mem_scfe_soul_of_the_art.4.desc: "Our linguists have deciphered the planet's persistent signals as a form of music, albeit with lyrics that lack coherent meaning - comprised mainly of redundant phrasing and discordant pitch variations, resulting in an unpleasant auditory experience.\n\nThe content of the lyrics reveres and questions the concept of the soul, expressing trepidation towards enigmatic entities from alternate dimensions. This thematic analysis has enabled us to interpret the painted inscriptions adorning the planetary surface. These inscriptions, akin to poetry or other literary forms, delve into metaphysical quandaries - pondering the essence of life, the transience of souls, and fears incited by obliteration. However, they lack rhythmic structure and possess scant literary sophistication."
 mem_scfe_soul_of_the_art.5.name: "Research Facility"
 mem_scfe_soul_of_the_art.5.desc: "Beneath the surface lies a colossal research complex. Despite extensive circuitry damage, some rudimentary devices have withstood the test of time. Analysis by our researchers suggests that this civilization was composed of machines sharing a collective consciousness.\n\nDelving into the remnants of their databases has unveiled knowledge of an alternate realm known as the Shroud, and a colossal weapon capable of harnessing energy from this dimension to unleash planetary destruction. We have uncovered records of the attacker vessels, detailing the machine civilization's defensive strategies and their encounters in battle, as well as their research on Zro.\n\nRemarkably, the preponderance of archival material focuses on the arts. The facility is a trove of cultural artifacts - paintings, literary works, and musical compositions from various civilizations, alongside studies dedicated to these artistic expressions."
 mem_scfe_soul_of_the_art.6.name: "The End"
 mem_scfe_soul_of_the_art.6.desc: "From the unearthed data, the fate of this planet has been pieced together. It fell victim to a Zro-infused psionic weapon and was ultimately obliterated.\n\nPrior to this catastrophe, the Gestalt Consciousness discerned that the weapon's destructive capacity was ineffective against organic beings. It hypothesized that through an appreciation of art - a pursuit uniquely cherished by organics - the machine entities that formed the collective consciousness could cultivate souls, thereby rendering themselves impervious to the Shroud's assault.\n\nIn pursuit of this immunity, the civilization embarked on a fervent acquisition and examination of artistic knowledge. They endeavored to mimic organic creativity, attempting to sing, write, and even decorate the planet's surface, their ships, and themselves. Despite these efforts, the Gestalt Consciousness's creations lacked the essence of true artistry, and it was ultimately vanquished by the weapon it sought to evade."
 mem_scfe_soul_of_the_art.6.a: "It was futile attempt..."
 mem_scfe_soul_of_the_art.6.b: "We will remember them."

 # King of the Underground City
 mem_scfe_king_of_underground_city_site: "King of the Underground City"
 mem_scfe_king_of_underground_city_site_desc: "Upon initial observation, §Y[From.Planet.GetName]§! presents as an archetypal desert world, uninhabitaded. Yet, our orbital scanners have detected faint signals from under the surface and acoustic emissions emanating from beneath, specifically from underground caverns. A conventional ground expedition is necessary to investigate further."
 mem_scfe_king_of_underground_city.1.name: "Underground City"
 mem_scfe_king_of_underground_city.1.desc: "An excavation and transportation vessel has been dispatched to §Y[From.Planet.GetName]§!. The team unearthed an underground metropolis, its scale far exceeding prior estimations. The city's architects, while seemingly sentient, were pre-FTLs. They constructed and sustained substantial subterranean structures. It is surmised that they sought refuge from the surface's extreme desert heat and to utilize subterranean aquifers.\n\nFurther analysis is imperative to ascertain the causes behind the civilization's collapse, especially given the abundance of remnants left in wake."
 mem_scfe_king_of_underground_city.1.a: "That will be easy."
 mem_scfe_king_of_underground_city.2.name: "Endless Records"
 mem_scfe_king_of_underground_city.2.desc: "The city is replete with documents, suggesting that its denizens placed great importance on record-keeping. Despite employing relatively rudimentary methods, they maintained meticulously systematic archives, even within the smallest communal entities.\n\nThis propensity for documentation is both fortuitous and burdensome; it presents an exceptional opportunity for in-depth research and analysis but also imposes a significant workload on our expedition team.\n\nThe bulk of these archives chronicle their ancient history, shedding light on the social structures and biological traits of the city's inhabitants. They appear to have appointed their wisest members as sovereigns, whose authority was upheld until their death. The historical accounts indicate that under this governance, they thrived, leveraging their industrious and cohesive nature to its fullest potential."
 mem_scfe_king_of_underground_city.3.name: "Core Archive"
 mem_scfe_king_of_underground_city.3.desc: "The central repository, designated for their most critical data - including the sovereign's dwelling and the final administrative documents preceding their downfall - has been unearthed following the decryption and analysis of retrieved data. Furthermore, near-complete decryption of their language has led our researchers to a startling revelation: §Y[From.Planet.GetName]§! was once an arctic world. The subterranean city was constructed atop geothermal vents as a sanctuary from the frigid surface.\n\nCatastrophic climate shifts, triggered by planetary anomalies, gradually incited a temperature rise, culminating in the desertification of the entire planet, an event that likely precipitated the inhabitants' extinction.\n\nA document from the central archives indicates that the city's inhabitants were aware of their species' acute susceptibility to even minor climatic variations. It also reveals that they had been urged to pool their resources and follow a strategy proposed by the most esteemed ruler in their history, in an attempt to combat the impending climatic catastrophe."
 mem_scfe_king_of_underground_city.4.name: "The Throne"
 mem_scfe_king_of_underground_city.4.desc: "As our research team approaches the palace, the historical records unearthed grow increasingly somber. One such document details a list of casualties - victims of an accident that occurred while deactivating a geothermal vent. Another chronicles a decree mandating the consolidation of two sectors due to the decimation of one sector's population.\n\nAt the journey's end, a throne was discovered. This throne, it transpired, was a terraforming apparatus, a revelation made all the more remarkable by the fact that this civilization had never achieved space travel. \n\nThe researchers managed to activate the king's personal recording device, which poignantly played back his final, remorse-filled message. The king had devised a brilliant solution to their predicament, but by then, nearly all his subjects had perished."
 mem_scfe_king_of_underground_city.4.a: "Activate the device."
 mem_scfe_king_of_underground_city.4.b: "Retrieve the device."
 mem_scfe_king_of_underground_city.4.c: "Pay respects to this ancient king."
 mem_scfe_ancient_terraforming_technology: "Ancient Terraforming Technology"
 mem_scfe_tomb_of_the_king: "King's Tomb"

 # When the World Sings
 mem_scfe_when_the_world_sings_site: "When the World Sings"
 mem_scfe_when_the_world_sings_site_desc: "Enigmatic sounds, akin to music, permeate §Y[From.Planet.GetName]§!, resonating from every corner of the planet."
 mem_scfe_when_the_world_sings.1.name: "When the World Sings"
 mem_scfe_when_the_world_sings.1.desc: "Something peculiar about §Y[From.Planet.GetName]§! has come to light. While orbital observations have not detected any physical anomalies, a persistent sound characterized by distinct intervals and pitch has been discerned, audible planet-wide.\n\nThis planet seems to be suffused with melodious sounds - or at least, auditory sequences reminiscent of music. These sounds reportedly evoke a sense of ease and are described as exceptionally gratifying by listeners."
 mem_scfe_when_the_world_sings.2.name: "Source of the Music"
 mem_scfe_when_the_world_sings.2.desc: "The source of the music has been traced to ruins spread throughout the planet. These structures are inhabited by groups of living creatures. These organisms generate sound through organ structures analogous to vocal cords, resulting in the planet's symphony being performed by a chorus of singing invertebrates!\n\nIt is unclear if these creatures are the original creatures of the structures or, if not, what happenend to them."
 mem_scfe_when_the_world_sings.3.name: "Planet-Scale Research Project"
 mem_scfe_when_the_world_sings.3.desc: "The clues unearthed suggest that §Y[From.Planet.GetName]§! served as a staging ground for an ambitious planetary research initiative. Analysis of data from various ruins has shed light on the objectives of the ruin-builders, revealing their advanced capabilities in genetic manipulation and brain science. It appears that these ruins were once centers dedicated to this intricate field of study.\n\nThe fragments of information we have deciphered indicate that their scientific endeavors were directed towards lofty goals of Ascension and Transcendence. A recurring theme in their work is the notion of 'Blooming' - a concept that captivated their scholarly pursuits. The current state of the ruins and the planet itself leaves it ambiguous whether they ever realized the fruits of their research.\n\nThe enigma of this 'Blooming' will to be the focal point of our ongoing investigation."
 mem_scfe_when_the_world_sings.4.name: "Blooming"
 mem_scfe_when_the_world_sings.4.desc: "Subsequent scrutiny of the information retrieved from the research outposts has yielded a significant discovery: the enigmatic Blooming project. The architects of the ruins were engrossed in the creation of an artificial gestalt consciousness, which they envisaged as the zenith of their evolutionary journey. They postulated that such a unified collective intellect would eradicate societal strife and usher in an era of unprecedented enlightenment. Their methodology hinged on cultivating neural connections through gene therapy, connections that were to be shared amongst their populace.\n\nIt seems their theoretical work bore fruit: the Blooming project was actualized by permeating their atmosphere with a retrovirus designed to disperse the gene therapy. Although the virus has since become extinct, the absence of any other sentient life forms suggests that it proliferated across their entire species. The theory posits that the melodic organisms residing within the ruins may indeed be the transformed remnants of the ruin-builders"
 mem_scfe_when_the_world_sings.5.name: "Gestalt Consciousness"
 mem_scfe_when_the_world_sings.5.desc: "Our expanded investigation into the vocalizing entities has verified that the ruin-builders achieved the formation of a gestalt consciousness, albeit partially. The 'singing' is, in fact, a collective vocal manifestation of their interconnected neural states - perfectly synchronized and indicative of a hive mind. From our observations, it is apparent that the Blooming project attained its goal.\n\nYet, a deeper examination of their neural responses suggests a troubling reality. This collective consciousness is expressing a singular, overwhelming sensation: pain. In the absence of the progenitor retrovirus or the original species, it's challenging to determine whether this adverse outcome occurred during or subsequent to the project's implementation. Nonetheless, the sounds emitted by these creatures are not lofty expressions:\n\n§RIt is a unified, harmonious scream.§!"
 mem_scfe_when_the_world_sings.5.a: "What's done is done, there's no point dwelling on it."
 mem_scfe_when_the_world_sings.5.b: "What can we can learn from this?"
 mem_scfe_when_the_world_sings.5.c: "We will mourn and honor them."
 mem_scfe_singing_planet: "Whistling World"
 mem_scfe_singing_planet_desc: "This world is enchanted by a harmonic tune. While some note the music as melancholy or disturbing, it is impossible not to be mesmerized by the never-ending melody."
 mem_scfe_screaming_planet: "Wailing World"
 mem_scfe_screaming_planet_desc: "What happened on this planet should be a lesson to us all. Nothing can save those organisms, once a promising species, who now live in endless agony emitting a single, unified scream."

 # Precursor Story Pack

