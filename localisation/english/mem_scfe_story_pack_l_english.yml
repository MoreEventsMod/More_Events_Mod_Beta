# Biggest Show of the World
 mem_scfe_biggest_show_of_world_site: "Biggest Show of the World"
 mem_scfe_biggest_show_of_world_site_desc: "Automated probes surveyed remnants of structures and advanced technologies.\nFurther scans revealed that they left behind eloquent testimonies to their existence: quaint towns, orderly suburbs, a well-furnished societal framework, and serene natural landscapes, mostly preserved. Our scans reveal an eerie stillness, however, with no life forms detected."
 mem_scfe_biggest_show.1.name: "Automaton"
 mem_scfe_biggest_show.1.desc: "Since the first landing, our research team has delved into the heart of a small city nestled among the ruins, which appears to have been the nerve center of the planet. Our preliminary investigations have unearthed two pivotal revelations.\nFirstly, isolation is an illusion here. The planet teems with countless figures resembling dolls, eerily mimicking life forms. Adorned in various attires, they seem designed for assorted tasks, suggesting a substitute for a once-thriving populace. Now, they lie in a dormant state, a silent army awaiting activation.\nSecondly, the planet is astonishingly well-preserved. Despite the cessation of most facilities from energy depletion, a core maintenance system hums in the background, dutifully performing its role. Our next objective is clear: we must unearth the control hub to unravel this enigma."
 mem_scfe_biggest_show.2.name: "Show of Puppets"
 mem_scfe_biggest_show.2.desc: "In their meticulous examination of the dolls, our researchers encountered a perplexing anomaly. Against their initial suppositions, approximately 30% of the dolls bore the likeness of children, and 20% mirrored the elderly - an oddity, considering the impracticality of such forms for laborious tasks.\nEvery dwelling was inhabited exclusively by these dolls, devoid of any signs of conventional life. Even more baffling was their arrangement, meticulously placed to mimic familial units. Furthermore, the presence of factories, educational institutions, and cultural centers, all staffed by these silent sentinels, deepens the mystery. "
 mem_scfe_biggest_show.3.name: "Awakening"
 mem_scfe_biggest_show.3.desc: "In the midst of their investigations, our expedition team chanced upon a dormant energy node, a potential source of power for the planet's control systems. After a thoughtful debate, the decision was made to infuse the node with energy. The moment the system was energized, a cacophony of piercing sounds filled the air.\nIt appears that this action simultaneously roused the dolls from their slumber. Their voices, indecipherable as of yet, seemed to carry the warmth of a greeting, though it was directed towards an unknown entity rather than our crew. Intriguingly, all the dolls seemed to be invoking the same figure, who is evidently not among our team.\nWhile direct communication with the dolls remains elusive, it's clear they share a unified purpose."
 mem_scfe_biggest_show.4.name: "Show of Life"
 mem_scfe_biggest_show.4.desc: "At last, the control center was unveiled, ingeniously concealed within the planet's dense clouds. Our system analysis shed light on the planet's true purpose.\nIt transpires that this planet was a stage for a production of extraordinary scale - a show where the lead was a living person unaware of their starring role. The infrastructure of the planet meticulously mimicked the ordinary life of their civilization for the spectacle. Hidden away, we uncovered a trove of recordings, chronicling a saga spanning generations, an epic that unfolded over millennia, crafted for the eyes of one.\nEach protagonist, emerging from an isolated hamlet, led a serene life, ultimately leaving the world in ignorance of their part in this elaborate masquerade. As epochs turned, the show's narrative evolved - from the early dramas filled with political intrigue, passionate love, and adventurous trials, to the unadorned beauty of everyday existence. Life's simple pleasures and pains played out in a narrative that promised its characters, without exception, a joyous denouement. Now, the time has come to unearth the motive behind this millennia-long drama."
 mem_scfe_biggest_show.5.name: "Protagonist of the World"
 mem_scfe_biggest_show.5.desc: "Our team breached the directorial archives within the system, uncovering the twilight of a once-great civilization. This society, after reigning over a vast expanse of the galaxy, succumbed to a slow decay across millennia. As their golden age waned, overpopulation and resource exhaustion led to widespread suffering.\nIn a bold move, the leaders conceived a distraction - a grand spectacle mirroring their civilization's halcyon days, intended to eclipse the grim realities of daily life. The show, a nostalgic homage to an era of abundance, ensnared the hearts and minds of the populace, including its originators.\nOriginally featuring professional actors, the show's popularity burgeoned, compelling the casting of ordinary individuals as its stars. This culminated in the selection of an infant as the lead, a decision fueled by fervent public desire. The show garnered impassioned reviews, with audiences lavishing the protagonist with love, envy, and adulation.\nAbruptly, the broadcast ceased. It appears the civilization, in a desperate bid to sustain their final narrative, cannibalized their planets for resources until nothing remained. This show stands as their singular inheritance. But what became of the unwitting lead who lived a lifetime on display?"
 mem_scfe_biggest_show.6.name: "Bad End"
 mem_scfe_biggest_show.6.desc: "In the depths of a primeval forest, our search concluded with the discovery of the show's main character. His sparse chronicles allowed us to piece together the show's climactic turn.\nThe end was as sudden as it was dramatic. First, the dolls ceased their performance, likely a result of the home planet's failure to transmit further instructions. Then, the societal edifices crumbled, presumably from the severance of the energy lifeline. Confronted with the reality that his loved ones were automatons and his life a scripted illusion, the protagonist endured the agony of truth.\nYet, from the ashes of his world, a new resolve ignited within him to escape. Surrounding his remains lay the evidence of his determination: rudimentary contraptions, aircraft, and the skeletal frames of rockets - each a testament to his unyielding spirit.\nAlas, his final venture was also his undoing. The story that seemed eternal met a solemn end with the protagonist's death.\nAs we reflect upon his lonely saga, we're left to ponder the direction of our own narrative."
 mem_scfe_biggest_show.6.a: "What a shame..."
 r_mem_scfe_protagonist_of_the_show: "Protagonist of the Show"
 r_mem_scfe_protagonist_of_the_show_desc: "This dried up deceased xeno was the last joy, survivor, and symbol of a collapsed ancient civilization... well, it's just a corpse at this moment."
 mem_scfe_protagonist_of_the_show_relic_activated: "$r_mem_scfe_protagonist_of_the_show$"

# The First Music
 mem_scfe_first_music.1.name: "The Signal"
 mem_scfe_first_music.1.desc: "Recent violent solar storms have stripped away a significant part of §Y[From.Planet.GetName]§!'s formerly dense atmosphere. This resulted in our ability to detect previously jammed signals from its surface. In the immediate wake of the solar disturbance, the signals were heavily garbled with noise, however, as stellar conditions returned to regular interference levels, their clarity has improved noticably. Our scientists pinpointed their origin to a location on the [From.Planet.GetPlanetMoon]'s surface."
 mem_scfe_first_music_site: "The First Music"
 mem_scfe_first_music_site_desc: "$mem_scfe_first_music.1.desc$"
 mem_scfe_first_music.2.name: "Ancient World"
 mem_scfe_first_music.2.desc: "Our team found out that the bedrock of [From.Planet.GetName] is one of the oldest we have documented so far, way older than its host star even, identifying it as a captured roque planet. There is barely any heat signature from the core differing from the outer crust. We are apparently  observing the final epoch of a geologically dead world. With less interference due to the now weakened atmosphere, the team effortlessly succeeded in locating the signal's origin several hundred meters below the surface."
 mem_scfe_first_music.3.name: "The Spherical Object"
 mem_scfe_first_music.3.desc: "During our excavation on [From.Planet.GetName] our archaeological team has unearthed the source of the received signals. While excavators had drilled through dense geological layers, the signal continued to intensify until they finally reached a compact, orbicular, metallic machine of alien design. According to our anlysis, this object itself appears to be not that much younger than this world itself.\n\nOnce uncovered, the machine ceased its broadcast, lapsing into silence. Attempts to understand its internal mechanics were so far thwarted by its impenetrable shell. As it stands, any chance of reactivating it seems lost. Perhaps its final transmission holds information."
 mem_scfe_first_music.3.a: "Gather the intellects of our Empire."
 mem_scfe_first_music.3.b: "Prepare the Brain Drones."
 mem_scfe_first_music.3.c: "Allocating Calculator Resources."
 mem_scfe_first_music.4.name: "Analysis of the Signal"
 mem_scfe_first_music.4.desc: "The enigmatic signals previously emitted by the machine were encoded in a complex cipher. Our brightest minds have toiled ceaselessly, utilizing all available computational power in an effort to decrypt the message. The complex signal appears to be constructed in a rhythmic cadence.\n\nIndeed, it proved to be a form of music cast into the cosmos. The waveforms, translated using the correct decyphering alghorithm, are as beautiful as they intriguing. While their purpose eludes us and the machine which broadcasted them remains silent, the profound impact on our society after hearing the music can be felt all over the [owner.GetName]."
 mem_scfe_first_music.4.a: "Fiat Lux, Let there be light."
 mem_scfe_Fiat_Lux: "Music - Fiat Lux"
 mem_scfe_Fiat_Lux_desc: "The discovery of this alien music, later dubbed '§YFiat Lux§!', has deeply enriched our society, from the most luxurious to the poorest quarters of our empire, citizens of all ages and backgrounds are enjoying the power of the music. A truely universal language."
 r_mem_scfe_music_of_the_universe: "Music Sheet of the Universe"
 r_mem_scfe_music_of_the_universe_desc: "This is a piece of music obtained from an encrypted signal. "
 mem_scfe_music_of_the_universe_modifier: "Music Sheet of the Universe"
 mem_scfe_music_of_the_universe_modifier_desc: "This music sheet must be the first in the universe..."
 SCFE_SIGNAL_ANALYSIS_OF_MACHINE_PROJECT: "Analyse the Machine's Signal"
 SCFE_SIGNAL_ANALYSIS_OF_MACHINE_PROJECT_DESC: "We should analyze the last signal of the machine, which we recorded on §Y[Root.GetName]§!. It will take a long time, but would answer hopefully some questions asked by our scientists."

 # Tomb of Space Whales
 mem_scfe_whale_tomb_site: "Tomb of the Space Whales"
 mem_scfe_whale_tomb_site_desc: "The unqiue composition of §Y[From.Planet.GetName]§!'s surface has drwan attention after first long range images surfaced. It contains numerous stratified layers brimming with the fossilized remains of ancient beings, evenly spaced, indicating the planet experienced consistent cycles of ecological flourishing and mass extinction.\n\nThe most recent cataclysm dates back 200 million years. It appears to have been abrupt, given that the planet's current biosphere is limited to protozoan organisms with a rudimentary genetic composition.\nThis planet evidently falls into the category of 'unfortunate' habitable worlds. However, a contentious issue remains: the size of the ancient fossils."
 mem_scfe_whale_tomb.1.name: "Tomb"
 mem_scfe_whale_tomb.1.desc: "The colossal entities discovered were spacefaring Tiyanki whales, known to converge upon a designated planet from a collectively acknowledged roster for their final resting place. §Y[From.Planet.GetName]§! was, regrettably, one of these selected destinations.\nThe smaller fossilized beings were the indigenous inhabitants of the planet, inadvertent casualties of the Tiyanki's death rites. Simulations of the Tiyanki's ungraceful descend predict devastion equal in destructive power to orbital bombardment.\n\nIn strata dating back 600 million years, indistinct remnants of what might have been a sentient civilization linger. A more profound investigation may well reveal further insights."
 mem_scfe_whale_tomb.2.name: "$primitive_plural$"
 mem_scfe_whale_tomb.2.desc: "Our investigation has confirmed the existence of a sentient species on this planet, who thrived even as the space whales' "funerals" were frequent occurrences. Inscriptions revealed their name as the Infelix. These primitives possessed advanced mechanical knowledge and created moving cities. Shown by several ruines that look like towers with legs. Several of these structures contain advanced Observatories with which they presumly estimated incoming Tiyanki. Powered by the near-inexhaustible amount of carcasses many of these mobile bases used fossil fuel to power themselves."
 mem_scfe_whale_tomb.3.name: "Fossil"
 mem_scfe_whale_tomb.3.desc: "Our team has detected signs of the civilization's nascent stages at a site far from the previously uncovered ruins.\n\nIt has been revealed that even in their formative years, this civilization harnessed the remains of the whales, as evidenced by the deliberate markings on the fossils. These early denizens actively exploited the Tiyanki cadavers, a stark contrast to their descendants. They depended entirely on the deceased leviathans for essential materials, going so far as to utilize the carcasses as shelters.\n\nWhile there were local variances in the sophistication of the tools applied to the whale remains, a commonality emerged: artistic expressions, such as symbols crafted from whale bones, were prevalent across most regions.\n\nThe exact significance of these symbols remains elusive, but  each deeper layer passed increases the complexity of these symbols."
 mem_scfe_whale_tomb.4.name: "Shelter"
 mem_scfe_whale_tomb.4.desc: "Our archaeological team has made an astonishing find: a structure resonating with the civilization's distinctive architectural style but possessing a technological sophistication that aligns with the space faring civilizations, a stark contrast to the primitive ruins above. It seems implausible that a civilization of such advancement would plummet to primitivism solely due to the descent of giant whales from the heavens.\n\nThis discovery refutes the prevailing theory that the Tiyanki whales' funerals were the catalyst for the planet's recurring extinctions. The team's findings suggest that while the impact of the falling whales is indeed destructive, yet it is not catastrophic enough to obliterate an entire civilization. This leaves our researchers in a state of bewilderment concerning the recent findings."
 mem_scfe_whale_tomb.5.name: "Extinction"
 mem_scfe_whale_tomb.5.desc: "The deeper our excavation team delved, the more they uncovered the remnants of a once opulent and thriving planetary empire on the cusp of space travel when it met its untimely end.\n\nThis  society wielded space-age technology and thrived by utilizing the remains of the whales as resources. They were well aware of the challenges they faced. At the height of their power, the descent of the whales was no longer a source of dread but merely a hurdle in their quest for cosmic exploration.\n\nHowever, several records and craters show signs of explosions while a regular warhead would be plausible the markings always stem from places where carcasses should be. This creates the leading theory that somehow the whale carcasses detonated."
 mem_scfe_whale_tomb.6.name: "Karma"
 mem_scfe_whale_tomb.6.desc: "Tiyanki space whales, by nature, do not combust post-mortem due to an intrinsic shielding within their bodies. The vast quantities of organic matter typically remain inert, either decomposing silently beneath the surface or transmuting into different substances. On the rare occasion that they do explode on the surface, the resultant toxic gases are negligible and ephemeral, dissipating quickly into the upper atmosphere without causing harm.\n\nHowever several documents revealed that the civilization which lived here tried to shoot down any incoming carcass. Reports suggest the first-strike provoked any Tiyanki in orbit and they responded en masse with violence. Countless Tiyanki whales converged on the planet in a vengeful charge, a vividly depicted crisis in the empire's records.\n\nThe mix of warheads and carcasses gasses formed lethal amounts of toxic air killing nearly all inhabitants of [from.planet.GetName] and ending any possibility of returning to space"
 mem_scfe_whale_tomb.6.a: "Their were just out of luck."
 mem_scfe_whale_tomb.6.b: "More Reasons to hunt those whales."
 mem_scfe_whale_tomb.6.c: "There are numerous deposits of gases remaining."
 mem_scfe_whale_tomb.6.d: "A tragic Story."
 mem_scfe_whale_tomb.6.e: "Fresh Corpses?"
 mem_scfe_whale_fossil: "Whale Fossils"
 mem_scfe_whale_fossil_desc: "The planet once used as a tomb world by Tiyanki Space Whales. There's a lot of whale fossils in its stratum, making it hard to develop its mining industry."
 mem_scfe_whale_fossil_2: "Whale Corpses"
 mem_scfe_whale_fossil_2_desc: "The planet is used as a tomb world by Tiyanki Space Whales. There's a lot of whale corpses in its stratum, making it easy to raise new tiyanki from the dead."
 mem_scfe_site_whale_lesson: "Lesson of Whale tomb world"
 mem_scfe_whale_hunt: "Whale Hunting"

 # Soul of the Art
 mem_scfe_soul_of_the_art_site: "Soul of the Art"
 mem_scfe_soul_of_the_art_site_desc: "A remarkably unique tomb world featuring continent-spanning, seemingly deliberately-colored terrain has been discovered. Orbiting this [from.GetPlanetMoon] is a multitude of debris and gutted husks of starships adorned with outlandish patterns. Furthermore, consistent signals emanate from the [from.GetPlanetMoon]'s surface, begging for exploration."
 mem_scfe_soul_of_the_art.1.name: "Fleet Remains"
 mem_scfe_soul_of_the_art.1.desc: "An analysis of the debris field suggests a clash between two distinct fleets, each with their unique designs, having taken place in the [from.GetPlanetMoon]'s orbit. The bulk of the wreckages is attributed to what we have dubbed the §HPainted Fleet§!, comprised of ships with elaborate, colorful patterns and a simplistic design architecture. In contrast the other fleet presents an austere exterior but contains intricate symbolic adornments internally.\n\nThe presence of disproportionately large chambers within suggests they may have served ritualistic or religious functions, as inferred from the discovered decorative artifacts. Regrettably, whatever datacores still remain within the wreckages have been found to be degraded beyond repair. Dispatching a reconnaissance team to the surface for comprehensive examination is recommended, as there appears no further insight to be gained in orbit."
 mem_scfe_soul_of_the_art.2.name: "Colorful Ruins"
 mem_scfe_soul_of_the_art.2.desc: "Our expedition team has uncovered largely unscathed remnants of a civilization on this vibrantly hued world. The chaotic 'brushwork' upon the terrain is too erratic to imply any clear pattern. Some edifices have deteriorated, but it we believe that their collapse resulted from prolonged exposure to the elements, rather than hostile actions.\nScattered across the [from.GetPlanetMoon]'s surface are many wrecks of §HPainted Fleet§! vessels. Our analysis indicates that the majority of the crashed ships met their end due to abrupt internal electrical failures rather than from direct combat damage. Among the ships painted husks of robots were found, their once vivid coatings now faded and flaking, strewn amidst the colorful ruins and shipwrecks."
 mem_scfe_soul_of_the_art.3.name: "Painted Remains"
 mem_scfe_soul_of_the_art.3.desc: "Within one of the still intact structures, our team discovered robots painted in a spectrum of colors that echo the [from.GetPlanetMoon]'s surface. Unlike their counterparts exposed to the ravages of time, these machines remain preserved with minimal environmental damage.\nIt appears they ceased operations amidst chaotic artistic endeavors, painting the walls haphazardly or etching images and enigmatic symbols into surfaces with chisels and hammers. Their circuits are unfortunately deteriorated beyond repair.\n\nA xenolinguist on site noted their theory that the seemingly disordered painted patterns on the rocks and building exteriors were rather structured repositories of language. If proven correct, this holds the potential for us to decode and possibly reconstruct the narrative of this civilization's demise."
 mem_scfe_soul_of_the_art.4.name: "The Discord"
 mem_scfe_soul_of_the_art.4.desc: "Our xenolinguists were able to successfully decipher some of the [from.GetPlanetMoon]'s surface paintings as a form of music, albeit with lyrics that lack coherent meaning and comprised mainly of redundant phrasing and discordant pitch variations. This resulted in an unpleasant auditory experience.\n\nThe content of the lyrics reveres and questions the concept of the soul, expressing trepidation towards enigmatic entities from alternate dimensions. This thematic analysis has enabled us to interpret the remaining painted inscriptions. These, akin to poetry or other literary forms, delve into metaphysical quandaries, the transience of souls, and fears incited by obliteration."
 mem_scfe_soul_of_the_art.5.name: "Server"
 mem_scfe_soul_of_the_art.5.desc: "Our excavationteam has found what it believes to have been a massive underground server and storage complex - a quite unique combination as pointed out by their leader. Despite extensive circuitry damage, some rudimentary devices appear to have withstood the test of time. An analysis by our researchers suggests that this civilization was composed of machines sharing a unified consciousness.\n\nDelving into the remnants of their databases has unveiled knowledge of their belief of an alternate realm known as the Shroud as well as the preponderance of archival material focusing on arts. The facility's storage is a treasure trove of cultural artifacts such as paintings, literary works, and musical compositions from various civilizations, alongside studies dedicated to these artistic expressions."
 mem_scfe_soul_of_the_art.6.name: "The End"
 mem_scfe_soul_of_the_art.6.desc: "Summarizing everything they had found so far our team has deduced the likely turn of events of this painted world. The machines started focussing on the Shroud and psionic technology following their encounter with a psionically gifted, hostile empire. It appears these aliens had learned to weaponize psionic energy to disintegrate any artificial being, while leaving organics unharmed.\n\nThe machine empire speculated that the 'soul' or the lack thereof was a deciding factor and that through a process of appreciation of art they would be able to cultivate 'souls', thereby rendering themselves impervious to their foes' weaponry.\n\nIn pursuit of this hypothesized immunity, the civilization embarked on a fervent campaign of acquisition and examination of artistic knowledge - as seen in their archived foreign artworks. They endeavored to mimic organic creativity, attempting to sing, write, and even decorate the [from.GetPlanetMoon]'s surface, their ships, and themselves. Despite all these efforts, however, it appears they did not succeed."
 mem_scfe_soul_of_the_art.6.a: "It was futile attempt..."
 mem_scfe_soul_of_the_art.6.b: "We will remember them."

 # King of the Underground City
 mem_scfe_king_of_underground_city_site: "Under a Scorching Sun"
 mem_scfe_king_of_underground_city_site_desc: "We have detected faint signals from beneath the hot and barren surface of §Y[From.Planet.GetName]§!."
 mem_scfe_king_of_underground_city.1.name: "Underground City"
 mem_scfe_king_of_underground_city.1.desc: "Deep scans revealed a far larger cavern system than initially expected. Drones sent to explore the caves returned images of an entire metropolis residing within the largest cavity. While the city itself appears abandoned, multiple mechanisms were still running, apparently intended to keep this subterranean refuge hospitable for its inhabitants. The much cooler climate down here indicates a population unfit for the scorching desert of §Y[From.Planet.GetName]§!. Our team is still searching for any traces of the former inhabitants of this place, but it seems they have been gone for a long time."
 mem_scfe_king_of_underground_city.1.a: "Dig!"
 mem_scfe_king_of_underground_city.2.name: "Forsaken Quarters"
 mem_scfe_king_of_underground_city.2.desc: "As our team recorded the city's layout and construction methods, the abundance of water recycling plants and giant storage tanks supplying a multitude of industrial scale air humidifiers and conditioners show the great lengths the builders of this place went to keep the climate of the cavern pleasant for its former inhabitants.\n\nThe city had been built with strict segmentations, likely a result of the segregation of social classes. Leaving behind the forsaken outer districts, our team aimed their exploration efforts further inwards where the central administrative infrastructure was assumed to be located."
 mem_scfe_king_of_underground_city.3.name: "Endless Records"
 mem_scfe_king_of_underground_city.3.desc: "The central repository was quickly located and recoverable data analyzed. Found documents describe that §Y[From.Planet.GetName]§! had been a cold, near arctic, world in the distant past. Catastrophic climate shifts, triggered by planetary anomalies, had gradually incited a temperature rise, culminating in the desertification of the entire planetary surface. As rapid climate shifts turned the surface to be increasingly inhospitable to their species they began to construct large subterranean cities.\n\nAt first their life underground appeared stable, but over time declining agricultural output of their inadequately adapted crops led to increasingly dire food shortages and famine, culminating in state-sanctioned cannibalism - at first the poor and downtrodden, later all non-essentials. When the inevitability of their impending collapse became obvious, a last great effort was started to shift the climate back again using sophisticated terraforming technology."
 mem_scfe_king_of_underground_city.4.name: "The Terraforming Device"
 mem_scfe_king_of_underground_city.4.desc: "Like the data suggested, the terraforming device was located within a secured facility in the central district. As far as our scientists were able to tell, it appeared completed rather than in an unfished state. Searching for further information they managed to activate the computer system housed within the facility and found recordings by the lead scientist overseeing the device's construction. They contained his remorse-filled message of how against all odds, they had managed to bring the project to completion out of sheer stubbornness, yet not in time to make a difference. Far too many of their kind had already died for them to be able to continue their civilization.\n\nAs can be seen, they chose to perish without ever activating their machine."
 mem_scfe_king_of_underground_city.4.a: "Activate the Machine."
 mem_scfe_king_of_underground_city.4.b: "Retrieve the Device."
 mem_scfe_king_of_underground_city.4.d: "Shiny!"
 mem_scfe_king_of_underground_city.4.c: "Honor their Nobility."
 mem_scfe_ancient_terraforming_technology: "Ancient Terraforming Technology"
 mem_scfe_tomb_of_the_king: "King's Tomb"
