 mem_caretaker_hacked_hub_3b_desc: "§HThe Caretaker§! hub on this planet has been hacked by an unknown hacker, altering its internal logic."
 mem_caretaker_unhappy_settler: "Forced to Live Under §Hthe Caretaker§!"
 mem_caretaker_unhappy_settler_desc: "These people are former free settlers who wished to live away from the watchful eye of the §Hthe Caretaker§!. They aren't happy about losing that freedom."
