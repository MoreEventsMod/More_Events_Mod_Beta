# 'Synthetic Evolution' AP taken
mem_caretaker_origin_event.515.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.515.desc: "How dare you?! §R<< Corrupted Data Block >>§! imbeciles, was mutilation of your bodies with §R<< Corrupted Data Block >>§! implants not enough for you? You've gone way too far this time. Do not expect any §R<< Corrupted Data Block >>§! assistance from me ever again."
