# Pop request granted
mem_caretaker_origin_event.20100.name: "A Gift of Life"
mem_caretaker_origin_event.20100.desc: "The request for a greater population on §Y[Root.GetName]§! has been granted."
mem_caretaker_origin_event.20100.option.a: "They will be useful."
mem_caretaker_origin_event.20100.option.a.tooltip: "Create §G100§! £pops£ Pops on §Y[Root.GetName]§!."

# Resource request granted
mem_caretaker_origin_event.20200.name: "The Caretaker Provides"
mem_caretaker_origin_event.20200.desc: "The request for aid has been granted.\n\n§HThe Caretaker§! will now require a period of restoration before it will consider further requests."
mem_caretaker_origin_event.20200.option.a: "We are grateful."
mem_caretaker_origin_event.20200.option.b: "We did need this help."
mem_caretaker_origin_event.20200.option.c: "Actually, it was a demand."
mem_caretaker_origin_event.20200.option.d: "We should not have to ask."

# Pop gift given
mem_caretaker_origin_event.20400.name: "A Gift of Life"
mem_caretaker_origin_event.20400.desc: "§HThe Caretaker§! has seen fit to increase the population on §Y[Root.GetName]§!."
mem_caretaker_origin_event.20400.option.a: "A welcome gift."
mem_caretaker_origin_event.20400.option.a.tooltip: "$mem_caretaker_origin_event.20100.option.a.tooltip$"

# Resource gift given
mem_caretaker_origin_event.20500.name: "A Gift of Resources"
mem_caretaker_origin_event.20500.desc: "§HThe Caretaker§! has seen fit to provide §Y[Root.GetName]§! with additional resources."
mem_caretaker_origin_event.20500.option.goods: "We accept this gift of £consumer_goods£ Goods with gratitude."
mem_caretaker_origin_event.20500.option.alloys: "We accept this gift of £alloys£ Alloys with gratitude."
mem_caretaker_origin_event.20500.option.minerals: "We accept this gift of £minerals£ Minerals with gratitude."
mem_caretaker_origin_event.20500.option.food: "We accept this gift of £food£ Food with gratitude."
mem_caretaker_origin_event.20500.option.b: "We have no need of these, but are grateful."
mem_caretaker_origin_event.20500.option.b.tooltip: "The mood of §Hthe Caretaker§! will be improved"
mem_caretaker_origin_event.20500.option.c: "We do not want such charity."
mem_caretaker_origin_event.20500.option.c.tooltip: "The mood of §Hthe Caretaker§! will worsen"

# Generic tooltips
mem_caretaker_mood_improved_tooltip: "§GThe mood of§! §Hthe Caretaker§! §Gwill be improved§!"
mem_caretaker_mood_worsened_tooltip: "§RThe mood of§! §Hthe Caretaker§! §Rwill be worsened§!"

### Special project to fit PCIs
MEM_CARETAKER_PERSONAL_CARE_PROJECT: "Personal Care Interfaces"
MEM_CARETAKER_PERSONAL_CARE_PROJECT_DESC: "§HThe Caretaker§! is ready to produce and despatch micro-drones to fit PCIs to those most deserving."
MEM_CARETAKER_PERSONAL_CARE_PROJECT_TT: "$tr_cybernetics_assimilator_modular_cybernetics$"
 ### Personal Care Ascension
 mem_caretaker_origin_event.23000.name: "Personal Care From §HThe Caretaker§!"
 mem_caretaker_origin_event.23000.desc: "We now have access to technology that will provide all of our worthiest citizens a Personal Care Interface. §HThe Caretaker§! is standing by to begin the process.\n\nIn the future, possessing a PCI will allow a greater contribution to the society we are building. Consequently, the process to install a PCI will be mandatory and free of cost to true citizens."
 mem_caretaker_origin_event.23000.a: "We must embrace this evolutionary upgrade."
 mem_caretaker_origin_event.23100.name: "A Caretaking Revolution"
 mem_caretaker_origin_event.23100.desc: "The Personal Care Interface roll-out has been completed! All citizens of our primary species have now been equipped with one. The infrastructure is also in place to modify any new citizens that are natural-born or provided by §HThe Caretaker§! within our nation, so that they can experience all the benefits of the PCI from an early age.\n\nHenceforth, our species shall be known as the §H[Root.GetSpeciesNamePlural]§!!"
 mem_caretaker_origin_event.23100.a: "This is our Caretaker Future."
 
 ### Caretaker Quirkiness ###
 mem_caretaker_origin_event.20800.name: "Building Removed"
 mem_caretaker_origin_event.20800.desc: "The Monitors on §Y[Root.GetName]§! report that §Hthe Caretaker§! has chosen to remove a building from the colony. They offer no explanation as to why in the report, only that the Clone Vats recently constructed on §Y[Root.GetName]§! are now gone."
 mem_caretaker_origin_event.20800.option.a: "Demand an explanation from the Monitors."
 mem_caretaker_origin_event.20800.option.b: "Order an investigation independent of the Monitors."
 mem_caretaker_origin_event.20800.option.c: "The Caretaker has a reason. Let it be."
 
