 # Static modifiers
 mem_caretaker_overclocked_cloning_vats: "Overclocked Cloning Vats"
 mem_caretaker_overclocked_cloning_vats_desc: "Having recognized that people will continue dying because of an error in its programming, §Hthe Caretaker§! offered to overclock the cloning vats it uses to produce our species. Hopefully, this will be enough to balance out the damage caused by the 'Killer Glitch'"
 mem_caretaker_destroyed_databanks: "Destroyed §Rthe Caretaker§!'s Databanks"
 mem_caretaker_destroyed_databanks_desc: "This country has decided to put their past behind them and enjoy their new life without §Rthe Caretaker§! watching over them."
 mem_caretaker_knows_awful_truth: "We Stand Strong"
 mem_caretaker_knows_awful_truth_desc: "This civilisation has learned an awful truth about its past and the horrible things that have been done to them. Despite that, the people stand strong and look to the future with optimism."
 mem_caretaker_free_from_oppression:0 "Free from the Caretaker"
 mem_caretaker_free_from_oppression_desc:0 "After years of oppression our civilization gained the freedom to live by our rules."
 mem_caretaker_unwelcome_changes:0 "Order Reforms"
 mem_caretaker_unwelcome_changes_desc:0 "The Order can no longer hide behind the Caretaker and its rules. They have to adapt."
 mem_caretaker_fortitude: "We Stand Proud"
 mem_caretaker_fortitude_desc: "This civilisation has learned an awful truth about its past and the horrible things that have been done to them. In a show of great fortitude they choose to stand proud and remain who they are."
 mem_caretaker_hacked_hub_1: "Hacked Caretaker Hub"
