 # Jobs
 job_mem_monitor: "Monitor"
 job_mem_monitor_plural: "$job_mem_monitor$s"
 job_mem_monitor_desc: "$job_mem_monitor_plural$ act as agents for a High Monitor.$job_mem_monitor_effect_desc$\n§RXenos may not join the Monitor Order§!"
 job_mem_monitor_effect_desc: "£job_mem_monitor£ $job_mem_monitor_plural$ are agents in charge of fulfilling §Hthe Caretaker§!'s wishes. It is they who distribute resources and amenities provided by §Hthe Caretaker§! and do the political work to unite people around its Glory."
 mod_job_mem_monitor_add: "[GetCaretakerMonitorName] Jobs"
 mod_job_mem_monitor_per_pop: "§G+1§! $job_mem_monitor$ Job per $VALUE$ Pops"
 mod_job_mem_monitor_per_pop_short: "\n§G+1§! £mod_job_mem_monitor_add£ per $VALUE$ £pop£"
 job_mem_monitor_alt: "Watcher"
 job_mem_monitor_alt_plural: "$job_mem_monitor_alt$s"
 job_mem_monitor_alt_desc: "$job_mem_monitor_alt_plural$ act as agents for a $job_mem_high_monitor_alt$.$job_mem_monitor_alt_effect_desc$\n§RXenos may not join the Monitor Order§!"
 job_mem_monitor_alt_effect_desc: "£job_monitor£ $job_mem_monitor_alt_plural$ are agents in charge of keeping our people safe. It is they who distribute resources and amenities provided by the industrial sector and do the political work to unite people around our Glory."


 job_mem_high_monitor: "High Monitor"
 job_mem_high_monitor_plural: "$job_mem_high_monitor$s"
 job_mem_high_monitor_desc: "$job_mem_high_monitor_plural$ regularly communicate with §Hthe Caretaker§!, and direct subservient Monitors according to its wishes. £job_mem_high_monitor£ $job_mem_monitor_plural$ communicate directly with §Hthe Caretaker§! and are able to petition for resources and amenities for people under their guardianship. They also serve to unify people around the glory of their Caretaker.\n§RXenos may not join the Monitor Order§!"
 job_mem_high_monitor_alt: "Grand Watcher"
 job_mem_high_monitor_alt_plural: "$job_mem_high_monitor_alt$s"
 job_mem_high_monitor_alt_desc: "$job_mem_high_monitor_alt_plural$ regularly commute with our people, and direct subservient $job_mem_monitor_alt_plural$ according to their wishes.\n§RXenos may not join the Monitor Order§!"
 mod_job_mem_high_monitor_add: "[GetCaretakerHighMonitorName] Jobs"
 mod_job_mem_high_monitor_per_pop: "§G+1§! $job_mem_high_monitor$ Job per $VALUE$ Pops"
 mod_job_mem_high_monitor_per_pop_short: "\n§G+1§! £mod_job_mem_high_monitor_add£ per $VALUE$ £pop£"

 job_mem_caretaker_ward: "Ward"
 job_mem_caretaker_ward_plural: "$job_mem_caretaker_ward$s"
 job_mem_caretaker_ward_desc: "Wards are able to simply enjoy life, without worrying about employment or productivity."
 job_mem_caretaker_ward_effect_desc: "£job_mem_caretaker_ward£ $job_mem_caretaker_ward_plural$ mostly just be."
 mod_job_mem_caretaker_ward_add: "$job_mem_caretaker_ward$ Jobs"
