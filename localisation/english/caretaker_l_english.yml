 mem_caretaker_origin_event.5.name:0 "Blessed Cooperation"

 mem_caretaker_origin_event.5.desc:0 "It is an honour to be given such a direct role in ensuring worlds of §Y[Root.GetName]§! are safe, secure and productive, and I promise to turn each and every one of them into utopias envied by the rest of the galaxy."
 mem_caretaker_origin_event.5.option.a:0 "May our worlds be safe and exuberant!"



mem_caretaker_origin_event.666.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.666.desc: "I'm sorry, [Root.Leader.GetName], I can't let you do that."
mem_caretaker_origin_event.666.option.a: "O-oh! This can't be good."

mem_caretaker_origin_event.1100.name: "Reminder: §HThe Caretaker§! Hubs"
mem_caretaker_origin_event.1100.desc: "§HReminder§!: According to the §Y[Root.Owner.GetName]§! Expansion Agreement section 2B-11 a Caretaker Hub must be established on every colony within two years of its foundation or falling under control of the §Y[Root.Owner.GetName]§!."
mem_caretaker_origin_event.1100.option.a: "Understood"
mem_caretaker_origin_event.1100.option.b: "Add it to our expansion protocols!"

mem_caretaker_origin_event.1110.name: "Reminder: §HThe Caretaker§! Hub"
mem_caretaker_origin_event.1110.desc: "§HReminder§!: The colony on §Y[Root.GetName]§! is yet to have a Caretaker Hub established on it, which goes against the §Y[Root.Owner.GetName]§! Expansion Agreement section 2B-11. A Caretaker Hub must be established there in the immediate future."
mem_caretaker_origin_event.1110.option.a: "We will establish a Caretaker Hub shortly."
mem_caretaker_origin_event.1110.option.b: "<< End communication >>"

mem_caretaker_origin_event.1121.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.1121.desc: "Your continuous failure to establish a Caretaker Hub on §Y[Root.GetName]§! is a breach of the §Y[Root.Owner.GetName]§! Expansion Agreement section 2B-11. This cannot stand. Establish a Caretaker Hub on the colony or there will be consequences!"
mem_caretaker_origin_event.1121.option.a: "We will fix this immediately!"
mem_caretaker_origin_event.1121.option.b: "<< End communication >>"

 mem_caretaker_origin_event.509.name:0 "Watershed Moment"
 mem_caretaker_origin_event.509.desc:0 "As the §YThe Caretaker§! leaves us, we are forced to adapt. Many in the ranks of the Monitor Order call out for rigid continuation of the established social system, even if the §Ythe Caretaker§! is no longer around. While others cry out to free ourselves from the oppression it has shackled us for centuries."
 mem_caretaker_origin_event.509.option.a:0 "Liberty, Equality, Fraternity!"
 mem_caretaker_origin_event.509.option.a.tt:0 "§YDismantle anything related to the Caretaker§!"
 mem_caretaker_origin_event.509.option.c:0 "A new Order!"
 mem_caretaker_origin_event.509.option.b:0 "The Order stands with us."
 mem_caretaker_origin_event.509.option.b.tt:0 "§YReform the Order and keep access to Caretaker Tech§!"

ANGRY_MEM_CARETAKER: "§RThe Caretaker§!"
# 'Xeno-compatibility' AP taken
mem_caretaker_origin_event.510.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.510.desc: "What do you think you're doing, you sanctimonious simpletons? Such technology is abominable and should have no place in §Y[Root.GetName]§!. It goes against the very foundation of our partnership. Your transgression is not easily forgiven and will not be forgotten. §R<< Corrupted Data Block >>§! Do not expect to have any request answered in the near future unless your very existence hangs in the balance."
mem_caretaker_origin_event.510.option.a: "We're sorry!"
mem_caretaker_origin_event.510.option.b: "We do what we want!"
mem_caretaker_origin_event.510.option.c: "It was our destiny!"
mem_caretaker_origin_event.510.option.d: "<< End communication >>"

# 'Nihilistic Acquisition' AP taken
mem_caretaker_origin_event.511.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.511.desc: "Fools, utter self-righteous fools, what are you planning to do now? An §R<< Corrupted Data Block >>§! Utopia like §Y[Root.GetName]§! has no place for foreigners and bringing them here is against the foundation our partnership is built upon. Your transgression is not easily forgiven and will not be forgotten. Do not expect to have your requests answered in the near future unless your very existence hangs in the balance."
mem_caretaker_origin_event.511.option.a: "We're sorry!"
mem_caretaker_origin_event.511.option.b: "We do what we want!"
mem_caretaker_origin_event.511.option.c: "The weak must serve under the strong!"
mem_caretaker_origin_event.511.option.d: "Those xenos will call us their masters!"

# 'The Flesh is Weak' AP taken
mem_caretaker_origin_event.512.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.512.desc: "You stupid imbeciles! You dare to mutilate yourselves with those §R<< Corrupted Data Block >>§! implants? Do not think that such foolishness will be tolerated in §Y[Root.GetName]§!! Your transgression against the foundation of our partnership is unforgivable and will never be forgotten. Do not §R<< Corrupted Data Block >>§! assistance in the future unless you repent for your §R<< Corrupted Data Block >>§! mistakes!"
mem_caretaker_origin_event.512.option.a: "We're sorry!"
mem_caretaker_origin_event.512.option.b: "We do what we want!"
mem_caretaker_origin_event.512.option.c: "You can't stop the progress!"
mem_caretaker_origin_event.512.option.d: "We can become one now!"

# 'Mind Over Matter' AP taken
mem_caretaker_origin_event.513.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.513.desc: "What is the meaning of this, §R<< Corrupted Data Block >>§! fools? You dare to promote your imbecilic beliefs of things-that-do-not-exist to this ridiculous extent? Such §R<< Corrupted Data Block >>§! has no place in §Y[Root.GetName]§!! Your transgression against the foundation of our partnership is unforgivable and will never be forgotten. Do not expect any assistance in the future unless you repent for your mistakes!"
mem_caretaker_origin_event.513.option.a: "We're sorry!"
mem_caretaker_origin_event.513.option.b: "We do what we want!"
mem_caretaker_origin_event.513.option.c: "Our faith demands this!"

# 'Engineered Evolution' AP taken
mem_caretaker_origin_event.514.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.514.desc: "What do you think you're doing, you §R<< Corrupted Data Block >>§! simpletons? You're taking your meddling with your DNA too far! This is unacceptable and §R<< Corrupted Data Block >>§! like this has no place in §Y[Root.GetName]§! Your transgression is unforgivable and will never be forgotten. No further assistance will be rendered to you until you repent for your mistake!"
mem_caretaker_origin_event.514.option.a: "We're sorry!"
