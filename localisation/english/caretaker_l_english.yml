mem_caretaker_origin_event.516.desc: "Traitorous fools of §Y[Root.GetName]§!! You dare to §R<< Corrupted Data Block >>§! replace me with imaginary 'Gods' you §R<< Corrupted Data Block >>§! thought up?! Very well. You've made your §R<< Corrupted Data Block >>§! choise. Do not expect any further assistance from me ever again."
