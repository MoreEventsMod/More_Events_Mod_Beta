 mem_caretaker_country_boost_desc: "This Caretaker unit has seceded from the empire it originally oversaw. It now dedicates considerable resources to ensure its continued survival."
 pm_mem_caretaker_free_settler_discord: "Discordant Population"
 pm_mem_caretaker_free_settler_discord_desc: "After their re-integration into civilized society, former free settlers began spreading nasty rumours about §Hthe Caretaker§! and its supposed misdeeds, causing discord among the local population. And despite the best efforts of Monitors and Enforcers, the rumours keep circulating around the cities."
 pm_mem_caretaker_core_restarting: "Caretaker Core Rebooting"
 pm_mem_caretaker_core_restarting_desc: "Implementation of algorithms related to FTL travel and communications requires §Hthe Caretaker§! to upgrade several of its core subroutines. This process should be completed within a few days."


 pm_mem_caretaker_core_pleased: "The Caretaker is Pleased"
 pm_mem_caretaker_core_pleased_desc: "§HThe Caretaker§! is currently in a good mood as people are following its testaments and do their best to promote its glory. In return, §Hthe Caretaker§! will answer their requests and may even bestow gifts upon them."
 pm_mem_caretaker_core_content: "The Caretaker is Content"
 pm_mem_caretaker_core_content_desc: "§HThe Caretaker§! is currently satisfied with the way people are following its testaments. Because of that, §Hthe Caretaker§! is likely to answer the requests made by its wards in a positive way."
 pm_mem_caretaker_core_annoyed: "The Caretaker is Annoyed"
 pm_mem_caretaker_core_annoyed_desc: "§HThe Caretaker§! is currently in a bad mood since people are straying away from its light and are doing things it considers `bad`. Right now §Hthe Caretaker§! is unlikely to answer any requests from its wards, but may still help them out in a true hour of need."
 pm_mem_caretaker_core_angry: "The Caretaker is ANGRY"
 pm_mem_caretaker_core_angry_desc: "§HThe Caretaker§! is extremely upset with its wards because they did something it finds hard to ever forgive. While not actively opposing people yet, §Hthe Caretaker§! has withdrawn its support from them and is unlikely to do anything even if they find themselves in a dire situation."
