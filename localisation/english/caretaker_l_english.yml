 mod_job_mem_caretaker_ward_per_pop_short: "\n§G+1§! £mod_job_mem_caretaker_ward_add£ per $VALUE$ £pop£"
 
 job_mem_caretaker_aa_drone: "Caretaker Drone"
 job_mem_caretaker_aa_drone_plural: "Caretaker Drones"
 job_mem_caretaker_aa_drone_desc: "Remote robotic extensions of §Hthe Caretaker§!, dedicated to security, construction, maintenance and service."
 job_mem_caretaker_aa_drone_effect_desc: "£job_mem_caretaker_aa_drone£ $job_mem_caretaker_aa_drone_plural$ reduce crime, increase amenities and improve construction rates."
