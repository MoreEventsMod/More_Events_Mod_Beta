 # Buildings
 building_mem_monitor_station_1: "Monitor Station"
 building_mem_monitor_station_1_desc: "A node in the §Hthe Caretaker's§! empire-wide network that allows the Monitor Order to keep tabs on the status of local settlements and guide their development."
 building_mem_monitor_station_2: "Monitor Complex"
 building_mem_monitor_station_2_desc: "An upgraded $building_mem_monitor_station_1$ supporting greater presence of the Monitor Order on the planet."
 building_mem_monitor_station_3: "Grand Monitor Complex"
 building_mem_monitor_station_3_desc: "A large and sprawling complex that serves as a local hub for the Monitor Order to better guide this colony and manage the requests and petitions of §Hthe Caretaker's§! wards."
 building_mem_caretaker_outreach: "Caretaker Hub"
 building_mem_caretaker_outreach_desc: "Local hub of §Hthe Caretaker§!, allowing it to monitor and guide the development of the colony and take care of people living there. Contains all of the same fabrication and cloning facilities as the primary core, and may take over if the core is compromised in some way." 
 building_mem_caretaker_outreach_swap_to_wards:0 "Replaces [civilian.GetIcon] §Y[civilian.GetNamePlural]§! with £job_mem_caretaker_ward£ §Y$job_mem_caretaker_ward_plural$§!"
 building_mem_caretaker_outreach_wards_effect:0 "£job_mem_caretaker_ward£ $job_mem_caretaker_ward_plural$ turn £amenities£ §YAmenities§! into £unity£ §YUnity§!"
 # Deposits
 d_mem_caretaker_core: "§HThe Caretaker§! Core"
 d_mem_caretaker_core_desc: "The main core of the §Hthe Caretaker§!. A set of large underground vaults housing the artificial intelligence and automated factories and cloning facilities it needs to ensure the survival and prosperity of its wards."
 d_mem_caretaker_core_pleased: "§HThe Caretaker§!: §GPleased§!"
 d_mem_caretaker_core_pleased_desc: "§HThe Caretaker§! is currently in a good mood as people are following its testaments and do their best to promote its glory. In return, §Hthe Caretaker§! will answer their requests and may even bestow gifts upon them."
 d_mem_caretaker_core_content: "§HThe Caretaker§!: §BContent§!"
 d_mem_caretaker_core_content_desc: "§HThe Caretaker§! is currently satisfied with the way people are following its testaments. Because of that, §HThe Caretaker§! is likely to answer the requests made by its wards in a positive way."
 d_mem_caretaker_core_annoyed: "§HThe Caretaker§!: §YAnnoyed§!"
 d_mem_caretaker_core_annoyed_desc: "§HThe Caretaker§! is currently in a bad mood since people are straying away from its light and are doing things it considers `bad`. Right now §HThe Caretaker§! is unlikely to answer any requests from its wards, but will still help them out in a true hour of need."
 d_mem_caretaker_core_angry: "§HThe Caretaker§!: §RAngry§!"
 d_mem_caretaker_core_angry_desc: "§HThe Caretaker§! is extremely upset with its wards because they did something it finds hard to ever forgive. While not actively opposing people yet, §HThe Caretaker§! has withdrawn its support from them and is unlikely to do anything even if they find themselves in a dire situation."

 d_mem_caretaker_hub: "§HThe Caretaker§! Hub"
 d_mem_caretaker_hub_desc: "Local hub of §Hthe Caretaker§!, allowing it to monitor and guide the development of the colony and take care of people living there. Contains all of the same fabrication and cloning facilities as the primary core, and may take over if the core is compromised in some way."

 d_mem_caretaker_free_settlements: "Free Settlements"
 d_mem_caretaker_free_settlements_desc: "A number of settlements hosting people wishing to live away from §Hthe Caretaker§!'s influence. They are protected from assimilation into local city clusters by state edicts."
 
 # Decisions
 mem_caretaker_add_hub: "£aa_mem_caretaker_icon£ £district£ Construct Caretaker Hub"
 mem_caretaker_add_hub_desc: "Construct a local hub for §Hthe Caretaker§!, allowing it to monitor and guide the development of the colony and take care of people living there. §HThe Caretaker§! will expand the hub to contain all of the same fabrication and cloning facilities as the primary core, which may take over if the core is compromised in some way."
 mem_caretaker_remove_hub: "£aa_mem_caretaker_icon£ Remove Caretaker Hub"
 mem_caretaker_remove_hub_desc: "Remove the §Hthe Caretaker§! local hub, preventing it from having further involvement with this colony. Any Monitor Stations will quickly be demolished as a result of this decision."
 mem_caretaker_in_restoration_mode: "£aa_mem_caretaker_icon£ Restoration Mode"
 mem_caretaker_in_restoration_mode_desc: "§HThe Caretaker§! is currently restoring itself and is unable to take requests for additional resources at this time."
 mem_caretaker_in_restoration_mode_effect: "None. §HThe Caretaker§! is currently restoring itself and is unable to take requests for additional resources at this time."
 mem_caretaker_is_angry_mode: "£aa_mem_caretaker_icon£ No Response"
