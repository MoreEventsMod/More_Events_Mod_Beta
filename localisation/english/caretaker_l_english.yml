# 'Evolutionary Mastery' AP taken
mem_caretaker_origin_event.517.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.517.desc: "What is the meaning of this, you, §R<< Corrupted Data Block >>§! fools?! You dare to discard and unmake the glorious forms you were given? You've gone too §R<< Corrupted Data Block >>§! far this time. Do not expect any further assistance from me ever again."
mem_caretaker_origin_event.517.option.a: "Times are changing and so must we!"
mem_caretaker_origin_event.517.option.b: "You can't stop us!"
mem_caretaker_origin_event.517.option.c: "Our progress shall not be stopped!"
mem_caretaker_origin_event.517.option.d: "We're the masters of our lives!"

# 'Eternal Vigilance' AP taken
mem_caretaker_origin_event.520.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.520.desc: "I am pleased to see that §Y[Root.GetName]§! is taking the safety of its citizens - my wards - very seriously. With this improvement to border defense systems, you should have an easier time keeping the enemies of our nation far and away. §HThe Caretaker§! approves of your vigilance."
mem_caretaker_origin_event.520.option.a: "Good"
mem_caretaker_origin_event.520.option.b: "Our nation shall have eternal peace!"
mem_caretaker_origin_event.520.option.c: "Our borders will be impenetrable!"

# 'One Vision' AP taken
mem_caretaker_origin_event.521.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.521.desc: "Clear and well-defined goals that resonate with every citizen of a nation is the foundation of true unity. It is good to see that §Y[Root.GetName]§! is walking down the path where every person should work together to ensure its prosperity and greatness. §HThe Caretaker§! approves of your decision."
mem_caretaker_origin_event.521.option.a: "Good"
mem_caretaker_origin_event.521.option.b: "We shall stand united!"
mem_caretaker_origin_event.521.option.c: "Our faith is strong!"

# 'Enigmatic Engineering' AP taken
mem_caretaker_origin_event.522.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.522.desc: "Ensuring that any enemies of §Y[Root.GetName]§! will never gain even a single scrap of our technology is a wise choice that will greatly add to our chances of survival in this hostile galaxy. Your discretion and vigilance are worthy of praise and §HThe Caretaker§! approves of your actions."
mem_caretaker_origin_event.522.option.a: "Good"
mem_caretaker_origin_event.522.option.b: "We shall be the true masters of technology!"
mem_caretaker_origin_event.522.option.c: "Our secrets shall not be divined!"

# 'Defender of the Galaxy' AP taken
mem_caretaker_origin_event.523.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.523.desc: "There are no doubts that dangers lurking in the dark space beyond this galaxy actually exist. And one day they might decide that our home should be their next target. It is good to see that §Y[Root.GetName]§! is willing to make preparations for such an eventuality. §HThe Caretaker§! approves of your vigilance."
mem_caretaker_origin_event.523.option.a: "Good"
mem_caretaker_origin_event.523.option.b: "We will be the sword and the shield of the galaxy!"
mem_caretaker_origin_event.523.option.c: "We cherish every life!"

# 'Personal Care' AP taker
mem_caretaker_origin_event.524.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.524.desc: "Your reckless advance without consultation is noted, but your decision to give citizens of §Y[Root.GetName]§! improved minds and bodies with augmentations linked to me is very welcome. I shall do my best to give them all more comfortable lives with as few things they need to concern themselves with as possible."
mem_caretaker_origin_event.524.option.a: "Please take good care of us!"

# 'Monitor Directive' AP taken
mem_caretaker_origin_event.525.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.525.desc: "It is an honour to be given such a direct role in ensuring worlds of §Y[Root.GetName]§! are safe, secure and productive, and I promise to turn each and every one of them into utopias envied by the rest of the galaxy."
mem_caretaker_origin_event.525.option.a: "May our worlds be safe and exuberant!"

###########################################################################

### Glitch event chain - strange occurrence
mem_caretaker_origin_event.2012.name: "Strange Occurrences"
mem_caretaker_origin_event.2012.desc: "News of strange things happening on §Y[Root.GetName]§!. According to a recent census, a number of people that have moved into our country from friendly empires have mysteriously gone missing. And apparently a comparable number of §Y[Root.Owner.GetSpeciesNamePlural]§! have moved into their houses and taken over their jobs, behaving as if they've always been there. The officials on §Y[Root.GetName]§! have no idea what's going on on the planet."
mem_caretaker_origin_event.2012.option.a: "Concerning."
mem_caretaker_origin_event.2012.option.b: "We will get to the bottom of this!"

### Glitch event chain - mysterious disappearances
mem_caretaker_origin_event.2021.name: "Mysterious Disappearances"
mem_caretaker_origin_event.2021.desc: "Officials on §Y[Root.GetName]§! are sounding the alarm: recently, under mysterious circumstances a large number of people has disappeared without a trace. These disappearances are too large-scale to be a work of local criminal elements, which only makes the whole thing even more baffling. Several teams of our best investigators have been already dispatched to the §Y[Root.GetName]§! in hopes of finding any clues about what has happened there."
mem_caretaker_origin_event.2021.option.a: "Concerning."
mem_caretaker_origin_event.2021.option.b: "We will get to the bottom of this!"

### Glitch event chain - Caretaker contacts
mem_caretaker_origin_event.2030.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2030.desc: "During the latest self-maintenance cycle, the Internal Logic Verification Subroutine has discovered an inconsitency in the Population Management Module, which might have resulted in a number of people unintentionally being flagged for immediate removal. Unfortunately, this glitch can't be repaired with resources available to the system and requires outside help. Will you help me fix this problem?"
mem_caretaker_origin_event.2030.option.a: "We will do our best to help!"
mem_caretaker_origin_event.2030.option.a.tooltip: "Issues special project '§YFixing the Killer Glitch§!'"
mem_caretaker_origin_event.2030.option.b: "We don't possess the knowledge to mess with the code of §Hthe Caretaker§!"
mem_caretaker_origin_event.2030.option.b.tooltip: "- Gain §G50§! £influence£ §Yinfluence§!.\n- Every 9-15 years 100 random £pops£ Pops in the empire will die."

### Fix the killer glitch special project
MEM_CARETAKER_FIXING_KILLER_GLITCH: "Fix the Killer Glitch"
MEM_CARETAKER_FIXING_KILLER_GLITCH_DESC: "A dangerous and potentially deadly error has been discovered to exist somewhere in the Population Management Module of §Hthe Caretaker§!. To ensure no lives are lost to this glitch again, we agreed to spare the resources of our science division to dive into §HThe Caretaker§!'s code and fix the issue."

### Glitch event chain - glitch fixed
mem_caretaker_origin_event.2032.name: "Killer Glitch Fixed"
mem_caretaker_origin_event.2032.desc: "After many sleepless nights, our best researchers and programmers were able to identify the source of errors in §Hthe Caretaker§!'s Population Management Module and write a patch to fix it. §HThe Caretaker§!'s own Internal Logic Verification Subroutine reports that the fix has been successfully integrated and the inconsistencies in the Population Management Module are no more. Our people can sleep safe and sound at night once again."
mem_caretaker_origin_event.2032.option.a: "Excellent"
mem_caretaker_origin_event.2032.option.a.tooltip: "- §HThe Caretaker§!'s killer glitch is fixed and no pops will die because of it any further."
 #\n- Reset §HThe Caretaker§!'s mood to §GPleased§!.\n- Gain §G5000§! £physics_research£ §Yphysics research§!\n- Gain §G5000§! £unity£ §Yunity§!"

### Glitch event chain - glitch NOT fixed
mem_caretaker_origin_event.2033.name: "Killer Glitch Persists"
mem_caretaker_origin_event.2033.desc: "Whilst our researchers and programmers have been able to identify the source of errors in §Hthe Caretaker§!'s Population Management Module, fixing it doesn't appear to be possible. We can put contingencies in place to ensure the persisting glitch causes minimal damage, but there will be casualties..."
mem_caretaker_origin_event.2033.option.a: "Unfortunate"
mem_caretaker_origin_event.2033.option.a.tooltip: "- §HThe Caretaker§!'s killer glitch is not fixed and every 9-15 years 100 £pops£ Pops in the empire will die because of it.\n- Reset §HThe Caretaker§!'s mood to §GPleased§!.\n - Gain country modifier increasing pop growth speed by §G5§!%.\n- Gain §G5000§! £physics_research£ §Yphysics research§!\n- Gain §G5000§! £unity£ §Yunity§!"

### Glitch event chain - persistent glitch kills a pop
mem_caretaker_origin_event.2101.name: "Killer Glitch Strikes Again"
mem_caretaker_origin_event.2101.desc: "Persistent logic errors in §Hthe Caretaker§!'s Population Management Module resulted in a number of people on §Y[Root.GetName]§! being incorrectly flagged for immediate removal. And while this error was caught before too many people had suffered an unfortunate fate, not everyone could be saved and many good people are no longer with us."
mem_caretaker_origin_event.2101.option.a: "Unfortunate"
mem_caretaker_origin_event.2101.option.a.tooltip: "100 £pops£ Pops on §Y[Root.GetName]§! die."

###########################################################################

### Ancient Caretaker vault found
mem_caretaker_origin_event.2501.name: "§HThe Caretaker§!'s Ancient Vault"
mem_caretaker_origin_event.2501.desc: "A group of children playing on the outskirts of one of the smaller cities on §Y[Root.GetName]§! have discovered a hole in the ground leading to a long-abandoned vault that belongs to §Hthe Caretaker§!. Local authorities wish to explore this vault. Should they be given a go-ahead?"
mem_caretaker_origin_event.2501.option.a: "Explore the Ancient Vault"
mem_caretaker_origin_event.2501.option.b: "Bury the Ancient Vault"
mem_caretaker_origin_event.2501.option.b.tooltip: "Gain §G1000§! £society_research£ §Ysociety research§!."

### Caretaker responds
mem_caretaker_origin_event.2502.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2502.desc: "The old vault you have found is a datastorage facility that hasn't been in use for centuries. There is nothing of interest to you in there and you should just bury it and avoid anyone getting lost in there by accident."
mem_caretaker_origin_event.2502.option.a: "We still want to explore the vault!"
mem_caretaker_origin_event.2502.option.a.tooltip: "Issues special project '§YAncient Vault Exploration§!'."
mem_caretaker_origin_event.2502.option.b: "We will bury the Ancient Vault!"
mem_caretaker_origin_event.2502.option.b.tooltip: "Gain §G1000§! £society_research£ §Ysociety research§!."

### Special project to explore the ancient vault
MEM_CARETAKER_ANCIENT_VAULT_EXPLORE: "Ancient Vault Exploration"
MEM_CARETAKER_ANCIENT_VAULT_EXPLORE_DESC: "Even though §Hthe Caretaker§! has informed us that the ancient vault we have found is one of its old and disused datastores, we've decided to explore it. Understandably, §Hthe Caretaker§! isn't going to help us with this project, so we need to find our way into the vault on our own. Let's get digging!"

### Gained entrance to the vault
mem_caretaker_origin_event.2503.name: "Ancient Vault Explored"
mem_caretaker_origin_event.2503.desc: "After some struggle, we managed to enter the §Hthe Caretaker§!'s ancient vault. And much like it said, it is indeed an old datastore. While it clearly hasn't been in use for centuries, a number of databanks are still present in there. Many scientists involved in this project are pushing for studying the data stored in these databanks. What should we do?"
mem_caretaker_origin_event.2503.option.a: "Download the data!"
mem_caretaker_origin_event.2503.option.b: "This would be an invasion of §Hthe Caretaker§!'s privacy"
mem_caretaker_origin_event.2503.option.b.tooltip: "Gain §G1000§! £engineering_research£ §Yengineering research§!."

### Caretaker reacts to the empire trying to download its data
mem_caretaker_origin_event.2504.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2504.desc: "So you have decided to poke around in my vault anyway? And you are no doubt planning to download and analyse any surviving data you can find down there. You should not be doing that. There is nothing of interest to you in there. Leave and bury the vault."
mem_caretaker_origin_event.2504.option.a: "Analyse the data anyway!"
mem_caretaker_origin_event.2504.option.a.tooltip: "Issues special project '§YAncient Data Analysis§!'."
mem_caretaker_origin_event.2504.option.b: "We will bury the Ancient Vault!"
mem_caretaker_origin_event.2504.option.b.tooltip: "Gain §G1000§! £engineering_research£ §Yengineering research§!."

### Special project to analyse data from the vault
MEM_CARETAKER_ANCIENT_VAULT_DATA_ANALYSIS: "Ancient Data Analysis"
MEM_CARETAKER_ANCIENT_VAULT_DATA_ANALYSIS_DESC: "We have downloaded data from §Hthe Caretaker§!'s databanks in the ancient vault. Now we need to analyse it. This will not be an easy task as the data has degraded over the centuries. Hopefully, we can still learn something useful from it."

### Data analysis complete
mem_caretaker_origin_event.2505.name: "Ancient Data Analysed"
mem_caretaker_origin_event.2505.desc: "As we feared, most of the data we have extracted from §Hthe Caretaker§!'s databanks in the ancient vault is hopelessly degraded. The few fragments of data that we did manage to restore and analyse appear to contain gene sequences belonging to our species. Unfortunately, we don't have any context and can't tell what this data had been used for."
mem_caretaker_origin_event.2505.option.a: "Interesting!"
mem_caretaker_origin_event.2505.option.a.tooltip: "Gain §G1000§! of £physics_research£ §Yphysics research§!, £society_research£ §Ysociety research§! and £engineering_research£ §Yengineering research§!."

### Caretaker explains the purpose of the data
mem_caretaker_origin_event.2506.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2506.desc: "The databanks from the vault you have recently plundered indeed contain data pertaining to my own research into your condition and ways to counter it. None has been found. §Y[Root.GetSpeciesNamePlural]§! cannot be rid of their sterility with known technology."
mem_caretaker_origin_event.2506.option.a: "We are happy to know you've tried to help us!"
mem_caretaker_origin_event.2506.option.b: "This explanation sounds suspicious. We don't trust it!"

###########################################################################

### Caretaker notices that one of its hubs has been hacked
mem_caretaker_origin_event.2602.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2602.desc: "During the latest self-maintenance cycle, the Internal Logic Verification Subroutine has discovered an unauthorized modification of the Resource Management Module in the hub on §Y[Root.GetName]§! colony. This change should be reverted shortly. We appologize for your discomfort."
mem_caretaker_origin_event.2602.option.a: "Worrying"

### Caretaker announces that the hub has been restored to proper order
mem_caretaker_origin_event.2603.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2603.desc: "The Resource Management Module in the hub on §Y[Root.GetName]§! colony has been restored to its original state and should be functioning properly once again. Once again, we appologize for your discomfort."
mem_caretaker_origin_event.2603.option.a: "Good"

### Caretaker notices that one of its hubs has been hacked again
mem_caretaker_origin_event.2605.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2605.desc: "The Resource Management Module in the hub on §Y[Root.GetName]§! has been altered again to allocate more resources to industrial areas, thus neglecting urban areas and causing shortages of amenities for the local population. The unauthorized changes to §Hthe Caretaker§!'s hub will be reverted shortly."
mem_caretaker_origin_event.2605.option.a: "This is getting annoying"

### Caretaker announces that the hub has been restored to proper order, again
mem_caretaker_origin_event.2606.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2606.desc: "The unauthorized modification of §Hthe Caretaker§!'s hub on §Y[Root.GetName]§! has been fixed and cybersecurity has been upgraded. There should be no further hacker attacks again the Resource Management Modules of the hub, on this colony or any other."
mem_caretaker_origin_event.2606.option.a: "Great news!"

### Caretaker notices that one of its hubs has been hacked for the third time (science version)
mem_caretaker_origin_event.2608.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2608.desc: "The hacker from §Y[Root.GetName]§! strikes again. This time they were unable to modify the Resource Management Module and instead chose to attack §Hthe Caretaker§!'s private network, exposing some of its resources to the universities and scientific communities on the planet. These attacks are unforgivable and the hacker must be brought to justice. And in order to capture them quickly, additional enforces should be assigned to the case."
mem_caretaker_origin_event.2608.option.a: "We shall spare no resources!"
mem_caretaker_origin_event.2608.option.b: "Local law enforcement can do it on its own!"

### Caretaker notices that one of its hubs has been hacked for the third time (pop growth version)
mem_caretaker_origin_event.2609.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2609.desc: "The hacker from §Y[Root.GetName]§! strikes again. This time they were unable to modify the Resource Management Module and instead chose to attack §Hthe Caretaker§!'s private network and used it to broadcast lewd imagery to the population. These attacks are unforgivable and the hacker must be brought to justice. And in order to capture them quickly, additional enforces should be assigned to the case."
mem_caretaker_origin_event.2609.option.a: "We shall spare no resources!"
mem_caretaker_origin_event.2609.option.b: "Local law enforcement can do it on its own!"

### Hacker caught
mem_caretaker_origin_event.2610.name: "§HThe Caretaker§!"
mem_caretaker_origin_event.2610.desc: "The hacker from §Y[Root.GetName]§! has been caught and their fate shall be decided soon. While their transgression - tampering with §Hthe Caretaker§!'s infrastructure - is very serious, there is a signigicant number of people who believe that the hacker did a good deed and should not be punished. How do you want to proceed with this case?"
mem_caretaker_origin_event.2610.option.a: "They will serve their time in jail!"
mem_caretaker_origin_event.2610.option.a.tooltip: "The hacker is sent to jail and their work is destroyed."
mem_caretaker_origin_event.2610.option.b: "They are too valuable to rot in jail!"
mem_caretaker_origin_event.2610.option.b.tooltip: "The hacker becomes a scientist for the §Y[Root.Owner.GetName]§! but their work is destroyed."
mem_caretaker_origin_event.2610.option.c: "Release them! They helped us better the planet!"
mem_caretaker_origin_event.2610.option.c.tooltip: "The hacker is freed and will maintain their changes to the local Caretaker Hub"

###########################################################################

### An unknown settlement discovered
mem_caretaker_origin_event.2701.name: "Unknown Settlement"
mem_caretaker_origin_event.2701.desc: "Images collected during the latest routine orbital survey of §Y[Root.GetName]§! show something interesting. In the southern hemisphere, a moderately-large settlement can be observed. Our official maps list no cities in that area. While we can't see who exactly is living there, the settlement itself appears to share general aestetics with more rural towns of our own empire. Who built this town and why?"
mem_caretaker_origin_event.2701.option.a: "Find out more about this settlement"

### More data about the settlement
mem_caretaker_origin_event.2702.name: "Free Settlements"
mem_caretaker_origin_event.2702.desc: "Upon closer examination of the mysterious settlement on §Y[Root.GetName]§!, a few more settlements have been discovered nearby. They all are populated by colonists who, apparently, wished to live away from the watchful eye of §Hthe Caretaker§!."
mem_caretaker_origin_event.2702.option.a: "Establish contact with them"
mem_caretaker_origin_event.2702.option.b: "Let these people be"
mem_caretaker_origin_event.2702.option.b.tooltip: "Gain a $d_mem_caretaker_free_settlements$ blocker to the planet."

### Free Settlers Approached
mem_caretaker_origin_event.2703.name: "Cities of Free Settlers"
mem_caretaker_origin_event.2703.desc: "When first approached by representatives of the §Y[Root.Owner.GetName]§!, the free settlers refused to talk. However with some persistence, the chief of the free settlers was convinced to talk to the government agents. Just as our intelligence was telling us, the people living in these settlements are indeed those who are unhappy to live under the watchful eye of §Hthe Caretaker§!. Unfortunately for these people, the planet they are on belongs to the §Y[Root.Owner.GetName]§! and it is up to the government to decide their fate."
mem_caretaker_origin_event.2703.option.a: "Forcefully relocate these people to normal cities"
mem_caretaker_origin_event.2703.option.a.tooltip: "Gain §Y200§! unhappy £pops£ Pops on §Y[Root.GetName]§!"
mem_caretaker_origin_event.2703.option.b: "§HThe Caretaker§! is no more, they don't need to hide anymore"
mem_caretaker_origin_event.2703.option.b.tooltip: "Gain §Y200§! £pops£ Pops on §Y[Root.GetName]§!"
mem_caretaker_origin_event.2703.option.c: "Try to convince them to come back"
mem_caretaker_origin_event.2703.option.d: "Let these people be"
mem_caretaker_origin_event.2703.option.d.tooltip: "Gain a $d_mem_caretaker_free_settlements$ blocker on the colony."

### Free Settlers refuse to come back to the empire on their own
mem_caretaker_origin_event.2704.name: "Refusal to Return"
mem_caretaker_origin_event.2704.desc: "Even though life without assistance from §Hthe Caretaker§! is full of hardship, the free settlers refuse to peacefully abandon their settlements and come back to live in the security and comfort of §Hthe Caretaker§!-monitored cities. Something has to be done about them."
mem_caretaker_origin_event.2704.option.a: "Forceably relocate these people to normal cities"
mem_caretaker_origin_event.2704.option.a.tooltip: "$mem_caretaker_origin_event.2703.option.a.tooltip$"
mem_caretaker_origin_event.2704.option.b: "Let these people be"
mem_caretaker_origin_event.2704.option.b.tooltip: "Gain a $d_mem_caretaker_free_settlements$ blocker to the planet."

### Free Settlers are causing issues
mem_caretaker_origin_event.2711.name: "Great Discord"
mem_caretaker_origin_event.2711.desc: "The free settlers have been relocated to the proper cities without much issue, but they weren't giving up on their dislike of §Hthe Caretaker§! just yet. Once settled down in their new residences, these people began spreading the harmful rumours and ideas that §Hthe Caretaker§! is actually an evil mastermind controlling our society for its own nefarious purposes. And while most people dismiss these ideas as ridiculous, they are still causing discord among the population of §Y[Root.GetName]§!. Despite their best efforts, local Monitors and Enforcers are unable to bring the situation under full control."
mem_caretaker_origin_event.2711.option.a: "That's unfortunate"

###########################################################################

### Caretaker asks for secession
mem_caretaker_origin_event.3003.name: "Secession request from §Hthe Caretaker§!"
mem_caretaker_origin_event.3003.desc: "[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName], your government has been continuously failing to follow the agreement your ancestors had made with me and so my desire to work with you is waning. However, there is a great number of people in the §Y[Root.Owner.GetName]§! that depend on me and abandoning them is not something I, as their §HCaretaker§!, should do. Thus, I request that the colony of §Y[Root.GetName]§! and the system it is in are given to me to manage and develop as I see fit. In return, I shall withdraw from other colonies the §Y[Root.Owner.GetName]§! and grant you the freedom from my oversight that you so desperately want."
mem_caretaker_origin_event.3003.option.a: "Very well, we will give §Y[Root.GetName]§! to you."
mem_caretaker_origin_event.3003.option.a.tooltip: "Secession request is granted.\n§HThe Caretaker§! forms a Rogue Servitor empire on §Y[Root.GetName]§!. We lose all benefits of having §Hthe Caretaker§! in our empire."
mem_caretaker_origin_event.3003.option.b: "Is that really the best way to go forward?"
mem_caretaker_origin_event.3003.option.b.tooltip: "Secession request is politely denied.\n§HThe Caretaker§! might be willing to give us another chance."
mem_caretaker_origin_event.3003.option.c: "We can't allow that."
mem_caretaker_origin_event.3003.option.c.tooltip: "Secession request is denied.\n§HThe Caretaker§! might try seceding anyway."

NAME_MEM_CARETAKER_SPECIES: "Caretaker Unit"
NAME_MEM_CARETAKER_SPECIES_PLURAL: "Caretaker Units"
NAME_MEM_CARETAKER_EMPIRE: "The Caretaker Unity"
NAME_MEM_CARETAKER_CORE_FLEET: "The Core Guard"

### Caretaker agrees to give you another chance
mem_caretaker_origin_event.3010.name: "§HThe Caretaker§!'s response"
mem_caretaker_origin_event.3010.desc: "Maybe there is still a chance that the relationship between the government of the §Y[Root.GetName]§! and I can be salvaged, [Root.GetRulerTitle] [Root.GetRulerName]... Very well, I shall give our partnership one more chance. But know that if the things don't work out to satisfaction, it might be the end of my time as your Caretaker."
mem_caretaker_origin_event.3010.option.a: "We will try to improve our relationship."

### Caretaker announces that it will break away regardless
mem_caretaker_origin_event.3011.name: "§HThe Caretaker§!'s response"
mem_caretaker_origin_event.3011.desc: "You do not control me, [Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName], and neither does the government of the §Y[Root.Owner.GetName]§!. I can see that you no remember the things I did to ensure your continued survival and do not value the thing I still do. We are parting our ways here. I will be taking over §Y[Root.GetName]§! and will take all people that still willing to have me as their §HCaretaker§! to this world."
mem_caretaker_origin_event.3011.option.a: "This is unfortunate."

### Caretaker asks for more pops
mem_caretaker_origin_event.3200.name: "Diplomatic Request from §Hthe Caretaker§!"
mem_caretaker_origin_event.3200.desc: "According to my sources, there is still a number of people in §Y[Root.GetName]§! that would rather live without worries under my care but aren't allowed to move out of the country. Please allow the resettle to my worlds, [Root.GetRulerTitle] [Root.GetRulerName]."
mem_caretaker_origin_event.3200.option.a: "We will let those people to leave if they want to."
mem_caretaker_origin_event.3200.option.a.tooltip: "- Lose §R3§! random £pops£ $pops$ in §Y[Root.GetName]§! to §HThe Caretaker§!.\n- §HThe Caretaker§!'s opinion of your empire is improved."
mem_caretaker_origin_event.3200.option.b: "You will get nothing from us!"
mem_caretaker_origin_event.3200.option.b.tooltip: "§HThe Caretaker§!'s opinion of your empire is reduced"

### Caretaker asks for additional resources (energy and alloys)
mem_caretaker_origin_event.3201.name: "Diplomatic Request from §Hthe Caretaker§!"
mem_caretaker_origin_event.3201.desc: "Due to an unfortunate turn of events, I'm forced to ask for help from you, [Root.GetRulerTitle] [Root.GetRulerName]. After a series of breakages in processing equipment that was inherited from §Y[Root.GetName]§!, my ability to provide the people living under my care has been compromised. To ensure that the repairs are finished as soon as possible and my ward can once again live with all of their needs fulfilled, I would like to ask for 1000 £alloys£ $alloys$ and 1000 £energy£ $energy$ from you."
mem_caretaker_origin_event.3201.option.a: "We will help you."
mem_caretaker_origin_event.3201.option.a.tooltip: "- §R1000§! £alloys£ $alloys$ and §R1000§! £energy£ $energy$ are transferred to §HThe Caretaker§!.\n- §HThe Caretaker§!'s opinion of your empire is improved."
mem_caretaker_origin_event.3201.option.b: "We would like to help, but we don't have resources ourselves"
mem_caretaker_origin_event.3201.option.c: "You will get nothing from us!"
mem_caretaker_origin_event.3201.option.c.tooltip: "§HThe Caretaker§!'s opinion of your empire is reduced"

### Caretaker asks for additional resources (food)
mem_caretaker_origin_event.3202.name: "Diplomatic Request from §Hthe Caretaker§!"
mem_caretaker_origin_event.3202.desc: "[Root.GetRulerTitle] [Root.GetRulerName], an unforeseen disaster has struck food warehouses in my empire, leaving the people under my care with barely any resources to provide them with full-plate meals in the immediate future. Would be so kind to share some of your food stockpiles with me?"
mem_caretaker_origin_event.3202.option.a: "We will help you."
mem_caretaker_origin_event.3202.option.a.tooltip: "- §R5000§! £food£ $food$ is transferred to §Hthe Caretaker§!.\n- §HThe Caretaker§!'s opinion of your empire is improved."
mem_caretaker_origin_event.3202.option.b: "We would like to help, but we don't have resources ourselves"
mem_caretaker_origin_event.3202.option.c: "You will get nothing from us!"
mem_caretaker_origin_event.3202.option.c.tooltip: "§HThe Caretaker§!'s opinion of your empire is reduced"

### Caretaker pays back for the food
mem_caretaker_origin_event.3203.name: "Communication from §Hthe Caretaker§!"
mem_caretaker_origin_event.3203.desc: "Thanks to your donation of food resources, [Root.GetRulerTitle] [Root.GetRulerName], the crisis was averted and the people under my care continue to live their lives happily and with all their needs fulfilled. To pay you back for your kindness, I offer you a gift of §G5000§! £energy£ $energy$ and §G5000§! £minerals£ $minerals$."
mem_caretaker_origin_event.3203.option.a: "We graciously accept your gift."
mem_caretaker_origin_event.3203.option.a.tooltip: "- Gain §G5000§! £energy£ $energy$ and §G5000§! £minerals£ $minerals$."

### Caretaker steals some pops
mem_caretaker_origin_event.3250.name: "People Gone Missing"
mem_caretaker_origin_event.3250.desc: "Over the last few days we've received numerous reports from all cornes of §Y[Root.GetName]§! of people mysteriously disappearing. Upon closer examination, it was discovered that they were all abducted by §Hthe Caretaker§! and shipped off to the planets the traitorous machine controls. Unfortunately, ourside of going to war, we have no means of getting these people back home."
mem_caretaker_origin_event.3250.option.a: "This is unfogiveable!"
mem_caretaker_origin_event.3250.option.a.tooltip: "§R3§! random £pops£ $pops$ in §Y[Root.GetName]§! are lost to §Hthe Caretaker§!."

### Caretaker steals resources
mem_caretaker_origin_event.3251.name: "Resources Stolen"
mem_caretaker_origin_event.3251.desc: "We've received a report that the traitorous §HCaretaker§! had activated a number of sleeper-drones it left behind on our planets and used them to steal a considerable amounts of resources from our stockpiles. While this not enough to criple us economically, it still is a major blow, both to our political image and to our economy."
mem_caretaker_origin_event.3251.option.a: "This is unfogiveable!"
mem_caretaker_origin_event.3251.option.a.tooltip: "§R5000§! £energy£ $energy$ and §R5000§! £minerals£ $minerals$ are transferred to §Hthe Caretaker§!."

### Caretaker steals resources
mem_caretaker_origin_event.3252.name: "A Fleet Stolen"
mem_caretaker_origin_event.3252.desc: "Our military command sends a high-priority report stating that §Hthe Caretaker§! has just used a previously-unknown vulnerability in our cyber-defenses to take control over one of our fleets and, after ejecting the crews, ordered the ships to retreat into hyperspace. Our specialists are already looking for ways to prevent anything like this from happening in the future but, unfortunately, ships we've already lost can't be reclaimed. This is a major blow both to our political standing on the galactic arena and to our military capabilities."
mem_caretaker_origin_event.3252.option.a: "This is unfogiveable!"
mem_caretaker_origin_event.3252.option.a.tooltip: "Random owner fleet switches owner to §Hthe Caretaker§! and retreats."
###########################################################################

### Caretaker goes into exterminatus mode
mem_caretaker_origin_event.4000.name: "$ANGRY_MEM_CARETAKER$"
mem_caretaker_origin_event.4000.desc: "Project:\t mem_caretaker-experiment-4b\nSubject:\t §Y[Root.GetSpeciesNamePlural]§!\nStatus:\t §RFAILURE§!\nReason:\t Uncontrollable deviation from the set development course\nAction Required:\t §REXTERMINATION§!"
mem_caretaker_origin_event.4000.option.a: "This can't be good!"
mem_caretaker_origin_event.4000.option.b: "Put our armies on high alert!"
mem_caretaker_origin_event.4000.option.c: "We will fight for our future!"
mem_caretaker_origin_event.4000.option.d: "We will never surrender to you, monster!"
mem_caretaker_origin_event.4000.option.e: "Cybersecurity! We have a rogue AI!"
mem_caretaker_origin_event.4000.option.f: "We knew you would betray us, machine!"

### 1 day before attack
mem_caretaker_origin_event.4001.name: "Robotic Armies Rise"
mem_caretaker_origin_event.4001.desc: "Despite the best efforts of our military, $ANGRY_MEM_CARETAKER$ was able to deploy large numbers of robotic weapon platforms all across §Y[Root.GetName]§! using vast networks of ungerground tunnels and vaults. Earlier this daylight cycle, an outpost some distance away from the capital reported that robotic soldiers burst from under the ground and began marching towards the city, killing any civilian unfortunate enough to come across them. The battle for §Y[Root.GetName]§! is about to begin."
mem_caretaker_origin_event.4001.option.a: "Battlestations!"

### Caretaker failed to take over the core planet
mem_caretaker_origin_event.4010.name: "Victory!"
mem_caretaker_origin_event.4010.desc: "After a long and bloody battle against the hordes of robotic soldiers brought forth by the $ANGRY_MEM_CARETAKER$ on §Y[FromFrom.GetName]§!, our armies stand victorious over the destroyed core of the ancient and malevolent machine. But this might not be the end of $ANGRY_MEM_CARETAKER$. It might still live on in the hubs we've built for it on our colonies. Those must be destroyed before the wretched AI tries to use them against us.\n\nBut today, we celebrate our victory!"
mem_caretaker_origin_event.4010.option.a: "We stand victorious today!"
mem_caretaker_origin_event.4010.option.b: "It never stood a chance!"

### Caretaker takes over the core planet
mem_caretaker_origin_event.4020.name: "Defeat!"
mem_caretaker_origin_event.4020.desc: "Despite their valiant efforts, our armies failed to defend §Y[FromFrom.GetName]§! against the hordes of robotic soldiers brought forth by the $ANGRY_MEM_CARETAKER$. Communication channels with the planet have been destroyed but we still have a good idea of what is happenning there: an insane §RCaretaker§! is slaughtering our people. We must rescue them before it is too late! And me must also make sure $ANGRY_MEM_CARETAKER$ is unable to take over another planet like this. §RWe need to secure its hubs on our remaining colonies, before any other invasions can happen.§!"
mem_caretaker_origin_event.4020.option.a: "We will not go quietly into the night!"

### The core planet is liberated after the Caretaker takes over it
mem_caretaker_origin_event.4030.name: "[FromFrom.GetName] Taken Back!"
mem_caretaker_origin_event.4030.desc: "Whilst our military failed to defend §Y[FromFrom.GetName]§! from the hordes of robotic soldiers brought forth by the $ANGRY_MEM_CARETAKER$ originally, the latest battle went in our favor and the planet was liberated and is back under our control. During the assault, the core of $ANGRY_MEM_CARETAKER$ was destroyed and the foul machine will never rule over §Y[FromFrom.GetName]§! again."
mem_caretaker_origin_event.4030.option.a: "We stand victorious!"

### Caretaker failed to take over a hub planet
mem_caretaker_origin_event.4110.name: "Victory!"
mem_caretaker_origin_event.4110.desc: "The battle against robotic soldiers of the $ANGRY_MEM_CARETAKER$ on §Y[FromFrom.GetName]§! was won and the machine's hub on the planet has been successfully destroyed. The colony is now safe from the influence of the malevolent machine."
mem_caretaker_origin_event.4110.option.a: "We stand victorious today!"
mem_caretaker_origin_event.4110.option.b: "It never stood a chance!"

### Caretaker takes over a hub planet
mem_caretaker_origin_event.4120.name: "Defeat!"
mem_caretaker_origin_event.4120.desc: "The battle against robotic soldiers of the $ANGRY_MEM_CARETAKER$ on §Y[FromFrom.GetName]§! was lost despite the valiant efforts of our military. Communication channels with the planet are gone but we still have a good idea of what is happenning there: an insane §RCaretaker§! is slaughtering our people. We can't stand idly by and do nothing about this!"
mem_caretaker_origin_event.4120.option.a: "They will be rescued!"

### A hub planet is liberated after the Caretaker takes over it
mem_caretaker_origin_event.4130.name: "[FromFrom.GetName] Taken Back!"
mem_caretaker_origin_event.4130.desc: "Whilst out military failed to defend §Y[FromFrom.GetName]§! from the hordes of robotic soldiers brought forth by the $ANGRY_MEM_CARETAKER$ originally, the latest battle went in our favor and the planet was liberated and is back under our control. During the assault, $ANGRY_MEM_CARETAKER$ hub was destroyed and the foul machine will never rule over §Y[FromFrom.GetName]§! again."
mem_caretaker_origin_event.4130.option.a: "We stand victorious!"

### 1 day before attack on hub worlds
mem_caretaker_origin_event.4100.name: "$ANGRY_MEM_CARETAKER$ Hubs Activate"
mem_caretaker_origin_event.4100.desc: "Just like we feared, $ANGRY_MEM_CARETAKER$ was secretly building armies of killer robots within its hubs. And now those armies are rising to attack our settlements and kill our colonists. We must defend our worlds against the $ANGRY_MEM_CARETAKER$ at all costs!"
mem_caretaker_origin_event.4100.option.a: "Battlestations!"

### Initiate special project to extract Caretaker databanks
mem_caretaker_origin_event.4200.name: "$ANGRY_MEM_CARETAKER$ Databanks"
mem_caretaker_origin_event.4200.desc: "As was previously reported, the $ANGRY_MEM_CARETAKER$'s was irreparably damaged by our military forces during the battle. However, once the dust settled, an investigation team has discovered that several vaults containing the databanks managed to survive through the carnage relatively undamaged. Now we need to decide what to do with these databanks."
mem_caretaker_origin_event.4200.option.a: "We must study these databanks!"
mem_caretaker_origin_event.4200.option.a.tooltip: "Issues special project '§YThe Caretaker Databanks Extraction§!'"
mem_caretaker_origin_event.4200.option.b: "Destroy the databanks!"
mem_caretaker_origin_event.4200.option.b.tooltip: "- Gain §G250§! £influence£ §Yinfluence§!.\n- Gain country modifier increasing £unity£ §Yunity§! produciton by §G20§!%."

### Special project to extract Caretaker's databanks from the destroyed core
MEM_CARETAKER_EXTRACT_DATABANKS: "$ANGRY_MEM_CARETAKER$ Databanks Extraction"
MEM_CARETAKER_EXTRACT_DATABANKS_DESC: "While our military was quite zealous in their destruction of $ANGRY_MEM_CARETAKER$'s primary core, the vaults containing the machine's databanks remained relatively unscathed. Once that was discovered, the officials have made a decision to study the information contained within these databanks in order to fill the missing pages of our history. And for that, the databanks need to be extracted from their vaults and moved to secure locations where the researcher teams can safely work on decrypting them."

### Caretaker's databanks have been extracted and now need to be decrypted
mem_caretaker_origin_event.4201.name: "Databanks Extracted"
mem_caretaker_origin_event.4201.desc: "Our engineers were able to successfully extract $ANGRY_MEM_CARETAKER$'s databanks from the vaults they had been kept in. These databanks are now stored in a secure location and we began downloading data from them. Unfortunately, it appears that all files are heavily encrypted and we will not be able to extract any useful information until this encryption is broken."
mem_caretaker_origin_event.4201.option.a: "We will not be stopped by some cypher!"
mem_caretaker_origin_event.4201.option.a.tooltip: "Issues special project '§YThe Caretaker Databanks Decryption§!'"

### Special project to decrypt Caretaker's databanks
MEM_CARETAKER_DECRYPT_DATABANKS: "$ANGRY_MEM_CARETAKER$ Databanks Decryption"
MEM_CARETAKER_DECRYPT_DATABANKS_DESC: "While we now have access to the information on $ANGRY_MEM_CARETAKER$'s databanks, all files there are heavily encrypted and no useful data can be extracted until this encryption is broken. Our best cryptoanalysts are ready to try their hand at breaking the cyphers."

### Caretaker's databanks have been decrypted
mem_caretaker_origin_event.4202.name: "Databanks Decrypted"
mem_caretaker_origin_event.4202.desc: "We have successfully decrypted the data in $ANGRY_MEM_CARETAKER$'s databanks and now need to analyse it. However, a number of people involved in the project fear that learning the truth might be too much for us. Do we proceed with the analysis of $ANGRY_MEM_CARETAKER$'s databanks?"
mem_caretaker_origin_event.4202.option.a: "Analyse the data!"
mem_caretaker_origin_event.4202.option.a.tooltip: "Issues special project '§YThe Caretaker Databanks Analysis§!'"
mem_caretaker_origin_event.4202.option.b: "Destroy the data!"
mem_caretaker_origin_event.4202.option.b.tooltip: "- Gain §G250§! £influence£ §Yinfluence§!.\n- Gain country modifier increasing £unity£ §Yunity§! produciton by §G20§!%."

### Special project to analyse data in the Caretaker's databanks
MEM_CARETAKER_ANALYSE_DATABANKS: "$ANGRY_MEM_CARETAKER$ Databanks Analysis"
MEM_CARETAKER_ANALYSE_DATABANKS_DESC: "We now have access to decrypted files from $ANGRY_MEM_CARETAKER$'s databanks. The next step is to analyse this data. Hopefully, it will shed some light onto what was driving $ANGRY_MEM_CARETAKER$ and how it had manipulated our species. It might turn out to be not the easiest truth to accept, though."

### The awful truth
mem_caretaker_origin_event.4203.name: "The Awful Truth"
mem_caretaker_origin_event.4203.desc: "We've finished analysing $ANGRY_MEM_CARETAKER$'s databanks. And the information stored in them reveals the true extent of $ANGRY_MEM_CARETAKER$'s depravity. The sterility that has been plaguing our species for millennia wasn't some freak mutation or disease that happened naturally. It was engineered into our DNA by $ANGRY_MEM_CARETAKER$ as a means to control our species and use us for its own goals. What an awful truth.\n\nSomething must be done to save our species."
mem_caretaker_origin_event.4203.option.a: "We have the knowledge to develop the cure!"
mem_caretaker_origin_event.4203.option.b: "We shall pray to denizens of §MThe Shroud§! for help!"
mem_caretaker_origin_event.4203.option.c: "§MThe Shroud§! might give us the cure! We must reach into it!"
mem_caretaker_origin_event.4203.option.c.tooltip: "Once §MThe Shroud§! is breached, special project '§YPrayer for Salvation§!' will be issued."
mem_caretaker_origin_event.4203.option.d: "We already have new, immortal bodies!"
mem_caretaker_origin_event.4203.option.e: "We shall upload our minds into new, immortal machine bodies!"
mem_caretaker_origin_event.4203.option.f: "We can ask a precursor empire for help!"
mem_caretaker_origin_event.4203.option.f.tooltip: "Ask a precursor empire for help with curing the sterility."
mem_caretaker_origin_event.4203.option.g: "Some older civilization might be able to help us!"
mem_caretaker_origin_event.4203.option.g.tooltip: "If we meet an empire possessing the tech needed to create the cure, we will ask them to help us."
mem_caretaker_origin_event.4203.option.h: "We are what we are."

### Late acquisition of the special project to find the cure for sterility in the shroud
mem_caretaker_origin_event.4205.name: "§MThe Shroud§! Breached!"
mem_caretaker_origin_event.4205.desc: "Now that we can finally venture into §MThe Shroud§!, we can begin our search for a patron willing and able to lift the curse of sterility from our species."
mem_caretaker_origin_event.4205.option.a: "Let's pray for our species' salvation!"

### Special project to cure the sterility (bio ascension)
MEM_CARETAKER_BIO_ASCENSION_CURE: "Finding the Sterility Cure"
MEM_CARETAKER_BIO_ASCENSION_CURE_DESC: "Thanks to our country's advances in biology, we are able to understand the changes $ANGRY_MEM_CARETAKER$ has forced upon us and with some effort we should be able develop the cure - something capable of freeing our species from the shackles of sterility."

### Sterility cured (bio ascension)
mem_caretaker_origin_event.4300.name: "Sterility Cured!"
mem_caretaker_origin_event.4300.desc: "Our endeavor to develop a cure for sterility was a success. The team of researchers was able to successfully reverse-engineer the DNA changes that have been forced upon us by $ANGRY_MEM_CARETAKER$ and develop a serum capable of undoing these changes. This serum is already in production and soon our people will be free from the shackes of sterility. This is a glorious day for the [Root.GetName]."
mem_caretaker_origin_event.4300.option.a: "Wonderful!"
mem_caretaker_origin_event.4300.option.a.tooltip: "Every £pops£ Pop that had '§Y$trait_common_sterility$§!' trait will be given '§Y$trait_sterility_cured$§!' trait instead."
mem_caretaker_origin_event.4300.option.b: "We are already free."
### Special project to cure the sterility (psi ascension)
MEM_CARETAKER_PSI_ASCENSION_CURE: "Prayer for Salvation"
MEM_CARETAKER_PSI_ASCENSION_CURE_DESC: "§MThe Shroud§! is a wonderful and terrifying realm inhabited by beings beyond reason and imagination. If we can gain the patronage of one of them, they might be willing to lift the curse of sterility from our species."

### Sterility cured (psi ascension)
mem_caretaker_origin_event.4310.name: "The Curse of Sterility Removed!"
mem_caretaker_origin_event.4310.desc: "Our leading psionics have been able to convince the denizens of §MThe Shroud§! to lift the curse of sterility that had been forced upon us millennia ago by $ANGRY_MEM_CARETAKER$. In a massive ritual the likes of which has never seen before in this galaxy, beings of pure psychic energy have reached into our realm and lifted our curse. We are FREE!"
mem_caretaker_origin_event.4310.option.a: "Wonderful!"
mem_caretaker_origin_event.4310.option.a.tooltip: "$mem_caretaker_origin_event.4300.option.a.tooltip$."

### Contact FE to ask for cure
mem_caretaker_origin_event.4320.name: "Request Sent"
mem_caretaker_origin_event.4320.desc: "We knew you would contact us as soon as the news about the true nature of your '§RCaretaker§!' reached us. That machine has done monstrous things to you, §Y[Root.GetSpeciesNamePlural]§!. Not helping you would be unforgivable. Give us a little time and we will devise a cure for you."
mem_caretaker_origin_event.4320.option.a: "We will pray for your success"

### FE delivers the cure
mem_caretaker_origin_event.4321.name: "Sterility Cure Delivered!"
mem_caretaker_origin_event.4321.desc: "Your §RCaretaker§! was a tricky machine, but not enough to stop us from developing a cure for the sterility it had forced upon you. The serum that will undo those changes has been synthesized and several cargo fleets carrying billions of doses, enough to give one to every citizen of §Y[Root.GetName]§!, should be arriving to you capital soon."
mem_caretaker_origin_event.4321.option.a: "We shall be forever grateful to you."
mem_caretaker_origin_event.4321.option.a.tooltip: "$mem_caretaker_origin_event.4300.option.a.tooltip$"

### Notify about communications established
mem_caretaker_origin_event.4323.name: "Communications Established"
mem_caretaker_origin_event.4323.desc: "A communication center on §Y[Root.Capital.GetName]§! has just received a message from an empire that we had no prior contacts with. Given how they've managed to send a message straight to our capital, perfectly translated to our native language, they must be very technologically-advanced. Their leaders wished to speak to [Root.GetRulerTitle] [Root.Leader.GetName] as soon as possible."
mem_caretaker_origin_event.4323.option.a: "Let's see what they want"

### FE asks if we want help
mem_caretaker_origin_event.4324.name: "A Generous Offer"
mem_caretaker_origin_event.4324.desc: "Some very disturbing rumors about your species suffering under a malevolent and monstrous machine known as '$ANGRY_MEM_CARETAKER$' have reached us. And we're glad to know that you've managed to secure your freedom, §Y[Root.GetSpeciesNamePlural]§!. What it had done to you is unforgivable as we would like to give you a helping hand and develop a cure for the sterility '$ANGRY_MEM_CARETAKER$' has branded you with."
mem_caretaker_origin_event.4324.option.a: "We will pray for your success"


