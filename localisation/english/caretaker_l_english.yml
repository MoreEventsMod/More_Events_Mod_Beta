 # Traits
 trait_common_sterility: "Sterility"
 trait_common_sterility_desc: "§LMembers of this species find natural reproduction to be extremely difficult.§!"
 trait_sterility_cured: "Sterility Remedied"
 trait_sterility_cured_desc: "§LThe curse of sterility has been remedied and fertility rates greatly increased.§!"
 leader_trait_ruler_firstmonitor: "First Monitor"
 leader_trait_ruler_firstmonitor_desc: "§LThe one who leads the Order. The one that has priority to communicate with§! §Hthe Caretaker§!§L. The one that has constant access to an archive of wisdom, and a life-extending interface.§!"
 trait_robot_mem_caretaker_directives: "Caretaker Link"
 trait_robot_mem_caretaker_directives_tt:0 "Unemployed Robots will become £job_mem_caretaker_aa_drone£ §YCaretaker Drones§!"
 trait_robot_mem_caretaker_directives_desc: "§HThe Caretaker§! §Lcan assumes direct control of robots fitted with a special transceiver§! allowing them to take a special £job_mem_caretaker_aa_drone£ Caretaker Drone job when no other suitable job is available"
 leader_trait_personal_mem_caretaker: "P.C.I."
 leader_trait_personal_mem_caretaker_desc: "§LThe Personal Care Interface is cyber and nano technology that provides harmonious monitoring and adjustment of body and mind by§! §Hthe Caretaker§!§L, as well as access to an archive of wisdom.§!"
 trait_personal_mem_caretaker: "P.C.I."
