# Stellaris Modjam 2020 - Caretaker
# AlphaAsh, NHunter, Rough, GwenBlanketKnight

# AA i love you, but please use $$ in your locs - tree
# Origin
 origin_mem_caretaker: "The Caretaker"
 origin_mem_caretaker_desc: "In the distant past, this civilization was cursed with sterility. In response to a rapidly shrinking population, the wisest of this civilisation's ancestors created a vast device, §Hthe Caretaker§!, designed to provide them with offspring.\n\nOver centuries, this civilization has become more and more dependent on §Htheir Caretaker§!, and now §Hthe Caretaker§! has gifted them with the means to expand into the stars. But it has made a rare request of its wards - that it may expand with them, to continue to care for them wherever they may go."
 #origin_tooltip_mem_caretaker_effects: "Start on a world with §Hthe Caretaker§! that provides services and resources requested by £decision£ planetary decisions, including producing £pop£ pops to help remedy a greatly reduced pop growth rate.\n\n"
 origin_tooltip_mem_caretaker_effects: "- $INITIAL_POPS$ §G+400§!$NEW_LINE$- Unlocks new Resource: £aa_mem_caretaker_mood_icon£ §Y$mem_caretaker_mood$§!$NEW_LINE$- Situation: §Y$mem_caretaker_mood_situation_type$§!$NEW_LINE$- Homeworld $TABBED_NEW_LINE$ - ['building:building_mem_monitor_station_1']$TABBED_NEW_LINE$ - ['building:building_mem_caretaker_outreach']" #$NEW_LINE$- ['concept_mem_caretaker_approves']
 origin_tooltip_mem_caretaker_effects_negative:0 "- Species Traits: ['trait:trait_common_sterility']" #$NEW_LINE$- ['concept_mem_caretaker_disapproves']
 START_SCREEN_MEM_CARETAKER_0: "In the distant past, the [GetSpeciesName] species was cursed with sterility. In response to a rapidly shrinking population, our wisest ancestors created a vast device, §Hthe Caretaker§!, designed to provide us with offspring."
 START_SCREEN_MEM_CARETAKER_2: "Over centuries, we have become more and more dependent on §Hthe Caretaker§!, and now §Hthe Caretaker§! has gifted us with the means to expand into the stars. But it has made a rare request of us - that it may expand with us, to continue to care for us wherever we may go. We have readily agreed to the request."
 # Resource 


 mem_caretaker_mood:0 "Approval"
 mem_caretaker_mood_desc:0 "The only source of happiness."
 MESSAGE_MEM_CARETAKER_CREATED_POPS_TITLE:0 "Pops Gifted"
 MESSAGE_MEM_CARETAKER_CREATED_POPS_DESC:0 "§G+$CREATED_POPS$§! £pop£ [owner_main_species.GetName] gifted to $PLANET$."

 # Civics
 civic_memmonitor_cult: "Monitor Cult"
 civic_memmonitor_cult_desc: "The Monitor Order is the hands and voice of §Hthe Caretaker§!. Society reveres them for their duty and dedication."
 civic_mem_one_big_family: "One Big Family"
 civic_mem_one_big_family_desc: "It is the responsibility of those who are able to have offspring to dedicate themselves to having offspring. That offspring is not the property of their parents and all will have a right to share the responsibility and privilege of raising natural-born children."
 civic_tooltip_one_big_family_effects: "£job_mem_caretaker_ward£ Wards provide §G+1%§! pop growth\n§YNaturally grown £pop£ pops will have advantages over those provided by§! §Hthe Caretaker§!\nCannot use §YDisallow Wards§! decision on any colony\n\n"
 civic_mem_protected: "Protected"
 civic_mem_protected_desc: "War horrifies this pacifist society, where life is rare and every death brings them nearer to their doom, so §Hthe Caretaker§! has taken on greater responsibility for defending its wards from potential threats."
 civic_mem_drone_culture: "Drone Culture"
 civic_mem_drone_culture_desc: "§HThe Caretaker§! provides robotic labourers and the technology to produce more."
 civic_mem_love_the_alien: "Love the Alien"
 civic_mem_love_the_alien_desc: "§HThe Caretaker§! loves only its true children, who consequently view other species as animals, to be used as beasts of burden, or to be kept as pets."
 #civic_tooltip_love_the_alien_effects: "Start with the §Y$tech_neural_implants$§! Tech\n§GThe Caretaker will be more tolerant of alien immigration§!\n§YAliens are permitted to be employed as £job_mem_caretaker_ward£ Wards on any colony§!\n\n"
 civic_mem_care_crusade: "Care Crusade"
 civic_mem_care_crusade_desc:0 "§HThe Caretaker§! provides for its children, who see war as a great trial to be mastered." 
 civic_polyamorous: "Polyamorous"
 mem_caretaker_job_ward_with_icon:0 "£job_mem_caretaker_ward£ §YWards§!"
 civic_memmonitor_cult_tt:0 "§G+0.05§! £influence£ §YInfluence§! per 1 £job_mem_high_monitor£ §YHigh Monitors§!\n['building:building_mem_caretaker_outreach']: §G+2%§! £job_monitor£ §YMonitors§! Efficiency per 100 $mem_caretaker_job_ward_with_icon$"
 civic_mem_one_big_family_tt:0 "['building:building_mem_caretaker_outreach']: §G+2%§! £mod_logistic_growth_mult£ §Y$MOD_LOGISTIC_GROWTH_MULT$§! per $mem_caretaker_job_ward_with_icon$"
 civic_mem_care_crusade_tt:0 "Can always request £alloys£ §YAlloys§!\n§HThe Caretaker§! approves winning a war\n['building:building_mem_caretaker_outreach']: §G+1%§! $job_foundry_plural_with_icon$ Efficiency per 100 $mem_caretaker_job_ward_with_icon$"
 civic_mem_drone_culture_tt:0 "§HThe Caretaker§! will tolerate £engineering£ Robotic Techs and Assembly Plants\n['building:building_mem_caretaker_outreach']: §G+1%§! $mod_robotic_pop_bonus_workforce_mult$ per 100 $mem_caretaker_job_ward_with_icon$"
 civic_mem_protected_tt:0 "The ['starbase_building:mem_caretaker_node',$sm_mem_caretaker_node$] provides extra $MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_ADD$\n\nIncreased £mod_pop_happiness£ §Y$MOD_POP_HAPPINESS$§! during peacetime"
 civic_mem_love_the_alien_tt: "§HThe Caretaker§! will tolerate Aliens\n['building:building_mem_caretaker_outreach']: §G+1%§! $mod_pop_cat_slave_bonus_workforce_mult$ per 100 $mem_caretaker_job_ward_with_icon$"
 # \n\nAliens may be employed as $mem_caretaker_job_ward_with_icon$"

