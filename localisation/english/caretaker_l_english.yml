 mem_caretaker_origin_event.3.name:0 "The New Ways"
 mem_caretaker_origin_event.3.desc:0 "I am pleased to see that §Y[Root.GetName]§! is taking our partnership very seriously, but the current situation forces changes upon my plans. It seems to me, that we do not share the same vision. So let me ask this once, what do you value most? "
