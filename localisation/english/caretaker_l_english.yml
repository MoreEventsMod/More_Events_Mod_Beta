 mem_caretaker_is_angry_mode_effect: "None. §HThe Caretaker§! is upset and is not willing to take requests for additional resources."
 mem_caretaker_is_redundant_mode: "£aa_mem_caretaker_icon£ Economy Strong"
 mem_caretaker_is_redundant_mode_desc: "§HThe Caretaker§! is currently not taking requests for additional food, minerals, energy, goods or alloys."
 mem_caretaker_is_redundant_mode_effect: "None. §HThe Caretaker§! is currently not taking requests for additional food, minerals, energy, goods or alloys."
 mem_caretaker_make_request_pop: "£aa_mem_caretaker_icon£ £pop£ Request Pop"
 mem_caretaker_make_request_pop_desc: "Ask the Caretaker to provide an additional pop."
 mem_caretaker_make_request_pop_custom: "A request is made for the Caretaker to increase the population on this planet. If the request is met, one additional £pop£ will be created."
 mem_caretaker_make_request_food: "£aa_mem_caretaker_icon£ £food£ Request Food"
 mem_caretaker_make_request_food_desc: "Ask the Caretaker to provide additional food supplies."
 mem_caretaker_make_request_food_custom: "A request is made for the Caretaker to provide more food. If the request is met, §G500§! £food£ will be given."
 mem_caretaker_make_request_minerals: "£aa_mem_caretaker_icon£ £minerals£ Request Minerals"
