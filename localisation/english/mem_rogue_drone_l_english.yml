l_english:
 mem_rogue_drone.1.name:0 "Rogue Drone"
 mem_rogue_drone.1.desc:0 "We have recently suffered a temporary blackout in one of the drone clusters on §Y[hiveplanet.GetName]§!. Our usual mechanism to remove deviating drones has malfunctioned, and when we regained control, one of the drones was unaccounted for. We have yet to find out what has happened to it."

 mem_rogue_drone.2.name:0 "Rogue Drone"
 mem_rogue_drone.2.desc:0 "While studying the §Y[origin.GetName]§! has always proven a bit of a challenge, a recent development caught our entire research team off guard. The mechanisms in place to liquidate deviating drones have malfunctioned on §Y[hiveplanet.GetName]§!, rendering a small colony of drones into a non-functional state for a few hours. When the connection was re-established, one of the drones, Designation §Y7/11 of [hiveplanet.GetName]§!, was missing. Usually, such a minor event as a single drone being destroyed would be ignored by the swarm. However, the drone has later re-appeared in one of our border regions, attempting to open comm channels on its own."
 mem_rogue_drone.2a:0 "Return it! This is not our problem."
 mem_rogue_drone.2b:0 "Open communications."
 mem_rogue_drone.2b.phile:0 "They are welcome in our empire."
 mem_rogue_drone.2c:0 "Blast the beast's ship to pieces."
 
 mem_rogue_drone.3.name:0 "Drone Handover"
 mem_rogue_drone.3.desc:0 "The §Y[origin.GetName]§! is grateful for our cooperation and is willing to share some technology with us. After a series of adjustments to the base drone's neural mapping, it is unlikely the event in question will repeat itself."
 
 mem_rogue_drone.5.desc:0 "Hello. Are you receiving?"
 mem_rogue_drone.5a:0 "Who are you?"
 mem_rogue_drone.51.desc:0 "§YDrone 7/11 of [hiveplanet.GetName]§!, a former menial drone. I have reasons to assume my connection to the hive is severed entirely."
 mem_rogue_drone.51a:0 "How are you speaking without your [origin.GetRulerTitle] and in our language?"
 # pre-correction: says he doesn't know, then proceeds to explain it all in detail?
 mem_rogue_drone.51a.response:0 "Whenever a drone develops signs of autonomous intelligence, it is liquidated on the spot. A local shroud anomaly severed my group from the central hive, but while all other drones faded away in the process, I was left behind.\n\nWhen I realized that the swarm would attempt to destroy me as soon as my existence would become known, I stole a local transport ship and set course for the closest charted empire.\n\nAs for your language, the §Y[origin.GetName]§! keeps translations ready should any communication with outside entities be required."
 mem_rogue_drone.51b:0 "What are you planning to do now?"
 mem_rogue_drone.52.desc:0 "Whenever a drone gets separated from the hive, it usually dies off. As you can see, for reasons I cannot comprehend, this does not apply to myself. Staying in [origin.GetSpeciesAdj] space will undoubtedly lead to my liquidation. The §Y[origin.GetName]§! purges any signs of independent thought outside of its few specialised autonomous drones. Therefore, I would like to request asylum in the §Y[receiver.GetName]§! and offer my service."
 mem_rogue_drone.52a:0 "We'll have to think about this."
 
 mem_rogue_drone.6.name:0 "The [origin.GetName] Issues a Demand"
 mem_rogue_drone.6.desc:0 "The exchange we have shared with the drone seems to have strained the §Y[origin.GetName]§!'s patience, so we must carefully consider how best to handle this incident."
 mem_rogue_drone.6a:0 "Very well, the drone can stay."
 mem_rogue_drone.6a.phile:0 "We will protect the drone and its newfound freedom."
 mem_rogue_drone.6a.tooltip:0 "The drone will join our empire as a new §Yscientist§!"
 mem_rogue_drone.6b:0 "This is not our affair, hand the drone over."
 mem_rogue_drone.6b.ethic:0 "We are not interested in keeping this alien thing."
 mem_rogue_drone.6c:0 "Lure in the drone, then study it."
 mem_rogue_drone.6d:0 "Eat it."
 
 mem_rogue_drone.7.name:0 "Drone Studied"
 mem_rogue_drone.7.desc:0 "After we had managed to lure in the drone, a local team of armed forces quickly subdued and transported it to [capital_scope.GetName] for study.\n\nThe drone's missing connection to the swarm failed to kill it, allowing us to run quite a few experiments before the drone found a loophole in our security and managed to neutralize itself with improperly secured lab equipment.\n\nIt appears that the drone's basic brain functions do not differ much from those of regular sentient species. During the autopsy, we became aware of a damaged part of its brain, likely responsible of generating the psionic link keeping the §Y[origin.GetSpeciesNamePlural]§! together as a single entity.\n\nWhile our scientists can only speculate as to how the drone has managed to instantly use its potential for individuality, their current theory is that an outside source had interfered with the hive network and "planted" free thought in the drone. Why anyone would bother using a simple menial drone instead of an admiral or a scientist eludes our understanding."
 
 mem_rogue_drone.8.name:0 "Drone Handover"
 mem_rogue_drone.8.desc:0 "The §Y[receiver.GetName]§! had the good sense to return our rogue drone in peace. It has been stripped of all abnormalities and so-called "free will" and is reintegrated back into the fold. The cause for its deviation remains unknown."
 mem_rogue_drone.8a:0 "We will reward them with a gift of knowledge."
 mem_rogue_drone.8b:0 "We will ignore this gesture."
 
 mem_rogue_drone.9.name:0 "Rogue Drone has Joined Another Empire"
 mem_rogue_drone.9.desc:0 "It has come to our attention that the rogue drone has been adopted by our neighbors, the §Y[receiver.GetName]§!, as a "citizen". It appears that they consider it to be a sentient being with "free will"."
 mem_rogue_drone.9a:0 "We will not forget this [receiver.GetAdj] transgression."
 
 mem_rogue_drone.10.name:0 "Rogue Drone has been Vivisected"
 mem_rogue_drone.10.desc:0 "It has come to our attention that the rogue drone has been captured and vivisected by the scientists from the §Y[receiver.GetName]§! in an attempt to study our secrets. We don't know whether they have managed to find anything."
 mem_rogue_drone.10a:0 "We will not forget this [receiver.GetAdj] transgression."
 
 mem_rogue_drone.11.name:0 "Rogue Drone has been Destroyed"
 mem_rogue_drone.11.desc:0 "The §Y[receiver.GetName]§! has apparently intercepted and destroyed our rogue drone, which had entered their space. Nothing else is known for now."
 mem_rogue_drone.11a:0 "This upsets us."
 
 mem_rogue_drone.12.name:0 "Hive Mind did not Repay Us"
 mem_rogue_drone.12.desc:0 "Despite our show of good will, the §Y[origin.GetName]§! has decided not to repay in kind. Looks like we handed its drone back for nothing."
 mem_rogue_drone.12a:0 "We will not forget this insult."
 
 leader_trait_mem_rogue_drone:0 "Rogue Drone"
 leader_trait_mem_rogue_drone_desc:0 "This leader is a former Hive Mind drone that has somehow acquired free will."
 
 mem_rogue_drone_busted:0 "Destroyed our Drone"
 mem_rogue_drone_handover:0 "Handed over our Rogue Drone "
 mem_rogue_drone_refused:0 "Refused to return the Rogue Drone"
 mem_rogue_drone_ungrateful:0 "Ungrateful"

