l_english:

 # Archaeological Sites
 mem_kay_site_a:0 "The Hollow Sanctum"
 mem_kay_site_a_desc:0 "In the not too distant past, a civilization called this world home, but there is little of them left now on the surface. Scans revealed a massive series of tunnels fused with organic material stretching deep into [from.GetName]'s crust.\n\nWe have detected rhythmic pulses of radiation originating from the bottom of the tunnels - reminiscent of a heartbeat. The walls feel warm to the touch, and in some places, a faint pulse can be felt."

