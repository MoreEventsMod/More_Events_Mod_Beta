 mem_mortis_spore_desc:0 "These small "creatures" form a coherent structure while in space. They prefer to target space fauna and infect it with spores to replicate."
 NO_COMMUNICATIONS_MEM_MORTIS:0 "Microscopic Aliens"
 mem_mortis_fc_1:0 "Our sensors registered faint pulses in the instruments, rhythmic but irregular, like signals that never quite repeat. These tiny particles seem to be active, and no one is certain whether they are intentional or not."
 mem_mortis_fc_2:0 "Our specialists realized that the signals observed were phytohormes and the particles some sort of mycelium. Vast fungal networks drifting through space in clustered formations, so called §Y$mem_mortis_spores_plural$§! traveling together, exchanging chemical and electromagnetic whispers across the void. Whether the signals are attempts at communication or merely the byproduct of their collective existence remains unknown.\n\n$mem_mortis_spore_desc$"
