 bombardment_mem_mortis_fungi_bombardment_desc:0 "A highly contagious fungal infection turned living matter into brainless flesh husks."

 NAME_mem_mortis_arrfish:0 "Admiral Yarrfish"
 mem_mortis_arrfish_catchphrase:0 "Friendship is more valuable than ernergy credits, .. or so they say"
 mem_mortis_arrfish_backstory:0 "$NAME_mem_mortis_arrfish$ once commanded a fleet of a small primitive empire. While he was away from his homeworld the $mem_Fungal_Chorus$ infected his species, causing it to go nearly extinct. With only a few surviving ships, he and his kin fled into deep space forming the last remnant of their kind. Even now he is determined to take revenge, but most of the time he gets distracted by petty plunder...."


 building_mem_mortis_bio:0 "Crimson Willow"
 building_mem_mortis_bio_desc:0 "A uniquely strange sprout of flora sustained only by the local crimson oceans. This species adapted over centuries to the nutrients given forming perfect symbosis."
 d_mem_mortis_bio:0 "Blood Ocean"
 d_mem_mortis_bio_desc:0 "A crimson sea filled with poisonous extracts. Only the local flora was able to adapt and convert the toxins to nutrients."
 building_mem_mortis_synth:0 "Shimmer Catalyst"
 building_mem_mortis_synth_desc:0 "Storage and filtration facility to harness the unique properties of the local $d_mem_mortis_cyber$. Unlike traditional recycling the shimmer transmutes everything which touches it."
 d_mem_mortis_synth:0 "Shimmering Lakes"
 d_mem_mortis_synth_desc:0 "Shimmer is a shiny, pearlescent soap water. It has a transmutative effects on different good and metals, triggered through contact. It seems that Shimmer is the only liquid that no lifeform inhibits and therefore it can not be fished in."
 building_mem_mortis_psionic:0 "Fog Refinery"
 building_mem_mortis_psionic_desc:0 "Enrichment facilities that utilizes the local mist to enhance psionic abilities. While the potential applications are fascinating, the supernatural may not be underestimated."
 d_mem_mortis_psionic:0 "Mist of Illusions"
 d_mem_mortis_psionic_desc:0 "All around the planet lays a thick, purple fog. Anyone roaming the surface it shows sweet delusions of a perfect life, of every dream ever wished for and the end of all wants and needs."
 building_mem_mortis_cyber:0 "Puddle Shaper"
 building_mem_mortis_cyber_desc:0 "Industrial machinery shaping the local liquids to usefull cyber-ware. Workers sometimes describe the unnerving experience of their faces copied by the products."
 d_mem_mortis_cyber:0 "Shapeshifting Puddles"
 d_mem_mortis_cyber_desc:0 "Pools filled with shapeshifting metallic liquids. The substance is in constant flux forming to shapes as fast as they disappear. Machinery coming to close may find themselves perfectly replicated."
 d_mem_mortis_cyber_tt:0 "Unlocks ['building:building_mem_mortis_cyber']"
