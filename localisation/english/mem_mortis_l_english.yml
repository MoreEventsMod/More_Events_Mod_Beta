#  mem_mortis.115.desc:0 "The bizare $mem_Fungal_Chorus$ has noticeably changed its behaviour. Our scientists are certain that it somehow awakened psionically and has begun to commune with entities beyond the shroud."
 mem_mortis.120.name:0 "Shroud Symbionts"
 mem_mortis.120.desc:0 "Sensors monitoring the $mem_Fungal_Chorus$ have noticed changes in its behaviour. These small creatures somehow pierce reality, having adapted to the harsh enviroment of the shroud their collective got fused with a strange patron from the beyond. It seems as if the shroud entity formed more than a simple pact with them. Against all likelihood the outcome was a shroud symbiosis."

 mem_mortis.601.title:0 "Dragon Beats Pirate"
 mem_mortis.601.desc:0 "Upon the demise of the undead dragon, the nearby ship's engines start to power up. Moments later it hailed our local fleet."
 mem_mortis.601.a:0 "Who are you?"
 mem_mortis.601.a.response:0 "A swashbucklin' adventurer, a scurvy dog o' a soldier, and the very bane of all witless space creatures that dare to come to close!"
 # mem_mortis.601.b:0 "REPLACE_ME"
 mem_mortis.601.b.response:0 "A beard? Aye, why not! Any more o' yer witless questions?"
 mem_mortis.601.c:0 "What do you plan to do now?"
 mem_mortis.601.c.response:0 "Arrr, be ye in dire need o' some fierce sellswords? Some cutthroat buccaneers to lend a hand and sail under yer flag, eh?"
 mem_mortis.601.d:0 "Die"
 #mem_mortis.601.d.response:0 "REPLACE_ME"


 mem_mortis.610.name:0 "Mad Dog"
 mem_mortis.610.desc:0 "By the stars, we've found it, lads! The most monstrous leviathan, lurking in the fathomless abyss o' the great black beyond! A creature o' nightmare, bigger than any Titan! Prepare for battle! We'll carve this cosmic beastie into fish food! To arms, ye dogs!"

 mem_mortis.614.name:0 "End of the Galaxy"
 mem_mortis.614.desc:0 "The [root.GetName] arrived at the edge of the galaxy where the [from.GetName] system lies. Within awaits a colossal space serpent encircled the system's dying black hole."
 mem_mortis.614.a:0 "Face the beast!"

