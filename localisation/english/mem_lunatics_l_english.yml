l_english:
 mem_lunatics_category:0 "Tides of Lunacy"
 mem_lunatics_category_desc:0 "Orbital scans of §Y[From.GetName]§! have detected an intact structure which regularly gets hit by the local tides. Further investigation is needed."
 tech_mem_lunatics_tidals:0 "Lunar Harnessing"
 tech_mem_lunatics_tidals_desc:0 "Rebuilding our power generators to actively harness power based on lunar phases might improve their output."

 mem_lunatics.1.name:0 "Act of Lunacy"
 mem_lunatics.1.desc:0 "The ancient complex is being regularly hit by the local tides and powered by giant tidal generators. Within our scientists found several chambers for rituals and paintings of the local moon. Many of these chambers where sealed when on arrival. Inside our team found corpses lying on the ground. Many of them seemed to have killed, maimed or mutilated themselves. Some deciphered records call it the "Tidal Concord" and speak of ritualistic acts to increase please their lunar goddess. Strangly enough further research revelead connections between moon phases and tidal energy generation."
 mem_lunatics.1.a:0 "This has potential."
 mem_lunatics.1.b:0 "Hollowing."
 mem_lunatics.1.c:0 "Take what you can."
 mem_lunatics.2.name:0 "Lunatics"
 mem_lunatics.2.desc:0 "Following the revelations of the history of the Tidal Concord, our Scientists have been analysing the effects of the moon on our colonies, and realised that there might be a way to help our colonies generate a bit more power. Rebuilding our power generators to actively harness power based on lunar phases might improve their output. When the effects of Tidal Forces are at their strongest, and we equip the Tidal Generators with special made turbines, they can harness energy at an improved rate. However some workers reported strange behaviour of colleagues while working on the prototype."

 zone_mem_lunatics_energy:0 "Tidal Farms"
 zone_mem_lunatics_energy_desc:0 "When the effects of Tidal Forces are at their strongest, and we equip the Tidal Generators with special made turbines, they can harness energy at an improved rate."
 zone_mem_lunatics_energy_spiritualist:0 "Tidal Enclaves"
 zone_mem_lunatics_energy_spiritualist_desc:0 "When the effects of Tidal Forces are at their strongest, we are the closest to our revered gods."