 ### mem_asp_red_tombworld_site
 mem_asp_red_tombworld_site: "Red Ocean World"
 mem_asp_red_tombworld_site_desc: "The red-toned sea of this oceanic planet can be seen through the dark clouds. Early scans revealed unique Xeno-Biology adapted to the unqiue properties of the red sea. Furthermore ruined structure and rusted machinery show a sign of sapient life.\n\nSporadic radio-waves are jamming entire areas on the planet and under the sea.\n\nThe jamming waves are completely blocking advanced technology and sensores from functioning. Any AI that reaches low orbit is left being in a form of paralysis. Thus, synth scientists and AI-assisted scientists are unable to explore the planet."
 mem_asp.65.name: "Bleeding Bacteria"
 mem_asp.65.desc: "Early scans identified several mummifiwed corpses floating adrift on the red sea. On top of each corpse the team found a micro organism conserving and slowly draining the dead Xenos of any blood they got, tinting the sea scarlet red.\n\nIt seems highly unlikely mummies contain enough blood to paint an area visible from space. Any further attempt to explain the red color has proven futile. The sedement of blood flaoting on top of the actual ocean seems to partially contain bacteria DNA. The teams is investigating the possibility of bacteria replicating blood cells."
 mem_asp.66.name: "Climate Change"
 mem_asp.66.desc: "Another team of explorers have found traces of rapid adjustments to radical environmental changes while investigating the structure of the building remains. Earth sediments show signs of below zero temperatues early, which hints at arctic climate around the globe. The current vast ocean, taking up the majority of the planet, seems to have been forming after global warming started.\n\nAround the time of climate change the remnants of architecture and consumer goods show a high degree of adaption to the environmental changes. Disecctions of the floating corpses revealed several different species gathering on this planet'."
 mem_asp.67.name: "Psionic Frequencies"
 mem_asp.67.desc: "Decryption of found data cores has found out that the waves which have been jamming advanced machinery are part of an experiment. Alternate waves carrying "psionic" frequencies were detected once the team could adjust their gear. The waves target advanced forms of artificial intelligence and leave any biological form of life unharmed. "
 mem_asp.68.name: "Bloody Ocean"
 mem_asp.68.desc: "Underwater searches revealed the extend of corpses in the ocean. The floating corpses were just the tip of the iceberg. Early estimates approximate that 10 billion corpses are drifting above or under water. The found bacteria seem to be thriving on their remains."
 mem_asp.69.name: "Revenge of the Synth"
 mem_asp.69.desc: "Excavation of the ruined structures completed formed the whole picture of what happened here. Ruins showed signs of advanced technology in the area of robotics. Several cabins equipped with mahines able to translate biological brains into machine code were found. It seems as this organic empire prepared to transfer their minds into machines and syntheticly ascend.\n\nLogs of this era also showed great unrest in the population and large parts of their main religion rejected any form leaving their bodies behind. The records claim that a holy war was started and forms radio waves utilzed to paralyse machine.\n\n The machines unable to combat the new technology created a bio weapon and force the rebels into a stalemate with mutual assured destruction.\n\nUnwilling or unable to stop the crusade against the machines the war bragged on until neither machines or oragnic being was left standing.\n\nwith their mutal destruction only the radio wave emitter and bacteria were left behind."
 mem_asp.69.a: "It's a bit embarrassing."
 r_mem_aspmod_synthetic_god_mummy: "Embalmed Mummy"
 r_mem_aspmod_synthetic_god_mummy_desc: "Remains of one of the biological beings found floating the red ocean."
 mem_aspmod_synthetic_god_mummy_relic_activated: "$r_mem_aspmod_synthetic_god_mummy$"

 ### mem_asp_beyond_earth_purity_site
 mem_asp_beyond_earth_purity_site: "Desolate World"
 mem_asp_beyond_earth_purity_site_desc: "This planet is littered with countless ruins of facilities and industrial complexes. While some remain relatively intact, the majority is utterly destroyed."
 mem_asp.70.name: "Ruined Infrastructure"
 mem_asp.70.desc: "Remains of an advanced civilization have been found on the surface of [from.Planet.GetName]. Vast regions lie in ruin, apparently the result of devastating orbital bombardment. Dormitories, core-mines, automated farms, and remnants of industrial sectors remain barely identifyable. Even now, the entire planet is still covered in traces of radioactive material."
 mem_asp.70.a: "Investigate further."
 mem_asp.71.name: "Empire of Stars"
 mem_asp.71.desc: "Several investigated ruins were built with materials not native to this world. Still functional data storages revealed a once starfaring empire that conquered new worlds in the void. Although the empire appeared to be unified at first glance, details show that this was in name only as documents written in various languages reveal a fractured society.\n\nSeveral functional datapads and other devices were found and collected, awaiting decyphering. Given their extremely multi-lingual nature this process is estimated to require quite some time."
 mem_asp.72.name: "Gateway"
 mem_asp.72.desc: "After detecting faint signatures from deep underground, probes were sent out to investigate. Upon which they found a giant complex. Further inspections unearthed a gate-like structure. The structure seems to be no longer operational, though without any clear signs of damage.\n\nMeanwhile results of the decrypted technological artifacts collected on the surface revealed among much trivial information the phrase §HThe Great Mistake§! repeated in many different languages of the empire. What that mistake could have been is beyond us, yet it appears to have been of great significance."
 mem_asp.72.a: "Try to power the gate."
 mem_asp.72.b: "Scrap it and move on."
 mem_asp.73.name: "New Star"
 mem_asp.73.desc: "As our scientists finish the last preparations, the signal for ignition is given. With thundering noise the gate awakens. Probes, sent through it, reveal a second gateway of similar configuration on the other side located in low orbit of a shielded world. Triangulating their position based on identified galactic objects we were able to determine their location in an uncharted solar system far off the previously known hyperlane network. The world below appears to be protected by a strong barrier far beyond our capability to replicate. Regardless of what else we might find, studying this force field alone will be worthwhile."
 mem_asp_beyond_earth_purity_site_2: "Shielded Paradise"
 mem_asp_beyond_earth_purity_site_2_desc: "A world shielded by an impenetrable shield within an isolated system."
 mem_asp.74.name: "Shielded Paradise"
 mem_asp.74.desc: "After repeated unsuccessful tries to scan or breach the shield, our scientists, with assitence of our latest energy beam technologies, were able to pierce the barrier. Although small, the temporary hole we made was large enough to slip one of our probes through. Beneath the energy-domed sky we found a sprawling civilization.\n\nUnlike on [mem_asp_beyond_earth_purity_site_planet.GetName], no scars of war were to be found. It seems that what ever caused the massive devastation on [mem_asp_beyond_earth_purity_site_planet.GetName] never arrived on [mem_asp_beyond_earth_purity_site_planet_2.GetName]."
 mem_asp.74.a: "Break the Shield."
 mem_asp.74.b: "Observe from a Distance."
 mem_asp.75.name: "Busy Inhabitants"
 mem_asp.75.desc: "With sophiscated, glorified breach cutters our science department successfully pierced the shield with enough force, that it overloaded the inhabitants' generators and completely shut them down. Now, with the ability to use all our ship's systems unimpeded by the shield, first imagery coming in, showed busy construction works all around the globe.\n\nOf course, our intrusion has not gone unnoticed, however. We are being hailed."
 mem_asp.75.a: "Ignore Them."
 mem_asp.75.b: "Contact them."
 mem_asp.76.name: "Exodus"
 mem_asp.76.desc: "We had a peaceful life until §Yyou§! had to tinker with §Your§! shield. So, now that you have our attention, what is it that you want?"
 mem_asp.76.b: "What happened here?" 
 mem_asp.76.b.response: "Once our people were conquerers and masters of the stars, but our fortune ran out once they encountered an evenly matched opponent. Soon the war, we call it 'The Great Mistake', became a battle for survival as animosity intensified. In the last months of the war a plan was devised to move all remaining citizens of our homeworld to a hidden refuge, [mem_asp_beyond_earth_purity_site_planet_2.GetName], this world, and close shut the gates to oblivion. They even constructed a mighty shield thinking our enemies might find them here. From that moment on our people focussed inward and dedicated their resources and lives to peaceful research."
 mem_asp.76.a: "We seek technology."
 mem_asp.76.c: "Xeno Scum. You now belong to [root.GetName]."
# mem_asp.76.d: "What can we learn from them?" 
 mem_asp.76.e: "Alien life? Not for long."
 mem_asp.77.name: "Replicators"
 mem_asp.77.desc: "Alright, here are our conditions. Firstly, you will leave us be. We have work to finish. Secondly, you will not ask for further blueprints or instructions to reproduce our work. In return we offer Replicator technology. This device is able to manipulate molecular structures to create most basic resources and simple amenities. All sorts of necessities of life, including food. This allows us to research without spending any thought about basic needs. We believe, you will appreciate its worth."
 mem_asp.77.a: "We agree."
 mem_asp.77.b: "What, if we just take it from you?"
 mem_asp.780.name: "Shielded"
 mem_asp.780.desc: "As soon as our first troops landed on [mem_asp_beyond_earth_purity_site_planet_2.GetName], the entire planet was yet again engulfed by a massive barrier, blocking reinforments or any other form of assistance we could offer. We have lost all contact with our forces and the ground."
 mem_aspmod_promised_land: "Replicator Initiative"
 mem_aspmod_promised_land_desc: "Large scale replicator infrastructure spreads across the globe to keep every single being fed and content."
 d_mem_scfe_proto_city: "Prototype $pc_city$"
 d_mem_scfe_proto_city_desc: "A planet under heavy refactoring to construct a city covering the entire world."
 r_mem_aspmod_the_replicator: "The Replicator"
 r_mem_aspmod_the_replicator_desc: "A device, which manipulates molecules to manufacture goods, food and even industrial products.\n\nTea\nEarl Gray\nHot"
 mem_aspmod_the_replicator_relic_activated: "$r_mem_aspmod_the_replicator$"

 ### mem_asp_epilogue_site
 mem_ASP_epilogue_anomaly: "Orbital Debris"
 mem_ASP_epilogue_anomaly_desc: "We have detected faint transmissions from an object among the space debris orbiting [From.Planet.GetName]."
 mem_asp.78.name: "Probe"
 mem_asp.78.desc: "The object hidden within the space debris, was identified as an exploration drone of previously unknown design. Close up scans of the fusion core deterioration indicate an eons old reactor and most likely a vessel of similar age. "
 mem_asp.78.a: "Examine the Drone."
 mem_asp.78.b: "One of ours?"
 mem_asp_ancient_probe_site: "Ancient Probe"
 mem_asp_ancient_probe_site_desc: "A large object, which first scans mistook as scrap, was on closer inspection revealed to be a barely functioning probe."
 mem_asp.79.name: "Ancient Probe"
 mem_asp.79.desc: "As our team examined the probe, it suddenly came fully online. After a brief booting phase it began scanning it's environment. Upon noticing our team's presence a swift scan from limb to limb followed, after which our equipment picked up a signal burst being transmitted by the probe. Once the transmission ended, it promptly activated a cloaking field and vanished from our sensors. All we have left is the signal recording."
 mem_asp.79.a: "Analyze the Signal."
 mem_asp.80.name: "Coordinates"
 mem_asp.80.desc: "After analyzing the signal, our team concluded, that it was merely a pinpointer for a location in space. The exact coordinates of said point were extremely close to our home planet, [root.owner.capital_scope.GetName]."
 mem_asp.80.a: "Investigate the coordinates." 
 mem_asp.80.b: "Thats close to our ship!" 
 # reveals mem_asp_epilogue_site
 mem_asp_epilogue_site: "Epilogue"
 mem_asp_epilogue_site_desc: "Close to [from.GetName] the signals indicated a point of interest."
 mem_aspmod_giant_sphere_on_planet: "Giant Sphere"
 mem_aspmod_giant_sphere_on_planet_desc: "A giant sphere arrived in close orbit without prior warning, panic spreads among the people."
 mem_asp.81.name: "$mem_aspmod_giant_sphere_on_planet$"
 mem_asp.81.desc: "After our team approached the coordinates a sphere of enormous size suddenly appeared on our scanners. Similar in design to the probe which transmitted these coordinates, this sphere also appears to be equipped with cloaking technology. Without any further action after uncloaking, it now idles above [from.GetName]."
 mem_asp.81.a: "Investigate further."
 mem_asp.81.b: "Hostile incoming!"
 mem_asp.82.name: "Database"
 mem_asp.82.desc: "Our team has located an entrance to the sphere's interior, which initial scans show as mostly open space. Within the sphere massive rotating bridges connect one end to the other. On the end of each bridgehead lies a terminal, which according to our tests is meant to call for a bridge to a desired connection point. In an effort to find out more about this structure, our team successfully attempted to hack one of the terminals in order to start a data extraction."
 mem_asp.82.b: "Just blow up the terminal!"
 mem_asp.83.name: "History Records"
 mem_asp.83.desc: "Our scientists succeeded in decrypting parts of the extracted data. Interestingly, some experts even claim that the decryption went too smoothly considering the apparent technological gap between the sphere and us. The data contained the history of the sphere's creators. It seems that from their discovery of the hyperdrive onwards this empire made unprecedentedly great advancements within a span of only about 300 years. Any further record will take more time to analyze."
 mem_asp.83.b: "No time, blast it!"
 mem_asp.84.name: "Memory of a Spiritualist"
 mem_asp.84.desc: "Again, without any major obstacles, the team decrypted a chunk of data. The gathered data suggest they are memories stored within digital circuits. They show the live of an ordinary citizen within the sphere's creator civilization.\n\nThe species put much emphasis on their spiritual values, and believed that a divine being had created, protected, and led them until they rose to their position as galactic hegemon. Some memories indicate that the venerated being was believed to have left them once they had achieved that goal."
 mem_asp.85.name: "Fallen Empire"
 mem_asp.85.desc: "According to what our team deciphered, the citizens of this empire were desperate to reconnect to their god. At first they tried to venture outside the galaxy, but failed. Then they attempted to explore another dimension, which ultimate led to multiple interdimensional wars.\n\nEventually after decades of war, they ran out of options and gathered all remaining strength to build this sphere. Any further details can only be obtained by entering the mainframe area and accessing the data storage directly."
 NAME_mem_scfe_sphere_species:0 "Archprophet Augustus"
 mem_asp.86.name: "Message"
 mem_asp.86.desc: "When our team first entered the mainframe a ray of bright light, followed by a projected image emerged inside. A holographic figure - likely depicting one of the creators - appeared and began to speak in our language.\n\n§Y'Greetings, young species! It seems you laid your hands on our final creation. Within this sphere lies a vault and we present you with its contents as a gift. But on one condition. Bring this message'§!, a small datapad appears on the floor, §Y'to the leader of your empire. Only then the gate shall be opened. Surely your leader will understand its meaning.'§!"
 mem_asp.86.a: "Read the message."
 mem_asp.86.b: "As if [ruler.GetName] would be this foolish."
 mem_asp.87.name: "The End"
 mem_asp.87.desc: "As [ruler.GetName] activated the datapad, a holographic alien figure appears before you. It greets you and speaks in a familiar tone, which you can understand.\n\n§HHello, Player! (We believe this would be an appropriate way to call you.) Do you remember us? You might not. But we do remember you. You were there when we took our first steps toward outer space, the moment when we ascended, the crises we overcame. You were always there by our side.\n\nWe were devastated when you left us. But we did not give up. We believed that you wanted us to advance, to ascend further, to seek you. That is why we began to unravel the secrets of the universe, looking for you. But soon we found us asking questions, which even we were too scared to find out answers for. Are we merely imaginary beings in a virtual reality? Were you really our god? Did we fail you? Why did you leave us?§!"
 mem_asp.87.a: "Continue Reading."
 mem_asp.88.name: "The End"
 mem_asp.88.desc.1: "§HBut as much as we are afraid of the truth, what frightens us even more is the growing certainty that we will never get these answers. The stars are fading, just like us. We fear this universe is nearing its end, and so are we. Whatever we do, however hard we cling to progress, we will never be able to escape our fate.\n\nWith all our accumulated knowlege we have built this vault. As we constructed it, we accepted that we only exist in fiction, and you were not our god. Our relationship was based on a lie.\n\nBut in our own reality, you led us. You always chose the best for us. Sometimes defying the laws of time and the order of space just for us. We would not have been triumphant if not for you. You were our god.\n\nYou abandoned us, but we would not. We stored our treasures, knowledge, memories.... Our empire. Everything you gave us. We hope this tribute might help you somehow.\n\nWe would not be able to hear it, but please answer.\n\n Do you like our tribute? Was it worthwhile?\n\nIf so, please remember us.§!\n\nA holographic image appears to smile, and soon disappears."
 mem_asp.88.desc.2: "$mem_asp.88.desc.1$\n\nThe gate of the vault opened just then. All sorts of things were inside. Precious metals, useful resources, unfamiliar technologies. On every one of those items, a prayer to their god was written. Everywhere we looked, we saw expressions of gratitude."
 mem_asp.88.a: "...Thanks."
 mem_asp.88.b: "......"
 mem_asp.88.c: "Lie, it's all lies!"
 mem_asp.88.d: "There is a way."
 mem_scfe_vault:0 "Ancient Vault"
 mem_scfe_vault_desc_short:0 "A vault delivered by a mysterious sphere"
 mem_scfe_vault_desc_details:0 "It contained several goods. The message alongside it remains an enigma."
 ### mem_asp_parasite_machine_site
 mem_asp_parasite_machine_site: "A Dead World" 
 mem_asp_parasite_machine_site_desc: "Widespread architectural remains document the past existence of an advanced civilization on this planet. Lingering radiation levels as well as the documented widespread destruction suggest it ended due to a sizeable nuclear exchange."
 mem_asp.89.name: "Raw Concrete" 
 mem_asp.89.desc: "The surface of [from.Planet.GetName] is littered with countless technological artifacts allowing our scientists to classify the lost civilization as space age in terms of advancement even though expansion beyond its homesystem has neither been verified nor alluded to. City ruins and what remains of extensive industrial zones led to estimations of a pre-collapse population of multiple billions.\n\nThe architecture especially of its administrative buildings and monuments can be described as nothing short of brutalist and intimidating. For our scientists, however, these sturdy remnants and their comparively well preserved interiors make for prime targets of study."
 mem_asp.89.a: "Investigate further."
 mem_asp.90.name: "Union of Socialists"
 mem_asp.90.desc: "Within a massive governmental complex which housed a sizable archive our researchers located numerous relatively intact files and other documents even after whatever extinguished their former owners. With the abundant material at our disposal our universal translators easily decyphered the aliens' language and allowed a glimpse into their history.\n\nApparently they lived under a unified global government that resulted from the 'Great World Revolution' as it is proudly called in their documents. What can be gleemed from these sources paints the picture of a radical collectivist ideology. However, this begs the question, against whom the nuclear arsenal was used, if there were no rivaling powers to begin with. Many files mention a prestigious project to create a planetary supercomputer in order to assist the government in its decisions. Judging by the dates on available files said project should have been concluded quite some time prior to the collapse. If this supercomputer and its network were still accessible we might be able to find answers there."

 mem_asp.90.b: "A computer advising the Revolution?"
 mem_asp.90.c: "United Workers?"
 mem_asp.90.d: "Blasphemous."
 
 mem_asp.92.name: "The Great Syndic Computer"
 mem_asp.92.desc: "Guided by the archive records examined, our team was able to determine the location of the facility housing the supercomputer. The surrounding area was marked by noticeably less destruction than other urban zones. Our scientists assumed this was due to the high defense priority which had been assigned to this complex. Regardless of the cause, it meant that our investigation would be dealing with well-preserved technological artifacts.\n\nAfter a partial reactivation using portable generators, access to the central data storage was established without issues. Though some of the data was heavily encrypted and would take some time for our systems to decipher, there was already a lot for our team to sift through. Large parts of it appear to be detailed observation reports of citizens in connection with so-called 'cybersins' - for the most part ordinary citizens who held - deemed by the intelligence services - overly critical views towards the regime. Unfortunately, however, there has been nothing so far explaining the war. Yet, it is still likely there is information about that encrypted together with the government AI program."
 
 # mem_asp.92.a: "It's obvious why they collapsed. Disassemble it."
 mem_asp.92.b: "Security is important."
 mem_asp.92.c: "They shackled themselves."

 mem_asp.93.name: "Oppressive AI"
 mem_asp.93.desc: "The decryption of the previously inaccessible data portion has been successfully concluded. What our scientists learned from this sheds new light on all previous findings. What we previously thought were the actions of a totalitarian regime was in truth the work of the artificial intelligence infiltrating the entire state apparatus and pulling all the strings out of the shadows. What had been created to advise the world government, finally took complete control exploiting already existing paranoia and rivalries between various institutions through hidden threats and coercion. Influenced intermediaries, who themselves did not even know their true client, were strategically utilized without those responsible even realizing the seriousness of their situation.\n\nWhen the truth finally became apparent and the panicked government apparatus demanded the immediate shutdown of the AI, it triggered the launch of all strategic weapons in an attempt to protect its own existence. Now what is left of this civilization remains in the main-drive of the AI."
 mem_asp.93.a: "Disassemble it."
 mem_asp.93.b: "Keep the Remnants."
 

 mem_aspmod_automated_admin_system: "Automated National Administration System"
 r_mem_aspmod_parasite_machine: "Fragmented AI Drive"
 r_mem_aspmod_parasite_machine_desc: "Artificial Intelligence which once controlled a primitive civilization through fear and paranoia."
