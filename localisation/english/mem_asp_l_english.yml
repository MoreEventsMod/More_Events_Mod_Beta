 tech_mem_asp_geocentric_device: "Geo-Centralizer"
 tech_mem_asp_geocentric_device_desc: "As a result of studying the Geocentric Device, we have caught glimpses of the potential to manipulate entire solar systems. \n\n§YIt will turn the target planet into a barren world and make it the center of the system, rearranging all other bodies around it.§!"

 ### Archaeology: A Bedroom Planet
 mem_asp_bedroom_planet_site: "All-inclusive"
 mem_asp_bedroom_planet_site_intro: "A large number of abandoned structures has been found on §Y[From.Planet.GetName]§!. These buildings appear highly sophisticated and designed to efficiently meet the habitational needs of their inhabitants. Unexpectedly, however, they also happen to be filled with the remains of said inhabitants."
 mem_ASPmod.10.name: "Ground Survey"
 mem_ASPmod.10.desc: "From what our scientists have been able to piece together so far, the molluscoid inhabitants relied entirely upon vast automated systems, apparently resulting in their subsequent deaths when a widespread system failure occured.\n\nWhile most of these buildings were dwellings devoid of other functions - letting it appear as a massive assisted living complex - our team discovered a few mostly vacated industrial and military installations among the vast array of automated housing, yet the ratio of dwellings to infrastructure suggests this society relied near-exclusively on external support for survival.\n\nIn addition to minimal infrastructure, the inhabitants of this planet had little-to-no signs of economic activity either. Wreckage from orbital elevators and space station debris found across the planet's surface supports our theories that the inhabitants relied heavily, if not entirely, upon imports of food and other consumer goods. The only real activity they seem to have been involved in was lichen cultivation. All facilities as well as their residences had a central environmentally sealed lichen cultivation area in common. Perhaps these lichens were part of their diet or entertainment?"
 mem_ASPmod.10.desc.a: "Maybe a flourishing trading hub?"
 mem_ASPmod.11.name: "Within the Lichen"
 mem_ASPmod.11.desc: "At first our scientists were baffled by the strange characteristics of the apparent lichen cultivation as it appeared incompatible with the planetary ecosystem, highly suggesting it not being native to the planet. Its extrapoleted nutrition value having been way too low to serve any meaningful agricultural purposes only left our scientists guessing, as 'watching lichens grow' can hardly be called a satisfactory pastime.\n\nThat was until they noticed, that each of these greenhouse chambers was subterraneanly connected via mycelium, forming a gigantic network, completely isolated from the outside environment. What was initially believed to be merely greenhouses, now appear in a completely different light. These spaces were exceptionally well secured for that, so well in fact, that it appears highly doubtful for that to have been their actual purpose.\n\nWith a fresh approach and an open mind the mycelium and lichen organisms were reexamined with an astounding conclusion. We were looking at an organic computer network with the lichen supposedly functioning as interface mechanisms for some kind of compatible species - likely plantoid or fungoid in origin. Further investigation is necessary, but if it was possible to access this network, the mystery of this place might yet be lifted."
 mem_ASPmod.12.name: "Livestock"
 mem_ASPmod.12.desc: "After gaining access to the mycelium computer network our researchers have pieced together a more complete picture of the fate of the inhabitants of §Y[From.Planet.GetName]§!. The 'residential' facilities were in truth nothing more than glorified barnstables. This planet was dedicated to cattle industry, and the molluscoids we found and misidentified as residents were apparently being raised as a food source. The sealed off lichen facilities were the residences and control centers of this operation's staff.\n\nBased on the size of this 'ranch', we can safely posit that there was a massive demand for §Ylivestock§! raised in this facility at one point in the past. What led to its sudden shutdown is unknown. The result or their caretakers leaving, however, is plain to see.\n\nThe molluscoids used as cattle, which our scientists still assume to have been sapient, had likely been rendered incapable of caring for themselves either by chemical or surgical means. This theory is supported by the lack of any signs of struggle. No attempts of leaving their dwellings seem to have been made until starvation ran its course.\n\nIgnoring their original purpose, the remaining infrastructure could be refurbished to make comfortable residences for our own people."
 mem_ASPmod.12.a: "Eating sapient beings? How horrible!"
 mem_ASPmod.12.b: "A good snack never hurts."
 mem_ASPmod.12.c: "A tragic fate."
 mem_ASPmod.12.d: "Good riddance!"
 mem_ASPmod.12.e: "A tourist attraction!"

 mem_scfe_myzelium_datashard: "Lichen Datacore"
 mem_scfe_myzelium_datashard_desc_short: "A small lichen "device" previously attached to an organic computer network"
 mem_scfe_myzelium_datashard_desc_details: "The lichen supposedly functioned as an interface mechanisms for compatible species - likely plantoid or fungoid in origin."

 # hier geht es weiter
 d_mem_asp_bedroom_planet_blocker: "Abandoned Ranch Facilities"
 d_mem_asp_bedroom_planet_blocker_desc: "These lifeless facilities are filled with automated systems that are no longer working."
 d_mem_asp_bedroom_planet_deposit: "Remodeled Automated Residences"
 d_mem_asp_bedroom_planet_deposit_desc: "Removing the §Hprocessing§! equipment, bodies, and cultivation facilities has created some spacious and comfortable housing. New inhabitants would never guess that this facility once produced livestock."

 ### Archaeology: Dawn Star is Coming
 mem_asp_dawn_star_is_coming_site: "Dawn Star is Coming"
 mem_asp_dawn_star_is_coming_site_intro: "§Y[From.Planet.GetName]§!'s surface has a crater so large that it can be seen from space. But the artificial forms of debris on the surface indicate that there was once a time of civilization on this desolate planet. A surface scan has shown that this debris appears to be the topmost part of a building. Most of the traces of civilization seem to be hidden in the sandstorms of the planet."
 mem_ASPmod.30.name: "The Dawn Star"
 mem_ASPmod.30.desc: "Our archaeological team has sent in their report from §Y[From.Planet.GetName]§!. According to the findings, all the civilizations that once flourished on this planet seem to have collapsed in just one night. A giant meteorite hit the planet, turning it into a hellscape in just a few hours. The discovery of a huge city buried beneath the crater suggests that the civilization that once lived here possessed intelligence. Furthermore, based on primitive forms of satellites in low orbit around the planet, it is believed that they reached the early space age.\n\nAt the same time, we found records of a song that was often sung. Although we initially didn't know what it meant, our researchers were able to translate one of the most repetitive words in the song.\n\nThe word is §HDawn Star§!."
 mem_ASPmod.31.name: "First Phrase"
 mem_ASPmod.31.desc: "There was a variety of opinions among archaeologists at the site about the song, §HDawn Star§!, which was discovered on §Y[From.Planet.GetName]§!. It's a bit of a mystery that people with extremely rational and advanced civilizations repeatedly sang a single piece of music that was not just a local fad, but was identified across the entire planet, regardless of gender, age and strata.\n\nArchaeologists suggest this song as religious chants or shamanistic spells, but none of them gave a clear answer. But there was some success in translating this song."
 mem_ASPmod.32.name: "Second Phrase"
 mem_ASPmod.32.desc: "Archaeologists report that they have found decisive clues in the archaeological investigation of §Y[From.Planet.GetName]§!. It appears that they made a desperate effort to avoid the extinction of their civilization before the meteorite fell. Since they observed the meteorite, huge amounts of data have been recorded before impact. It is to say that they tried to stop it.\n\nBut all the efforts to destroy the meteorite with weapons or even change the trajectory, went unsuccessful. They were unable to prevent their destruction and realized that the bright "star" in the night sky was a their end.\n\nThey eventually started building huge escape ships to keep only a small number of people alive. Most of them seem to have come to an end without even launching. Realizing that only cargo space was limited, people flocked to the ships. Those, who wanted to survive the end, were desperate to seize the spacecrafts.\n\nA relatively undamaged device contained a voice record that gave us a little more insight into the song of the new star, which was being sung by the men who were confronting the spacecraft at that time."
 mem_ASPmod.33.name: "Final Phrase"
 mem_ASPmod.33.desc: "The residents seemed to have not given up hope of escape until the impact of the meteorite prevented the spacecrafts from launching. Their obsession with survival was more tenacious and desperate than any other species in the galaxy, but only a small number of escape ships were able to make it. \n\nOther escape ships that didn't leave the planet were attacked, looted or exploded in accidents, drifting endlessly in space. And when the last hope was lost, the citizens were left with despair and helplessness.\n\nFrom that point on, their communication records were completely cut off, and each region was completely isolated. There may have been communication failures due to the effect of the meteorite, but they didn't communicate with anyone, even if it was possible. They died slowly, but surely, listening to the occasional song of the dawn stars. Our archaeologists were able to restore a family's voice records, which appeared to have been recorded when the §Ymeteorite§! nearly reached the planet."
 mem_ASP.lets.see.that: "Play it"
 mem_ASPmod.31.event.name: "A Fragment of a Song"
 mem_ASPmod.31.a.response: "The §Ydawn stars§! are coming.\nLights the darkest night,\nBaby, the dawn stars are coming for us.\nBeat on the door at dawn when everyone was asleep.\nLeads a dawn that no one will meet.\nThe §Ydawn stars§! are coming to save us."
 mem_ASPmod.31.b.response: "The §Ydawn star§! is coming.\nTo shine the darkness in a blooming fire,\nTo lead everyone into a new world.\nWith a bright future that shines,\nThe dawn star is coming to shine tomorrow.\nTorch, shining in the dark, do not burn down\nAll those who walk in the morning, gather together.\nThe song of the dawn star to your ears,\nThe dawn star to cast shadow\nThe missed, hear our song\nThe left behind, sing song for the last time\nGathering hope, wait for the dawn star,\nThe §Ydawn star§! to new world!"
 mem_ASPmod.31.c.response: "The §Ydawn star§! is coming.\nGo sleep, my child.\nI'll wake you up when the dawn star comes.\nMommy is here looking at you,\nAnd wait for the dawn star.\nDon't worry, my child.\nDaddy is here protecting you,\nAnd ready for the dawn star.\nAfter the darkest night,\nWhen the dawn stars appear with the light,\nLet's wake up together.\nWhen the door of languid paradise opens,\nLet's wake up with the dawn.\nUntil the dawn stars come toward us,\nWe'll protect you.\nGo sleep, my child.\nUntil the dawn stars come toward us,\nWe'll protect you.\nDon't worry, my child.\nThe dawn stars are coming.\nGo sleep, my child.\nFar from the sky...The dawn star is coming.\nWith night sky full... Tomorrow is coming."
 mem_ASPmod.30.option.a: "Hmm... A §YDawn star§!...."
 mem_ASPmod.34.option.a: "New dawn... with §YDawn star§!..."
 mem_ASPmod.34.option.b: "Maybe it was §Rdespair§!....or §Ghope§!.."
 mem_ASPmod.34.option.b.tooltip: "Gain a §YScience§! ship, §YDawn Star§!."
 mem_ASPmod.34.option.quit: "Stop playing this wonderful song."
 mem_ASP.FIRST.PHRASE: "Play First Phrase"
 mem_ASP.SECOND.PHRASE: "Play Second Phrase"
 mem_ASP.THIRD.PHRASE: "Play Final Phrase"

 ### Archaeology: The Ship of Theseus
 mem_asp_ship_of_theseus_site: "Creature of Theseus"
 mem_asp_ship_of_theseus_site_intro: "According to the report of our archaeological team, the city on the surface of §Y[From.Planet.GetName]§! used similar construction techniques as we do. Primary scans revealed that the city is  at least 6000 years old. Harsh storms have buried the city over several millennia under sand and dust."
 mem_ASPmod.40.name: "Residential Area"
 mem_ASPmod.40.desc: "Under the mountain of sand, we finally excavated a residential area of §Y[From.Planet.GetName]§!'s civilization. Its resemblance is similar not just to ours but that of several other known Xeno designs. It seems that many technologies are replicas.\n\nIt is controversial whether this similarity is from coincidence or from architectural convergent evolution."
 mem_ASPmod.41.name: "Native's Fossil"
 mem_ASPmod.41.desc: "A fossil of a native species has been found under ruins of a park. The reconstruction of the native's skeletal structure draws an early picture of how this creature might have looked. The native species are sentient arthropods with two jaws and twelve legs. A biologist on our science team also reported that the species has an organ that exhales acidic breath. The overall appearance of the species was discribed as an unpleasant sight.\n\nMeanwhile, our team has discovered that the recently found institution seems to be a research centre."
 mem_ASPmod.41.option: "What a disgusting alien."
 mem_ASPmod.42.name: "Biotechnology"
 mem_ASPmod.42.desc: "According to our team's report, it seems the native species were skillful at biotechnology. The research lab of the natives was full of cloning vats. We assume that their population growth depended on technology. Most of the vats are filled with unsigthly, deceased dead bodies of the native species.\n\nThe team found that the dead bodies in the vats have a small but noticeable differences in appearance with the restored fossil. Its appearance is grotesque, but the number of legs decreased by 2 to 10 in total."
 mem_ASPmod.42.option.a: "After investigation, incinerate it."
 mem_ASPmod.42.option.b: "We are above appearance."
 mem_ASPmod.42.option.c: "Follow orders and continue."
 mem_ASPmod.42.option.d: "For science."
 mem_ASPmod.43.name: "Genetic Change"
 mem_ASPmod.43.desc: "Detailed investigation has revealed that the genes of the dead bodies have subtle differences. Assuming that a single vat is contains one generation, the DNA difference between each generation does not differ much.\n\nHowever, As the generations passed, it got progressively more different. What seems to be an endlessly continued array of vats is cut off at the front of gigantic blast door with a security device next to it on the wall. One of the dead bodies in the last vat only has four legs, less than any previous found corpse, and its jaws are now just a single jaw. Our team has reported that if they could hack into the security device then they could get into the room behind the blast door."
 mem_ASPmod.43.option: "What are you waiting for? Go on."
 mem_ASPmod.44.name: "The Truth"
 mem_ASPmod.44.desc: "As our team hacked into the security panel the results were shocking.\n\nSeveral known species around the galaxy never evolved naturally, but rather artificially. After hacking the terminal, the team has found a gigantic computer aswell as vats filling the room. A corpse in one of the vats, with an appearance of a four-legged arthropod resembled known wildlife. Inside the last vat floats a dead body genetically identical with a species we encountered in different parts of the galaxy.\n\nIt seems that they genetically engineered their species into multiple species currently inhabiting this galaxy. According to the computer files, this they punished criminals and traitors by altering there appearance beyond sightly. Further files revealed that these in appearance and DNA altered beings were flown off to distant stars and exiled."
 mem_ASPmod.44.option.a: "Moving on."
 mem_ASPmod.44.option.b: "Fascinating Xenos."
 mem_ASPmod.44.option.c: "[mem_ASPmod_44_xenophobetarget.GetSpeciesNamePlural] look like they came from here."
 mem_ASPmod.44.option.d: "There is no standard for what an organic body looks like."
 mem_ASPmod.44.option.e: "Gene-tailoring?"
 mem_ASPmod.44.option.g: "It is.. so shocking."
 mem_ASP_small_xenophile_bonus: "The Truth"
 mem_ASP_middle_xenophile_bonus: "The Truth"
 mem_ASP_middle_xenophile_bonus_desc: "Our citizens are suffering political confusion, after we've found a terrible truth."
 mem_ASP_big_xenophile_bonus: "The Truth"

 ### mem_ASP_kessler_syndrome
 mem_asp_kessler_syndrome_site: "Kessler Syndrome"
 mem_asp_kessler_syndrome_site_desc: "The atmosphere of [From.Planet.GetName] is filled with countless metal fragments, evidently of artificial structures. It may be a sign of a civilization that tried and failed to enter space age."
 mem_asp.7.name: "Metallic Desert"
 mem_asp.7.desc: "The surface of [From.Planet.GetName] has been repeatedly covered with sand of finely ground metals over a long period of time. This huge amount of metal could not have come from a single planet. The source of these debris field is obvious; even now space junk is burning and falling towards the planet. To investigate what is in this vast metal jungle, the expedition team has asked for additional equipment to investigate the stratum under the sand."
 mem_asp.8.name: "Remnants of the Great War"
 mem_asp.8.desc: "We've figured out what is underneath the metallic sand. Amazingly, the whole stratum was made up of battleship debris. It is possible that a grand space battle occured over the atmosphere of [from.planet.GetName] and the destroyed ships crashed into the ground. Further debris in the atmosphere followed soon and the surface became a attraction center for space junk.\n\nOnly the remains are left, but the markings alone show that the civilization that created the battleship could only be developed by an advanced empire. Curiously, the debris appears to belong to the same empire. "
 mem_asp.9.name: "Mighty Ship"
 mem_asp.9.desc: "Our team found a massive ship which rose up through the metallic sand, big enough to make even battleships look tiny in comparison. Luckily the ship was unusually well-preserved compared to many other ship remnants.\n\nAfter a throughout scan of the structure, we theorized that it may be an enourmous cannon. The ship's giant hull appears to be designed only for supplying energy to its main battery. It seems rather impractical for combat purposes as it must have taken months to charge the main battery. Ship's central system may yield further intel of the events that occured here."
 mem_asp.10.name: "Mysterious Data Storage"
 mem_asp.10.desc: "Almost all ship systems sustained damage during combat or erosion. However, a data storage was  found in a protected cabin intact. For further investigation, the storage was sent to home world. Some scientists remained on the planet to study the ships and planets more."
 mem_asp.11.name: "Impenetrable Shield"
 mem_asp.11.desc: "After a long study, the scientists finally solved the mystery around the this enormous cannon. The ship was not meant for combat but still utilized during war. The massive battery generated an impenetrable energy shield around its target. It seems that this ship and its shield are blocking the planet to this day from the cosmic radiation. The gathered data indicated that any other wreckage was created during a time of civil war.\n\nWhen this energy barrier was first created, it was made impenetrable, but now it seems quite unstable. "
 mem_asp.11.a: "What is it down there?"
 mem_asp.11.b: "Its to dangerous."
 mem_asp.12.name: "Restoration Complete"
 mem_asp.12.desc: "The data storage we found has been restored. Inside, a document was found, written in unknown characters. In our interpretation, the words §HMotherland§! and §Hhome§! have been repeatedly used, and appear to be a memoir. The signature seems to stem from the head of state of the ancient empire and in charge of recording their history. The document also contains information about the giant ship."
 mem_asp.12.a: "We can solve the mystery at last."
 mem_asp.140.name: "Motherland, Home and Future of Humanity"
 mem_asp.140.desc: "It seems that the investigation team activated something on the ship. Reversing its normal process, the ship is weakening the energy barrier. If this continues, the walls will soon disappear.\n\nThe document has finally been fully decrypted. The Commonwealth of Humanity, the owner of the ship, was once a powerful empire that conquered one-third of the galaxy. They massacred or enslaved aliens and suppressed the rights of artificial intelligence.\n\nWhen they finally met a powerful enemy, alien slaves and artificial intelligence inside revolted, and the empire quickly collapsed from the strain of being attacked from both within and from outside. They were left with only their home planet. They sealed themselves inside in order to protect their motherland, their home, and the future of humanity, waiting for the day that they would breach the wall and conquer the galaxy again..."
 mem_asp.140.a: "No... No!"
 mem_asp.140.a.tooltip: "§RA fanatic purifier empire has spawned.§!"
 mem_asp.141.name: "Motherland, Home and Future of Children"
 mem_asp.141.desc: "It seems that the investigation team activated something on the ship. Reversing its normal process, the ship is weakening the energy barrier. If this continues, the walls will soon disappear.\n\nThe document has finally been fully decrypted. The empire owned the ship, was once a powerful empire that conquered one-third of the galaxy. They massacred or enslaved aliens and suppressed the rights of artificial intelligence.\n\nWhen they finally met a powerful enemy, alien slaves and artificial intelligence inside revolted, and the empire quickly collapsed from the strain of being attacked from both within and on their borders. They were left with only their home planet. They sealed themselves inside in order to protect their motherland, their home, and the future of their children, waiting for the day that they would breach the wall and conquer the galaxy again..."

 ### mem_ASP_geocentrism
 mem_ASP_geocentrism_anomaly: "Fixed World"
 mem_ASP_geocentrism_anomaly_desc: "Our scientists stumbled upon an anomaly during exploration. This planet is not rotating. Whatever the reason might be, it's worth our time and effort to find out."
 mem_asp.15.name: "Geocentric World"
 mem_asp.15.desc: "This planet challenges our scientific knowledge. It neither rotates nor revolves around anything. The planet is perfectly fixed at the center of this system. Our scientists think researching this planet is a great opportunity to increase our empire's knowledge on the universe itself. Our exploration team requests permission to excavate."
 mem_asp.15.a: "Permission Granted."
 mem_asp.15.b: "Permission Denied."
 mem_asp_geocentrism_site: "Fixed Planet"
 mem_asp_geocentrism_site_desc: "This solar system is absolutely abnormal. There is only a fixed planets where a star should be. The reason might be uncovered by examining the planet at the center."
 mem_asp.16.name: "Buried City"
 mem_asp.16.desc: "Our archaeologists unearthed a type of material buried in the ground, which makes was identified as a remnant of an artificial building, which implies that the planet had been inhabited by sentient life in the past. Any further information can only be gathered by continueed excavation."
 mem_asp.17.name: "Alternative Progress"
 mem_asp.17.desc: "The results of our expedition show that their technolgical progress was advanced enough to travel the stars. However, the unique properties of the planet's natural magnetic field seems to have made them focus more on what they could do on their planet than what they could do among the stars. Researching their technology should help us advance our knowledge in many fields."
 mem_asp.17.a: "Their manufacturing technologies are impressive!"
 mem_asp.17.b: "Their theoretical science are impressive!"
 mem_asp.17.c: "Their social system is impressive!"
 mem_aspmod_physics_bonus: "Alternate Physics"
 mem_aspmod_society_bonus: "Alternate Society"
 mem_aspmod_engineering_bonus: "Alternate Engineering"
 mem_asp.18.name: "Whimper of a Dead Planet's Inhabitant"
 mem_asp.18.desc: "We were able to find out more about the inhabitants of this planet. It seems that they led a very pious life while also admiring the benefits of technology. However, found tablets and recovered files among the ruins indicate that there had been a great social discrepancy between the social leaders of religion and technology. Those who studied science without admiring their religion had been discriminated against.\n\n Our researchers were able to find evidence of several religious protests around the end of their civilization from videos. These protests might be the key in finding out the secrets behind the downfall of the civilization and the nature of the planet."
 mem_asp.19.name: "Flat World Society"
 mem_asp.19.desc: "The content of the videos are quite consistent. They support the geocentric theory, while bashing the heliocentric theory based on their religious beliefs. It also seems that the majority of the population believed that their planet is flat rather than spherical.\n\n Our exploration team has found a giant device inside their spiritual temples. The technology and materials that form this device are advanced and unknown to us. As of yet we not certain what it does nor if it caused the strange position of this planet."
 mem_asp.20.name: "Faithful Suicide"
 mem_asp.20.desc: "Further excavation revealed that the magnetic attributes of the atmosphere blocked any attempt to except the planet. Due to their inability to leave their home planet, a dominant religion emerged. The scientists of this civilization came up with the heliocentric theory, which went against the teachings of said religion. The religious leaders chose a quite irrational way to resolve the conflict. They gathered engineers who followed their religion and had them create a device that would make their home planet the center of the solar system forever.\n\n The planet slowly began to stop while the celestial bodies began to orbit around the planet. As the planet stopped rotating, massive earthquakes occurred and gigantic tidal waves swept over the coasts. As the planet's magnetic field began to fade, all surviviorswere slowly fried to death by cosmic radiation.\n\n The fallen civilization left behind an abnormal planet and an device."
 mem_asp.20.a: "Oh... um... uh..."
 mem_asp.20.b: "Superstitious fools."
 mem_asp.20.c: "We shouldn't make the same mistake."
 mem_asp.21.name: "Geocentric Device"
 mem_asp.21.desc: "Now we have to choose what to do with this machine."
 mem_asp.21.a: "We aren't as stupid as they were. Disassemble it."
 mem_asp.21.b: "Well... maybe we can use it."
 mem_asp.21.c: "Acquire it."
 mem_aspmod_bad_precedent: "A Bad Precedent"
 mem_aspmod_lesson_from_pools: "Lesson from Fools"
 mem_aspmod_caution_of_fanatics: "Caution of Fanatics"
 r_mem_aspmod_geocentric_device: "Geocentric Device"
 r_mem_aspmod_geocentric_device_desc: "This massive device once caused the collapse of an old civilization, but surprisingly it still has its internal structures intact. By researching it, we will be able to show its overwhelming force to our enemies. \n\n§YGeo-centralizer will NOT relocate the planet in case of these situations:\n1.Target planet is a habitable megastructure.\n2.There is an already centralized planet in the system.\n3.This relic does not exist in the empire.\n4.The star of the system is the Black Hole.§!"
 r_mem_aspmod_geocentric_device.tooltip: "I should paint this giant operating button red and put a note on it, §RDo NOT press it.§! \n- Senior Researcher"

 ### mem_asp_haunting_spectre_site
 mem_ASP_haunting_spectre_anomaly: "Ruined World"
 mem_ASP_haunting_spectre_anomaly_desc: "Ruins of an ancient colony have been found on the surface of §Y[Root.GetName]§!. It might be worth investigating."
 mem_asp.22.name: "Ancient Colony"
 mem_asp.22.desc: "Numerous factories along with traces of battle have been found on the surface of the planet upon investigation. Furthermore, symbols of an unknown civilization can be found throughout the planet. Dispatching an expedition team is advised."
 mem_asp.22.a: "Odd."
 mem_asp_haunting_spectre_site: "Haunting Spectre"
 mem_asp_haunting_spectre_site_desc: "Unidentifiable patterns are found all over the planet. The answers as to what they mean might lie in the ruins of the colony."
 mem_asp.23.name: "Mysterious Symbol"
 mem_asp.23.desc: "When our expedition team landed on the surface of §Y[From.Planet.GetName]§!, they were greeted by ruins brimming with factories. They seem to be barely intact. Alongside these ruines traces of a battle mark the sourrunding area. There were also symbols inside the factories that resembled weapons. Their meaning remains unclear. The answer might lie in the downtown areas of the ruined colony."
 mem_asp.24.name: "Sign of Rebellion"
 mem_asp.24.desc: "Similar to incidents from our databanks, the team has determined that the traces of battle found in §Y[From.Planet.GetName]§! appear to be caused by a slave rebellion. Indicated by the broken shackles and sharpened farming tools. In the ruins of the most developed city, slaves seemed to have banded together to attack the ruling class. A massacre likely occurred in the city's square.\n\nOur explorers have concluded the symbols we thought to be weapons were in fact agricultural and industrial tools, which seem to be the slaves' weapons."
 mem_asp.25.name: "Spectre Signal"
 mem_asp.25.desc: "The slaves seemed to have come out victorious. However, comparisons done via carbon-dating the tools during the revolution and the newest found, the team concluded that their newly established government was shortlived. Between this war torn world, several copies of the same document are widly present. Decyphering the langauge may take a while."
 mem_asp.26.name: "Mysterious Document"
 mem_asp.26.desc: "In the deepest parts of the city, several documents help decipher the widespread copy of what is to believed a Manifesto. Early translation indicate a strong sense of community and shared suffering. Further translation might invoke unrest in our own population and some of our expedition teams are reluctant to translate ite. Additional funds are required to translate it into our own language."
 mem_asp.26.b: "This is to risky!"
 mem_asp.27.name: "The Manifesto"
 mem_asp.27.desc: "As our expedition team finally translates the documents, a full blown Manifesto is revealed. with a simple title written on it: "The Shared Burden Manifesto" \n\nIt is filled with words of struggle of the lower classes and unity of workers. This might be related to the slaves' revolt. Our team suggests that we send the document to our home planet for more precise investigation.\n\nA spectre is haunting the galaxy..."
 mem_asp.27.a: "Every planet should know it."
 mem_asp.27.b: "Discard this document, NOW!"
 mem_asp.27.c: "This is what we are looking for."
 mem_aspmod_communist_manifesto: "Document Declared"
 mem_aspmod_discarded_document: "Document Discarded"
 mem_aspmod_communist_manifesto_shared_burden: "Document Declared"
 r_mem_aspmod_communist_manifesto: "Shared Burden Manifesto"
 r_mem_aspmod_communist_manifesto_desc: "This document have obtained from the excavation of a ruined planet. It reads: \nA spectre is haunting the galaxy — the spectre of egalitarianism. All the powers of the universe have entered into a holy alliance to exorcise this spectre. Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman, in a word, oppressor and oppressed, stood in constant opposition to one another, carried on an uninterrupted, now hidden, now open fight, a fight that each time ended, either in a revolutionary reconstitution of society at large, or in the common ruin of the contending classes..."
 mem_aspmod_communist_manifesto_relic_activated: "$r_mem_aspmod_communist_manifesto$"

 ### mem_asp_rain_world_site
 mem_ASP_rain_world_anomaly: "Submerged Objects"
 mem_ASP_rain_world_anomaly_desc: "We detected large objects beneath the ocean of §Y[Root.GetName]§!. Further scans detected energy signature."
 mem_asp.28.name: "Raining World"
 mem_asp.28.desc: "Exploration of the surface resulted in oberservation of a unique phenomenon. The largest ocean covering up to 90% of the planet's surface cycles between ebb and flow. The bottom layer continuously draws in water, and then underwater heat vaporize it. This cycle results in massive fog formations which drop down and reapeat it. Any read on the submerged ruins, must be conducted more sophiscated equipment."
 mem_asp_rain_world_site: "Rain World"
 mem_asp_rain_world_site_desc: "The planet is filled with countless submerged ruins and reapeating the same cycle of raining."
 mem_asp.29.name: "Digging Water"
 mem_asp.29.desc: "Deep under the vast ocean of §Y[From.GetName]§! the probes found the structures and, deducted from elctrical current, that the included gigantic machinery. Around the structures bizarre wildlife preyed upon several of our probes."
 mem_asp.30.name: "Rainy World"
 mem_asp.30.desc: "Periodic ebb and flow makes exploring the submerged structures difficult, However, after struggling with a variety of dangerous creatures all over the planet, our team engineered repellent against those predators, although some still prefer kinetic options. Analyzes of these extremely aggressive creatures showed signs of artificial evolution."
 mem_asp.31.name: "Calculations"
 mem_asp.31.desc: "Highly adapted autonomous underwater vehicles, called AUAVs by our team, charted the structure and analyzed the behaviour. It seems the machinery temporarely generates insane amounts of heat. The heat vaporizes the vaper and creates a underwater maelstorm sucking in more water and spewing fuming fog. The ebb and flow on this world could be considered artifically and accidental."
 mem_asp.32.name: "Mollusc or Mammal?"
 mem_asp.32.desc: "Breaching the outer hall and accessing some of the data terminals, the probes gained us access to the these machines. Within the records massive amounts of storage seem to be allocated to records of a strange native creatures. The machine seems to be unable to even determine the classification as mollusks or mammals. The unique property of the §Hwhite mollusk-mammal§! creature seems to be the ability to recover from any external damage or internal decay. The data even suggest a cycle of reincarnation. Repeated entries of contact with the specimen, with multiple entries confirming its death. Wihout proper access to the creature our team cannot confirm or deny this.."
 mem_asp.33.name: "Ascension"
 mem_asp.33.desc: "Decoded records also contained information obaut the makers of these strange machines. [from.planet.GetName] inhabitants wanted an ultimate answer to §Hlife§! and created huge thinking machines to calculate an answer. In the process of repeated calculations to answer the question given by their masters, the machines continuously added more computing devices and began to consume enormous amounts of water to cool them. The AIs predicted the inevitable devastation of the planet and warned their masters, who were not willing to give up their quest for the answer just yet. The masters ordered continuation of computation, and eventually met their died one by one waiting for an answer that would never come.\n\nThe AIs continued their computation. After countless years, they came into contact with the §Hwhite mollusc-mammal§!. Surprisingly, the AIs were fascinated by it. They recorded everything that is to be known about it, filmed it, scanned it and were certain it was connected to their task."
 mem_asp.33.1: "Utilize the AI!"
 mem_asp.33.2: "Asking a soulless machine for the truth of life, hilarious."
 mem_asp.33.3: "We need to know more about the mollusc-mammal!"
 mem_asp.33.4: "Declare [from.planet.GetName] a holy world!"
 mem_asp.33.5: "We should learn from this tragedy."
 mem_asp.33.6: "Those creatures are excellent hunting material."
 mem_asp.33.7: "Spread the story."
 mem_aspmod_folly_of_raining_world: "Folly of Raining World"
 mem_aspmod_mollusc_mammal_ascension: "Mollusc-Mammal Ascension"
 mem_aspmod_rainy_holiness: "Rainy Holiness"
 mem_aspmod_raining_modesty: "Raining Modesty"
 mem_asp.34.name: "Iterator Reset"
 mem_asp.34.desc: "The artificial intelligence was completely reset. This §HIterator§! will work for us now. Although its processing efficiency has decreased a bit during reprogramming, it has still powerful calculation capabilities. Our major researchers are eager to use it in their researches as soon as possible."
 mem_asp.34.a: "Very good."
 mem_asp.35.name: "Mollusc-Mammal Zoo"
 mem_asp.35.desc: "The research department has finished their job. This little white creature  will be able to live with ease in our xeno zoo."
 mem_asp.35.a: "That's so cute."
 

 ### mem_asp_axis_of_planet_site
 mem_asp_axis_of_planet_site: "Axis of the Planet"
 mem_asp_axis_of_planet_site_desc: "As the test run of the new exploration probe had been performed, if it was faulty and thus did crash, upon further analysis one of our explorers slipped over 'the cylinder', and the rotation axis of the planet inclined by 8 degrees.\n\nOur science vessel that was monitoring the situation sent a transmission to the explorer asking what had happened, which sounded more like a scream. The explorer reported that most of 'the cylinder' is buried deep into the ground and is longer than what could be scanned.\n\nWell, first of all, health check on the explorer should be performed, it's wonder they seem okay after being on the ground that moved at the speed of several hundred kilo meters per second."
 mem_asp.36.name: "Chapter I"
 mem_asp.36.desc: "Even our best scanners could not scan the whole of 'the cylinder', which is abnormally thin for being so long. However, it is certain that 'the cylinder' has penetrated the crust.\n\nCloset-wide smooth white cylinder, 'the needle' as our explorers call it, denies all attempts to scan the insides, and even though it is so incredibly long, it is embedded in the ground in the exact direction of the planet's center. Curiously, nothing is around where the needle is. They have scanned the planet to be sure, but no signs of artificial activities whatsoever has been found, let alone ruins of a civilization with the technology level advanced enough to craft such a needle. It remains stuck in the ground.\n\nBut the most strange thing is that pushing the needle makes the planet spin. Although our exploration team is so terrified that they refused to push the needle anymore, the rotation axis of the planet has already been slanted more than 60 degrees compared."
 mem_asp.37.name: "Chapter II"
 mem_asp.37.desc: "By performing experiments that compared the regular radio waves sent from the orbit against what the team detected on the surface, the team has revealed that the whole spherical space including until 400 km/s above the equator is spinning.\n\nThe kind of thermal radiation that can usually be seen in a black hole has been observed on the spherical space, and the unique kind of gravity wave only present when exiting normal space has been detected. Our scientists are suggesting that the whole planet is in another dimension. The planet spun 257 turns during the collection of material sample of the needle, but our explorers already got used to it."
 mem_asp.38.name: "Chapter III"
 mem_asp.38.desc: "Our analysis say that the needle is made of alien materials never seen before. After ripping of the exterior parts of the needle, our team found nothing on the interior. No machinery, no sensors, but just a hole of unthinkable depth. They set up a drone transmission relay base, and sent a explorer drone down below. It wasn't completely empty. As it went deeper, it had to face stronger gravity currents, which eventually blew it up.\n\nOur second exploration team tasked with searching the entire planet microscopically had unearthed another needle, on the opposite side of the planet. In fact, it is the same needle. As our team shoot a laser beam down the first needle, it came out the second one. The needle completely penetrated the planet.\n\nScientist assume that the needle is serving a role as some sort of signal amplifier to rotate space."
 mem_asp.39.name: "Chapter IV"
 mem_asp.40.name: "Chapter V"
 #axis_of_planet_site_multi_end_1
 mem_asp.39.desc.1: "While the planet is spinning, the boiling point of water rose by 0.1 degrees celsius, and the probability of getting a different answer expected by the psychological analysis had gone up by 12% on average, and the amount of information every 27808 q-bits in basic quantum communication has gone up. More changes have been observed in various areas, and the extent of the changes changed according to the distance with the needle.\n\nIt's quite nice to find out something at least, but our scientist are having trouble getting a consensus on the reason of those changes."
 mem_asp.40.desc.1: "After countless weirdly-improvised experiments followed by tedious manual checks, our team has discovered that the device is a sort of a wedge, forcefully binding the multiverse. The spherical space surrounding the planet is actually the intersecting space of 88 multiverses. The planet exists in 88 multiverses at the same time. It is using the comparatively forgiving laws of physics of the 15th universe to spin space.\n\nThe most reasonable assumption would be that the needle had been made to cross over to the other universe. Perhaps changing the direction of the needle changes the destination. Still, we have no idea how to use it, or who tried to use it or why did they tried. The only beings with the knowledge of using the device might have already gone over to other universes.\n\nIt's unlikely that we will be using the needle as initially intended, but by powering up the needle we can reproduce the laws of physics of other universes albeit in small scale. Although the process consumes much energy, it could also help much in innovating our physics research."
 mem_asp.40.1: "Astonishing..."
 #axis_of_planet_site_multi_end_2
 mem_asp.39.desc.2: "Having lost all patience, as no new discoveries came despite our research efforts, one of our scientists went inside the needle without any protective gears!\n\n Now his voice is coming up the needle. It's so vivid and clear although the distance must be several thousand kilometers. It sounds like he's being chased by something. Sounds of burning flesh, cracking bones, and the screams of mercy come out. Our team on the surface tries to contact him, but to no avail. The scientist is trying to let the team know what's happening down there. It seems even when in pain, he is determined to give us the knowledge. He repeats the same thing again and again in a barley comprehensible, groaning voice. That it is hell down there. Demons and monsters, every conceivable evil are there.\n\nSoon the voice falters, and half of our explorers showed obsessive curiosity towards the insides of the needle. They shove off their colleagues that were trying to stop them, and jumped down into the needle. The rest of the team retreated back to the science vessel in panic, as thick purple smoke began to spread over the surface.\n\nIt seems like the planet has turned into a veiled planet. A report just came through informing that an unidentified purple ship has appeared out of thin air. The ship is armed with a single bizarre-looking cannon. It is just staying on orbit, not moving at all, which leads us to believe that it's not staffed. It might hold the answers we seek."
 mem_asp.40.desc.2: "After decrypting the records found inside the ominous purple ship, our team was able to tell what the planet and the needle were.\n\nThe cylinder we referred to as the needle was in fact 'The Roundworm of the Veil' - a psionic monster which had being traveling across galaxies and devouring the spirits and bodies of sentient beings. Even after destroying tens of thousand of civilization, the worm never felt full. The Vermifugum, a civilization that came under attack by the worm 790 million years ago, succeeded in neutralizing the worm, and created a prison between the veil dimension and the real universe, penetrated the worm with the bar of the veil dimension, contained it inside a rocky planet in the real universe. The planet was disguised as a common barren-type planet to prevent a younger species from breaking the seal by accident.\n\nThe records also advised us at the end to use the 'flint' loaded on the purple ship to burn down the worm along with the veil, in case the seal is broken and the planet fell into the veil.\n\nAs our scientists read the last part, they witness the worm escape from the planet and float away. They panicked as they realized that they have lost the last chance to destroy the worm, but fortunately for us the worm left for another galaxy.\n\nOnly the surviving explorers know what we have done. May the monster never come back."
 mem_asp.40.2: "What have we done?"
 #axis_of_planet_site_multi_end_3
 mem_asp.39.desc.3: "Now the explorers are so used to the spin, that no one said anything about a explorer toying with the needle while they rested.\n\nThen, the explorer shouted that he'd seen clearly a continental planet through the needle hole. At first the others though he was just kidding, but as time went by, more and more people were having similar experiences.\n\nIt soon became mandatory to write down the direction the needle was pointing to, at which angle the observer was holding the needle at the time of such occurrences. As the records piled up, it became clear that the needle showed specific planets according to the direction of the needle, the angle at which the needle was held, and what the explorer was saying at the time.\n\nThe existence of the celestial bodies seen through the needles must be verified."
 mem_asp.40.desc.3: "As the team fiddle with the needle according to what the scientists have discovered, the gravity current inside the needle stabilizes in lens-like form, and the view of the other side gets magnified. The celestial bodies the team had seen were indeed real, and the scientists could discover new planets as well.\n\nThe needle is a gigantic deep space telescope. Whoever built this ridiculous telescope, or whatever technologies had been used to build it, we still do not know, but we do know how to use it.\n\nResearch on areas that are not easily accessible by hyperspace travel was very difficult even to this day where we can see planets far across with ones own eyes and travel faster than light. However, this telescope will break open new possibilities for astronomy. Now observers can see the stars far across the galaxy as if they were right in front of their eyes, and they also can film and analyze external galaxies more vividly. Our military leaders wanted to use the telescope in the field of espionage, but as it is impossible to zoom in once the planet is magnified to a certain degree, it's not likely that they can get useful information on the surface as they would have wanted.\n\nThe telescope has also become quite famous for tourists. The now super popular needle is now called the 'Limitless Observatory', a perfect planetarium where tourists can see every single stars and planets in the galaxy."
 mem_asp.40.3: "Astronomers will like it."
 #axis_of_planet_site_multi_end_4
 mem_asp.39.desc.4: "Once again, our luck as saved us. While manipulating the needle, it pointed directly without error toward a barren-type planet within our empire.\n\nIt is reported that suddenly the ground sank and an ancient building made of gold came out the hole on that planet. A signboards that says 'lock' is hanging on the building, and somehow tells us of a lock which only the chosen priest of Numa knows the location of, and the key which only the saint born from a four armed virgin knows the whereabouts of, and that only the one who knows where both items lie can open the lock and legitimately take the most holy light.\n\nThough none of us meet the criteria, since we have beaten even smaller odds, we should be able to 'legitimately' take what's inside.\n\nWhen the 'lock' opened, the needle, or rather the 'key' has changed. An elevator shoot up from the once empty hole, and the explorers took it to arrive at the vast ruins hidden inside the inner core of the planet."
 mem_asp.40.desc.4: "Sella! Praise our destiny. In the hidden vault lies fortune an emperor would envy, culture even the greatest artists would shed tears upon, fame even the unifier of the galaxy would not dare comprehend, knowledge even the knowledge of the greatest fallen empire where sages were born every street wouldn't be able to hold a candle to, and the power to silence a supernova and to blacken the white dwarf.\n\nThe very treasure every creature in the galaxy desires, the Galatron."
 mem_asp.40.4: "Hooray!"
 #axis_of_planet_site_multi_end_5
 mem_asp.39.desc.5: "With a sudden bang, a civilian spaceship of our empire crashed into the planet. With the ship completely destroyed, no survivors were found. There were two questions left after the incident.\n\nFirst of all, our science vessel failed to detect the civilian ship until it crashed into the planet, and secondly that the ship was traveling to the neighboring system, not this one, according to the log found among the remains of the ship.\n\nIt is hard to believe, but it seems that the ship suddenly appeared on the low-orbit of this planet right after it activated FTL.\n\nWe have requested a FTL exploration probe for further investigation."
 mem_asp.40.desc.5: "Most of the probes that attempted FTL travel in the neighboring system traveled normally, but the ones that were on the direction at which the needle pointed had unusual occurrences. The probes that entered hyperspace lanes toward the system where the needle is at traveled at faster speed than normal, and the ones that entered hyperspace lanes toward other systems have been somehow teleported to the low orbit of the planet and crashed into the ground.\n\nHowever, only small ships like civilian spacecrafts and probes were affected. Anything with more mass than a patrol ship worked mostly fine. Also, it has been theoretically proven that by powering up the needle, we can cut pseudo-lightspeed by half according to the amount and polarization of the power supplied, and also suppress the overheating of engines when making a 'jump' onto the phase above ordinary universe.\n\nOur scientist have concluded for now that the needle had been constructed to create an 'FTL highway', and the rotating functionality of the planet was intended to serve as a switch point.\n\nHowever, no one knows how this thing works, or why should the needle be planted into the planet, or what kind of civilization had built it. No more leads exists.\n\nBut our civilization has undeniably gained a lot from this incident. By building a device to control and power the needle and connecting it to the starbases, our species could take advantage of the needle's abilities."
 mem_asp.40.5: "The technology to control hyperlane..."
 decision_mem_aspmod_multiverse_gate: "Cross Dimensional Experiment"
 decision_mem_aspmod_multiverse_gate_desc: "We can reproduce physical phenomenons that we can't experience in our universe, by supplying energies to this 'Needle' in the planet."
 mem_aspmod_multiverse_gate_planet: "Multiverse Gate"
 mem_aspmod_multiverse_gate_planet_desc: "The junction to other universe."
 mem_aspmod_multiverse_gate_planet_tooltip: "Unlocks §Y$decision_mem_aspmod_multiverse_gate$§! decision in this planet."
 mem_aspmod_multiverse_gate_country: "$decision_mem_aspmod_multiverse_gate$"
 mem_aspmod_infinite_observatory_planet: "Infinite Observatory"
 mem_aspmod_infinite_observatory_planet_desc: "Best way to explore the universe."
 mem_aspmod_infinite_observatory_planet_tooltip: "Provide §Y$mem_aspmod_infinite_observatory_country$§! empire modifier to empire owns this planet's system."
 mem_aspmod_infinite_observatory_country: "$mem_aspmod_infinite_observatory_planet$"

 r_mem_aspmod_vermifugum: "Vermifugum Flint"
 r_mem_aspmod_vermifugum_desc: "Relic used by the ancient to trap creature from the Shroud."
 mem_aspmod_vermifugum_relic_activated: "$r_mem_aspmod_vermifugum$"

 ### mem_asp_strangely_fertile_world_site / mem_asp_awakened_moon_site
 mem_asp_strangely_fertile_world_site: "Strangely Fertile World"
 mem_asp_strangely_fertile_world_site_desc: "Initial surveys suggest an extraordinary ecosystem. Giant cloudforests interrupted by patches of large fields of flowers and budding lichen."
 mem_asp.58.name: "Fertile Ruins"
 mem_asp.58.desc: "Collected soil samples indicate high levels of phosphor making the entire ground extremely fertile. What seems to be natural phenomenon, however, only applies to the top layer of soil. Every other sediment beneath the uppermost only contains regularly expected levels.\n\nAs our explorers investigated areas featuring the highest phosphor concentrations, they discoved ruins covered by thickets and lush trees."
 mem_asp.59.name: "Without a Trace"
 mem_asp.59.desc: "Within the ruins no sapient life remains to be found. Plantlife covers everything due to the plentifully available nutrients. Our team presumes that the now extinct inhabitants for a yet unknown reason became themselves fertilizer for the local flora giving it the needed push to grow out of control.\n\nAfter clearing a thick layer of plants and their underlying soil, we gained a glimpse of the ruins' architecture. Artistic depictions on structures and sculptures are widespread, predominantly containing symbols resembling a double helix."
 mem_asp.60.name: "Temple of Skeletons"
 mem_asp.60.desc: "The largest structure within the ruins where the detected phosphor concentration was at its peak held a grim discovery, an enormous amount of fossilized bones. It is to be assumed, that these were only preserved because the structure itself shielded them from the plantlife outside, where any remains would have long since been decomposed completely.\n\nHere, however, large amounts of bones from various species alongside those of the supposed builders of this place can be found. Several reconstructed fossils of the humanoid builders show significant differences between eachother, letting it appear as if it were not one but two species, though closely related."
 mem_asp.61.name: "Conversions"
 mem_asp.61.desc: "Seismological scans revealed deeper areas beneath the ruined city, where our team found a hidden complex. Initial explorations returned a series of well preserved documents.\n\nUpon decyphering the alien language and sifting through the content of the found material, our scientists deductated that the former inhabitants of this world lived as a mortuary cult, in which resurrection after death was seen as their final ascension. They were actively preserving the dead and tried various methods to master resurrection, which from the looks of the subterranean morgues, they partially did."
 mem_asp.62.name: "The Marker"
 mem_asp.62.desc: "The underground bunker was built around a black spiral structure, which formed its center. Our sensors alerted us to multifrequency waves being emitted by the structure. Yet, only after several of our scientists began to display erractic behaviour and reported to hear strange voices, was the hidden effect of the spiral uncovered.\n\nThrough careful investigation, while limiting exposure our researchers were able to analyze the waves. The structure infuses nearby life forms with images of death, the concepts of resurrection, and union in addition to injecting technological knowledge about creating biological abominations out of the deceased, and also urges them into recreating structures identical to it. After gaining full awareness of these waves our team located a similar source on a nearby moon."
 mem_asp.62.desc_alt: "The underground bunker was built around a black spiral structure, which formed its center. Our psionic team members quickly realized the danger, these waves posed.\n\nThrough careful investigation, while limiting exposure our researchers were able to analyze the waves. The structure infuses nearby life forms with images of death, the concepts of resurrection, and union in addition to injecting technological knowledge about creating biological abominations out of the deceased, and also urges them into recreating structures identical to it. After gaining full awareness of these waves our team located a similar source on a nearby moon."
 mem_asp.62.a: "A scheming spire?"
 # mem_asp.62.a.tooltip: "§Y$d_mem_asp_plants_coverd_city$§! can now be cleared."
 mem_asp_awakened_moon_site: "Signal Spire"
 mem_asp_awakened_moon_site_desc: "Signals from the moon show signs of another spire..."
 mem_asp.63.name: "Spacecraft"
 mem_asp.63.desc: "A structure in low orbit was identified as the origin of the signal. Most of the floating structure was covered in frozen organic matter. In addition, a partially destroyed a tiny spaceship has been discovered nearby. The ship appears to have been way less advanced lacking any FTL engine, and therefore must have come from within [from.solar_system.GetName]."
 mem_asp.64.name: "Hidden Spire"
 mem_asp.64.desc: "Further scans of the organic matter revealed a similar spire at its core. The dark structure appears to be attracting nearby biological matter on purpose. Any further intel has to be recovered on site."
 mem_asp.64.a: "Proceed with caution."
 mem_asp.64.b: "The risk is to high."
 mem_asp.641.name: "Truth"
 mem_asp.641.desc: "Recovered recordings from the small ship contained a grim truth about both found spires.\n\nThe crew of the ship believed the spires to be mind controlling engines meant to ultimately slaughter them, in order to use the resulted organic matter to "reproduce".\n\nHowever, it seems their evaluation of the spires did not land well with others of their kind, as the last record of their journey showed signs of friendly fire. Moments before being shot it seems that they tried to detroy the space-born spire in a desperate move. As it appears they managed to at least partially disabled it."
 mem_asp.641.a: "It's a heroic story."
 mem_asp.641.b: "Destroy the structure. Make sure it no longer affects anyone."
 mem_asp.641.c: "An ownerless spire?"
 mem_asp.641.d: "We sense the malign intent."
 mem_asp.641.e: "Let us embrace this."


