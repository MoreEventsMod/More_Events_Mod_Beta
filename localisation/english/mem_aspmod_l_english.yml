 ### Archaeology: A Bedroom Planet
 site_mem_ASP_a_bedroom_planet: "All-inclusive" #"Bedroom Planet"
 site_mem_ASP_a_bedroom_planet_intro: "A large number of abandoned structures has been found on §Y[From.Planet.GetName]§!. These buildings appear highly sophisticated and designed to efficiently meet the habitational needs of their inhabitants. Unexpectedly, however, they also happen to be filled with the remains of said inhabitants."
 mem_ASPmod.10.name: "Ground Survey"
 mem_ASPmod.10.desc: "From what our scientists have been able to piece together so far, the molluscoid inhabitants relied entirely upon vast automated systems, apparently resulting in their subsequent deaths when a widespread system failure occured.\n\nWhile most of these buildings were dwellings devoid of other functions - letting it appear as a massive assisted living complex - our team discovered a few mostly vacated industrial and military installations among the vast array of automated housing, yet the ratio of dwellings to infrastructure suggests this society relied near-exclusively on external support for survival.\n\nIn addition to minimal infrastructure, the inhabitants of this planet had little-to-no signs of economic activity either. Wreckage from orbital elevators and space station debris found across the planet's surface supports our theories that the inhabitants relied heavily, if not entirely, upon imports of food and other consumer goods. The only real activity they seem to have been involved in was lichen cultivation. All facilities as well as their residences had a central environmentally sealed lichen cultivation area in common. Perhaps these lichens were part of their diet or entertainment?"
 mem_ASPmod.10.desc.a: "Maybe a flourishing trading hub?"
 mem_ASPmod.11.name: "Within the Lichen"
 mem_ASPmod.11.desc: "At first our scientists were baffled by the strange characteristics of the apparent lichen cultivation as it appeared incompatible with the planetary ecosystem, highly suggesting it not being native to the planet. Its extrapoleted nutrition value having been way too low to serve any meaningful agricultural purposes only left our scientists guessing, as 'watching lichens grow' can hardly be called a satisfactory pastime.\n\nThat was until they noticed, that each of these greenhouse chambers was subterraneanly connected via mycelium, forming a gigantic network, completely isolated from the outside environment. What was initially believed to be merely greenhouses, now appear in a completely different light. These spaces were exceptionally well secured for that, so well in fact, that it appears highly doubtful for that to have been their actual purpose.\n\nWith a fresh approach and an open mind the mycelium and lichen organisms were reexamined with an astounding conclusion. We were looking at an organic computer network with the lichen supposedly functioning as interface mechanisms for some kind of compatible species - likely plantoid or fungoid in origin. Further investigation is necessary, but if it was possible to access this network, the mystery of this place might yet be lifted."
 mem_ASPmod.12.name: "Livestock"
 mem_ASPmod.12.desc: "After gaining access to the mycelium computer network our researchers have pieced together a more complete picture of the fate of the inhabitants of §Y[From.Planet.GetName]§!. The 'residential' facilities were in truth nothing more than glorified barnstables. This planet was dedicated to cattle industry, and the molluscoids we found and misidentified as residents were apparently being raised as a food source. The sealed off lichen facilities were the residences and control centers of this operation's staff.\n\nBased on the size of this 'ranch', we can safely posit that there was a massive demand for §Ylivestock§! raised in this facility at one point in the past. What led to its sudden shutdown is unknown. The result or their caretakers leaving, however, is plain to see.\n\nThe molluscoids used as cattle, which our scientists still assume to have been sapient, had likely been rendered incapable of caring for themselves either by chemical or surgical means. This theory is supported by the lack of any signs of struggle. No attempts of leaving their dwellings seem to have been made until starvation ran its course.\n\nIgnoring their original purpose, the remaining infrastructure could be refurbished to make comfortable residences for our own people."
 mem_ASPmod.12.a: "Eating sapient beings? How horrible!"
 mem_ASPmod.12.b: "A good snack never hurts."
 mem_ASPmod.12.c: "A tragic fate."
 mem_ASPmod.12.d: "Good riddance!"
 mem_ASPmod.12.e: "A tourist attraction!"

 mem_scfe_myzelium_datashard: "Lichen Datacore"
 mem_scfe_myzelium_datashard_desc_short: "A small lichen "device" previously attached to an organic computer network"
 mem_scfe_myzelium_datashard_desc_details: "The lichen supposedly functioned as an interface mechanisms for compatible species - likely plantoid or fungoid in origin."

