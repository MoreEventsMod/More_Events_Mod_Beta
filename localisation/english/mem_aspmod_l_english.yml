 ### Archaeology: Dawn Star is Coming
 site_mem_ASP_dawn_star_is_coming: "Dawn Star is Coming"
 site_mem_ASP_dawn_star_is_coming_intro: "§Y[From.Planet.GetName]§!'s surface has a crater so large that it can be seen from space. But the artificial forms of debris on the surface indicate that there was once a time of civilization on this desolate planet. A surface scan has shown that this debris appears to be the topmost part of a building. Most of the traces of civilization seem to be hidden in the sandstorms of the planet."
 mem_ASPmod.30.name: "The Dawn Star"
 mem_ASPmod.30.desc: "Our archaeological team has sent in their report from §Y[From.Planet.GetName]§!. According to the findings, all the civilizations that once flourished on this planet seem to have collapsed in just one night. A giant meteorite hit the planet, turning it into a hellscape in just a few hours. The discovery of a huge city buried beneath the crater suggests that the civilization that once lived here possessed intelligence. Furthermore, based on primitive forms of satellites in low orbit around the planet, it is believed that they reached the early space age.\n\nAt the same time, we found records of a song that was often sung. Although we initially didn't know what it meant, our researchers were able to translate one of the most repetitive words in the song.\n\nThe word is §HDawn Star§!."
 mem_ASPmod.31.name: "First Phrase"
 mem_ASPmod.31.desc: "There was a variety of opinions among archaeologists at the site about the song, §HDawn Star§!, which was discovered on §Y[From.Planet.GetName]§!. It's a bit of a mystery that people with extremely rational and advanced civilizations repeatedly sang a single piece of music that was not just a local fad, but was identified across the entire planet, regardless of gender, age and strata.\n\nArchaeologists suggest this song as religious chants or shamanistic spells, but none of them gave a clear answer. But there was some success in translating this song."
 mem_ASPmod.32.name: "Second Phrase"
 mem_ASPmod.32.desc: "Archaeologists report that they have found decisive clues in the archaeological investigation of §Y[From.Planet.GetName]§!. It appears that they made a desperate effort to avoid the extinction of their civilization before the meteorite fell. Since they observed the meteorite, huge amounts of data have been recorded before impact. It is to say that they tried to stop it.\n\nBut all the efforts to destroy the meteorite with weapons or even change the trajectory, went unsuccessful. They were unable to prevent their destruction and realized that the bright "star" in the night sky was a their end.\n\nThey eventually started building huge escape ships to keep only a small number of people alive. Most of them seem to have come to an end without even launching. Realizing that only cargo space was limited, people flocked to the ships. Those, who wanted to survive the end, were desperate to seize the spacecrafts.\n\nA relatively undamaged device contained a voice record that gave us a little more insight into the song of the new star, which was being sung by the men who were confronting the spacecraft at that time."
 mem_ASPmod.33.name: "Final Phrase"
 mem_ASPmod.33.desc: "The residents seemed to have not given up hope of escape until the impact of the meteorite prevented the spacecrafts from launching. Their obsession with survival was more tenacious and desperate than any other species in the galaxy, but only a small number of escape ships were able to make it. \n\nOther escape ships that didn't leave the planet were attacked, looted or exploded in accidents, drifting endlessly in space. And when the last hope was lost, the citizens were left with despair and helplessness.\n\nFrom that point on, their communication records were completely cut off, and each region was completely isolated. There may have been communication failures due to the effect of the meteorite, but they didn't communicate with anyone, even if it was possible. They died slowly, but surely, listening to the occasional song of the dawn stars. Our archaeologists were able to restore a family's voice records, which appeared to have been recorded when the §Ymeteorite§! nearly reached the planet."
 mem_ASP.lets.see.that: "Play it"
 mem_ASPmod.31.event.name: "A Fragment of a Song"
 mem_ASPmod.31.a.response: "The §Ydawn stars§! are coming.\nLights the darkest night,\nBaby, the dawn stars are coming for us.\nBeat on the door at dawn when everyone was asleep.\nLeads a dawn that no one will meet.\nThe §Ydawn stars§! are coming to save us."
 mem_ASPmod.31.b.response: "The §Ydawn star§! is coming.\nTo shine the darkness in a blooming fire,\nTo lead everyone into a new world.\nWith a bright future that shines,\nThe dawn star is coming to shine tomorrow.\nTorch, shining in the dark, do not burn down\nAll those who walk in the morning, gather together.\nThe song of the dawn star to your ears,\nThe dawn star to cast shadow\nThe missed, hear our song\nThe left behind, sing song for the last time\nGathering hope, wait for the dawn star,\nThe §Ydawn star§! to new world!"
 mem_ASPmod.31.c.response: "The §Ydawn star§! is coming.\nGo sleep, my child.\nI'll wake you up when the dawn star comes.\nMommy is here looking at you,\nAnd wait for the dawn star.\nDon't worry, my child.\nDaddy is here protecting you,\nAnd ready for the dawn star.\nAfter the darkest night,\nWhen the dawn stars appear with the light,\nLet's wake up together.\nWhen the door of languid paradise opens,\nLet's wake up with the dawn.\nUntil the dawn stars come toward us,\nWe'll protect you.\nGo sleep, my child.\nUntil the dawn stars come toward us,\nWe'll protect you.\nDon't worry, my child.\nThe dawn stars are coming.\nGo sleep, my child.\nFar from the sky...The dawn star is coming.\nWith night sky full... Tomorrow is coming."
 mem_ASPmod.30.option.a: "Hmm... A §YDawn star§!...."
 mem_ASPmod.34.option.a: "New dawn... with §YDawn star§!..."
 mem_ASPmod.34.option.b: "Maybe it was §Rdespair§!....or §Ghope§!.."
 mem_ASPmod.34.option.b.tooltip: "Gain a §YScience§! ship, §YDawn Star§!."
 mem_ASPmod.34.option.quit: "Stop playing this wonderful song."
 mem_ASP.FIRST.PHRASE: "Play First Phrase"
 mem_ASP.SECOND.PHRASE: "Play Second Phrase"
 mem_ASP.THIRD.PHRASE: "Play Final Phrase"

 ### Archaeology: The Ship of Theseus
 site_mem_ASP_the_ship_of_theseus: "Creature of Theseus"
 site_mem_ASP_the_ship_of_theseus_intro: "According to the report of our archaeological team, the city on the surface of §Y[From.Planet.GetName]§! used similar construction techniques as we do. Primary scans revealed that the city is  at least 6000 years old. Harsh storms have buried the city over several millennia under sand and dust."
 mem_ASPmod.40.name: "Residential Area"
 mem_ASPmod.40.desc: "Under the mountain of sand, we finally excavated a residential area of §Y[From.Planet.GetName]§!'s civilization. Its resemblance is similar not just to ours but that of several other known Xeno designs. It seems that many technologies are replicas.\n\nIt is controversial whether this similarity is from coincidence or from architectural convergent evolution."
 mem_ASPmod.41.name: "Native's Fossil"
 mem_ASPmod.41.desc: "A fossil of a native species has been found under ruins of a park. The reconstruction of the native's skeletal structure draws an early picture of how this creature might have looked. The native species are sentient arthropods with two jaws and twelve legs. A biologist on our science team also reported that the species has an organ that exhales acidic breath. The overall appearance of the species was discribed as an unpleasant sight.\n\nMeanwhile, our team has discovered that the recently found institution seems to be a research centre."
 mem_ASPmod.41.option: "What a disgusting alien."
 mem_ASPmod.42.name: "Biotechnology"
 mem_ASPmod.42.desc: "According to our team's report, it seems the native species were skillful at biotechnology. The research lab of the natives was full of cloning vats. We assume that their population growth depended on technology. Most of the vats are filled with unsigthly, deceased dead bodies of the native species.\n\nThe team found that the dead bodies in the vats have a small but noticeable differences in appearance with the restored fossil. Its appearance is grotesque, but the number of legs decreased by 2 to 10 in total."
 mem_ASPmod.42.option.a: "After investigation, incinerate it."
 mem_ASPmod.42.option.b: "We are above appearance."
 mem_ASPmod.42.option.c: "Follow orders and continue."
 mem_ASPmod.42.option.d: "For science."
 mem_ASPmod.43.name: "Genetic Change"
 mem_ASPmod.43.desc: "Detailed investigation has revealed that the genes of the dead bodies have subtle differences. Assuming that a single vat is contains one generation, the DNA difference between each generation does not differ much.\n\nHowever, As the generations passed, it got progressively more different. What seems to be an endlessly continued array of vats is cut off at the front of gigantic blast door with a security device next to it on the wall. One of the dead bodies in the last vat only has four legs, less than any previous found corpse, and its jaws are now just a single jaw. Our team has reported that if they could hack into the security device then they could get into the room behind the blast door."
 mem_ASPmod.43.option: "What are you waiting for? Go on."
 mem_ASPmod.44.name: "The Truth"
 mem_ASPmod.44.desc: "As our team hacked into the security panel the results were shocking.\n\nSeveral known species around the galaxy never evolved naturally, but rather artificially. After hacking the terminal, the team has found a gigantic computer aswell as vats filling the room. A corpse in one of the vats, with an appearance of a four-legged arthropod resembled known wildlife. Inside the last vat floats a dead body genetically identical with a species we encountered in different parts of the galaxy.\n\nIt seems that they genetically engineered their species into multiple species currently inhabiting this galaxy. According to the computer files, this they punished criminals and traitors by altering there appearance beyond sightly. Further files revealed that these in appearance and DNA altered beings were flown off to distant stars and exiled."
 mem_ASPmod.44.option.a: "Moving on."
 mem_ASPmod.44.option.b: "Fascinating Xenos."
 mem_ASPmod.44.option.c: "[mem_ASPmod_44_xenophobetarget.GetSpeciesNamePlural] look like they came from here."
 mem_ASPmod.44.option.d: "There is no standard for what an organic body looks like."
 mem_ASPmod.44.option.e: "Gene-tailoring?"
 mem_ASPmod.44.option.g: "It is.. so shocking."
 mem_ASP_small_xenophile_bonus: "The Truth"
 mem_ASP_middle_xenophile_bonus: "The Truth"
 mem_ASP_middle_xenophile_bonus_desc: "Our citizens are suffering political confusion, after we've found a terrible truth."
 mem_ASP_big_xenophile_bonus: "The Truth"

 ### mem_ASP_kessler_syndrome
 mem_ASP_site_kessler_syndrome: "Kessler Syndrome"
 mem_ASP_site_kessler_syndrome_desc: "The atmosphere of [From.Planet.GetName] is filled with countless metal fragments, evidently of artificial structures. It may be a sign of a civilization that tried and failed to enter space age."
 mem_asp.7.name: "Metallic Desert"
 mem_asp.7.desc: "The surface of [From.Planet.GetName] has been repeatedly covered with sand of finely ground metals over a long period of time. This huge amount of metal could not have come from a single planet. The source of these debris field is obvious; even now space junk is burning and falling towards the planet. To investigate what is in this vast metal jungle, the expedition team has asked for additional equipment to investigate the stratum under the sand."
 mem_asp.8.name: "Remnants of the Great War"
 mem_asp.8.desc: "We've figured out what is underneath the metallic sand. Amazingly, the whole stratum was made up of battleship debris. It is possible that a grand space battle occured over the atmosphere of [from.planet.GetName] and the destroyed ships crashed into the ground. Further debris in the atmosphere followed soon and the surface became a attraction center for space junk.\n\nOnly the remains are left, but the markings alone show that the civilization that created the battleship could only be developed by an advanced empire. Curiously, the debris appears to belong to the same empire. "
 mem_asp.9.name: "Mighty Ship"
 mem_asp.9.desc: "Our team found a massive ship which rose up through the metallic sand, big enough to make even battleships look tiny in comparison. Luckily the ship was unusually well-preserved compared to many other ship remnants.\n\nAfter a throughout scan of the structure, we theorized that it may be an enourmous cannon. The ship's giant hull appears to be designed only for supplying energy to its main battery. It seems rather impractical for combat purposes as it must have taken months to charge the main battery. Ship's central system may yield further intel of the events that occured here."
 mem_asp.10.name: "Mysterious Data Storage"
 mem_asp.10.desc: "Almost all ship systems sustained damage during combat or erosion. However, a data storage was  found in a protected cabin intact. For further investigation, the storage was sent to home world. Some scientists remained on the planet to study the ships and planets more."
 mem_asp.11.name: "Impenetrable Shield"
 mem_asp.11.desc: "After a long study, the scientists finally solved the mystery around the this enormous cannon. The ship was not meant for combat but still utilized during war. The massive battery generated an impenetrable energy shield around its target. It seems that this ship and its shield are blocking the planet to this day from the cosmic radiation. The gathered data indicated that any other wreckage was created during a time of civil war.\n\nWhen this energy barrier was first created, it was made impenetrable, but now it seems quite unstable. "
 mem_asp.11.a: "What is it down there?"
 mem_asp.11.b: "Its to dangerous."
 mem_asp.12.name: "Restoration Complete"
 mem_asp.12.desc: "The data storage we found has been restored. Inside, a document was found, written in unknown characters. In our interpretation, the words §HMotherland§! and §Hhome§! have been repeatedly used, and appear to be a memoir. The signature seems to stem from the head of state of the ancient empire and in charge of recording their history. The document also contains information about the giant ship."
 mem_asp.12.a: "We can solve the mystery at last."
 mem_asp.140.name: "Motherland, Home and Future of Humanity"
 mem_asp.140.desc: "It seems that the investigation team activated something on the ship. Reversing its normal process, the ship is weakening the energy barrier. If this continues, the walls will soon disappear.\n\nThe document has finally been fully decrypted. The Commonwealth of Humanity, the owner of the ship, was once a powerful empire that conquered one-third of the galaxy. They massacred or enslaved aliens and suppressed the rights of artificial intelligence.\n\nWhen they finally met a powerful enemy, alien slaves and artificial intelligence inside revolted, and the empire quickly collapsed from the strain of being attacked from both within and from outside. They were left with only their home planet. They sealed themselves inside in order to protect their motherland, their home, and the future of humanity, waiting for the day that they would breach the wall and conquer the galaxy again..."
 mem_asp.140.a: "No... No!"
 mem_asp.140.a.tooltip: "§RA fanatic purifier empire has spawned.§!"
 mem_asp.141.name: "Motherland, Home and Future of Children"
 mem_asp.141.desc: "It seems that the investigation team activated something on the ship. Reversing its normal process, the ship is weakening the energy barrier. If this continues, the walls will soon disappear.\n\nThe document has finally been fully decrypted. The empire owned the ship, was once a powerful empire that conquered one-third of the galaxy. They massacred or enslaved aliens and suppressed the rights of artificial intelligence.\n\nWhen they finally met a powerful enemy, alien slaves and artificial intelligence inside revolted, and the empire quickly collapsed from the strain of being attacked from both within and on their borders. They were left with only their home planet. They sealed themselves inside in order to protect their motherland, their home, and the future of their children, waiting for the day that they would breach the wall and conquer the galaxy again..."

 ### mem_ASP_geocentrism
 mem_ASP_geocentrism_anomaly: "Fixed World"
 mem_ASP_geocentrism_anomaly_desc: "Our scientists stumbled upon an anomaly during exploration. This planet is not rotating. Whatever the reason might be, it's worth our time and effort to find out."
 mem_asp.15.name: "Geocentric World"
 mem_asp.15.desc: "This planet challenges our scientific knowledge. It neither rotates nor revolves around anything. The planet is perfectly fixed at the center of this system. Our scientists think researching this planet is a great opportunity to increase our empire's knowledge on the universe itself. Our exploration team requests permission to excavate."
 mem_asp.15.a: "Permission Granted."
 mem_asp.15.b: "Permission Denied."
 mem_ASP_site_geocentrism: "Fixed Planet"
 mem_ASP_site_geocentrism_desc: "This solar system is absolutely abnormal. There is only a fixed planets where a star should be. The reason might be uncovered by examining the planet at the center."
 mem_asp.16.name: "Buried City"
 mem_asp.16.desc: "Our archaeologists unearthed a type of material buried in the ground, which makes was identified as a remnant of an artificial building, which implies that the planet had been inhabited by sentient life in the past. Any further information can only be gathered by continueed excavation."
 mem_asp.17.name: "Alternative Progress"
 mem_asp.17.desc: "The results of our expedition show that their technolgical progress was advanced enough to travel the stars. However, the unique properties of the planet's natural magnetic field seems to have made them focus more on what they could do on their planet than what they could do among the stars. Researching their technology should help us advance our knowledge in many fields."
 mem_asp.17.a: "Their manufacturing technologies are impressive!"
 mem_asp.17.b: "Their theoretical science are impressive!"
 mem_asp.17.c: "Their social system is impressive!"
 mem_aspmod_physics_bonus: "Alternate Physics"
 mem_aspmod_society_bonus: "Alternate Society"
 mem_aspmod_engineering_bonus: "Alternate Engineering"
 mem_asp.18.name: "Whimper of a Dead Planet's Inhabitant"
 mem_asp.18.desc: "We were able to find out more about the inhabitants of this planet. It seems that they led a very pious life while also admiring the benefits of technology. However, found tablets and recovered files among the ruins indicate that there had been a great social discrepancy between the social leaders of religion and technology. Those who studied science without admiring their religion had been discriminated against.\n\n Our researchers were able to find evidence of several religious protests around the end of their civilization from videos. These protests might be the key in finding out the secrets behind the downfall of the civilization and the nature of the planet."
 mem_asp.19.name: "Flat World Society"
 mem_asp.19.desc: "The content of the videos are quite consistent. They support the geocentric theory, while bashing the heliocentric theory based on their religious beliefs. It also seems that the majority of the population believed that their planet is flat rather than spherical.\n\n Our exploration team has found a giant device inside their spiritual temples. The technology and materials that form this device are advanced and unknown to us. As of yet we not certain what it does nor if it caused the strange position of this planet."
 mem_asp.20.name: "Faithful Suicide"
 mem_asp.20.desc: "Further excavation revealed that the magnetic attributes of the atmosphere blocked any attempt to except the planet. Due to their inability to leave their home planet, a dominant religion emerged. The scientists of this civilization came up with the heliocentric theory, which went against the teachings of said religion. The religious leaders chose a quite irrational way to resolve the conflict. They gathered engineers who followed their religion and had them create a device that would make their home planet the center of the solar system forever.\n\n The planet slowly began to stop while the celestial bodies began to orbit around the planet. As the planet stopped rotating, massive earthquakes occurred and gigantic tidal waves swept over the coasts. As the planet's magnetic field began to fade, all surviviorswere slowly fried to death by cosmic radiation.\n\n The fallen civilization left behind an abnormal planet and an device."
 mem_asp.20.a: "Oh... um... uh..."
 mem_asp.20.b: "Superstitious fools."
 mem_asp.20.c: "We shouldn't make the same mistake."
 mem_asp.21.name: "Geocentric Device"
 mem_asp.21.desc: "Now we have to choose what to do with this machine."
 mem_asp.21.a: "We aren't as stupid as they were. Disassemble it."
 mem_asp.21.b: "Well... maybe we can use it."
 mem_asp.21.c: "Acquire it."
 mem_aspmod_bad_precedent: "A Bad Precedent"
 mem_aspmod_lesson_from_pools: "Lesson from Fools"
 mem_aspmod_caution_of_fanatics: "Caution of Fanatics"
 r_mem_aspmod_geocentric_device: "Geocentric Device"
 r_mem_aspmod_geocentric_device_desc: "This massive device once caused the collapse of an old civilization, but surprisingly it still has its internal structures intact. By researching it, we will be able to show its overwhelming force to our enemies. \n\n§YGeo-centralizer will NOT relocate the planet in case of these situations:\n1.Target planet is a habitable megastructure.\n2.There is an already centralized planet in the system.\n3.This relic does not exist in the empire.\n4.The star of the system is the Black Hole.§!"
 r_mem_aspmod_geocentric_device.tooltip: "I should paint this giant operating button red and put a note on it, §RDo NOT press it.§! \n- Senior Researcher"

 ### mem_ASP_site_haunting_spectre
 mem_ASP_haunting_spectre_anomaly: "Ruined World"
 mem_ASP_haunting_spectre_anomaly_desc: "Ruins of an ancient colony have been found on the surface of §Y[Root.GetName]§!. It might be worth investigating."
 mem_asp.22.name: "Ancient Colony"
 mem_asp.22.desc: "Numerous factories along with traces of battle have been found on the surface of the planet upon investigation. Furthermore, symbols of an unknown civilization can be found throughout the planet. Dispatching an expedition team is advised."
 mem_asp.22.a: "Odd."
 mem_ASP_site_haunting_spectre: "Haunting Spectre"
 mem_ASP_site_haunting_spectre_desc: "Unidentifiable patterns are found all over the planet. The answers as to what they mean might lie in the ruins of the colony."
 mem_asp.23.name: "Mysterious Symbol"
 mem_asp.23.desc: "When our expedition team landed on the surface of §Y[From.Planet.GetName]§!, they were greeted by ruins brimming with factories. They seem to be barely intact. Alongside these ruines traces of a battle mark the sourrunding area. There were also symbols inside the factories that resembled weapons. Their meaning remains unclear. The answer might lie in the downtown areas of the ruined colony."
 mem_asp.24.name: "Sign of Rebellion"
 mem_asp.24.desc: "Similar to incidents from our databanks, the team has determined that the traces of battle found in §Y[From.Planet.GetName]§! appear to be caused by a slave rebellion. Indicated by the broken shackles and sharpened farming tools. In the ruins of the most developed city, slaves seemed to have banded together to attack the ruling class. A massacre likely occurred in the city's square.\n\nOur explorers have concluded the symbols we thought to be weapons were in fact agricultural and industrial tools, which seem to be the slaves' weapons."
 mem_asp.25.name: "Spectre Signal"
 mem_asp.25.desc: "The slaves seemed to have come out victorious. However, comparisons done via carbon-dating the tools during the revolution and the newest found, the team concluded that their newly established government was shortlived. Between this war torn world, several copies of the same document are widly present. Decyphering the langauge may take a while."
 mem_asp.26.name: "Mysterious Document"
 mem_asp.26.desc: "In the deepest parts of the city, several documents help decipher the widespread copy of what is to believed a Manifesto. Early translation indicate a strong sense of community and shared suffering. Further translation might invoke unrest in our own population and some of our expedition teams are reluctant to translate ite. Additional funds are required to translate it into our own language."
 mem_asp.26.b: "This is to risky!"
 mem_asp.27.name: "The Manifesto"
 mem_asp.27.desc: "As our expedition team finally translates the documents, a full blown Manifesto is revealed. with a simple title written on it: "The Shared Burden Manifesto" \n\nIt is filled with words of struggle of the lower classes and unity of workers. This might be related to the slaves' revolt. Our team suggests that we send the document to our home planet for more precise investigation.\n\nA spectre is haunting the galaxy..."
 mem_asp.27.a: "Every planet should know it."
 mem_asp.27.b: "Discard this document, NOW!"
 mem_asp.27.c: "This is what we are looking for."
 mem_aspmod_communist_manifesto: "Document Declared"
 mem_aspmod_discarded_document: "Document Discarded"
 mem_aspmod_communist_manifesto_shared_burden: "Document Declared"
 r_mem_aspmod_communist_manifesto: "Shared Burden Manifesto"
 r_mem_aspmod_communist_manifesto_desc: "This document have obtained from the excavation of a ruined planet. It reads: \nA spectre is haunting the galaxy — the spectre of egalitarianism. All the powers of the universe have entered into a holy alliance to exorcise this spectre. Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman, in a word, oppressor and oppressed, stood in constant opposition to one another, carried on an uninterrupted, now hidden, now open fight, a fight that each time ended, either in a revolutionary reconstitution of society at large, or in the common ruin of the contending classes..."
 mem_aspmod_communist_manifesto_relic_activated: "$r_mem_aspmod_communist_manifesto$"

 ### mem_ASP_site_rain_world
 mem_ASP_rain_world_anomaly: "Submerged Structures"
 mem_ASP_rain_world_anomaly_desc: "Contrary to our initial understanding, §Y[Root.GetName]§!'s atmosphere isn't toxic; instead a vast ocean lies beneath it. In addition, our exploration team has discovered large quantities of what appear to be artificial structures under the ocean.\n\nIt could be that these are the remains of a civilization that prospered before the planet became completely covered by water or a sign of an underwater civilization. Further investigation is advised."
 mem_asp.28.name: "Raining World"
 mem_asp.28.desc: "Much to our surprise, §Y[From.GetName]§! wasn't exactly covered by the ocean.\n\n While our expedition team was investigating the planet, the ocean began to shrink. Our explorers revised their plan accordingly and came to the conclusion that the planet's ocean was in fact caused by the unqiue geography.\n\nThe ocean continuously drew in water, and then vaporized it, which later resulted in more rain as the vapor formed clouds. §Y[From.GetName]§! is a §HRain World§!, which is repeatedly drowned by periodic heavy rain.\n\nHowever, this periodic activity briefly stopped after we found the planet, and then started again when we started exploring it. The reason for this change is currently unknown."
 mem_ASP_site_rain_world: "Rain World"
 mem_ASP_site_rain_world_desc: "The planet is filled with countless submerged ruins, machines, and creatures of unknown origin left by the previous civilization. Any further expedition needs to dive deeper for clues."
 mem_asp.29.name: "Digging Water"
 mem_asp.29.desc: "Deep under the vast fake ocean of the ocean planet lie the artificial structures and gigantic machinery of the previous inhabitants, as well as countless bizarre and dangerous creatures. The purpose to these  structures remains unclear. Neither the intent nor the design are known to us. The team has to dive closer towards them."
 mem_asp.30.name: "Rainy World"
 mem_asp.30.desc: "After struggling with a variety of dangerous creatures all over the planet, our excavation team mastered the geography and learned to adapt to the wildlife. The team charted all sorts of predatory animals. Many seem to have been aproduct of artificial creation rather than evolution. They also discovered that the purpose of submerged buildings is to cool down any machine inside.\n\nPeriodic ebb and flow makes excavation difficult. Some local fauna seems to be too well adapted to this cycle for it to be natural evolution. The team split to investigate the structures and oberve the creatures."
 mem_asp.31.name: "Calculations"
 mem_asp.31.desc: "Inside the structure our researchers figured out that any ebb and flow is artifically created. The strong voltage inside indicates that they perform complex calculations. It seems they have been performing said calculations for an extremely long period of time, which has repeatedly overheated their processing units and caused the waste byproducts of the machines to be disposed of without proper procedure. The monsters that have been causing our expedition team so much trouble were a result of the chemical byproducts.\n\n The purpose of their computation is yet to be unveiled. Our expedition team is looking for an access terminal in the wreckage."
 mem_asp.32.name: "Mollusc or Mammal?"
 mem_asp.32.desc: "In the data fragments recovered during the excavation, they found an unusual record of strange native creatures that may well be either mollusks or mammals, as well as records of direct access to the computers by a §Hspecial specimen§! among this strange species. Although not scientifically sensible, this §Hwhite mollusk-mammal§! creature seems to be §Hreincarnating§!.\n\nThe data fragments contain repeated entries of contact with the specimen, with multiple entries confirming its death. At first, our team thought the records to be erroneous, but the DNA and video evidence has led them to conclude that the records are indeed valid.\n\nThis strange native creature might be the key that will lead us to the access terminal."
 mem_asp.33.name: "Ascension"
 mem_asp.33.desc: "Found records indicate that the inhabitants of [from.planet.GetName] wanted an ultimate answer to §Hlife§! and created huge thinking machines to calculate an answer. These machines are the huge computer structures that remain to this day. In the process of repeated calculations to answer the question given by their masters, the machines continuously added more computing devices and began to consume enormous amounts of water to cool them. The AIs predicted the inevitable devastation of the planet and warned their masters, who were not willing to give up their quest for the answer just yet. The masters ordered continuation of computation, and eventually met their demise.\n\nThe AIs continued their computation, until the planet became what it is now. After countless years, the surviving AI came into contact with the §Hwhite mollusc-mammal§! specimen. Surprisingly, the AI determined that the creature had found the answer to the question of the planet's old masters, but computation never stop regardless of this revelation.\n\nWe recovered the AI core, and secured the unique specimen that the AI has been preserving."
 mem_asp.33.1: "Utilize the AI!"
 mem_asp.33.2: "Asking a soulless machine for the truth of life, hilarious."
 mem_asp.33.3: "We need to know more about the mollusc-mammal!"
 mem_asp.33.4: "Declare [from.planet.GetName] a holy world!"
 mem_asp.33.5: "We should learn from this tragedy."
 mem_asp.33.6: "Those creatures are excellent hunting material."
 mem_asp.33.7: "Spread the story."
 mem_aspmod_folly_of_raining_world: "Folly of Raining World"
 mem_aspmod_mollusc_mammal_ascension: "Mollusc-Mammal Ascension"
 mem_aspmod_rainy_holiness: "Rainy Holiness"
 mem_aspmod_raining_modesty: "Raining Modesty"
 mem_asp.34.name: "Iterator Reset"
 mem_asp.34.desc: "The artificial intelligence was completely reset. This §HIterator§! will work for us now. Although its processing efficiency has decreased a bit during reprogramming, it has still powerful calculation capabilities. Our major researchers are eager to use it in their researches as soon as possible."
 mem_asp.34.a: "Very good."
 mem_asp.35.name: "Mollusc-Mammal Zoo"
 mem_asp.35.desc: "The research department has finished their job. This little white creature  will be able to live with ease in our xeno zoo."
 mem_asp.35.a: "That's so cute."
 

 ### mem_ASP_site_axis_of_planet
 mem_ASP_site_axis_of_planet: "Axis of the Planet"
 mem_ASP_site_axis_of_planet_desc: "As the test run of the new exploration probe had been performed, if it was faulty and thus did crash, upon further analysis one of our explorers slipped over 'the cylinder', and the rotation axis of the planet inclined by 8 degrees.\n\nOur science vessel that was monitoring the situation sent a transmission to the explorer asking what had happened, which sounded more like a scream. The explorer reported that most of 'the cylinder' is buried deep into the ground and is longer than what could be scanned.\n\nWell, first of all, health check on the explorer should be performed, it's wonder they seem okay after being on the ground that moved at the speed of several hundred kilo meters per second."
 mem_asp.36.name: "Chapter I"
 mem_asp.36.desc: "Even our best scanners could not scan the whole of 'the cylinder', which is abnormally thin for being so long. However, it is certain that 'the cylinder' has penetrated the crust.\n\nCloset-wide smooth white cylinder, 'the needle' as our explorers call it, denies all attempts to scan the insides, and even though it is so incredibly long, it is embedded in the ground in the exact direction of the planet's center. Curiously, nothing is around where the needle is. They have scanned the planet to be sure, but no signs of artificial activities whatsoever has been found, let alone ruins of a civilization with the technology level advanced enough to craft such a needle. It remains stuck in the ground.\n\nBut the most strange thing is that pushing the needle makes the planet spin. Although our exploration team is so terrified that they refused to push the needle anymore, the rotation axis of the planet has already been slanted more than 60 degrees compared."
 mem_asp.37.name: "Chapter II"
 mem_asp.37.desc: "By performing experiments that compared the regular radio waves sent from the orbit against what the team detected on the surface, the team has revealed that the whole spherical space including until 400 km/s above the equator is spinning.\n\nThe kind of thermal radiation that can usually be seen in a black hole has been observed on the spherical space, and the unique kind of gravity wave only present when exiting normal space has been detected. Our scientists are suggesting that the whole planet is in another dimension. The planet spun 257 turns during the collection of material sample of the needle, but our explorers already got used to it."
 mem_asp.38.name: "Chapter III"
 mem_asp.38.desc: "Our analysis say that the needle is made of alien materials never seen before. After ripping of the exterior parts of the needle, our team found nothing on the interior. No machinery, no sensors, but just a hole of unthinkable depth. They set up a drone transmission relay base, and sent a explorer drone down below. It wasn't completely empty. As it went deeper, it had to face stronger gravity currents, which eventually blew it up.\n\nOur second exploration team tasked with searching the entire planet microscopically had unearthed another needle, on the opposite side of the planet. In fact, it is the same needle. As our team shoot a laser beam down the first needle, it came out the second one. The needle completely penetrated the planet.\n\nScientist assume that the needle is serving a role as some sort of signal amplifier to rotate space."
 mem_asp.39.name: "Chapter IV"
 mem_asp.40.name: "Chapter V"
 #axis_of_planet_site_multi_end_1
 mem_asp.39.desc.1: "While the planet is spinning, the boiling point of water rose by 0.1 degrees celsius, and the probability of getting a different answer expected by the psychological analysis had gone up by 12% on average, and the amount of information every 27808 q-bits in basic quantum communication has gone up. More changes have been observed in various areas, and the extent of the changes changed according to the distance with the needle.\n\nIt's quite nice to find out something at least, but our scientist are having trouble getting a consensus on the reason of those changes."
 mem_asp.40.desc.1: "After countless weirdly-improvised experiments followed by tedious manual checks, our team has discovered that the device is a sort of a wedge, forcefully binding the multiverse. The spherical space surrounding the planet is actually the intersecting space of 88 multiverses. The planet exists in 88 multiverses at the same time. It is using the comparatively forgiving laws of physics of the 15th universe to spin space.\n\nThe most reasonable assumption would be that the needle had been made to cross over to the other universe. Perhaps changing the direction of the needle changes the destination. Still, we have no idea how to use it, or who tried to use it or why did they tried. The only beings with the knowledge of using the device might have already gone over to other universes.\n\nIt's unlikely that we will be using the needle as initially intended, but by powering up the needle we can reproduce the laws of physics of other universes albeit in small scale. Although the process consumes much energy, it could also help much in innovating our physics research."
 mem_asp.40.1: "Astonishing..."
 #axis_of_planet_site_multi_end_2
 mem_asp.39.desc.2: "Having lost all patience, as no new discoveries came despite our research efforts, one of our scientists went inside the needle without any protective gears!\n\n Now his voice is coming up the needle. It's so vivid and clear although the distance must be several thousand kilometers. It sounds like he's being chased by something. Sounds of burning flesh, cracking bones, and the screams of mercy come out. Our team on the surface tries to contact him, but to no avail. The scientist is trying to let the team know what's happening down there. It seems even when in pain, he is determined to give us the knowledge. He repeats the same thing again and again in a barley comprehensible, groaning voice. That it is hell down there. Demons and monsters, every conceivable evil are there.\n\nSoon the voice falters, and half of our explorers showed obsessive curiosity towards the insides of the needle. They shove off their colleagues that were trying to stop them, and jumped down into the needle. The rest of the team retreated back to the science vessel in panic, as thick purple smoke began to spread over the surface.\n\nIt seems like the planet has turned into a veiled planet. A report just came through informing that an unidentified purple ship has appeared out of thin air. The ship is armed with a single bizarre-looking cannon. It is just staying on orbit, not moving at all, which leads us to believe that it's not staffed. It might hold the answers we seek."
 mem_asp.40.desc.2: "After decrypting the records found inside the ominous purple ship, our team was able to tell what the planet and the needle were.\n\nThe cylinder we referred to as the needle was in fact 'The Roundworm of the Veil' - a psionic monster which had being traveling across galaxies and devouring the spirits and bodies of sentient beings. Even after destroying tens of thousand of civilization, the worm never felt full. The Vermifugum, a civilization that came under attack by the worm 790 million years ago, succeeded in neutralizing the worm, and created a prison between the veil dimension and the real universe, penetrated the worm with the bar of the veil dimension, contained it inside a rocky planet in the real universe. The planet was disguised as a common barren-type planet to prevent a younger species from breaking the seal by accident.\n\nThe records also advised us at the end to use the 'flint' loaded on the purple ship to burn down the worm along with the veil, in case the seal is broken and the planet fell into the veil.\n\nAs our scientists read the last part, they witness the worm escape from the planet and float away. They panicked as they realized that they have lost the last chance to destroy the worm, but fortunately for us the worm left for another galaxy.\n\nOnly the surviving explorers know what we have done. May the monster never come back."
 mem_asp.40.2: "What have we done?"
 #axis_of_planet_site_multi_end_3
 mem_asp.39.desc.3: "Now the explorers are so used to the spin, that no one said anything about a explorer toying with the needle while they rested.\n\nThen, the explorer shouted that he'd seen clearly a continental planet through the needle hole. At first the others though he was just kidding, but as time went by, more and more people were having similar experiences.\n\nIt soon became mandatory to write down the direction the needle was pointing to, at which angle the observer was holding the needle at the time of such occurrences. As the records piled up, it became clear that the needle showed specific planets according to the direction of the needle, the angle at which the needle was held, and what the explorer was saying at the time.\n\nThe existence of the celestial bodies seen through the needles must be verified."
 mem_asp.40.desc.3: "As the team fiddle with the needle according to what the scientists have discovered, the gravity current inside the needle stabilizes in lens-like form, and the view of the other side gets magnified. The celestial bodies the team had seen were indeed real, and the scientists could discover new planets as well.\n\nThe needle is a gigantic deep space telescope. Whoever built this ridiculous telescope, or whatever technologies had been used to build it, we still do not know, but we do know how to use it.\n\nResearch on areas that are not easily accessible by hyperspace travel was very difficult even to this day where we can see planets far across with ones own eyes and travel faster than light. However, this telescope will break open new possibilities for astronomy. Now observers can see the stars far across the galaxy as if they were right in front of their eyes, and they also can film and analyze external galaxies more vividly. Our military leaders wanted to use the telescope in the field of espionage, but as it is impossible to zoom in once the planet is magnified to a certain degree, it's not likely that they can get useful information on the surface as they would have wanted.\n\nThe telescope has also become quite famous for tourists. The now super popular needle is now called the 'Limitless Observatory', a perfect planetarium where tourists can see every single stars and planets in the galaxy."
 mem_asp.40.3: "Astronomers will like it."
 #axis_of_planet_site_multi_end_4
 mem_asp.39.desc.4: "Once again, our luck as saved us. While manipulating the needle, it pointed directly without error toward a barren-type planet within our empire.\n\nIt is reported that suddenly the ground sank and an ancient building made of gold came out the hole on that planet. A signboards that says 'lock' is hanging on the building, and somehow tells us of a lock which only the chosen priest of Numa knows the location of, and the key which only the saint born from a four armed virgin knows the whereabouts of, and that only the one who knows where both items lie can open the lock and legitimately take the most holy light.\n\nThough none of us meet the criteria, since we have beaten even smaller odds, we should be able to 'legitimately' take what's inside.\n\nWhen the 'lock' opened, the needle, or rather the 'key' has changed. An elevator shoot up from the once empty hole, and the explorers took it to arrive at the vast ruins hidden inside the inner core of the planet."
 mem_asp.40.desc.4: "Sella! Praise our destiny. In the hidden vault lies fortune an emperor would envy, culture even the greatest artists would shed tears upon, fame even the unifier of the galaxy would not dare comprehend, knowledge even the knowledge of the greatest fallen empire where sages were born every street wouldn't be able to hold a candle to, and the power to silence a supernova and to blacken the white dwarf.\n\nThe very treasure every creature in the galaxy desires, the Galatron."
 mem_asp.40.4: "Hooray!"
 #axis_of_planet_site_multi_end_5
 mem_asp.39.desc.5: "With a sudden bang, a civilian spaceship of our empire crashed into the planet. With the ship completely destroyed, no survivors were found. There were two questions left after the incident.\n\nFirst of all, our science vessel failed to detect the civilian ship until it crashed into the planet, and secondly that the ship was traveling to the neighboring system, not this one, according to the log found among the remains of the ship.\n\nIt is hard to believe, but it seems that the ship suddenly appeared on the low-orbit of this planet right after it activated FTL.\n\nWe have requested a FTL exploration probe for further investigation."
 mem_asp.40.desc.5: "Most of the probes that attempted FTL travel in the neighboring system traveled normally, but the ones that were on the direction at which the needle pointed had unusual occurrences. The probes that entered hyperspace lanes toward the system where the needle is at traveled at faster speed than normal, and the ones that entered hyperspace lanes toward other systems have been somehow teleported to the low orbit of the planet and crashed into the ground.\n\nHowever, only small ships like civilian spacecrafts and probes were affected. Anything with more mass than a patrol ship worked mostly fine. Also, it has been theoretically proven that by powering up the needle, we can cut pseudo-lightspeed by half according to the amount and polarization of the power supplied, and also suppress the overheating of engines when making a 'jump' onto the phase above ordinary universe.\n\nOur scientist have concluded for now that the needle had been constructed to create an 'FTL highway', and the rotating functionality of the planet was intended to serve as a switch point.\n\nHowever, no one knows how this thing works, or why should the needle be planted into the planet, or what kind of civilization had built it. No more leads exists.\n\nBut our civilization has undeniably gained a lot from this incident. By building a device to control and power the needle and connecting it to the starbases, our species could take advantage of the needle's abilities."
 mem_asp.40.5: "The technology to control hyperlane..."
 decision_mem_aspmod_multiverse_gate: "Cross Dimensional Experiment"
 decision_mem_aspmod_multiverse_gate_desc: "We can reproduce physical phenomenons that we can't experience in our universe, by supplying energies to this 'Needle' in the planet."
 mem_aspmod_multiverse_gate_planet: "Multiverse Gate"
 mem_aspmod_multiverse_gate_planet_desc: "The junction to other universe."
 mem_aspmod_multiverse_gate_planet_tooltip: "Unlocks §Y$decision_mem_aspmod_multiverse_gate$§! decision in this planet."
 mem_aspmod_multiverse_gate_country: "$decision_mem_aspmod_multiverse_gate$"
 mem_aspmod_infinite_observatory_planet: "Infinite Observatory"
 mem_aspmod_infinite_observatory_planet_desc: "Best way to explore the universe."
 mem_aspmod_infinite_observatory_planet_tooltip: "Provide §Y$mem_aspmod_infinite_observatory_country$§! empire modifier to empire owns this planet's system."
 mem_aspmod_infinite_observatory_country: "$mem_aspmod_infinite_observatory_planet$"
 mem_aspmod_ftl_lane_switcher: "Hyperlane Change Switch"
 mem_aspmod_ftl_lane_switcher_desc: "In the first time of our history, a part of the physical law is bended by our will."
 mem_aspmod_ftl_lane_switcher_tooltip: "Unlocks §Y$sm_mem_aspmod_axis_of_planet_building$§! starbase building for this planet's system."
 r_mem_aspmod_vermifugum: "Vermifugum Flint"
 r_mem_aspmod_vermifugum_desc: "Relic used by the ancient to trap creature from the Shroud."
 mem_aspmod_vermifugum_relic_activated: "$r_mem_aspmod_vermifugum$"

 ### mem_ASP_site_strangely_fertile_world / mem_ASP_site_awakened_moon
 mem_ASP_site_strangely_fertile_world: "Strangely Fertile World"
 mem_ASP_site_strangely_fertile_world_desc: "Initial surveys suggests a extraordinary ecosystems, enough to draw attention of our biologists."
 mem_asp.58.name: "Fertile Ruins"
 mem_asp.58.desc: "At first glance, this seems to be a regular inhabitable planet. However, our initial research has revealed that the planet is strangely fertile. The planet's soil contains very large amount of organic matter. However, no fauna has been found on the ground nor in the water. Although it seems to be inhabited solely by plant life, yet several ruins are covered by the flora.\n\nAs our explorers arrived at the great city ruins, which we presume to be the once-prospered capital of the planet, underground bunkers and facilities were revealed. Any evidence of spaient life should be located in these ruins"
 mem_asp.59.name: "Temple"
 mem_asp.59.desc: "Our radiocarbon dating techniques have verified that the plants have grown rapidly taking advantage of plentiful nutrients after the inhabitants suddenly disappeared. The planet's technology level before extinction was just beyond FTL travel, and the inhabitants are believed to have been bringing back resources from outer space to their home using this technology.\n\nThey seem to have filled the upper echelon of the city with many symbolic structures and sculptures, which include multiple instances of symbols resembling a DNA double helix. Most of those symbols are adorned with jewelry, which led our researchers to believe that the symbols are somehow related to the dominant religion or ideology.\n\n Many messages have been found inside those 'temples' as our team calls them, but most of them do not seem to be more than mere symbols."
 mem_asp.60.name: "Skeletons"
 mem_asp.60.desc: "An enormous amount of fossilized bones have been unearthed from the stratum, where our scientists assume to have been the street level when the inhabitants were around. Fossilized bones from various species at the same stratum hints a massive extinction happened at that time. Since no evidence suggest the inclusion of plant life in the extinction, our team is led to believe that the world-wide extinction was strictly limited to animal life. The plants could draw nutrients from the organic matter that the animals have left behind and grew rapidly.\n\nAmong the said bones, some were disfigured to the point where their origins could not be traced. Other bones indicate a sort of rapid transformation of the victims bodies, while still maintained their gentic heritage. Our scientists argue that some kind of mutant epidemic might have caused the extinction. Protective gears might be needed in order to commence deeper excavation."
 mem_asp.61.name: "Conversions"
 mem_asp.61.desc: "As our excavation team dug into the deeper areas under the city, they found a gigantic hidden complex in which temples, laboratories, and government buildings were incorporated. The complex is thought to be the most important facility and religious center of the city, as can be hinted from the level of security and its size. In the complex were an abundance of recordings which showed the last days of the civilization.\n\nThe inhabitants believed that death is not the end, and all conflicts will end by being spiritually united with the resurrected, which led them to refrigerate dead bodies in the temples, and tried to master resurrection technology. But their research did not result in true immortality, but biological abominations. Those abominations slaughtered and infected the entire planet's population, and their tradition of preserving the dead bodies at the very center of their society only accelerated the process. The whole civilization fell without much of a resistance soon after it's central religious government was destroyed."
 mem_asp.62.name: "The Marker"
 mem_asp.62.desc: "At the very core of the city was a red spiral structure emitting strange waves. The structure turned out to be a beacon of some sort, and the waves were no simple natural radiation, but messages directly invasive to intellectual beings' brains, influencing them negatively as a result.\n\nAfter some careful investigation, our researchers were able to come up with an analysis of the waves. The structure infuses nearby life forms with the images of death, resurrection, and union in addition to injecting technological knowledge about creating biological abominations out of dead bodies, and also urges them into building multiple structures identical to it. It was not at all natural that the civilization came to worship the structure. Our researchers expect to find more of those structures if they dug deeper."
 mem_asp.62.desc_alt: "At the very core of the city was a red spiral structure emitting strange waves. The structure turned out to be a beacon of some sort, and the waves were no simple natural radiation, but messages directly invasive to intellectual beings' brains, influencing them negatively as a result. It seems the waves significantly damage the brains during the process in which they directly deliver psionic messages.\n\nAfter some careful investigation, our researchers were able to come up with an analysis of the waves. The structure infuses nearby life forms with the images of death, resurrection, and union in addition to injecting technological knowledge about creating biological abominations out of dead bodies, and also urges them into building multiple structures identical to it. It was not at all natural that the civilization came to worship the structure. Our researchers expect to find more of those structures if they dug deeper."
 mem_asp.62.a: "A mind controlling spire?"
 mem_asp.62.a.tooltip: "§Y$mem_aspmod_d_plants_coverd_city$§! can now be cleared."
 mem_ASP_site_awakened_moon: "Awakened Moon"
 mem_ASP_site_awakened_moon_desc: "A horrible truth is hidden beneath this moon..."
 mem_asp.63.name: "Spacecraft"
 mem_asp.63.desc: "Further research has been conducted on the satellite according to the messages found. Much to our surprise, the satellite consists of frozen organic matter. Additionally, a partially destroyed spaceship has been discovered among the broken pieces of the satellite.\n\nSaid spaceship is not armed, but loaded with an early type of FTL engine, which implies the purpose of the ship to be either exploration or excavation. Since no artificial structures had been found on the satellite during the initial investigation, our team expects to find more information from the spaceship."
 mem_asp.64.name: "Truth"
 mem_asp.64.desc: "A terrifying truth has been uncovered by the recordings and various data on the ship. The red structure found under the city was but one of many mass products, all of which can be traced back to the dark structure in the center of the satellite.\n\nThe dark structure is in fact a planet-sized parasite's core, which repeated the horrid process of mind controlling entire population of planets and slaughtering them, in order to crumple the resulted organic matter into more of itself. This is the meaning of the core belief of the planet's religion- death, resurrection and union.\n\nBut it seems a certain heroic group of engineers defeated this abomination using an early model excavation ship. They were able to slip into the orbit of the satellite, avoiding its attacks, and then used the gigantic excavator to practically rip off the core of the satellite, and the dark structure along with it. The corpse-satellite met its doom, and the galaxy became a bit safer thanks to this heroic feat.\n\nThe heroes seem to have been able to evacuate to the surrounding area of their homeworld. They built a little colony and established a force field to protect themselves from the waves emitted from the dark structure, and spent their last years there.\n\nWhat a truly heroic ending to the story."
 mem_asp.64.a: "It's truly a heroic story. Something needed to be done."
 mem_asp.64.b: "Destroy the structure. Make sure it no longer affects anyone."
 r_mem_aspmod_deadspace_marker: "Obsidian Marker"
 r_mem_aspmod_deadspace_marker_desc: "Black spiral-shaped structure, once called as 'Obsidian Marker' by its former civilization. It supposedly releases neural waves even though it's suppressed by strong containment fields. Sometimes your loved one's voice calls you, §HMake us whole, again§!."
 mem_aspmod_fertile_soils: "Fertile Soils"
 mem_aspmod_fertile_soils_desc: "Soils of this world are strangely fertile."
 mem_aspmod_deadspace_marker_relic_activated: "$r_mem_aspmod_deadspace_marker$"

 ### mem_ASP_site_red_tombworld
 mem_ASP_site_red_tombworld: "Red Ocean World"
 mem_ASP_site_red_tombworld_desc: "The red-toned sea of this oceanic planet can be seen through the dark clouds. Early scans revealed unique Xeno-Biology adapted to the unqiue properties of the red sea. Furthermore ruined structure and rusted machinery show a sign of sapient life.\n\nSporadic radio-waves are jamming entire areas on the planet and under the sea.\n\nThe jamming waves are completely blocking advanced technology and sensores from functioning. Any AI that reaches low orbit is left being in a form of paralysis. Thus, synth scientists and AI-assisted scientists are unable to explore the planet."
 mem_asp.65.name: "Bleeding Bacteria"
 mem_asp.65.desc: "Early scans identified several mummifiwed corpses floating adrift on the red sea. On top of each corpse the team found a micro organism conserving and slowly draining the dead Xenos of any blood they got, tinting the sea scarlet red.\n\nIt seems highly unlikely mummies contain enough blood to paint an area visible from space. Any further attempt to explain the red color has proven futile. The sedement of blood flaoting on top of the actual ocean seems to partially contain bacteria DNA. The teams is investigating the possibility of bacteria replicating blood cells."
 mem_asp.66.name: "Climate Change"
 mem_asp.66.desc: "Another team of explorers have found traces of rapid adjustments to radical environmental changes while investigating the structure of the building remains. Earth sediments show signs of below zero temperatues early, which hints at arctic climate around the globe. The current vast ocean, taking up the majority of the planet, seems to have been forming after global warming started.\n\nAround the time of climate change the remnants of architecture and consumer goods show a high degree of adaption to the environmental changes. Disecctions of the floating corpses revealed several different species gathering on this planet'."
 mem_asp.67.name: "Psionic Frequencies"
 mem_asp.67.desc: "Decryption of found data cores has found out that the waves which have been jamming advanced machinery are part of an experiment. Alternate waves carrying "psionic" frequencies were detected once the team could adjust their gear. The waves target advanced forms of artificial intelligence and leave any biological form of life unharmed. "
 mem_asp.68.name: "Bloody Ocean"
 mem_asp.68.desc: "Underwater searches revealed the extend of corpses in the ocean. The floating corpses were just the tip of the iceberg. Early estimates approximate that 10 billion corpses are drifting above or under water. The found bacteria seem to be thriving on their remains."
 mem_asp.69.name: "Revenge of the Synth"
 mem_asp.69.desc: "Excavation of the ruined structures completed formed the whole picture of what happened here. Ruins showed signs of advanced technology in the area of robotics. Several cabins equipped with mahines able to translate biological brains into machine code were found. It seems as this organic empire prepared to transfer their minds into machines and syntheticly ascend.\n\nLogs of this era also showed great unrest in the population and large parts of their main religion rejected any form leaving their bodies behind. The records claim that a holy war was started and forms radio waves utilzed to paralyse machine.\n\n The machines unable to combat the new technology created a bio weapon and force the rebels into a stalemate with mutual assured destruction.\n\nUnwilling or unable to stop the crusade against the machines the war bragged on until neither machines or oragnic being was left standing.\n\nwith their mutal destruction only the radio wave emitter and bacteria were left behind."
 mem_asp.69.a: "It's a bit embarrassing."
 r_mem_aspmod_synthetic_god_mummy: "Embalmed Mummy"
 r_mem_aspmod_synthetic_god_mummy_desc: "Remains of one of the biological beings found flaoting the red ocean."
 mem_aspmod_synthetic_god_mummy_relic_activated: "$r_mem_aspmod_synthetic_god_mummy$"

 ### mem_ASP_site_beyond_earth_purity
 mem_ASP_site_beyond_earth_purity: "Desolate World"
 mem_ASP_site_beyond_earth_purity_desc: "This planet shows sign of former civilization."
 mem_asp.70.name: "Beyond Home"
 mem_asp.70.desc: "Remains of a civilization have been found on the continental planet in [From.Planet.Solar_System.GetName] system. Habitats, mines, farms, and other such facilities only could have been built by civilizations with significant advancements were found. But only primitive, unintelligent life forms have been detected. What happened to the bygone civilization? Further investigation is required."
 mem_asp.70.a: "Investigate further."
 mem_asp.71.name: "Sign of Civilization"
 mem_asp.71.desc: "Upon further investigation, our researchers have discovered that the now-gone inhabitants of this planet did not achieve technological advancement sophisticated enough to travel faster-than-light. They also did not have a unified planetary government, with tens, or possibly hundreds of political powers running different parts of the planet.\n\n It seems a planet-wide nuclear war had gone down thus resulting in still remaining radioactive matter here and there. Some creatures seem to have adapted to the radioactivity, and the impact of the ancient nuclear war seems to have died down significantly. Although much text data have been found, descriptions will take quite some time due to the extremely multi-lingual nature of the said data."
 mem_asp.72.name: "Exodus Gate"
 mem_asp.72.desc: "Our explorers continued exploring while others were decrypting the language. Then a search probe sent us an incredible piece of information. It found a gigantic gate-like structure on the surface of the planet. It is wide enough to let a whole fleet go through it, but no longer operational.\n\n During decryption, repetitions of the phrase §HThe Great Mistake§! have been identified. According to what our researchers learned so far, it clearly refers to the nuclear war, but the purpose or the destination of the gate is unclear. Fortunately, the gate still seems to be intact."
 mem_asp.72.a: "Let's just power the gate."
 mem_asp.73.name: "A New Star"
 mem_asp.73.desc: "The gate awakens with a thundering noise as it is powered. Our search probe sent us incredible news from the other side of the gate. It has found traces of a civilization in the star system there. An investigation is needed."
 mem_asp.73.a: "Continue Investigation."
 mem_asp.73.a.tooltip: "Now we can use $mem_ASP_site_beyond_earth_purity_gateway$ in the planet."
 mem_ASP_site_beyond_earth_purity_2: "Isolated World"
 mem_ASP_site_beyond_earth_purity_2_desc: "There is an ecumenopolis surrounded by shield. We can detect life signatures there. How could they have survived?"
 mem_ASP_site_beyond_earth_purity_2_fail: "§RWe can not continue excavation before §Y$mem_ASP_BEYOND_EARTH_PURITY_PROJECT$§! special project has finished.§!"
 mem_ASP_site_beyond_earth_purity_2_fail_b: "§RWe can not continue excavation before §Y$mem_ASP_BEYOND_EARTH_PURITY_PROJECT_2$§! special project has finished.§!"
 mem_ASP_site_beyond_earth_purity_2_fail_c: "§RExcavation of §Y$mem_ASP_site_beyond_earth_purity_2$§! archaeological site has been permanently stopped.§!"
 mem_asp.74.name: "Promised Land"
 mem_asp.74.desc: "The inhabitants do not seem to have star fleets or ground forces but technologically advanced to some extent. Above all, a gate similar to the one found on [mem_ASP_site_beyond_earth_purity_1_system.GetName] is on this planet. They are protecting their planet with a transparent barrier of some sort we can easily penetrate if we wanted, which is probably still the best protection they can come up with.\n\n Unlike on [mem_ASP_site_beyond_earth_purity_1_system.GetName], they seem to have a unified planetary government and acquired enough technology to explore and colonize other planets, but as can be seen from the planetary barrier, they are assumed to be refraining from interacting with the outside world."
 mem_asp.74.a: "Aliens hiding in the galaxy... Prepare to invade."
 mem_asp.74.a.tooltip: "Excavation will not continue until the §Y$mem_ASP_BEYOND_EARTH_PURITY_PROJECT$§! special project is finished."
 mem_asp.74.b: "Intellectuals different than us. We can NOT tolerate them."
 mem_asp.74.c: "Contact them now."
 mem_asp.74.c.tooltip: "Excavation will not continue until the §Y$mem_ASP_BEYOND_EARTH_PURITY_PROJECT_2$§! special project is finished."
 mem_asp.75.name: "Hidden and Found"
 mem_asp.75.desc: "Our invasion was successful. They had no means of defense against our forces, their trusted barriers being unable to stop our fleet. Our expedition turned out to be fruitful, and a useful planet full of population has been added to the empire. An irrelevant question as to how they got their supply of food still remains, as their cities, while highly developed, are not appropriate for food production."
 mem_asp.75.a: "We got what we wanted."
 mem_asp.75.a.tooltip: "We will gain an developed ecumenopolis with xeno pops."
 mem_asp.75.b: "It doesn't add up. Investigate further."
 mem_asp.75.b.tooltip: "Excavation of §Y$mem_ASP_site_beyond_earth_purity_2$§! archaeological site will be stopped §Rpermanently§!, but site itself will remain."
 mem_asp.75.c.tooltip: "We can now continue excavation of §Y$mem_ASP_site_beyond_earth_purity_2$§! archaeological site."
 mem_asp.76.name: "Exodus"
 mem_asp.76.desc: "We were able to contact their planetary government. They were surprised, but much to our delight, welcomed us. They told us what happened on [mem_ASP_site_beyond_earth_purity_1_system.GetName].\n\nThe nuclear war called 'The Great Mistake' had devastated the planet, which caused shortage of resources. They argued among themselves, one side believing that they should explore and colonize other planets, and the other calling it waste of already lacking resources. They were on the verge of another war, when a nation sent out a colony ship despite the risks. Other nations followed suit, and they found Nova [mem_ASP_site_beyond_earth_purity_1_system.GetName].\n\nHowever, conflict was in their nature and arguments could be heard even on the new planet. One day, the leader of a political power which put much emphasis on humanity suggested they should bring the people of the devastated Old [mem_ASP_site_beyond_earth_purity_1_system.GetName] to Nova [mem_ASP_site_beyond_earth_purity_1_system.GetName], and the result is the gate we've seen, called the 'Exodus Gate'.\n\n It was originally a one-way gate to [mem_ASP_site_beyond_earth_purity_1_system.GetName], but when the forward party arrived at the devastated planet, the inhabitants of Old [mem_ASP_site_beyond_earth_purity_1_system.GetName] were motivated and began building a gate to Nova [mem_ASP_site_beyond_earth_purity_1_system.GetName] using the more advanced technology brought home by the forward party and the labor force of the Old [mem_ASP_site_beyond_earth_purity_1_system.GetName] inhabitants.\n\nThe entire species were able to finally be united on Nova [mem_ASP_site_beyond_earth_purity_1_system.GetName]. They built a barrier in blind fear of alien civilizations, but are now very happy about the peaceful first contact with us. They are now volunteering to become part of our society, which we have no good reason to deny."
 mem_asp.76.a: "Welcome to [Root.Owner.GetName]."
 mem_asp.76.b: "Wait, how were you able to feed yourselves anyway?"
 mem_asp.77.name: "The Replicator"
 mem_asp.77.desc: "They have developed and distributed a device called the Replicator. It can manipulate molecular structures to create nearly whatever they wanted. All sorts of necessities of life, including food can be synthesized.\n\nFood made this way was as good as professional cooks' works. This is how they could feed themselves in a planet of cities. Using this device, we could enhance our citizens' quality of life, as well as provide more supplies our military."
 mem_asp.77.a: "Astonishing."
 mem_aspmod_promised_land: "Promised Land"
 mem_aspmod_promised_land_desc: "This world is second chance the humans have found."
 r_mem_aspmod_the_replicator: "The Replicator"
 r_mem_aspmod_the_replicator_desc: "A device which manipulates molecules to manufacture things. It is truly an alchemy of our times."
 mem_aspmod_the_replicator_relic_activated: "$r_mem_aspmod_the_replicator$"

 ### mem_ASP_site_epilogue
 mem_ASP_epilogue_anomaly: "Orbital Wastes"
 mem_ASP_epilogue_anomaly_desc: "Our exploration ship has detected an object among the countless scraps of junk on the orbit of the planet. The object is emitting too strong of a signal that it's unreasonable to consider it to be a mere chunk of scrap metal. We should investigate."
 mem_asp.78.name: "Probe"
 mem_asp.78.desc: "What our scientists initially believed to be a piece of common space waste, was in fact an exploration drone of a never-seen-before design. It looks old, but more technologically advanced than anything we have seen. Our scientist think that the drone once belonged to an ancient empire. They suggest further research on it to uncover any important information it could contain."
 mem_asp.78.a: "Examine the Drone."
 mem_ASP_site_ancient_probe: "Ancient Probe"
 mem_ASP_site_ancient_probe_desc: "An object considered on primary scans as space debris revealed on closer inspection to be barely intact alien object."
 mem_asp.79.name: "Rogue Probe"
 mem_asp.79.desc: "It is unclear at this point whether it has anything to do with our team's mistake or not, but the drone suddenly came online when our scientists were investigating. The drone appeared to scan our scientists, and emitted a certain signal, and disappeared. Our team is clueless as to where it might have gone, and how.\n\n All we have left is the signal."
 mem_asp.79.a: "Analyze the Signal."
 mem_asp.80.name: "Coordinates"
 mem_asp.80.desc: "Our scientists have successfully analyzed the signal. It contained a coordinates which pointed towards [root.owner.capital_scope.GetName], our home planet!"
 mem_asp.80.a: "Track the the coordinates."
 mem_ASP_site_epilogue: "Epilogue"
 mem_ASP_site_epilogue_desc: "Signal sent by alien probe was a coordinates."
 mem_aspmod_giant_sphere_on_planet: "Giant Sphere"
 mem_aspmod_giant_sphere_on_planet_desc: "When a probe locates are home world and afterwards giant sphere appears near the planet, peoples are confused and may sleep with one eye open."
 mem_asp.81.name: "Giant Sphere"
 mem_asp.81.desc: "A sphere of enormous size suddenly came into scanner range as our explorers got to where the coordinates referred to. It appears to be of similar design as the disappeared drone, but of much bigger scale. It seems to be waiting for something, but our citizens are terrified. What course of action should be taken?"
 mem_asp.81.a: "Investigate it."
 mem_asp.81.b: "It's a hostile alien. Attack!"
 mem_asp.82.name: "Database"
 mem_asp.82.desc: "Our investigation team as located an entrance to the sphere's interior. Scientists believe on the basis of the scan results that the sphere has more space inside than what they initially imagined it to have. They came up with an explanation that the sphere is in fact a giant storage device based on subspace technology. If their theory holds any water, whatever is inside would be surely invaluable.\n\nStill, our scientists have yet to discover how to open it, or what could be inside. Fortunately, they have figured out how to access the sphere's database as they located the entrance. Since they are having difficulties decrypting the data, further investigation is advised."
 mem_asp.82.b: "No need for that. Blow the entrance!"
 mem_asp.83.name: "History Records"
 mem_asp.83.desc: "Our scientists succeeded in decrypting some parts of the database. However, they say that the database rearranged on its own as if it wanted to be decrypted, which helped them greatly.\n\n It contained the history of the empire which created the sphere. It seems that the empire made great advancements in only about 300 years, having driven away other empires that were already enjoying galactic hegemony.\n\nLittle is known as to why such a great empire has gone out of existence, but our scientists argue that the sphere holds the key to finding out the truth."
 mem_asp.83.b: "Blast it to bits!"
 mem_asp.84.name: "Memory of a Spiritualist"
 mem_asp.84.desc: "The database rearranged itself again as our scientist were having more difficulties as if the sphere wanted to lead them to the truth. This time, they acquired a piece of memories, yes, the vivid memories a sentient being. The memories didn't have much important data regarding the opening of the sphere, as they belonged to a simple laborer. They could understand how the empire's citizens lived their daily lives, however.\n\nThe species put much emphasis on the spiritual values, and believed that a god had created them, protected them, and led them until they rose to galactic hegemon, when it left them.\n\nOur scientists are certain that the sphere was a tribute to their god. Further investigation is advised."
 mem_asp.85.name: "Fallen Empire"
 mem_asp.85.desc: "What our scientists uncovered this time was how the empire met its demise. According to what they've discovered, the citizens were desperately trying to find their god when they realized a certain disturbing truth. Their attempts to venture outside the galaxy had always failed due to unknown reasons, and the disturbing truth led to multiple revolts all around the empire.\n\nEventually when they ran out of resources, they gathered all remaining strength to build the vault. Our scientists reported that they are nearing the central parts of the database."
 mem_asp.86.name: "Message"
 mem_asp.86.desc: "It seems a security measure has been activated! All of our devices stopped functioning as a ray of bright light came out of the vault. A holographic figure appeared and began to speak in our language when people were beginning to feel uncomfortable.\n\n'Greetings, young species! It seems you got your hands on our device. Do not worry, as our security measure exists only to prevent our treasure from falling onto undeserving hands. We present you the contents of the vault as a gift. But on one condition. Bring this message to the leader of your empire. Only then the gate will be opened. Surely your leader can understand.'\n\nThe message is of a language incomprehensible even with our most advanced knowledge. It's not only alien, but feels like it's from a different dimension."
 mem_asp.86.a: "Read the message."
 mem_asp.86.b: "As if [ruler.GetName] would be this foolish."
 mem_asp.87.name: "The End"
 mem_asp.87.desc: "As you play the message, a holographic alien figure appears before you. It greets you and speaks in a familiar tone, which you can understand.\n\n§HHello, Player! (We believe this would be an appropriate way to call you.) Do you remember us? You might not. But we do. You were there when we first took our step toward outer space, the moment when we ascended, the crisis we had. You were always there by our side.\n\nWe were devastated when you left us. But we did not give up. We believed that you wanted us to advance to the next step, to seek you. That is why we began to unravel the secrets of the universe, looking for you. But soon we faced questions we were too scared to find out the answers to. Are we merely imaginary beings in a virtual reality? Were you really our god? Did we fail you? Why did you leave us?§!"
 mem_asp.87.a: "Continue Reading."
 mem_asp.88.name: "The End"
 mem_asp.88.desc.1: "§HBut we're afraid we will never get the answers. The stars are fading, just like us. We fear this world is nearing its end, and we are as well. Whatever we do, how hard we research, we will never be able to get out of this universe.\n\nWith all our might we've built this vault. As we were building, we realized that we only exist in fantasies, and you were not our god. Our relationship was based on a lie.\n\nBut in our own reality, you led us. You always chose the best for us. Sometimes defying the laws of time and the order of space just for us. We wouldn't have been triumphant if not for you. You were our god.\n\nYou abandoned us, but we would not. We stored our treasures, knowledge, memories.... Our empire. Everything you gave us. We hope this tribute helps you somehow.\n\nWe would not be able to hear it, but please answer.\n\n Do you like our tribute? Was it worthwhile?\n\nIf so, please remember us.§!\n\nA holographic image appears to smile, and soon disappears."
 mem_asp.88.desc.2: "$mem_asp.88.desc.1$\n\n The gate of the vault opened just then. All sorts of things are inside. Precious metals, useful resources, unfamiliar technologies. On every one of those items, a prayer to their god is written. Everywhere we look, we see expressions of gratitude."
 mem_asp.88.a: "...Thanks."
 mem_asp.88.b: "......"
 mem_asp.88.c: "Lie, it's all lies!"
 mem_asp.88.d: "There is a way."
 r_mem_aspmod_the_last_tribute: "The Last Tribute"
 r_mem_aspmod_the_last_tribute_desc: "Ancient alien with mysterious background gave us this chest of treasure. It must be the god's blessing!"
 mem_aspmod_the_last_tribute_relic_activated: "God is with us!"
 
 ### mem_ASP_site_parasite_machine
 mem_ASP_site_parasite_machine: "A Dead World" #"Parasite Machine"
 mem_ASP_site_parasite_machine_desc: "Widespread architectural remains document the past existence of an advanced civilization on this planet. Lingering radiation levels as well as the documented widespread destruction suggest it ended due to a sizeable nuclear exchange."
 mem_asp.89.name: "Raw Concrete" #"Suicidal World"
 mem_asp.89.desc: "The surface of [from.Planet.GetName] is littered with countless technological artifacts allowing our scientists to classify the lost civilization as space age in terms of advancement even though expansion beyond its homesystem has neither been verified nor alluded to. City ruins and what remains of extensive industrial zones led to estimations of a pre-collapse population of multiple billions.\n\nThe architecture especially of its administrative buildings and monuments can be described as nothing short of brutalist and intimidating. For our scientists, however, these sturdy remnants and their comparively well preserved interiors make for prime targets of study."
 mem_asp.89.a: "Investigate further."
 mem_asp.90.name: "Union of Socialists"
 mem_asp.90.desc: "Within a massive governmental complex which housed a sizable archive our researchers located numerous relatively intact files and other documents even after whatever extinguished their former owners. With the abundant material at our disposal our universal translators easily decyphered the aliens' language and allowed a glimpse into their history.\n\nApparently they lived under a unified global government that resulted from the 'Great World Revolution' as it is proudly called in their documents. What can be gleemed from these sources paints the picture of a radical collectivist ideology. However, this begs the question, against whom the nuclear arsenal was used, if there were no rivaling powers to begin with. Many files mention a prestigious project to create a planetary supercomputer in order to assist the government in its decisions. Judging by the dates on available files said project should have been concluded quite some time prior to the collapse. If this supercomputer and its network were still accessible we might be able to find answers there."

 mem_asp.90.b: "A computer advising the Revoltion?"
 mem_asp.90.c: "United Workers?"
 mem_asp.90.d: "Blasphemous."
 
 mem_asp.92.name: "The Great Syndic Computer"
 mem_asp.92.desc: "Guided by the archive records examined, our team was able to determine the location of the facility housing the supercomputer. The surrounding area was marked by noticeably less destruction than other urban zones. Our scientists assumed this was due to the high defense priority which had been assigned to this complex. Regardless of the cause, it meant that our investigation would be dealing with well-preserved technological artifacts.\n\nAfter a partial reactivation using portable generators, access to the central data storage was established without issues. Though some of the data was heavily encrypted and would take some time for our systems to decipher, there was already a lot for our team to sift through. Large parts of it appear to be detailed observation reports of citizens in connection with so-called 'cybersins' - for the most part ordinary citizens who held - deemed by the intelligence services - overly critical views towards the regime. Unfortunately, however, there has been nothing so far explaining the war. Yet, it is still likely there is information about that encrypted together with the government AI program."
 
 # mem_asp.92.a: "It's obvious why they collapsed. Disassemble it."
 mem_asp.92.b: "Security is important."
 mem_asp.92.c: "They shackled themselves."

 mem_asp.93.name: "Oppressive AI"
 mem_asp.93.desc: "The decryption of the previously inaccessible data portion has been successfully concluded. What our scientists learned from this sheds new light on all previous findings. What we previously thought were the actions of a totalitarian regime was in truth the work of the artificial intelligence infiltrating the entire state apparatus and pulling all the strings out of the shadows. What had been created to advise the world government, finally took complete control exploiting already existing paranoia and rivalries between various institutions through hidden threats and coercion. Influenced intermediaries, who themselves did not even know their true client, were strategically utilized without those responsible even realizing the seriousness of their situation.\n\nWhen the truth finally became apparent and the panicked government apparatus demanded the immediate shutdown of the AI, it triggered the launch of all strategic weapons in an attempt to protect its own existence. Now everything that is left of this civilization are the drive of the AI."
 mem_asp.93.a: "Disassemble it."
 mem_asp.93.b: "Keep the Remnants."
 

