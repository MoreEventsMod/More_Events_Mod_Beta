 mem_planetophage_disabled_powergrid:0 "Disabled Powergrid"
 mem_planetophage_debris:0 "Debris Shell"
 MEM_PLANETOPHAGE_RESTORE:0 "Restoring the Steel Maw"
 mem_planetophage_ship_buff:0 "Buffs"
 mem_planetophage_crust:0 "Steel Maw Globe"
 mem_planetophage_crust_desc_short:0 "A sculpture of the Steel Maw created by a rather talented soldier who was part of the victorious engagement"
 mem_planetophage_crust_desc_details:0 "The creator said, the battle sparked inspiration from deep within and wanted to express that with a little memorial."

 mem_planetophage.1.name:0 "That`s no Moon"
 mem_planetophage.1.desc:0 "Our scientist [leader.GetName] discovered an interesting discovery while exploring [from.GetName]. The entire machine world seems to be shut down for an unknown reason. It seems that the creators wanted something more than a giant globe of matter and integrated ship systems within [from.GetName]. [leader.GetName] annotes that theoritically speaking this entire planet could "travel" to other systems.\nLuckily the power grid was not as sophisticated as one might expect and our team should be able to turn it back on."
 mem_planetophage.1.a:0 "Turn it on."
 mem_planetophage.1.a.tt:0 "§RAre you sure?§!"
 mem_planetophage.1.b:0 "Leave it alone"
 mem_planetophage.5.name:0 "It's a Space Station"
 mem_planetophage.5.desc:0 "Only minutes after turning back on the power grid, the entire planet began to rumble with machine noises. Days later we finally got the answer to what this machine is for: As it seems the "machine world" was just a dormant ship capable of recycling entire planets.\nAnd as it seems it is ever hungry for more!"
 mem_planetophage.200.name:0 "The Very Hungry Machine-pillar"
 mem_planetophage.200.desc:0 "The bigger they are, the harder they fall and [FromFromFrom.GetName] was one of the biggest around. The ever-hungry machine seems to have lost its appetite for planets after eating some of our torpedos and lasers. We were not able to completely destroy this monster, but it seems to shut itself down.\nOur engineers are certain they can reprogram it for our cause while others call for a more ethical approach."
 mem_planetophage.200.a:0 "Repair and reprogram it."
 mem_planetophage.200.b:0 "Planet is planet."
 mem_planetophage.200.b.tt:0 "§LThe wreckage becomes a machine world§!"
 mem_planetophage.200.c:0 "Recycle and study it."
 mem_planetophage.210.name:0 "Nimmersatt Machine"
 mem_planetophage.210.desc:0 "Our technicians and engineers finished their work and got the §YSteel Maw§! functional again. Sadly, they were not able to fully gain control of the hungry machine, but small improvements to the logic queue have been made and it should no longer target valuable planets."
 mem_planetophage.210.a.tt:0 "§LThe Steel Maw becomes neutral and no longer targets habitable worlds§!"