# By Tree

l_english:


 mem_planetophage_category:0 "Dark Side of the Moon"
 mem_planetophage_category_desc:0 "Early scans reavealed some kind of machinery under that massive debris. However as it turns out the entire moon is covered with circuits and server. While we found no trace of sentient or mechanical life, the massive machine also seems disabled. Further scans might reveal a clue to how and why this machine is covered with an outer shell of debris."
 MEM_PLANET_EATER_CRACKER:0 "Planet Consumer"
 MEM_PLANET_EATER_CRACKER_ACTION:0 "Consume Planet"
 FLEETORDER_DESTROY_PLANET_WITH_MEM_PLANET_EATER_CRACKER:0 "Consume Planet"
 NAME_MEM_planetophage:0 "Steel Maw MKI"
