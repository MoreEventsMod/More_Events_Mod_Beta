 MEM_PLANET_EATER_CRACKER:0 "Planet Consumer"
 MEM_PLANET_EATER_CRACKER_ACTION:0 "Consume Planet"
 FLEETORDER_DESTROY_PLANET_WITH_MEM_PLANET_EATER_CRACKER:0 "Consume Planet"
 NAME_MEM_planetophage:0 "Steel Maw MKI"
 mem_planetophage_ateplanet_counter:0 "Bites taken"
 mem_planetophage_disabled_powergrid:0 "Disabled Powergrid"
 mem_planetophage_debris:0 "Debris Shell"
 MEM_PLANETOPHAGE_RESTORE:0 "Restoring the Steel Maw"
 MEM_PLANETOPHAGE_RESTORE_DESC: "This planet-sized ship was built to devour whole planets and turn them into raw resources to use at its makers' leisure. For an unknown reason, however, it used the planets' resources to arm itself instead. We should be able to restore it in accordance with its original purpose and use the resources for ourselves."
 mem_planetophage_ship_buff:0 "Buffs"
 mem_planetophage_crust:0 "Steel Maw Globe"
 mem_planetophage_crust_desc_short:0 "A sculpture of the Steel Maw created by a rather talented soldier who was part of the victorious engagement"
 mem_planetophage_crust_desc_details:0 "The creator said, the battle sparked inspiration from deep within him and he wanted to express that with a little memorial. The sculpture itself is fittingly made from fragments of the original."

 #anomaly
 mem_planetophage_category:0 "Dark Side of the Moon"
 mem_planetophage_category_desc:0 "The [solar_system.GetName] system consists of only a couple planetary bodies, despite our earlier scans indicating more. It seems that several of them went missing. Our only clue is the moon [from.GetName] orbiting a broken ecumonopolis. The curiosity about this rather odd shattered world is its "shell" of debris from other planets. While we found no trace of sentient or mechanical life, the massive planetary body also seems to align with the ecumonopolis flawlessly. Further scans might reveal a clue to how and why this planet is covered with this extravagant extension."
 # anomaly finsih
 mem_planetophage.2.name:0 "Shy Machinery"
 mem_planetophage.2.desc:0 "Beneath the crust of [from.GetName] we found wires, cables and other machinery. Some sections are obviously dedicated for raw resource extraction while others are full to the brim with servers and high end circuitry. Our construction ship crew has noted that none of the aforementionted are active and running. The entire planet seems to be shut down."
 mem_planetophage.2.a:0 "Can we reactivate it?"
 mem_planetophage.2.b:0 "Leave the sleeping beauty alone."
 # special project 1
 MEM_PLANETOPHAGE_REACTIVATE:0 "Reactivate the Machine World"
 MEM_PLANETOPHAGE_REACTIVATE_DESC: "This Machine World has been shut off. We could try finding the on switch and restart this planet. Whoever left it there is not around anymore. That means there is nobody to object this action left. Right?"
 # special project 1 finish
 mem_planetophage.1.name:0 "That`s no Moon"
 mem_planetophage.1.desc:0 "The entire machine world [from.GetName] seems to be shut down for an unknown reason. It seems that whoever built this massive machine integrated ship systems within [from.GetName]. [leader.GetName] annotes that theoretically speaking this entire planet could "travel" to other systems.\nLuckily the power grid was not as sophisticated as one might expect and our team should be able to turn it back on."
 mem_planetophage.1.a:0 "Turn it on."
 mem_planetophage.1.a.tt:0 "§RAre you sure?§!"
 mem_planetophage.1.b:0 "Leave it alone."
 # clicked mem_planetophage.1.a
 mem_planetophage.5.name:0 "It's a Space Station"
 mem_planetophage.5.desc:0 "Only minutes after turning back on the power grid, the entire planet began to rumble with machine noises. Like a breeze rushing through a forest, one signal after another reactivated previous dormant sections. Days later we observed the true purpose of this moving planet: To consume every planet in sight and augment itself with whatever is useful.\nAnd as it seems it is ever hungry for more!"

 # defeated the steel maw
 mem_planetophage.200.name:0 "The Very Hungry Machine-pillar"
 mem_planetophage.200.desc:0 "The bigger they are, the harder they fall and [FromFromFrom.GetName] was one of the biggest around. The ever-hungry machine seems to have lost its appetite for planets after eating some of our torpedos and lasers. We were not able to completely destroy this monster, but it seems to shut itself down as if it is sentient and begging for mercy.\nOur engineers are certain they can reprogram it for our cause, while others call for a more ethical approach."
 mem_planetophage.200.a:0 "Repair and reprogram it."
 mem_planetophage.200.b:0 "Planet is planet."
 mem_planetophage.200.b.tt:0 "§LThe wreckage becomes a machine world§!"
 mem_planetophage.200.c:0 "Recycle and study it."
 # clicked mem_planetophage.200.a
 mem_planetophage.210.name:0 "Insatiatable Machine"
 mem_planetophage.210.desc:0 "Our technicians and engineers finished their work and got the §YSteel Maw§! functional again. They discovered a foreign software deep inside the machine core systems. They can only speculate why someone would try to manipulate the decision-making of this monster, but it explains the misfortunate ending of its makers. After they removed this virus, they gained partial control over the Steel Maw. Small improvements to the logic queue have been made and it should no longer target valuable planets and turn useless one into massive amounts of raw materials."
 mem_planetophage.210.a.tt:0 "§LThe Steel Maw becomes neutral and no longer targets habitable worlds§!"