# Decisions
 mem_scfe_decision_planet_illusion_rune: "Illusion Rune Terraforming"
 mem_scfe_decision_planet_illusion_rune_desc: "Adds two planetary features to the planet."
 mem_scfe_decision_two_prospect_effects_short: "Adds two random §YPlanetary Features§! to the planet."
 mem_scfe_decision_planet_haste_rune: "Haste Rune Acceleration"
 mem_scfe_decision_planet_haste_rune_desc: "Swift as the wolves of Icewrack."
# Relics
 r_mem_scfe_damage_rune: "The Mighty Rune"
 r_mem_scfe_damage_rune_desc: "The Mighty Rune was created by a Machine Empire by request of the §HNyblax§!. When first tested the Rune released so much energy that it destroyed the whole system. The Rune provides great power for he who holds it."
 r_mem_scfe_haste_rune: "The Haste Rune"
 r_mem_scfe_haste_rune_desc: "The Haste Rune was created by a spiritualist civilization. They worshiped The §HNyblax§! as if it was their god. The Nyblax took advantage of their beliefs and tricked them into creating the Haste Rune, having them die in the process."
 haste_rune_activated: "§HUnlocks Decision:§! §G$mem_scfe_decision_planet_haste_rune$§!, granting the ability to accelerate time on one planet, increasing §YBuilding Construction Speed and Blocker Clear Speed§!."
 r_mem_scfe_illusion_rune: "The Illusion Rune"
 r_mem_scfe_illusion_rune_desc: "The Illusion Rune was created by a race of antrophoids that could camouflage, in their attempt to use The Rune to hide from The §HNyblax§!, they disappeared. The Illusion Rune grants its user absolute control over reality itself, converting antimatter into matter."
 mem_scfe_illusion_rune_activated: "§HUnlocks Decision:§! §G$mem_scfe_decision_planet_illusion_rune$§!, granting the ability to add two planetary features to a planet."
 r_mem_scfe_arcane_rune: "The Arcane Rune"
 r_mem_scfe_arcane_rune_desc: "The First Rune, also known as The Arcane Rune, was created by Vorta, a Shakzem scientist. He drained the living energy out of his people to harvest the required power to forge the Rune."
 mem_scfe_arcane_rune_activated: "Creates a §YGovernor§!, §YScientist§!, §YAdmiral§! or §YGeneral§! from the souls of the harvested Shakzem people."
 r_mem_scfe_invisibility_rune: "The Invisibility Rune"
 r_mem_scfe_invisibility_rune_desc: "Little is known about the Invisibility Rune, it was created for the §HNyblax§! but lost due to the negligence of its creators."
 r_mem_scfe_regeneration_rune: "The Regeneration Rune"
 r_mem_scfe_regeneration_rune_desc: "The Regeneration Rune was created by a Hive mind entity that was merged into one single planet-like being when used for the first time. It has the power to heal and repair damage extremely fast."
# Modifiers
 mem_scfe_planet_haste_rune_boost: "Haste Rune Acceleration"
 mem_scfe_planet_haste_rune_boost_desc: "This planet is currently being accelerated by the Haste Rune."
 mem_scfe_planet_illusion_rune_boost: "Illusion Rune Terraforming"
 mem_scfe_planet_illusion_rune_boost_desc: "This planet's environment has been cleared by the §YIllusion Rune§!"
 mem_scfe_invisibility_rune: "$r_mem_scfe_invisibility_rune$"
 mem_scfe_invisibility_rune_desc: "Our empire is cloaked by the power of the Invisibility Rune, blocking enemy sensors and granting us superior fighting capability."
 mem_scfe_invisibility_rune_fc: "$r_mem_scfe_invisibility_rune$"
 mem_scfe_invisibility_rune_fc_desc: "$mem_scfe_invisibility_rune_desc$"
 mem_scfe_regeneration_rune: "$r_mem_scfe_regeneration_rune$"
 mem_scfe_regeneration_rune_desc: "The Regeneration Rune allows are ships to heal its armor and hull."
 mem_scfe_power_rune_boost: "Damage Rune's Power"
 mem_scfe_power_rune_boost_desc: "The Damage Rune allows our ships to do devastating orbital bombardments."
# Arcane Rune Events
 mem_scfe_arcane_rune.1.name: "Synthetic Assembly"
 mem_scfe_arcane_rune.1.desc: "We can now create an artificial lifeform out of the souls of the Shakzem ancestors into one being to aid us. The question remains, what purpose should this §YArcane Synthetic§! serve?"
 mem_scfe_arcane_rune.1.a: "Build us an Official"
 mem_scfe_arcane_rune.1.b: "Build us a Scientist"
 mem_scfe_arcane_rune.1.c: "Build us a Commander"
# Ghastly Eyrie
 mem_scfe_ghastly_eyrie_init.1.name: "Strange Radiation"
 mem_scfe_ghastly_eyrie_init.1.desc: "Upon entering the §HHyrokkin§! system, our science ships have picked up a strange radiation signature from the planet §HMoxxu§!."
 mem_scfe_ghastly_eyrie_init.1.a: "Send a team to investigate."
# Ghastly Eyrie Dig Site
 mem_scfe_ghastly_eyrie_site: "Moxxu Digsite"
 mem_scfe_ghastly_eyrie_relic_world_site_desc: "Our science ships have picked up a strange radiation signature from §HMoxxu§!."
 mem_scfe_ghastly_eyrie.1.name: "The Long Journey"
 mem_scfe_ghastly_eyrie.1.desc: "Upon scanning the planet's surface, our team has discovered a decaying city within its deepest abyss. The radiation emanating from the city is so intense that it disrupts our ship's instruments, rendering navigation of the chasm impossible. Our archaeologists will proceed on foot to continue their investigation."
 mem_scfe_ghastly_eyrie.1.a: "Go on."
 mem_scfe_ghastly_eyrie.2.name: "The Shakzems"
 mem_scfe_ghastly_eyrie.2.desc: "Nearing the bottom of the chasm lies the city. According to our team's findings, the city once floated above the abyss, but for reasons yet to be discovered, its hovering mechanisms have failed.\n\nAs the team approaches the ruins, faint sounds fill the air - voices chattering, infants laughing, and distant wails. Some among the crew believe the city is haunted by ghosts and hesitate to move forward, but the more skeptical and adventurous press on. It is then that spirit-like entities appear before them."
 mem_scfe_ghastly_eyrie.3.desc: "§BFear not, travelers. We are the Shakzems, and we come in peace.§!\n\nOne of the beings steps forward as a representative, reaffirming their peaceful intentions. It explains that they are the last remnants of a long-dead civilization. Intrigued, our archaeologists ask what became of their people, and so the Shakzems begin to recount the tale of Vorta and Dniki."
 mem_scfe_ghastly_eyrie.4.name: "Lovers Quarrel"
 mem_scfe_ghastly_eyrie.4.desc: "According to their tale, Vorta was one of the greatest scientists the Shakzems had ever known - until the day their god, Go'ldai, appeared.\n\n§BThe other Shakzems revered the entity as a deity, but Vorta and Dniki saw the truth... It was no god at all! The creature was simply a spaceborne entity, unique in the galaxy: a Nyblax!§!\n\nThey continued to explain that Vorta became deeply involved in assisting the Nyblax with its secret project. However, one day, Dniki made a horrifying discovery - Vorta and the Nyblax were using Shakzem citizens as sacrifices for their vile experiments. Thus began the lovers' tragic quarrel..."
 mem_scfe_ghastly_eyrie.4.a: "Tragic."
 mem_scfe_ghastly_eyrie.5.name: "The First Rune"
 mem_scfe_ghastly_eyrie.5.desc: "The quarrel ended in disaster, as Vorta's crimes became public, sparking a civil war. His experiments had been focused on creating what he called §YThe Runes of Power§! - mystical runes forged by siphoning the life energy of living beings. With enough runes, Vorta believed he could create another Nyblax. While his intentions may have been noble, his methods were nothing short of monstrous.\n\nIn the end, Vorta succeeded in creating the first rune, which he named §YThe Arcane Rune§!.\n\nBut once the rune was complete, the Nyblax itself entered the conflict, laying waste to the city. It tore everything apart, killing every last Shakzem who remained."
 mem_scfe_ghastly_eyrie.6.desc: "What the Nyblax did not realize was that a single rune would not be enough to fulfill its desires.\n\nDuring the war, Dniki managed to seize the rune, but it was damaged in the Battle of Ekbor. The remnants of the Shakzem civilization now hold this artifact and seem willing to offer it to us - for a price.\n\nSince the rune was damaged, it is no longer functional, meaning countless Shakzem lives were sacrificed in vain. To restore its power, another sacrifice must be made.\n\nOnly then will the Shakzems hand over §YThe Arcane Rune§!."
 mem_scfe_ghastly_eyrie.6.a: "Such a complicated scenario..."
 mem_scfe_ghastly_eyrie.11.name: "The Sacrifice"
 mem_scfe_ghastly_eyrie.11.desc: "The Shakzems are waiting for an answer. Who should we sacrifice?"
 mem_scfe_ghastly_eyrie.11.a: "It wouldn't be right if the captain didn't sacrifice himself."
 mem_scfe_ghastly_eyrie.11.b: "§Y[Root.Leader.GetName]§! is too important, sacrifice somebody else."
 mem_scfe_ghastly_eyrie.12.name: "The Arcane Rune"
 mem_scfe_ghastly_eyrie.12.desc: "Our officer was placed inside an ancient device, where their life force was drained to complete the ritual. As soon as the sacrifice was made, the machine collapsed, and the Shakzem remnants vanished, leaving the rune behind.\n\nWhether the Shakzem were truly spirits or merely advanced holographic projections created by the device remains unclear. In the end, however - at the cost of our officer - we have obtained §YThe Arcane Rune§!."
 mem_scfe_ghastly_eyrie.12.a: "A worthy sacrifice."
 mem_scfe_ghastly_eyrie.13.name: "The Arcane Rune"
 mem_scfe_ghastly_eyrie.13.desc: "To ensure the sacrifice would succeed, we gathered a group of deviant drones and fulfilled our part of the bargain. As soon as the ritual was complete, the machine collapsed, and the Shakzem remnants faded away, leaving the rune behind.\n\nWhether the Shakzem were truly spirits or simply advanced holographic projections generated by the device remains uncertain. But in the end, we now possess §YThe Arcane Rune§!."
 mem_scfe_ghastly_eyrie.13.mach: "Error: Soul not found."
 mem_scfe_ghastly_eyrie.13.hive: "Anything for the Hive."
# Techis
 mem_scfe_techis_init.1.name: "Destroyed System"
 mem_scfe_techis_init.1.desc: "The §Y[Root.GetName]§! reports that the §HKhnum§! system has been devastated for some time. The cause of its destruction was not the star itself, but rather a massive energy surge that originated from one of the planets."
 mem_scfe_techis_init.1.a: "Find out what happened!"
# Techis Dig Site
 mem_scfe_techis_site: "Tharkun Digsite"
 mem_scfe_techis_relic_world_site_desc: "Long range scans reveal the system has been destroyed by a power surge that originated in planet Spleen."
 mem_scfe_techis.1.name: "Initial report"
 mem_scfe_techis.1.desc: "Our initial scans have proven accurate. The entire system was devastated by a massive energy surge millennia ago, obliterating every planet and collapsing the sun into a black hole. Although the planets were completely destroyed, fragments remain - some of which still bear traces of what appear to be the ruins of an ancient civilization."
 mem_scfe_techis.1.a: "Check them out."
 mem_scfe_techis.2.name: "Machine Worlds"
 mem_scfe_techis.2.desc: "Our scientists investigated the ruins with the highest residual energy readings and discovered that the planet's surface was once covered in metal and wires, resembling a colossal supercomputer. This planet had the capability to host and interconnect data hubs from across its entire surface. Remarkably, some of the data nodes are still operational, and we may be able to connect our systems and hack into the planet's mainframe."
 mem_scfe_techis.2.a: "Start the connection."
 mem_scfe_techis.3.name: "Failing Archives"
 mem_scfe_techis.3.desc: "Creating an interface with the planet's data stream proved more challenging than expected. Despite the difficulties, our hackers managed to access data stored within the ruined archive structures.\n\n§B'Unlocated redundancies, creating local backup...\nLoading nyblax.log...\nLog: Unidentified creature detected.\nLog: Assigning code beta alien.\nLog: Engaging defensive protocols.\nLog: Beta alien not hostile.\nLog: Commencing social interactions...'§!\n\nThe system is stuck in a loop, replaying a file labeled 'Nyblax.log.' It appears this civilization encountered an alien entity, which they began interacting with."
 mem_scfe_techis.3.a: "Keep Reading!"
 mem_scfe_techis.4.name: "The Nyblax"
 mem_scfe_techis.4.desc: "The system logs were fragmented and difficult to interpret, presenting a challenge our hackers did not anticipate. However, their report confirms the arrival of a being identified as the Nyblax.\n\nFor many years, the Nyblax and the machines engaged in trade. The creature shared advanced technologies from other civilizations it had encountered, and in exchange, the machines worked to create something they referred to as The Rune."
 mem_scfe_techis.5.desc: "According to their logs, the machines successfully created the rune, but unfortunately, no details were recorded on how it was done.\n\nBefore handing it over to the Nyblax, they decided to test the rune. Our team has concluded that this test is what triggered the catastrophic collapse of the entire system since their last log entry reads as follows:\n\n§BLog: Rune - Planetary Matrix connection established.\nLog: Initiating Rune debug.§!\n§RSystem Failing\nSaving nyblax.log\nSystem Failure\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data\nCorrupt data§!"
 mem_scfe_techis.5.a: "Such power. Where is the Rune now?"
 mem_scfe_techis.6.name: "The Mighty Rune"
 mem_scfe_techis.6.desc: "Our team returned to §Y[Root.GetName]§! to search for the Rune amidst the debris. Using the ship's scanners, they pinpointed the source of the lingering energy readings. Once the course was set, the crew navigated through the planet's remains and found the Rune, drifting in the vacuum of space."
 mem_scfe_techis.6.a: "With the Mighty Rune, how can we ever be defeated?"
# Narrow Maze
 mem_scfe_narrow_maze_init.1.name: "Spotted Signal"
 mem_scfe_narrow_maze_init.1.desc: "§Y[Root.GetName]§! has encountered a peculiar sight: a dragon-shaped dust cloud emanating from the planet §HNinsun§!. Long-range scanners reveal that the planet is littered with abandoned colonies, which may be worth investigating."
 mem_scfe_narrow_maze_init.1.a: "Most intriguing."
# Narrow Maze dig site
 mem_scfe_narrow_maze_site: "Ruined Planet"
 mem_scfe_narrow_maze_relic_world_site_desc: "A dragon shaped dust cloud is coming from one of the ghost cities from §HNinsun§!."
 mem_scfe_narrow_maze.1.name: "The Ninsun Maze"
 mem_scfe_narrow_maze.1.desc: "As the team navigates the ruins in search of the cloud's source, they find themselves lost within a maze-like city. They report sightings of towering statues and devotional murals dedicated to a being called Nyblax, all seemingly pointing toward a place of interest."
 mem_scfe_narrow_maze.1.a: "Follow the leads!"
 mem_scfe_narrow_maze.2.name: "The Quarri Church"
 mem_scfe_narrow_maze.2.desc: "Our experts have pinpointed the site where the statues and paintings were directing them, leading to the source of the signal. At the end of the path stood a temple. Its architecture appears to date back to the civilization's renaissance era. Nyblax-shaped gargoyles adorned the structure, and as our archaeologists entered, they were met by a putrid stench and piles of decomposing bodies."
 mem_scfe_narrow_maze.2.a: "What happened?"
 mem_scfe_narrow_maze.3.name: "The Book of the Dead"
 mem_scfe_narrow_maze.3.desc: "There were no signs of struggle, disease, or battle in the temple. It was as if these people had simply... died.\n\nOne of our scientists discovered a tome on the altar. It lay open, and one of the pages contained the following passage:\n\n§B'And by doing so, thou shalt summon the Nyblax. For his needs are above ours, and our souls shall be eternal.'§!"
 mem_scfe_narrow_maze.3.a: "Continue Reading."
 mem_scfe_narrow_maze.4.name: "The Dark Ritual"
 mem_scfe_narrow_maze.4.desc: "The tome, which formed the foundation of their faith, tells the story of the Nyblax and the Runes. According to legend, the Nyblax visited the Ninsun system thousands of years ago, offering the Quarri civilization a swift path to ascension.\n\nThe ritual required a mass sacrifice around the altar, promising that through this act, the Quarri people would ascend to a higher plane of existence.\n\nThe book claims that once the ritual was complete, a Rune would be created from the soulless bodies, and the Nyblax would return to ensure their ascension had been fulfilled."
 mem_scfe_narrow_maze.4.a: "Where is the Rune?"
 mem_scfe_narrow_maze.5.name: "The Haste Rune"
 mem_scfe_narrow_maze.5.desc: "Amidst the bodies of the fallen, a strange necklace was discovered, emitting faint energy pulses.\n\nIt appears the necklace once belonged to the high priest.\n\nUpon dismantling it, our team uncovered that it had been crafted by the Nyblax to harness energy from the dead in order to create the Rune. Once the Rune was complete, the necklace would signal the Nyblax to return and claim it.\n\nRemarkably, the Rune was still inside the necklace!"
 mem_scfe_narrow_maze.5.a: "It seems we got to it first!"
# Quad
 mem_scfe_quad_init.1.name: "Arrhythmic Heartbeat"
 mem_scfe_quad_init.1.desc: "Upon entering the §HKikimora§! system, our science ship have detected a powerful heartbeat signal emanating from §HM'Cholou§!. §Y[Root.Leader.GetName]§! is keen to investigate the planet."
 mem_scfe_quad_init.1.a: "Proceed."
# Quad dig site
 mem_scfe_quad_site: "M'Cholou Digsite"
 mem_scfe_quad_relic_world_site_desc: "The plannet appears to have an arrhythmic heartbeat."
 mem_scfe_quad.1.name: "Sticky Gounds"
 mem_scfe_quad.1.desc: "After landing on the planet's surface, we discovered that the entire landscape is a living organism. It's difficult to determine the age of the organic tissue, but based on carbon dating of some dead samples, we estimate it to be over a thousand years old.\n\nAn arrhythmic heartbeat echoes across the planet, causing the ground to tremble with each pulse. The source of the heartbeat seems to be deep within a mountain near some ancient ruins. Our team proposes investigating the ruins as they make their way toward the mountain."
 mem_scfe_quad.1.a: "Go ahead."
 mem_scfe_quad.2.name: "Bone Buildings"
 mem_scfe_quad.2.desc: "As our team approached the ruins, they noticed the planet's heartbeat quickening, as if the planet itself was aware of their presence. The team reported that the structures were made of muscle, tissue, and bone - an astonishing example of organic architecture. These buildings were still alive, breathing, though no sentient life remained. The scale of the structures suggests they once housed thousands, but no other species was found.\nOur archaeologists speculate there was a mass exodus toward the mountain, where the heartbeat originates. The team pressed on.\n\nNear the summit, they discovered a tunnel of flesh, leading deep into the heart of the mountain."
 mem_scfe_quad.2.a: "Keep moving forward."
 mem_scfe_quad.5.name: "M'Cholou"
 mem_scfe_quad.5.desc: "Tentacles began to encircle the exploration team as a giant, faceless creature approached. Despite its terrifying appearance, the creature showed no signs of hostility. In fact, it has started communicating with us.\n\n§HAre you the Nyblax?§!"
 mem_scfe_quad.5.a: "Hum, no."
 mem_scfe_quad.6.desc: "§BThe creature seems disappointed after realizing your team is not the entity it was expecting.§!\n\nYes, I am disappointed...\nAnd yes, I have linked my thoughts to yours, forming a bridge between our minds so we can communicate. The connection is weaker with inferior or mechanical species like yourselves, and yet, here we are.\nHow is this possible? Well... it is thanks to the Nyblax. We were once a proud and benevolent collective known as the Morthra, but now we have merged into a single, superior being."
 mem_scfe_quad.6.a: "What is the Nyblax?"
 mem_scfe_quad.7.desc: "§BThe creature appears irritated and frustrated by your thoughts.§!\n\nThe Nyblax... It arrived on our homeworld thousands of years ago. The creature believed we were like it - unique, one of a kind. And in a way, we were... It sought our friendship and our help.\nWhether the Nyblax was honest, benevolent, malevolent, or simply lost in hopeless despair remains unclear.\nIt wanted us to create a Rune for it, and when we did, it would return to collect it.\nYes, of course we created the Rune! How else do you think we managed to merge our entire collective into this single vessel?\nThe Rune? I have it here somewhere. I've been trying to rid myself of it for a very long time, but overpowering my own gravity has proven... rather difficult."
 mem_scfe_quad.7.a: "Can we have it?"
 mem_scfe_quad.8.desc: "§BOne of the creature's tentacles extends toward your team, holding the Rune.§!\n\nPlease, take it with you... Once the Rune leaves this planet, I will finally be able to die.\n\n§BThe creature pauses, a deep melancholy in its movements.§!\n\nI have been sentient for millennia, waiting for the Nyblax to return and claim the Rune, but it never came. One can only live as long as one has a purpose, and mine has long since expired. Will you do this for me?"
 mem_scfe_quad.8.dev: "We will feast today."
 mem_scfe_quad.8.phil: "Life is a choice, we will help you."
 mem_scfe_quad.8.phob: "Help you end your horrid life? Give us the Rune!"
 mem_scfe_quad.8.spir: "Fate brought us here for a reason, its our lords will"
 mem_scfe_quad.8.mate: "Sure. Life is overrated"
 mem_scfe_quad.8.egal: "It is only fair you get to chose whether or not you live."
 mem_scfe_quad.8.auth: "Your wish is meaningless, you must serve us or die."
 mem_scfe_quad.8.mili: "We'll take the Rune and launch tactical nukes to the surface"
 mem_scfe_quad.8.paci: "We shall help you end your torment, may you rest in peace."
 mem_scfe_quad.8.mach: "Positive"
 mem_scfe_quad.8.hive: "We will take the Rune, Lady. May we meet again."
 mem_scfe_quad.8.default: "Sure."
 mem_scfe_quad.9.name: "The Regeneration Rune"
 mem_scfe_quad.9.desc: "After securing §YThe Regeneration Rune§! and beginning our ascent from the planet's surface, numerous tentacles emerged from the mountain's tunnel, reaching for our ship.\nOur captain executed evasive maneuvers, successfully navigating us into orbit. As we dodged the grmem_asping limbs and reached the stratosphere, we watched as the tentacles collapsed, lifeless."
 mem_scfe_quad.9.a: "I guess that, in the end, nobody wants to die"
# Jex
 mem_scfe_jex_init.1.name: "The Dark Sun"
 mem_scfe_jex_init.1.desc: "There appears to be a planet in the §HMireska§! system, orbiting a black hole. While unusual, what makes this even more remarkable is the presence of signs of civilization and flora on the planet. Without the energy of a star, it seems improbable that life could have thrived there."
 mem_scfe_jex_init.1.a: "Lets take a look at it"
# Jex dig site
 mem_scfe_jex_site: "Jex Digsite"
 mem_scfe_jex_relic_world_site_desc: "There are signs of civilization in the surface of §HJex§!, but, without the energy of a star, it seems improbable that life could have thrived there."
 mem_scfe_jex.1.name: "Deceitful Senses"
 mem_scfe_jex.1.desc: "Upon landing, our team was met with a surprisingly warm atmosphere. The air was thick with humidity, and the entire landscape was illuminated by a strange light coming from the direction of the black hole. Local flora were in full bloom, their flowers vibrant.\nThe absence of a sun left our scientists baffled. Unable to explain the anomaly, they proceeded toward a nearby city in search of answers."
 mem_scfe_jex.1.a: "Just go!"
 mem_scfe_jex.2.name: "The Camouflaged Lab"
 mem_scfe_jex.2.desc: "By the time they arrived, the city had vanished! In its place stood an abandoned lab, filled with research material.\nAfter deciphering the alien language, our team began sifting through the documents. They soon determined that the lab had been established by an anthropoid species with natural camouflage abilities. The research focused on creating a device using their own DNA."
 mem_scfe_jex.2.a: "Keep reading!."
 mem_scfe_jex.3.name: "The Visitor"
 mem_scfe_jex.3.desc: "According to the research notes, the anthropoids encountered a supreme being known as the Nyblax. The notes describe how the creature taught them to harness their natural abilities to create what they called a §YRune of Power§!. They allegedly succeeded and were preparing to test it at a location known as the White Spire.\nUnfortunately, most of the records detailing the creation process are too damaged to be of use, making replication impossible. Our best option is to investigate the White Spire, hoping to uncover more clues about what happened to them, their sun, and their civilization."
 mem_scfe_jex.3.a: "Go to the site!"
 mem_scfe_jex.4.name: "The White Spire"
 mem_scfe_jex.4.desc: "After exploring the planet, we located the White Spire. Like the lab, the site had long been abandoned by the anthropoids.\nA digital console that controlled and logged the White Spire's activities was still functional. We accessed the logs and discovered that the rune had worked. They called it §YThe Illusion Rune§!, and according to the records, it was used to conceal the sun, transforming it into a black hole.\nThe power of the rune was harnessed throughout their labs, cities, and the planet itself - hiding, enhancing, or even creating the paradise we now see. Fearing the Nyblax's return and any hidden motives, they relocated the Rune to a place known as the Yellow Spire."
 mem_scfe_jex.4.a: "Just get the Rune!"
 mem_scfe_jex.5.name: "The Illusion Rune"
 mem_scfe_jex.5.desc: "The Yellow Spire was nearly identical to the White Spire, with one notable difference: §HThe Illusion Rune§! was simply sitting in the main input system.\nIntrigued, our archaeologists examined the system's logs and discovered that, when their sensors detected the Nyblax approaching the planet, the anthropoids used §HThe Illusion Rune§! on their entire population.\nOur only conclusion is that, in their attempt to render themselves invisible, they literally vanished, as no further entries were found in the logs.\nThe team returned with the Rune, carrying tales of a lost species and the most beautiful planet they had ever seen."
 mem_scfe_jex.5.a: "Don't look at the past of a gifted Rune..."
# Riki
 mem_scfe_riki_init.1.name: "Diffuse Light"
 mem_scfe_riki_init.1.desc: "§Y[Root.GetName]§! has detected that at a specific position and time of day, the light from the star becomes diffused. This anomaly would have gone unnoticed had we not entered the system at precisely the right moment. The light dispersion appears to be caused by an unidentified object orbiting the planet §HDeani§!."
 mem_scfe_riki_init.1.a: "Could it be an ancient civilization?"
# Riki dig site
 mem_scfe_riki_site: "Diffuse Light"
 mem_scfe_riki_relic_world_site_desc: "The light from the star gets diffused by an unidentified object orbiting planet §HDeani§!."
 mem_scfe_riki.1.name: "The Invisible Station"
 mem_scfe_riki.1.desc: "Upon entering the orbit of §HDeani§!, one of the crew members spotted a cloud of space dust in the shape of a station. As the ship drew closer to the anomaly, it became clear that we were dealing with a cloaked orbital station."
 mem_scfe_riki.1.a: "Breach the station and investigate its purpose."
 mem_scfe_riki.2.name: "The Breach"
 mem_scfe_riki.2.desc: "After successfully breaching the docking bay, our team scouted the station. Nobody was there.\nThough the station seemed abandoned, voices echoed near the communal sector. As the team approached, they discovered the source: a looping hologram being projected."
 mem_scfe_riki.2.a: "What did it say?"
 mem_scfe_riki.3.name: "Lost in Space"
 mem_scfe_riki.3.desc: "The recording was lengthy and spoken in an alien language that required our specialists to decipher and translate. According to the speaker, the entire crew abandoned the station in search of the Nyblax but forgot their station was cloaked, leaving them unable to find their way back.\n\n§BIt's been §RSTATIC§! months since we left Arkanin station. We ran out of fuel and had to §RSTATIC§! on Deani's surface. Without a way to escape the planet's gravity, it seems unlikely we will §RLONG STATIC§!. If you see this message, please find us - we are at §RLONG STATIC§! rift valley. We successfully created §RLONG STATIC§!, which made the station invisible.§!"
 mem_scfe_riki.3.a: "We need that tech!"
 mem_scfe_riki.4.name: "The Nyblax Paintings"
 mem_scfe_riki.4.desc: "Deani's surface is inhospitable - it's no wonder the Arkanin crew's outlook was so grim. Our scanners failed to locate any structures or wreckage, so our archaeologists conducted a grid search through every valley they could find.\nFortunately, the expedition was a success: we discovered the cave where the crew spent their final days. The cave walls were adorned with ancient paintings that told the story of the Nyblax.\n\nIn the first set of paintings, the crew encounters the creature for the first time, receiving a gift. Our linguists interpret this as the gift of knowledge. The story continues with the crew using this gift on their home planet, inadvertently causing the death of most of their people.\nThe final set of paintings shows the crew lifting a glowing Rune, as though it were some kind of prize or achievement. When the disaster occurred, the life force of their people was crystallized into this Rune. According to the drawings, the Rune has the power to render objects invisible."
 mem_scfe_riki.4.a: "Probably the dumbest crew ever, now, where is the rune?"
 mem_scfe_riki.5.name: "The Invisibility Rune"
 mem_scfe_riki.5.desc: "The task proved more difficult than anticipated. We had expected the Rune to be alongside the corpses of the Arkanin crew, but one member was missing. Our sensors eventually located his body on the shore of a poisoned lake. Fortunately for us, he still had the Rune with him."
 mem_scfe_riki.5.a: "Can I see it?"
 mem_scfe_abandoned_invisible_observation_outpost: "Arkanin Research Station"
 mem_scfe_riki_observation_tooltip: "A cloaked orbital station"
 mem_scfe_riki_observation_desc: "A cloaked orbital station"

# Country Events
 mem_scfe_rune_lost: "Loss of a Power Rune"
 mem_scfe_rune_lost_desc: "Our carelessness has cost us one of the most powerful weapons in the galaxy."
 mem_scfe_nyblax_country.11.name: "Misplaced Relics"
 mem_scfe_nyblax_country.11.base: "Following the administrative upheaval caused by our vassalization, it appears that our"
 mem_scfe_nyblax_country.11.desc1: "$mem_scfe_nyblax_country.11.base$ §YRune of Power§! has vanished. We have people searching everywhere for it, but most have already given up hope of finding it."
 mem_scfe_nyblax_country.11.desc2: "$mem_scfe_nyblax_country.11.base$ §YRunes of Power§! have vanished. We have people searching everywhere for them, but most have already given up hope of finding them."
 mem_scfe_nyblax_country.11.a: "A most tragic loss"
 mem_scfe_nyblax_country.20.name: "The Mysterious Hoarder"
 mem_scfe_nyblax_country.20.desc: "A shady figure has approached our leaders with exciting news: he possesses a powerful relic known as the §YMighty Rune§! and is willing to trade it for a supply of rare spices."
 mem_scfe_nyblax_country.20.a: "An interesting development."
 mem_scfe_nyblax_country.21.name: "The One Eyed Golem"
 mem_scfe_nyblax_country.21.desc: "A strange Lithoid has approached us with an offer: if we can cure its rare condition, it will reward us with a powerful relic known as the §YHaste Rune§!."
 mem_scfe_nyblax_country.21.a: "Deal!"
 mem_scfe_nyblax_country.22.name: "Unexpected Treasure"
 mem_scfe_nyblax_country.22.desc: "A damaged alien cargo ship has arrived within our borders after an emergency jump, showing no signs of life. Upon investigation, it was found to contain an array of valuable artifacts, including a powerful relic known as the §YIllusion Rune§!."
 mem_scfe_nyblax_country.23.name: "The Vengeful Spirits"
 mem_scfe_nyblax_country.23.desc1: "Ghost-like creatures appeared in the dreams of §Y[Root.GetRulerTitle] [Root.GetRulerName]§! last night, presenting a powerful relic known as the §YArcane Rune§! on the condition that it be used against the §HNyblax§!. Upon awakening, §Y[Root.GetRulerName]§! found the rune still held in their [GetSpeciesHandNamePlural]."
 mem_scfe_nyblax_country.23.desc2: "A powerful vision interrupted §Y[Root.GetRulerTitle] [Root.GetRulerName]§!'s processes, as ghost-like figures presented a powerful relic known as the §YArcane Rune§! with the condition to use it against the §HNyblax§!. When the vision subsided, §Y[Root.GetRulerName]§! found the rune securely within their [GetSpeciesHandNamePlural]."
 mem_scfe_nyblax_country.23.a: "Spooky"
 mem_scfe_nyblax_country.24.name: "The Trickster"
 mem_scfe_nyblax_country.24.desc: "A thief was captured today after an intense pursuit, following a series of audacious thefts over recent months. His secret was finally revealed when a powerful relic known as the §YInvisibility Rune§! was found in his possession. Disturbingly, the thief vanished completely the moment the relic was taken from him."
 mem_scfe_nyblax_country.25.name: "Overgrowth"
 mem_scfe_nyblax_country.25.desc: "One of our cargo ships was destroyed from within by the sudden overgrowth of its own cargo. Amidst the wreckage, we discovered a powerful relic known as the §YRegeneration Rune§!, which had caused some seeds to grow instantly into a dense thicket of trees, tearing the ship apart."
