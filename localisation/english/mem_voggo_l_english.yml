# Voggo the Great
# By ViolentBeetle

l_english: 

 mem_voggo_site: "In the Clouds"
 mem_voggo_site_desc: "A large station is hovering in the upper atmosphere of §YVesper§!.\n\nIts exterior, though damaged and heavily weathered from the passage of time and powerful winds, still shows signs of its once luxurious design. It appears to have been abandoned long ago."

 mem_voggo.1.name: "The Antechamber"
 mem_voggo.1.desc: "Mapping out and cataloguing the luxurious interiors of the station on §YVesper§! took significant effort. The damage sustained has turned the twisting passages hazardous and the air inside has become dangerously volatile from the malfunctioning life-support systems.\n\nThe strangest thing about all this seems to be the decor. Every room contains at least one statue or a portrait of the same individual striking some kind of magnificent pose."
 mem_voggo.2.name: "Send in the Clones"
 mem_voggo.2.desc: "As archaeologists on §YVesper§! pushed into the depths of the station's interiors, they have started encountering dead bodies. Some of them were killed by gunfire, blades and blunt implements, but others seem to have perished from a life support failure.\n\nAll of the bodies appear to be genetically identical, bearing strong resemblance to the portraits aboard. However, different bodies show different levels of development and health - some were significantly disfigured compared to the others or show shrunken cranial areas.\n\n[Leader.GetName] believes that all of them are clones of the same individual replicated with different degrees of success. The most degenerated ones were probably the result of multiple generations of cloning."
 mem_voggo.3.name: "Cloning Laboratory"
 mem_voggo.3.desc: "Closer to the core of the station, [Leader.GetName] has found several rooms apparently dedicated to cloning. It seems to have been the site of a major battle, as most of the equipment is smashed or shot to pieces. Cloning vats still contain half-formed bodies, and sampling machines are badly damaged, as if someone kept smashing them to reach whoever was inside."
 mem_voggo.4.name: "The Inner Sanctum"
 mem_voggo.4.desc: "Until now, we believed the station was abandoned. We were mistaken.\n\nIn the innermost part of the station, [Leader.GetName] discovered a sealed off section shielded from the outside.\n\nInside, [Leader.GetSheHe] found a living alien in suspended animation that also shares its appearance with the portraits in the station. Judging by the lack of disfiguring genetic defects, it was likely the original template for the clones whose corpses litter that station. After being awoken, it wished to speak with us."
 mem_voggo.4.pur: "Kill it instead."
 mem_voggo.4.swarm: "Eat it instead."
 mem_voggo.5.name: "Voggo the Great"
 mem_voggo.5.desc: "§HHaving sat down on an oppulent throne, waiting for him beside the stasis chamber, he now quietly hovers slightly above eye level.§!\n\nAh, someone has come to free me from my confinement!\n\n§HHe pompously clears his throat.§!\n\nPlease, allow me to introduce myself. I am §SVoggo the Great§!, also known as The Magnificent, The Wise, The Anointed, The Reviled, The Shunned, The Betrayed and The Exiled."
 mem_voggo.5.a: "Welcome aboard."
 mem_voggo.5.b: "We'd rather not."
 mem_voggo.5.c: "Can you tell us more about yourself?"
 mem_voggo.5.c.response: "I was once the ruler of the great and bountiful §YVorkun Republic§!, do you recognize the name?\n\nNo? Thought so... Serves them right.\n\nNow that I am finally free, please allow me to offer you my services. I am the most capable administrator you'll ever come to know."
 mem_voggo.5.d: "You said, you were exiled?"
 mem_voggo.5.d.response: "Oh, this is a thrilling tale, full of intrigue, treachery and betrayal. I wrote a book about it a few decades ago, but I think I accidentally processed it through one of the food machines. Don't worry, I'll write another one. For now, allow me to give you an abridged version:\n\nThe §YVorkun Republic§! I hail from, was once a powerful empire on the galactic stage and I was its elected leader. Though my power wasn't absolute, I was gifted with talents others were not. I could see things hidden from most. People would look up to me, consulting me on matters of importance, recognizing my endless wisdom. Times were good, for a while.\n\n§HHe sighs for obvious theatrical effect.§!\n\nBut being blessed with foresight and power can be a terrible curse. While the other Vorkuns lived their lives in blissful ignorance, I anticipated a terrible calamity. I saw the writing on the wall, and it was mostly obscene doodles.\n\nI came before the Great Senate, stating that they had a choice - give me absolute power or perish. They said that I also had a choice - exile or death. They've made their choice and I've made mine. From the looks of it, I was right, and they were wrong."
 mem_voggo.5.e: "What happened on this station?"
 mem_voggo.5.e.response: "Oh, this private station of mine? It was my safe haven, my refuge. Well, it should have been, but things did not work out as intended.\n\nAfter arriving in my exile, I was fresh out of friends, allies and companions, and so I had no choice, but to make my own. And who else would qualify for that position if not someone who'd share my boundless intelligence? So I procured a few cloning machines and began my work.\n\nThe result was more flawed than I had anticipated however, as my clones were not blessed with the same level of patience and compassion as I. The lot conspired and turned against me.\n\nAs I sought refuge in my innermost sanctum, they turned on each other, each trying to clone themselves into an army to gain the upper hand. From the safety of my sanctum I continued to observe. Soon the first generation of clones was dead, but they left behind their clones.\n\nGeneration after generation, they grew more numerous yet less sane, until eventually life support failed to put up with their growing numbers. I was protected by my own personal equipment while they suffocated.\n\nIt was fun while it lasted, but I'm glad they're all dead now."
 mem_voggo.5.f: "Why were you in stasis?"
 mem_voggo.5.f.response: "§HThe exasperation in his voice is tangible as he replies...§!\n\nYou have been outside of this room. You have seen the devastation my clones left behind. Where should I have possibly gone? With the communications relay offline as well, calling for help wasn't an option either."

 mem_voggo.7.name:0 "Abandoned Station"
 mem_voggo.7.desc:0 "Upon entering the [From.GetName] system, our sensors discovered an apparently abandoned station orbiting a local gas giant. However, initial scans indicate that some of its systems may still be intact."
 mem_voggo.7.a:0 "Explore it."
 # wanna clone me?
 mem_voggo.100.name:0 "Proposal"
 mem_voggo.100.desc:0 "Voggo enters the audience chamber quite giddily.\n\n§T"I've had an idea! Try to contain your excitement. You may recall my previous cloning initiative ending in what historians insist on calling *a catastrophic collapse of reason*. An unfair description. It was, at worst, an overenthusiastic peer-review process.\n\nThe fundamental concept, however, was impeccable. The error lay in allowing imperfect copies of perfection to exist. A regrettable oversight that I have spent decades correcting - in theory.\n\nThis time will be different. Imagine it: more Voggos! One to administer your empire, another to advise it and another to represent it! Productivity would increase by at least several hundred percent! Conservatively estimated, of course..."§!"
 mem_voggo.100.a:0 "Do it!"
 mem_voggo.100.b:0 "Never!"

 # finished sitaution
 # Read the Title in Borat
 mem_voggo.110.name:0 "A Great Success"
 mem_voggo.110.desc:0 "In a festive tone Voggo addresses his audience - various government officials as well es our esteemed [root.owner.GetRulerTitle].\n\n§T"The planning phase has been concluded, resulting in resounding success! Every calculation has been verified, every single flaw from my previous endeavor has been corrected, and every safety protocol has been written and double-checked by the only individual qualified to review my work: myself. The design is as elegant as it is functional.\n\nI believe this is what lesser scientists call 'learning from experience', Which leaves us with one rather mundane obstacle.\n\nThe machine does not exist in the physical realm yet. Unfortunately blueprints do not possess the ability to assemble themselves. The alloys must be forged, the circuitry installed, and the cloning apparatus constructed. In other words, the difficult intellectual work is finished, what remains is engineering. I have every confidence that your people are capable of lifting heavy objects while I supervise."
 mem_voggo.110.a:0 "Splendid."
 mem_voggo.110.b:0 "About time."

 # recruit screen for voggo clones
 mem_voggo.115.name:0 "[lord_voggo.GetName]"
 mem_voggo.115.desc:0 "A new clone was created and is ready to serve our empire."
 mem_voggo.115.c:0 "Gilded skin, really?"
 mem_voggo.115.c.response:0 "A mere mistake turned to an oppurtinity. Am I not the most beautiful Vorkuran you have ever seen?"
 mem_voggo.115.d:0 "You look sick"
 mem_voggo.115.d.response:0 "Do you fear me? Good. As you should."
 mem_voggo.115.e:0 "So you chose your skin color?"
 mem_voggo.115.e.response:0 "Without the light of Change, the universe would stagnate and collapse. Only through this struggle, can any advancement occur."
 # maggus the red quote, slightly changed
 mem_voggo.115.f:0 "A pacifist?"
 mem_voggo.115.f.response:0 "Holding on to anger is like grasping a hot coal with the intent of throwing it at someone else; you are the one who gets burned." 
 # literal budda quote

 mem_voggo.200.name:0 "Strategic Realigment"
 mem_voggo.200.desc:0 "After several weeks of productive discussion, the Voggos unanimously found their current budget to be insultingly modest. Reaching this conclusion so quickly came as a bit of a surprise given their usual need for lengthy diplomatic back and forth between council members.\n\nThus they present a humble request for additional funding. Deliberately not worded as a demand, but a polite appeal from an 'expanding collective of unparalleled administrative talent' worthy of support."
 mem_voggo.200.a:0 "Very well."
 mem_voggo.200.b:0 "This is a bad idea."
 mem_voggo.200.c:0 "Denied."

 mem_voggo.205.name:0 "Council of Voggo"
 mem_voggo.205.desc:0 "After another long debate, lasting no less than fourteen hours, and ending with every participant declaring themselves Chair of the Council, the following conclusion was reached and forwarded as an official communiqué:\n\n§T"After extensive analysis of the empire's scientific progress, we have reached a single, unavoidable conclusion. Research funding is more than just insufficient - indeed pitifully so.\n\nStatistically speaking, there is hardly anyone as - let alone more - intelligent than a room full of Voggos. As a matter of fact it is hardly a fair comparison. Though we are certain you would have reached the same conclusion eventually, we have saved you several years of painfully agonizing thought processes."§!"
 mem_voggo.205.a:0 "Thanks?"

 mem_voggo.210.name:0 "Heated Rivalry"
 mem_voggo.210.desc:0 "Great news. It began, as all great romances do, with a heated intellectual disagreement. [mem_voggo_married_to.GetName] accused me, [mem_voggo_married.GetName], of having misunderstood a relatively simple economic projection. I responded by suggesting that [mem_voggo_married_to.GetName] possessed the analytical capabilities of a decorative plant. Matters escalated from there. We argued for six hours. Then we stopped and looked deep into each others eyes and kissed. Everything else is history."
 mem_voggo.210.a:0 "What?!"


