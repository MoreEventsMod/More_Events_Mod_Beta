# Voggo the Great
# By ViolentBeetle

l_english: 

 mem_voggo_site: "In the Clouds"
 mem_voggo_site_desc: "A large station is hovering in the upper atmosphere of §Y[From.Planet.GetName]§!. \n\nIts exterior, though weathered heavily from the passage of time and powerful winds, is unusually luxurious. The station itself seems to have been abandoned long ago."

 mem_voggo.1.name: "The Antechamber"
 mem_voggo.1.desc: "Mapping out and cataloguing the luxurious interiors of the station on §Y[From.Planet.GetName]§! took significant effort. The damage sustained has turned the twisting passages hazardous and the air inside has become dangerously volatile from the malfunctioning life-support systems. \n\nThe strangest thing about all this seems to be the decor. Every room contains at least one statue or a portrait of the same individual striking some kind of magnificent pose."
 mem_voggo.2.name: "Send in the Clones"
 mem_voggo.2.desc: "As archaeologists on §Y[From.Planet.GetName]§! pushed into the depths of the station's interiors, they have started encountering dead bodies. Some of them were killed by gunfire, blades and blunt implements, but others seem to have perished from a life support failure. \n\nAll of the bodies appear to be genetically identical, bearing strong resemblance to the portraits aboard. However, different bodies show different levels of development and health - some were significantly disfigured compared to the others or show shrunken cranial areas. \n\n[Leader.GetName] believes that all of them are clones of the same individual replicated with different degrees of success. The most degenerated ones were probably the result of multiple generations of cloning."
 mem_voggo.3.name: "Cloning Laboratory"
 mem_voggo.3.desc: "Closer to the core of the station, [Leader.GetName] has found several rooms seemingly dedicated to cloning. It seems to have been the site of a major battle, as most of the equipment is smashed or shot to pieces. Cloning vats still contain half-formed bodies, and sampling machines are badly damaged, as if someone kept smashing them to reach whoever was inside."
 mem_voggo.4.name: "The Inner Sanctum"
 mem_voggo.4.desc: "Until now, we believed the station was abandoned. We were mistaken. \n\nIn the innermost part of the station, [Leader.GetName] has discovered a sealed off section shielded from the outside. \n\nInside, [Leader.GetSheHe] has found a living alien that also shares its appearance with the portraits in the station. Judging by the lack of disfiguring genetic defects, he is likely the original template for the clones whose corpses litter that station. He wishes to speak to us."
 mem_voggo.4.pur: "Kill him instead."
 mem_voggo.4.swarm: "Eat him instead."
 mem_voggo.5.name: "Voggo the Great"
 mem_voggo.5.desc: "Ah, someone has come to free me from my confinement! \n\nPlease, allow me to introduce myself. I am §SVoggo the Great§!, also known as The Magnificent, The Wise, The Anointed, The Reviled, The Shunned, The Betrayed and The Exiled. I was once the ruler of the great and bountiful §YVorkun Nation§!, do you recognize the name?\n\nNo? Thought so... Serves them right.\n\nNow that I am finally free, please allow me to offer you my services. I am the most capable administrator you'll ever come to know."
 mem_voggo.5.a: "Very well. Welcome aboard."
 mem_voggo.5.a.tooltip: "§YVoggo the Great§! becomes our new §SGovernor§!."
 mem_voggo.5.b: "We'd rather not employ you."
 mem_voggo.5.c: "What's your story?"
 mem_voggo.5.c.responce: "Oh, this is a thrilling tale, full of intrigue, treachery and betrayal. I wrote a book about it a few decades ago, but I think I accidentally processed it through one of the food machines. Don't worry, I'll write another one. For now, I'll give you an abridged version.\n\nThe §YVorkun Nation§! I hail from was once a powerful empire on the galactic stage and I was its leader. I wasn't the only one, but I was gifted with talents others were not. I could see things hidden from most. People would look up to me and always consulted me on important matters, recognizing my endless wisdom. Times were good, for a while. \n\nBut being blessed with foresight and power can be a terrible curse. While the other Vorkuns lived their lives in happy ignorance, I anticipated a terrible calamity. I saw the writing on the wall, and it was mostly obscene doodles. \n\nI came before the Great Senate, saying that they had a choice - give me absolute power or perish. They said that I also have a choice - exile or death. They've made their choice and I've made mine. From the looks of it, I was right, and they were wrong."
 mem_voggo.5.d: "What happened on this station?"
 mem_voggo.5.d.responce: "This was my private station, my safe haven. After arriving in my exile, I was fresh out of friends, allies and companions, and I had no choice but to make my own. Who else would qualify for the position if not someone who'd share my boundless intelligence? So I've procured a few cloning machines and started the work. \n\nThe process was more flawed than I had anticipated however, as my clones were not blessed with the same level of patience and compassion as I. Many turned against me. As I sought refuge in my innermost sanctum, they turned on one another, and each tried to clone themselves into an army. Soon the first generation of clones was dead, but each left behind their own clones. Generation after generation, they grew more numerous and less sane, until life support could no longer put up with them. I was protected by my own personal equipment while they had suffocated. \n\nIt was fun, for a while. But I'm glad they all died."

