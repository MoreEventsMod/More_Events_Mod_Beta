# Voggo the Great
# By ViolentBeetle

l_english: 

 mem_voggo_site: "In the Clouds"
 mem_voggo_site_desc: "A large station is hovering in the upper atmosphere of §YVesper§!. \n\nIts exterior, though weathered heavily from the passage of time and powerful winds, is unusually luxurious. The station itself seems to have been abandoned long ago."

 mem_voggo.1.name: "The Antechamber"
 mem_voggo.1.desc: "Mapping out and cataloguing the luxurious interiors of the station on §YVesper§! took significant effort. The damage sustained has turned the twisting passages hazardous and the air inside has become dangerously volatile from the malfunctioning life-support systems. \n\nThe strangest thing about all this seems to be the decor. Every room contains at least one statue or a portrait of the same individual striking some kind of magnificent pose."
 mem_voggo.2.name: "Send in the Clones"
 mem_voggo.2.desc: "As archaeologists on §YVesper§! pushed into the depths of the station's interiors, they have started encountering dead bodies. Some of them were killed by gunfire, blades and blunt implements, but others seem to have perished from a life support failure. \n\nAll of the bodies appear to be genetically identical, bearing strong resemblance to the portraits aboard. However, different bodies show different levels of development and health - some were significantly disfigured compared to the others or show shrunken cranial areas. \n\n[Leader.GetName] believes that all of them are clones of the same individual replicated with different degrees of success. The most degenerated ones were probably the result of multiple generations of cloning."
 mem_voggo.3.name: "Cloning Laboratory"
 mem_voggo.3.desc: "Closer to the core of the station, [Leader.GetName] has found several rooms seemingly dedicated to cloning. It seems to have been the site of a major battle, as most of the equipment is smashed or shot to pieces. Cloning vats still contain half-formed bodies, and sampling machines are badly damaged, as if someone kept smashing them to reach whoever was inside."
 mem_voggo.4.name: "The Inner Sanctum"
 mem_voggo.4.desc: "Until now, we believed the station was abandoned. We were mistaken. \n\nIn the innermost part of the station, [Leader.GetName] has discovered a sealed off section shielded from the outside. \n\nInside, [Leader.GetSheHe] has found a living alien that also shares its appearance with the portraits in the station. Judging by the lack of disfiguring genetic defects, he is likely the original template for the clones whose corpses litter that station. He wishes to speak to us."
 mem_voggo.4.pur: "Kill him instead."
 mem_voggo.4.swarm: "Eat him instead."
 mem_voggo.5.name: "Voggo the Great"
 mem_voggo.5.desc: "Ah, someone has come to free me from my confinement! \n\nPlease, allow me to introduce myself. I am §SVoggo the Great§!, also known as The Magnificent, The Wise, The Anointed, The Reviled, The Shunned, The Betrayed and The Exiled. I was once the ruler of the great and bountiful §YVorkun Nation§!, do you recognize the name?\n\nNo? Thought so... Serves them right.\n\nNow that I am finally free, please allow me to offer you my services. I am the most capable administrator you'll ever come to know."
 mem_voggo.5.a: "Very well. Welcome aboard."
 mem_voggo.5.b: "We'd rather not employ you."
 mem_voggo.5.c: "What's your story?"
 mem_voggo.5.c.response: "Oh, this is a thrilling tale, full of intrigue, treachery and betrayal. I wrote a book about it a few decades ago, but I think I accidentally processed it through one of the food machines. Don't worry, I'll write another one. For now, I'll give you an abridged version.\n\nThe §YVorkun Nation§! I hail from was once a powerful empire on the galactic stage and I was its leader. I wasn't the only one, but I was gifted with talents others were not. I could see things hidden from most. People would look up to me and always consulted me on important matters, recognizing my endless wisdom. Times were good, for a while. \n\nBut being blessed with foresight and power can be a terrible curse. While the other Vorkuns lived their lives in happy ignorance, I anticipated a terrible calamity. I saw the writing on the wall, and it was mostly obscene doodles. \n\nI came before the Great Senate, saying that they had a choice - give me absolute power or perish. They said that I also have a choice - exile or death. They've made their choice and I've made mine. From the looks of it, I was right, and they were wrong."
 mem_voggo.5.d: "What happened on this station?"
 mem_voggo.5.d.response: "This was my private station, my safe haven. After arriving in my exile, I was fresh out of friends, allies and companions, and I had no choice but to make my own. Who else would qualify for the position if not someone who'd share my boundless intelligence? So I've procured a few cloning machines and started the work. \n\nThe process was more flawed than I had anticipated however, as my clones were not blessed with the same level of patience and compassion as I. Many turned against me. As I sought refuge in my innermost sanctum, they turned on one another, and each tried to clone themselves into an army. Soon the first generation of clones was dead, but each left behind their own clones. Generation after generation, they grew more numerous and less sane, until life support could no longer put up with them. I was protected by my own personal equipment while they had suffocated. \n\nIt was fun, for a while. But I'm glad they all died."

 # wanna clone me?
 mem_voggo.100.name:0 "Proposal"
 mem_voggo.100.desc:0 "I've had an idea! Try to contain your excitement. You may recall my previous cloning initiative ending in what historians insist on calling *a catastrophic collapse of reason*. An unfair description. It was, at worst, an overenthusiastic peer-review process.\n\nThe fundamental concept was impeccable. The error lay in allowing imperfect copies of perfection to exist. A regrettable oversight that I have spent decades correcting in theory.\n\nThis time will be different. Imagine it: more Voggos. One to administer your empire, another to advise it and another to represent it. Productivity would increase by at least several hundred percent. Conservatively estimated, of course."
 mem_voggo.100.a:0 "Do it"
 mem_voggo.100.b:0 "Never"

 # finished sitaution
 mem_voggo.110.name:0 "Grand Opening"
 mem_voggo.110.desc:0 "The planning phase has been completed with absolute success. Every calculation has been verified, every flaw from my previous endeavor has been corrected, and every safety protocol has been written by the only individual qualified to review my work: myself. The design is elegant. I believe this is what lesser scientists call 'learning from experience.' Which leaves us with one rather mundane obstacle.\n\nThe machine does not exist. Blueprints, however, do not possess the fortunate ability to assemble themselves. The alloys must be forged, the circuitry installed, and the cloning apparatus constructed. In other words, the difficult intellectual work is finished, what remains is engineering. I have every confidence that your people are capable of lifting heavy objects while I supervise."
 mem_voggo.110.a:0 "Splendid"
 mem_voggo.110.b:0 "About time."

 # recruit screen for voggo clones
 mem_voggo.115.name:0 "[lord_voggo.GetName]"
 mem_voggo.115.desc:0 "A new clone was created and is willing to serve our empire."
 mem_voggo.115.c:0 "Gilded skin, really?"
 mem_voggo.115.c.response:0 "golden voggo response"
 mem_voggo.115.d:0 "You look sick"
 mem_voggo.115.d.response:0 "pale response"

 mem_voggo.200.name:0 "Strategic Realigment"
 mem_voggo.200.desc:0 "After several weeks of productive discussion, the Voggos have unanimously concluded that our current budget is insultingly modest. Reaching this decision required remarkable diplomacy, as every participant was me. We therefore present a humble request for additional funding. Not a demand, but a polite appeal from an expanding collection of unparalleled administrative talent."
 mem_voggo.200.a:0 "Very well."
 mem_voggo.200.b:0 "This is a bad idea."
 mem_voggo.200.c:0 "Denied."

 mem_voggo.205.name:0 "Council of Froggos"
 mem_voggo.205.desc:0 "After another debate, which lasted fourteen hours, and ended with every participant declaring themselves Chair of the Council. After extensive analysis of the empire's scientific progress, we have reached a single, unavoidable conclusion. You are not conducting enough research. Statistically speaking, almost everyone is less intelligent than a room full of Voggos. It is hardly a fair comparison. We are certain you would have reached the same conclusion eventually. We merely saved you several years."
 mem_voggo.205.a:0 "Thanks?"

 mem_voggo.210.name:0 "Heated Rivalry"
 mem_voggo.210.desc:0 "Great news. It began, as all great romances do, with a heated intellectual disagreement. [mem_voggo_married_to.GetName] accused me, [mem_voggo_married.GetName], of having misunderstood a relatively simple economic projection. I responded by suggesting that [mem_voggo_married_to.GetName] possessed the analytical capabilities of a decorative plant. Matters escalated from there. We argued for six hours. Then we stopped and looked deep into our eyes and kissed. Everything else is history."
 mem_voggo.210.a:0 "What?"


