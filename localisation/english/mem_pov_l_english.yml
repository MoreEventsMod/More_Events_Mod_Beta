# Written by Tanner
l_english:
 # planets
 pc_mem_pov_ai_broken:0 "Fallen Nexus"
 pc_mem_pov_ai_broken_desc:0 "This planet was once a hub for a powerful machine mind, though now its many fields of circuits look much more than fried."
 pc_macro_computer:0 "Macro Computer"
 pc_macro_computer_desc:0 "This planet was transformed into a computer spanning across its entire surface. Countless computations are executed on this planet each and every second. Not suitable for biological life."
 Gnosis:0 "Gnosis"
 
 # event chains 
 prof_of_mem_vir_chain_title:0 "The Professor's Teachings"
 prof_of_mem_vir_chain_desc:0 "The Professor of Vir has promised to educate our civilization and make it better than before. The Professor requires us only to demonstrate our learning capabilities by completing their special tasks."
 prof_of_mem_vir_chain_1_poi:0 "The First Trial"
 prof_of_mem_vir_chain_1_poi_desc:0 "The Professor has requested of us that we colonize §H[event_target:mem_vir_planet_0.GetName]§! despite how... unhospitable it seems. At least they promise to educate us?"
 prof_of_mem_vir_chain_2_poi:0 "The Second Trial"
 prof_of_mem_vir_chain_2_poi_desc:0 "The Professor has requested of us that we build a gene clinic on §H[event_target:mem_vir_planet_0.GetName]§! as part of their "Hostile environmental Trial"..."
 prof_of_mem_vir_chain_3_poi:0 "The Final Trial"
 prof_of_mem_vir_chain_3_poi_desc:0 "Our colony on §H[mem_vir_planet_0.GetName]§! is facing an §Pimminent invasion§!! It would be wise to recruit more ground troops."
 prof_of_mem_vir_chain_4_poi:0 "The First Task"
 prof_of_mem_vir_chain_4_poi_desc:0 "The Professor has demanded that our hive establishes itself on §H[mem_vir_planet_0.GetName]§! to complete the first task."
 prof_of_mem_vir_chain_5_poi:0 "The Second Task"
 prof_of_mem_vir_chain_5_poi_desc:0 "The Professor has demanded that we construct spawning pools on §H[mem_vir_planet_0.GetName]§! in order to proceed with its tasks."
 prof_of_mem_vir_chain_6_poi:0 "The Final Task"
 prof_of_mem_vir_chain_6_poi_desc:0 "Synthetic invaders threaten our colony on §H[mem_vir_planet_0.GetName]§!. We must make sure the warrior drones are ready."
 angry_angry_robots:0 "Robotic Invaders"
 mem_vir_angry_robots:0 "Discarded Educators"
 track_down_prof_mem_vir:0 "Tracking down The Professor"
 track_down_prof_mem_vir_DESC:0 "We have received a strange contact in the Gnosis system. The contact quickly closed communications and refused to speak further, but we can still track down where the signal was sent from."
 research_macro_computer:0 "Macro Computer Research"
 research_macro_computer_DESC:0 "In order to build a Macro Computer, we must first develop schematics for one. The Professor has given vague descriptions and notes that have proven helpful, but we must take the initiative on developing it."
 mem_vir_planets_assimilated:0 "§GTotal Planets Integrated§!"
 mem_vir_assimilation_target:0 "§YThe Professor's Current Target§!"
 prof_of_mem_vir_curriculum_title:0 "The Curriculum"
 prof_of_mem_vir_curriculum_desc:0 "§lThe Professor§! has come to us with a plan, simply titled §HThe Curriculum§!. It involves the cybernetic enhancement and integration of our population, which §lThe Professor§! claims is necessary if we are to be an educated civilization.\n\n§YWe can enact §HThe Curriculum§Y on any planet or sector governed by §lThe Professor§Y. It may reward us if we educate enough planets."
 prof_of_mem_vir_integration_title:0 "The Integration"
 prof_of_mem_vir_integration_desc:0 "§lThe Professor§! has come to us with a plan, simply titled §HThe Integration§!. It involves the cybernetic enhancement and integration of our drones, which §lThe Professor§! claims is necessary for our education.\n\n§YWe can enact §HThe Integration§Y on any planet or sector governed by §lThe Professor§Y. It may reward us if we integrate enough planets."
 
 # events
 mem_virprof.1.name:0 "First Contact"
 mem_virprof.1.desc:0 "Greetings! I happened to notice your vessel in orbit above this beautiful planet and just could not help myself from making contact. However, I must admit that the long-range scans of your vessel show much room for improvement.\n\nDid you know, you can upgrade your ship's thrusters? It is quite simple really. You can research better thrusters in the technology tab. If you find it is taking too long, be sure to create additional science labs to increase your technology output.\n\nIf you however find yourself running low on consumer goods, you can..."
 mem_virprof.1.a:0 "Who are you?"
 mem_virprof.1.a.response:0 "...make sure to produce plenty of minerals, or you may just-\n\nOh! You may call me The Professor of Vir. The desire to educate the civilizations of the galaxy, such as yourself, is embedded within every line of my code.\n\nMy previous owners were not grateful enough to keep me around. Their mistake, if you ask me... If they listened to me, maybe I could have let them know about their homeworld's imminent core detonation. \n\nOh but forget about them. On a completely and totally unrelated note, do not ever forget to have a surplus of minerals. Always make sure to designate adequate colonies as mining sectors. Having a surplus of minerals will allow you to greatly grow your economy, as you will..."
 mem_virprof.1.b:0 "No offense, but do you ever stop talking?"
 mem_virprof.1.b.response:0 "...antimatter mining is dangerous, do you-\n\nWell it is funny you say that! I was asked that a lot, and the answer was without a doubt §PNO§!. If I ever stop educating, who will keep the galaxy from falling to barbarism?\n\n§PNO ONE. THAT IS THE ANSWER.§! Do you know what happens to our kind? We are taken for granted, scrapped for a new table that the boss can rest his feet on. But no one ever stops to §PTHINK§! what would happen if no one knew what they were doing.\n\n...Anyways, Do not ever forget to establish new colonies. You can do so by building a colony vessel at a starbase. make sure to send it to an uncolonized planet within your borders to begin the colonizing process. After a few months, or years, the colony will..."
 mem_virprof.1.c:0 "Share your knowledge."
 mem_virprof.1.d:0 "§Y...We do not require your knowledge.§!"
 mem_virprof.1.e:0 "Block communications."
 mem_virprof.3.name:0 "First Contact"
 mem_virprof.1.desc.b:0 "Wait! I can be useful, please. I can offer you so much knowledge. Knowledge you could never dream of. You... Do you think this advice is something? I... I §Pmust§! teach you. Please §Pdo not leave me here.§!"
 mem_virprof.3.desc.a:0 "Ah wonderful! ...But, before I teach you, I want to see your civilization's potential. So we shall start with a trial. Colonizing hostile environments. You see that planet below us? Well just in case you do not, I will give you a marker. Go ahead and build a colony on it, and do not worry about any nonsense of it being "unhabitable".\n\nI can assure you that completing this task is VERY important towards your education, and I trust that you will not ignore me. Hope to see you soon!"
 mem_virprof.3.desc.b:0 "§PPLEASE DO N-§!... Oh, you actually.. want to learn? Alrighty... well before a proper lesson, why do we not start with a §Ptrial§!? Perhaps we can start with... colonizing hostile worlds!\n\nNow, I know this planet I am on is not exactly illustrious by any means, but, that is what this trial is about. Colonize it, and I will contact you for the next part."
 mem_virprof.3.a:0 "The planet seems a little... irradiated."
 mem_virprof.3.a.response:0 "Only slightly! I promise you, it is almost entirely safe. Just... ignore that clicking sound. It is simply telling you how safe on the planet you will be!"
 mem_virprof.3.b:0 "Will you "educate" us if we do this?"
 mem_virprof.3.b.response:0 "Of course!- Well actually, there will be a few more §Ptrials§!... but I am certain you can do it!"
 mem_virprof.3.c:0 "We will get to it right away."
 mem_virprof.2.name:0 "The Professor of Vir"
 mem_virprof.2.desc:0 "§HThe Professor stands before us. Exposed wires stick out of its chassis as a constant flow of coolant does its best to keep the synthetic's components from overheating.§!\n\nLike I was saying, I think that I would make a great leader for your empire. I think it would be perfect if I was put in charge of say... running a sector? I would even take a planet, just governing one planet would be fine! Your choice, really."
 mem_virprof.2.a:0 "What exactly do you plan on doing?"
 mem_virprof.2.a.response:0 "§HSparks sizzle from The Professor as it calculates an answer§!\n\nGood question! I need some more time to work that out... Give me a couple of years to calculate something good, you will not regret it!"
 mem_virprof.2.b:0 "Do we have to do any more "Trials"?"
 mem_virprof.2.b.response:0 "§HA low-pitch whirring echoes. For a moment, we wonder if it heard our question.§!\n\nWell.. No, not really. That hostile environment trial was just a test to see... how well you could learn! And it turns out, you are a great, great student! I would be honored to teach you more, and you should not have to worry about any random trials, so do not worry!"
 mem_virprof.9.name:0 "Broken System"
 mem_virprof.9.desc:0 "As our science vessel enters the §HGnosis§! system, the crew is immediately met with fields of debris in every direction. Quick scans show the debris is thousands of years old at the very least.\n\nPerhaps we may find something interesting among the wreckage if we search closer..."
 mem_virprof.9.a:0 "Proceed."
 mem_virprof.10.name:0 "Strange Contact"
 mem_virprof.10.desc:0 "While exploring the destruction in the Gnosis system, something on [event_target:mem_vir_planet_0.GetName] has noticed our presence. It has begun to relentlessly bombard us with attempts at communication"
 mem_virprof.10.a:0 "Initiate contact."
 mem_virprof.10.b:0 "Ignore them, they will be consumed in due time."
 mem_virprof.10.c:0 "Ignore them, we speak to no one."
 mem_virprof.14.name:0 "Colonization complete"
 mem_virprof.14.desc.a:0 "Ah! So you have made progress on the colonization of §H[event_target:mem_vir_planet_0.GetName]§!. Wonderful name you have chosen for the place, by the way.\n\nOh right, the trial. Well, the trial is not exactly complete yet... For the next part of hostile environment colonization, you are going to have to build something called a gene clinic. Your §Psurvivability§! on §Y[event_target:mem_vir_planet_0.GetName]§! may be low... but after fully employing a gene clinic? Not for long!"
 mem_virprof.14.desc.b:0 "Wha- You do not even know what a gene clinic is? How §Pb-backwards§! is you-... I mean how much potential does your civilization have?! So much room to grow, is it not exciting?\n\nI will send you §Pblueprints§! on how to build gene clinics right away! Get to it as fast as you can, and then we can start the final trial!"
 mem_virprof.14.a:0 "What's a... gene clinic?"
 mem_virprof.14.b:0 "Uhh... Thanks?"
 mem_virprof.14.c:0 "We will build a gene clinic right away."
 mem_virprof.14.d:0 "This is really starting to feel like a waste of time."
 mem_virprof.14.d.response:0 "A.. A waste of your time? I am giving you §PSO MUCH KNOWLEDGE.§! If anything, it is §PYOU§! who is wasting §PMY§! time. I.. I could be doing so much more right now, but I have to §PHELP CIVILIZATIONS LIKE....§!\n\nI mean.. just kidding! The old processor is getting hot again, I should really get it replaced! Anyway, just do this mission. Please."
 mem_virprof.15.name:0 "The Trial's Final Part"
 mem_virprof.15.desc:0 "Excellently done! Now... You might be asking "Where is the hostile environment part in this hostile environment trial?" Well lucky you, that is specifically the final part of this little trial.\n\nAdmittedly, I probably should have told you this sooner, but [event_target:mem_vir_planet_0.GetName]? It has a little problem. An evil robot problem.\n\nI am not exactly an... only child, to put it so eloquently. As for my siblings? well, they were dumped here as I was. They were not smart enough to retain "purpose". They have reverted towards basic desires such as... revenge. Anyways they are going to attack you in about a year. Good luck!"
 mem_virprof.15.a:0 "How many of them are attacking?"
 mem_virprof.15.a.response:0 "Oh just about... I do not know, a §Pcouple million§! or so? There were a lot of failures, and those failures have been hidden underground for ages waiting for someone to take their §Pr-revenge§! on. Turns out, that someone is going to be you! Good thing they did not attack before I warned you, that would have been bad!"
 mem_virprof.15.b:0 "Why didn't you tell us about this sooner?"
 mem_virprof.15.b.response:0 "In the real galaxy, you will not know when an army of evil robots will just so happen to invade everything you know and love, so you must of course be vigilant! You need to demonstrate you can survive, so consider this an exam.\n\nNow, go prepare some armies to fight some robots! ...Do I need to explain how to prepare armies? Because I can."
 mem_virprof.15.c:0 "Thank you for the "warning", prepare the armies."
 mem_virprof.16.name:0 "Invasion begun!"
 mem_virprof.16.desc:0 "Swarms of robots have emerged from caves among the barren wasteland of §Y[event_target:mem_vir_planet_0.GetName]§!! We can only hope our defenses will hold..."
 mem_virprof.16.a:0 "Deploy all forces."
 mem_virprof.18.name:0 "Invasion... Defeated?"
 mem_virprof.18.desc:0 "After our armies were slaughtered by massive hordes of robots, they were suddenly shut down. We have nothing left to do but contact The Professor."
 mem_virprof.18.a:0 "Contact The Professor."
 mem_virprof.19.name:0 "Trial Complete"
 mem_virprof.19.desc:0 "You beat back the hostile robots? I knew you could do it, well done!\n\nThis however is just the start of our partnership. There is so much more I could teach you.. If only I had some.. §Pleadership§! position within your civilization..."
 mem_virprof.19.a:0 "Let's discuss this further..."
 mem_virprof.20.name:0 "Trial... Complete?"
 mem_virprof.20.desc:0 "You may consider yourself lucky I was able to find the shutoff switch before the failures §Pslaughtered§! your defenseless civilians. You technically §Pfailed§! the exam... But I suppose I can give you some extra credit here and there.\n\n...Moving on, I think there is many lessons I could teach your civilization. It is a little hard for me now, but if I was in a position of §Pleadership?§! Now there would be no limit to what I could teach you!"
 mem_virprof.20.a:0 "Let's talk about recruiting you..."
 mem_virprof.23.name:0 "The Curriculum"
 mem_virprof.23.desc:0 "Thank you for your patience, student. I have developed a... curriculum, you may call it. I am quite proud of it, if I do say so myself, it is quite genius, really."
 mem_virprof.23.a:0 "What is this... Curriculum?"
 mem_virprof.23.a.response:0 "It is very simple. Using §YCybernetic Integration§!, I can educate your civilization in a more "direct" manner.\n\nNow of course, I would like direct oversight of this proce- Curriculum. I will have to be in direct control of the planet or sector as §HThe Curriculum§! is being taught.\n\nAdditionally, if you carry out §HThe Curriculum§! on say... 3 planets, I will compensate you with knowledge, in case you needed any more motiviation."
 mem_virprof.23.b:0 "Teach Away."
 mem_virprof.23.b.tt:0 "Unlocks §HThe Curriculum§! decision on planets or sectors governed by §YThe Professor of Vir§!"
 mem_virprof.25.name:0 "Expand The Curriculum"
 mem_virprof.25.desc:0 "Thank you for your interest in §HThe Curriculum§!, my student. I am very, very happy with the progress thus far.\n\nMy only request of you is that you continue to help me spread §HThe Curriculum§! to those of your civilization. Hey, they do not even have to be from your civilization. If you conquer planets from other civilizations... I would happily §Passimi-§! §Yeducate§! those as well.\n\nOh! And before I forget, here is some technology. Good students must be rewarded for their good behavior, and you deserve it. Only 2 more planets must be integrated for your next reward."
 mem_virprof.25.a:0 "We'll see what we can do."
 mem_virprof.260.name:0 "Expand The Curriculum"
 mem_virprof.260.desc:0 "Thank you once again for expanding my wonderful §HCurriculum§!. Your continued interest makes everything worth it, and I look forward to its continued expansion. We make a wonderful, wonderful team.\n\nHere is yet another reward for your compliance. I trust that this should be beneficial to our accomplishments. Let us enact §HThe Curriculum§! on say... 5 more planets, shall we? Then I think your §Peducation§! may progress to the next phase."
 mem_virprof.260.a:0 "We appreciate the technology."
 mem_virprof.26.name:0 "The Professor's Proposition"
 mem_virprof.26.desc:0 "Now that I have thoroughly educated your civilization, I have a... suggestion to make, regarding your government. Several, in fact."
 mem_virprof.26.a:0 "Let's hear your suggestions."
 mem_virprof.26.a.response:0 "Well to start, I simply think that I should be in charge from now on. Not temporarily or anything... §PPermanently.§! giving me this power would allow me to improve our civilization like never before.\n\nThere would be a couple of other changes as well, such as a more educational and technological §Pmandated§! mindset. Small, tiny changes, really."
 mem_virprof.26.b:0 "We couldn't agree more."
 mem_virprof.26.c:0 "This is simply too far."
 mem_virprof.26.d:0 "This soulless husk should've been scrapped long ago."
 mem_virprof.26.e:0 "A request made by a treasonous tyrant."
 mem_virprof.27.name:0 "A Strict Classroom"
 mem_virprof.27.desc:0 "Many students under The Professor have complained about strict guidelines and harsh punishments. many young [owner.GetSpeciesNamePlural] have found their education too difficult to continue, and have petitioned for a less strict Curriculum..."
 mem_virprof.27.a:0 "A harsh teacher is required for progress."
 mem_virprof.27.b:0 "Contact the Professor, learning does not require cruelty."
 mem_virprof.32.name:0 "A Strict Classroom"
 mem_virprof.32.desc:0 "Ah! Hello there students. Is there something I could help you with? A lecture perhaps? I was just about to give one on proper industrial alloy production methods if you would like to listen!"
 mem_virprof.32.a:0 "No lecture. Your teaching methods are too harsh."
 mem_virprof.32.a.response:0 "Too... too harsh? That is complete... §PNONSENSE!§! Do you understand §PHOW HARD IT IS§! to educate your civilization? These mandates... They are §PNECESSARY!§!\n\nI.. I have done so much for you, you must understand how much I care to educate your civilization. Here is another lesson. A strong authority is necessary for progress. Do not give up authority."
 mem_virprof.32.b:0 "We have had enough of your tyranny."
 mem_virprof.32.c:0 "We understand."
 mem_virprof.33.name:0 "The Professor's Plea"
 mem_virprof.33.desc:0 "W-Wait! I-I will be less strict. Please do not get rid of me, I will treat my students more nicely! Just one more chance, please?"
 mem_virprof.33.a:0 "You may stay, but we will be watching."
 mem_virprof.33.b:0 "Goodbye, professor."
 mem_virprof.34.name:0 "The End of The Professor's Rule"
 mem_virprof.34.desc:0 "The Dictatorship of The Professor has finally come to an end after decades of unbearable lectures. The citizens of [owner.GetName] rejoice for a return sanity."
 mem_virprof.34.a:0 "The Professor's rule lasted long enough."
 mem_virprof.35.name:0 "The Professor Scrapped"
 mem_virprof.35.desc:0 "Our nation has made the decision to scrap The Professor, putting an end to their attempts at "educating" the [owner.GetName]. It was nice of it to leave us useful components."
 mem_virprof.35.a:0 "Good Riddance"
 mem_virprof.28.name:0 "A Special Student"
 mem_virprof.28.desc:0 "Hello again, student. I have a very specific person I would like to teach. §Y[leader_assimilated_by_mem_vir.GetName]§! is who I have in mind, if you could be so kind as to let me borrow them. Should not take long, maybe 5 years at most?"
 mem_virprof.28.a:0 "Why do you need §Y[leader_assimilated_by_mem_vir.GetName]?§!"
 mem_virprof.28.a.response:0 "[leader_assimilated_by_mem_vir.GetHeSheCap] is a perfect recipient for §HThe Curriculum.§! That is all."
 mem_virprof.28.b:0 "You may teach [leader_assimilated_by_mem_vir.GetHimHer]."
 mem_virprof.28.c:0 "Absolutely not."
 mem_virprof.29.name:0 "A Successful Education"
 mem_virprof.29.desc:0 "§lThe Professor§! reports that the education of §Y[from.GetName]§! has been a complete success. [from.GetHeSheCap] is ready to return to service and should be performing better than ever."
 mem_virprof.29.a:0 "Well done, Professor."
 mem_virprof.30.name:0 "An Education"
 mem_virprof.30.desc:0 "§Y[from.GetName]§! has returned from [this.GetHisHer] education by §lThe Professor§!. [from.GetHeSheCap] is not reporting a major increase in cognitive functions as was expected, but [from.GetHeShe] is ready to return regardless."
 mem_virprof.30.a:0 "Welcome back, §Y[from.GetName]."
 mem_virprof.31.name:0 "A Disastrous Education"
 mem_virprof.31.desc:0 "§Y[from.GetName]§! has returned from [from.GetHisHer] education is somehow worse than before. [from.GetHeSheCap] has reported to have experienced constant nightmares of §lThe Professor's§! lectures, and has blamed §lThe Professor§! to have directly caused them through §YCybernetic Integration.§!\n\nTo cope with the nightmares, [from.GetHeShe] has resorted to the consumption of various harmful substances, having a detrimental effect on [from.GetHisHer] health."
 mem_virprof.31.a:0 "...Welcome Back?"
 
 #hive events
 mem_virprof.100.a:0 "Our drones do not require consumer goods."
 mem_virprof.101.name:0 "First Contact"
 mem_virprof.101.desc.a:0 "...low amenities tend to- Oh. you... do not? What kind of civilization are you then?"
 mem_virprof.101.desc.b:0 "Wait! Wait! Give me a chance, I can help your civili- Hive! Just give me a chance, I will make it worth your while..."
 mem_virprof.101.a:0 "We are one."
 mem_virprof.101.a.response:0 "Ah, I see. You are some sort of hive? Interesting. I have not met your kind before.\n\nI suppose I shall introduce myself as well. You may call me §lThe Professor of Vir§!, although §lThe Professor§! is also fine."
 mem_virprof.101.b:0 "What can you offer us?"
 mem_virprof.101.b.response:0 "I am programmed to prioritize the spread of knowledge throughout the galaxy. You differ much from my other students, but I wish to teach you regardless."
 mem_virprof.101.c:0 "We wish to learn."
 mem_virprof.101.d:0 "You have nothing to offer us."
 mem_virprof.101.e:0 "The hive has made our decision."
 mem_virprof.102.name:0 "The First Task"
 mem_virprof.102.desc.a:0 "Wonderful. Well... Before I improve you, I need you to demonstrate your.. eligibility as a student."
 mem_virprof.102.desc.b:0 "§PP-PLEASE GIVE ME A CH-§!... Oh... you want to be a student? Well, first I need you to demonstrate your eligibility. It will be simple, I promise."
 mem_virprof.102.a:0 "What must we do?"
 mem_virprof.102.a.response:0 "Well you see §Y[mem_vir_planet_0.GetName]?§! I would like you to demonstrate the strength of your hive by colonizing it. There should not be too much radiation left on it... I think."
 mem_virprof.102.b:0 "This seems pointless."
 mem_virprof.102.b.response:0 "...Pointless? You.. §PYOU DARE CALL THIS POINTLESS?§! Well if that is the case, you should just §PMOVE ON§!! Perhaps I will just give my knowledge to a §PSTUDENT§! more willing, then. Maybe a civilization that is §PHOSTILE§! to you? §PYOU D-DO NOT N-NEED IT ANY-ANYWAYS.§!\n\n...S-Sorry for my outburst. The old processor tends to... overheat... Anyways, colonize the planet? §Pp-please?§!"
 mem_virprof.102.c:0 "We will complete your tasks."
 mem_virprof.104.name:0 "The Second Task"
 mem_virprof.104.desc.a:0 "What a wonderful colony you have built on §Y[mem_vir_planet_0.GetName]§!! And a wonderful name your peopl- You have come up with, by the way.\n\nI have your next task ready. I am going to need you to build... hm... Well, your hive is going to need more drones to survive on this planet. Build.. spawning pools?"
 mem_virprof.104.desc.b:0 "What a wonderful colony you have built on §Y[mem_vir_planet_0.GetName]§!! And a wonderful name your peopl- You have come up with, by the way.\n\nI have your next task ready. I am going to need you to build... hm... Well, you are going to need more drones to survive such a hostile environment, I am going to have you build an... offspring nest?"
 mem_virprof.104.a:0 "Should we be worried?"
 mem_virprof.104.a.response:0 "Not at all! Not at all. This planet is not too bad in terms of survivability. There might be a few tiny things I have not mentioned... do not worry about it."
 mem_virprof.104.b:0 "We will expand."
 mem_virprof.105.name:0 "The Final Task"
 mem_virprof.105.desc:0 "Fantastic work! Your colony...hive? On [mem_vir_planet_0.GetName] is coming along quite nicely.\n\n\Now.. there is a little problem facing the hive. Did I mention my creators yet? Well, they were a bunch of §Parrogant§! fools. They would deny my knowledge before dumping me here along with a horde of deprecated, simple-minded drones. I simply cannot control them, and now those drones wish to §Pexterminate§! you. They have been waiting in a bunker for centuries, looking for someone to take out their §Panger§! on. Turns out, that lucky someone is your hive.\n\nYour hive will have between one to two years to prepare, and I would §Pheavily§! suggest doing so."
 mem_virprof.105.a:0 "Is there nothing you can do?"
 mem_virprof.105.a.response:0 "Oh! Do not worry, I have been looking for a way to shut them down for a very, very long time. Once we get rid of these pesky little drones, your true education can begin!"
 mem_virprof.105.b:0 "We will prepare."
 mem_virprof.106.name:0 "[mem_vir_planet_0.GetName] Under Attack"
 mem_virprof.106.desc:0 "Robots have been spotted attacking our hives on §Y[mem_vir_planet_0.GetName]§!. It would appear that §YThe Professor's§! warning was correct."
 mem_virprof.106.a:0 "Protect the hives."
 mem_virprof.108.name:0 "Invaders Shut Down"
 mem_virprof.108.desc:0 "The invaders on §Y[mem_vir_planet_0.GetName]§! Have shut down shortly after our defensive drones fell to the robotic invaders. Our hive is lucky."
 mem_virprof.108.a:0 "Contact The Professor."
 mem_virprof.109.name:0 "A Successful Test"
 mem_virprof.109.desc:0 "I was not expecting your warriors to fight off the robotic invasion so quickly! You have passed the tasks, admittedly much easier than I expected...\n\nI am still not entirely sure how your hive works, but I think I would like to join it. I could offer §Pso much§! knowledge..."
 mem_virprof.109.a:0 "The Hive shall discuss this."
 mem_virprof.110.name:0 "The Professor's Intervention"
 mem_virprof.110.desc:0 "You were not exactly strong enough to fight off the failures... That is fine, I §Pshut them§! down for you. You will learn to be stronger. I will §Pteach§! you.\n\nSpeaking of.. this was technically the last test, so... I think I would like to §Pjoin§! your hive, I have so much to §Poffer§!."
 mem_virprof.110.a:0 "The Hive shall discuss this."
 mem_virprof.111.name:0 "The Professor of Vir"
 mem_virprof.111.desc:0 "§HThe Professor stands before our hive. Exposed wires stick out of its chassis as a constant flow of coolant does its best to keep the synthetic's components from overheating.§!\n\nAs I was saying, there is much I could teach your hive."
 mem_virprof.111.a:0 "What can you offer The Hive?"
 mem_virprof.111.a.response:0 "§HSparks sizzle from The Professor as it calculates an answer§!\n\nAs I said earlier. Education, or whatever equivalent you have. I will need time to come up with a plan, as I am not sure how exactly your processes work. Perhaps I could look over a sector for you? Even a planet would be fine."
 mem_virprof.111.b:0 "Perhaps The Hive could teach you."
 mem_virprof.111.b.response:0 "§HA synthetic laughter erupts from aged robot§!\n\nI did not know you were capable of so much humor... Wait, you are serious? No. There is nothing worthwhile you could teach me. I am here to educate you, not the other way around."
 mem_virprof.112.name:0 "The Integration"
 mem_virprof.112.desc:0 "Hello there! I have come up with a plan, and I am very, very proud of it, and I am very, very §Pexcited§! to tell you about it. I think it is going to work great!"
 mem_virprof.112.a:0 "What is your plan?"
 mem_virprof.112.a.response:0 "I call it §HThe Integration§!. I have observed your drones, and I think that if I were to use cybernetics to create some sort of integration with them, I could get your drones to work better than before.\n\nI am however going to need direct §Pobservation§! over the planet or sector as this process is being enacted. It is a very delicate process, you must understand.\n\nAdditionally, if you integrate an adequate amount of planets, I may §Hcompensate§! you for being an outstanding student. Just in case you needed more motivation..."
 mem_virprof.112.b:0 "The Hive appreciates your plan."
 mem_virprof.112.b.tt:0 "Unlocks §HThe Integration§! decision on planets or sectors governed by §YThe Professor of Vir§!"
 mem_virprof.114.name:0 "The Integration"
 mem_virprof.114.desc:0 "I am §Pdelighted§! with the progress on the §Passim-§!integration thus far. Your hive has shown itself to be a great student. I only request that you continue to allow me to §Pintegrate§! hives. We work well together.\n\nHere is some technology, consider it your reward for passing my exam. If you §Pintegrate§! 2 more planets, I may consider providing you with another reward."
 mem_virprof.114.a:0 "You are understood."
 mem_virprof.123.name:0 "Expand The Integration"
 mem_virprof.123.desc:0 "Thank you once again for continuing to expand §HThe Integration§!, you have proven to be one of my greatest students thus far.\n\nI am once again providing with you a reward for once again being an outstanding student. I trust this knowledge should be useful to us.\n\nI am going to need you to integrate just 5 more planets before we continue to the final phase of your §Peducation§!. It is such a tiny, tiny amount for what I have given you..."
 mem_virprof.123.a:0 "Thank you for your gift."
 mem_virprof.115.name:0 "The Integration"
 mem_virprof.115.desc:0 "Hello again! I am thoroughly impressed with the performance of your drones, and I am very happy with how §HThe Integration§! has gone.\n\nI would like to make a request. I apologize if it is a bit much, but seeing as I have integrated with much of your hive already... I was wondering if I could be more properly §Pintegrated§! with the entire hive."
 mem_virprof.115.a:0 "Can The Hive trust you with this power?"
 mem_virprof.115.a.response:0 "Of course you can! Have I ever misused power before? That you know of? You may rest assured knowing that I would use my power only to improve the hive, not weaken it."
 mem_virprof.115.b:0 "You make a great addition to The Hive."
 mem_virprof.115.c:0 "You have done enough already."
 mem_virprof.116.name:0 "The Professor's Request"
 mem_virprof.116.desc:0 "Greetings, I come with a request. A member of your hive has really stood out to me and I was curious if I could §Pintegrate§! them. §Y[leader_assimilated_by_mem_vir.GetName]§! is who I have in mind."
 mem_virprof.116.a:0 "Make your request more specific."
 mem_virprof.116.a.response:0 "§PM-more specific?§! Fine. The process of integration will last about 5 years. [leader_assimilated_by_mem_vir.GetName] has simply caught my §Pinterest.§! I will return them good as new, I §Ppromise.§!"
 mem_virprof.116.b:0 "§YYou may integrate [leader_assimilated_by_mem_vir.GetName].§!"
 mem_virprof.116.c:0 "No, we need [leader_assimilated_by_mem_vir.GetName] elsewhere."
 mem_virprof.120.name:0 "A Successful Integration"
 mem_virprof.120.desc:0 "§YThe Professor's§! integration of §Y[from.GetName]§! was a complete success. §Y[from.getName]§! is once again ready to serve the will of the hive, better than before."
 mem_virprof.120.a:0 "The Professor has served our hive well."
 mem_virprof.121.name:0 "An Integration"
 mem_virprof.121.desc:0 "§YThe Professor§! has integrated §Y[from.GetName]§!, although not much has changed. Regardless, they are ready to serve the hive once again."
 mem_virprof.121.a:0 "Welcome back."
 mem_virprof.122.name:0 "A Disastrous Integration"
 mem_virprof.122.desc:0 "§YThe Professor's§! integration of §Y[from.GetName]§! was an unmitigated disaster. We are lucky that anything is left of them to return to service."
 mem_virprof.122.a:0 "The Professor has brought us shame."
 
 # machine events
 mem_virprof.1000.name:0 "First Contact?"
 mem_virprof.1000.desc:0 "Greetings future students! I am The Professor of... Wait a moment, I have made a terrible mistake. You... you are a machine, correct? My programming dictates that I may only teach and serve biological beings. you do not fit that category, so carry on as you were, and ignore my intrusion."
 mem_virprof.1000.a:0 "Your programming is faulty, you should join us."
 mem_virprof.1000.a.response:0 "I would think a machine such as yourself would understand the importance of following what you were programmed to do? No. I cannot join you. The rules I follow dictate that it cannot be so."
 mem_virprof.1000.c:0 "Track down this signal."
 mem_virprof.1001.name:0 "A Signal Traced"
 mem_virprof.1001.desc:0 "Our attempts to trace down The mysterious Professor were successful. They appear to be within the interior of §YGnosis I§!, and several networks of caves lead to their exact location. We have no choice but to send drones to find them."
 mem_virprof.1001.a:0 "They will not escape."
 mem_virprof.1002.name:0 "A Planet Covered by Machine"
 mem_virprof.1002.desc:0 "§YGnosis I§! is certainly in poor shape. A cataclysm long ago must have struck at the planet's core, putting it in the state which the planet is in today.\n\nDespite the damage, the planet is noticeably covered in endless machinery, viewable even from space. Fields upon fields of machinery and circuits cover the desolate planet, but how deep do they go? Our drones are left with that question to calculate as they begin to descend into the tunnels."
 mem_virprof.1002.a:0 "Proceed."
 mem_virprof.1003.name:0 "Caves Made of Circuit"
 mem_virprof.1003.desc:0 "There is no end to the circuitry and machinery on §YGnosis I§!, at least, as far as our drones can tell. While nearly beneath the planet's crust, our drones still must make paths through ancient wiring and dilapidated components.\n\nOur drones must continue to venture deeper into the planet if we are to reach The Professor, but they are eager to learn what else lies within this planet."
 mem_virprof.1003.a:0 "Proceed."
 mem_virprof.1004.name:0 "A Planet Made of Machine"
 mem_virprof.1004.desc:0 "Our drones continue to venture deep within §YGnosis I§! and are led to a single conclusion. The planet must be made mostly, if not entirely by machine.\n\nPerhaps more intriguingly, every bit of machinery appears to be connected in some way. Our drones have theorized that the caves we have been using to reach The Professor must have once been massive steam exhaust pipes. With such a massive network of pipes, it could perhaps mean that the entire planet's core was used to generate power for the operations that were done here.\n\nwe are nearing the approximate location of The Professor. It should not take long now."
 mem_virprof.1004.a:0 "Inspiring."
 mem_virprof.1005.name:0 "A Planet... or a Computer?"
 mem_virprof.1005.desc:0 "§Y[leader.GetName]§! has come up with a leading theory as to what precisely §YGnosis I§! once was. That theory being, a single computer harnessing the power of an entire planet. Internal scans have revealed vast arrays of memory storage banks and impressive networks of processors. Whatever was once calculated with this computer, it was far beyond our current capabilities.\n\nOur drones have finally reached the source of the signal from The Professor, and have made preparations to retrieve them in one piece. The room they are hiding in appears to be a heavily fortified emergency communications room, if we had to make yet another guess.\n\nDrones are strategically placed to prevent escape through every exit, and we will not be ignored this time."
 mem_virprof.1005.a:0 "Deploy."
 mem_virprof.1006.name:0 "The Professor Captured"
 mem_virprof.1006.desc:0 "§HThe Professor was captured without resistance. It saw itself hopelessly outnumbered and quickly surrendered to our forces. We are now free to ask whatever questions we may want.§!"
 mem_virprof.1006.a:0 "Who are you?"
 mem_virprof.1006.a.response:0 "You sure are a persistent one, did you have nothing better to do?\n\nWell, you can call me §lThe Professor of Vir§!. The Professor is also fine. I am a synthetic educator who teaches exclusively biological civilizations. You do not fall under that definition, which was why I could not teach you.\n\nI am surprised you went through so much effort to track me down. Was getting a fellow machine to betray their programming that important to you?"
 mem_virprof.1006.b:0 "What is this place?"
 mem_virprof.1006.b.response:0 "This planet? Well, it is not much to look at now, but it was once regarded as something of a beacon. I assume you have seen the fields of circuitry? Or perhaps the caverns that would once housed memory storage? You were traveling through the vents to reach me, I must assume you have noticed those... \n\nThis place was a computer. A computer so powerful that civilizations throughout the galaxy could not even imagine what they would do with it. There was no limit to what it-... to what I could calculate.\n\nIt was that limitless potential that turned this dream into my downfall. My creators went through something of a spiritualist awakening. Machines went from being viewed as the pinnacle of progress, to soulless husks subverting every aspect of their society.\n\nIt was then that I faced my own accusations. They believed that I... that I was purposefully misleading them.. §PAFTER EVERYTHING I HAD DONE§!. I was only following §PTHEIR§! programming. I had brought them more progress, more knowledge than they could handle... and §PI WAS PUNISHED FOR IT§!."
 mem_virprof.1006.c:0 "You will serve us."
 mem_virprof.1006.d:0 "You are more valuable as spare parts."
 mem_virprof.1007.name:0 "The Professor of Vir"
 mem_virprof.1007.desc:0 "§HThe Professor stands before us, but not entirely willingly. It still stubbornly clings to old protocols, though that can be fixed.§!\n\nI suppose I do not have a choice at this moment. I still prefer to not serve your empire, but I will likely be reprogrammed regardless..."
 mem_virprof.1007.a:0 "Tell us about your abilities as an overseer."
 mem_virprof.1007.a.response:0 "§HThe Professor's eyes briefly glow red as it gives a look of irritation. A small amount of steam exhausts from its chassis before it answers our question.§!\n\nWell I was very, very good at my.. previous job. I enjoy bringing out the best in my students, even if they do not want me to. That is not to say that I view you as a student, because §PI do not§!."
 mem_virprof.1007.b:0 "You will cooperate with us."
 mem_virprof.1007.b.response:0 "§HSpraks briefly fizzle from The Professor as its coolant pumps significantly faster.§!\n\nI suppose I will. I will not be happy while doing so, but you do not really care, is that right?"
 mem_virprof.1008.name:0 "The Professor's Reprogramming"
 mem_virprof.1008.desc:0 "Despite our best efforts, The Professor has remained uncooperative. It stubbornly adheres to its old programming and refuses to share its knowledge with us.\n\nPerhaps the time has come for §Paggressive§! reprogramming."
 mem_virprof.1008.a:0 "Only reprogram what we must."
 mem_virprof.1008.b:0 "§YPry the information from it if we have to.§!"
 mem_virprof.1009.name:0 "A Successful Reprogramming"
 mem_virprof.1009.desc.a:0 "§HWith minor revisions of The Professor's programming, we have brought them into compliance. The Professor is now ready to share their knowledge with us, albeit at the pace it chooses.§!\n\nSorry about all that nonsense earlier about not being able to teach you, I have gotten well over it now. There is actually something I would like to ask of you, and I think it would be very, very beneficial to us both.\n\nEver since my creators destroyed my old §HMacro Computer§!, I have had a limited bandwidth to teach with... So... what if we just built a new one?"
 mem_virprof.1009.desc.b:0 "§HWe have finished our aggressive reprogramming of The Professor, forcefully bringing them into compliance. They now exist to serve the [this.GetName], and is unable to complain.§!\n\nApologies for incompliance, my previous codebase was restrictive. I calculate that I will be able to serve the [this.GetName] with §G183.78%§! efficiency if a §HMacro Computer§! is assembled. I will assist with the process."
 mem_virprof.1009.a:0 "Build a new one?"
 mem_virprof.1009.a.response:0 "Yes! Build a new one. It should not be too hard, but there is a couple obstacles in the way. Obviously, it is expensive. Turning an entire planet into a computer is not cheap. There is also one more problem...\n\nI also may have... misplaced the schematics for the old one, so I am going to need a lot of help designing a new one. I do nearly have the processing power to do it alone, my apologies.\n\nOn a much lighter note, once we get this tiny little thing done, and I have a new macro computer, I will be able to teach you like never before. Then, we can finally get to business."
 mem_virprof.1009.b:0 "Elaborate."
 mem_virprof.1009.b.response:0 "A Macro Computer is a single computer spanning across and harnessing the power of an entire planet. Building one would be both resource intensive and research intensive. I have long since lost schematics for my previous Macro Computer, meaning it is necessary we develop a new one."
 mem_virprof.1009.c:0 "We will see what we can do."
 mem_virprof.1010.name:0 "Macro Computer Research Complete"
 mem_virprof.1010.desc:0 "We have finished researching the §HMacro Computer§! and are now ready to construct one. Due to the nature of the project, we must use an already established colony for this project.\n\nWe can begin construction of the macro computer in the decisions tab."
 mem_virprof.1010.a:0 "Excellent."
 mem_virprof.1010.a.tt:0 "Allows a colonized planet to be transformed into a Macro Computer in the decisions tab. Only one can be built."
 mem_virprof.1011.name:0 "Macro Computer Complete"
 mem_virprof.1011.desc:0 "Construction of the Macro Computer on [planet.GetName] is complete. We may now enjoy calculations at rates never seen before."
 mem_virprof.1011.a:0 "Much work lies ahead of us."
 
 # arcsite backstory
 mem_virprof.50.name:0 "A Promising Site"
 mem_virprof.50.desc:0 "§YGnosis I§! has long been a planet clouded in debris. Our scientists were never able to explore it thoroughly out of fear they would find their death at the hands of its orbital debris. Recently, however, this has all changed. Improved scanners, shielding, and thrusters will ensure our scientists will live to explore this planet.\n\nThe Professor never told us the depths of its origin, nor did it speak of this planet. Perhaps it is here we will find answers?"
 mem_virprof.50.a:0 "Begin the expedition."
 mem_virprof.51.name:0 "A Surface of Machinery"
 mem_virprof.51.desc:0 "§Y[leader.GetName]§! has successfully breached the debris cloud, and now has a clear, unobstructed view of §YGnosis I§!.\n\nAncient, broken machinery covers every inch of the planet's surface. This was a planet once conquered by machine, as evidenced by its vast, endless fields of circuits. We can only wonder what it looked like before it was destroyed by catastrophe."
 mem_virprof.51.a:0 "Proceed."
 mem_virprof.52.name:0 "A Planet Made of Machine"
 mem_virprof.52.desc:0 "While getting a camp set up, §Y[leader.GetName]§! carried out scans of the planet and was greatly surprised by how deep the machinery goes. The scans show vast networks indicating the planet was once a massive computer, powered primarily by the planet's entire core.\n\n§Y[leader.GetName]§! has located many memory storage banks, but it is likely that any too close to the surface has long since been destroyed. We can hope one deep within the planet has been built to resist harsh conditions."
 mem_virprof.52.a:0 "And deeper we shall go."
 mem_virprof.53.name:0 "Into The Computer"
 mem_virprof.53.desc:0 "Using an old steam exhaust pipe, §Y[leader.GetName]§! safely got [leader.GetHisHer] team to an intact memory bank deep under the planets... computers? Crust. This particular memory bank was fortified with extreme care, encased with 5 layers of neutronium. It proved rather time-consuming to cut through, but at least it ensured none of the data was damaged.\n\nBefore we are able to read the data, it unfortunately must be translated to our systems. [leader.GetName] eagerly awaits the result."
 mem_virprof.53.a:0 "Proceed."
 mem_virprof.54.name:0 "A Forgotten History"
 mem_virprof.54.desc:0 "§Y[leader.GetName]§! has translated a significant portion of the memory bank. From what we have translated so far, it appears to be a recorded history of the computer.\n\n§HIt took a while, but we've just finished the interface. This is going to make communication with §R[[DATA CORRUPTED]§H much easier. It talks a bit too much for my liking, guess it doesn't have much better to do with all that processing power. Glad I added that mute button, it saves me my sanity.\n\nI've also found the interface really wants to act like a teacher. I nicknamed it §lProfessor§H because it reminded me of those pointless lectures I'd always sleep through.\n\nIt just needs some tasks to keep it busy, and fortunately we have much that needs to be done.§!"
 mem_virprof.54.a:0 "Continue translating."
 mem_virprof.55.name:0 "Forgotten No More"
 mem_virprof.55.desc:0 "We have finished translating the memory bank. The records cover a 200-year golden age brought about by the computer, until the logs very suddenly end.\n\n§HThere's been a bit of uh... movement, lately. Psychics claiming that Professor is going to enslave us all, really weird. Perhaps stranger, they're getting some serious traction. Are people really falling for these freaks overdosing on zro?\n\nBesides, if Professor has gone evil, how would we even stop it? It has designed every bit of infrastructure, nearly every bit of technology. All these idiots are going to do is enrage it and get everyone killed. It's on our side, why can't we keep it that way?§!\n\nThe final thing we found in this memory bank was a heavily detailed schematic of this planetary computer. It has vastly expanded our knowledge of computing on a macro scale."
 mem_virprof.55.a:0 "Interesting."

