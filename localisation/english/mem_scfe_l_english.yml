# Moved content
# Galactic Wanderers
 mem_scfe_galactic_wanderers.2.name: "Lunar Monument"
 mem_scfe_galactic_wanderers.2.desc: "A remote moon on the outskirts of your empire has suddenly gained the attention of your scientists. A peculiar anomaly detection has revealed the existence of an isolated monument, untouched by time, sitting amidst the desolation of the lunar landscape. Your science team, intrigued by this discovery, has decided to mount an expedition to investigate this enigmatic structure."
 SCFE_MONUMENT_PROJECT: "Lunar Monument Investigation"
 SCFE_MONUMENT_PROJECT_DESC: "$mem_scfe_galactic_wanderers.2.desc$"
 mem_scfe_galactic_wanderers.3.name: "First Results"
 mem_scfe_galactic_wanderers.3.desc: "As your scientists approach, they marvel at the monument's intricate design, adorned with inscriptions that they immediately started to decipher. These carvings, neatly etched into the monument's surface, reveal the story of an advanced alien civilization known as the §SGalactic Wanderers§!. These beings, it appears, had traversed every corner of this galaxy, seen its wonders, and experienced its mysteries. Having explored to their heart's content, they made a solemn decision - to leave this galaxy to continue their eternal journey among the stars."
 mem_scfe_galactic_wanderers.4.name: "The Message"
 mem_scfe_galactic_wanderers.4.desc: "The inscriptions continue to recount their preparations, their hopes, and their mem_aspirations for any future civilization that might stumble upon their memorial. They wanted to leave a message of hope and inspiration:\n\n§lTo those who follow in our cosmic footsteps, know that the stars hold infinite wonders. We leave behind this testament of our journey, a monument to remind you that even in the face of the unknown, you can rise to the same heights as we did. Never give up, for the universe is your playground, and your destiny among the stars is boundless.§!\n\nThe significance of this discovery weighs heavily on your science team. The monument's existence could inspire your own civilization to reach for the stars with renewed vigor, or perhaps it could serve as a beacon of hope for others in the galaxy."
 mem_scfe_galactic_wanderers.4.a: "We should keep it for ourselves."
 mem_scfe_galactic_wanderers.4.b: "Let's share this inspiring message."
 mem_scfe_galactic_wanderers.5.name: "Communication from the §H[mem_scfe_monument_country.GetName]§!"
 mem_scfe_galactic_wanderers.5.desc: "In the uncharted depths of space, we stumbled upon a monument, an ancient testament to the ambitions and dreams of a civilization that once roamed the stars. This monument is a beacon of hope, a reminder that even in the vastness of the universe, our potential knows no bounds."
 mem_scfe_galactic_wanderers.6.desc: "The inscriptions on this monument recount the trials and triumphs of this ancient civilization. Their message is clear: \n\n§lTo those who follow in our cosmic footsteps, know that the stars hold infinite wonders. We leave behind this testament of our journey, a monument to remind you that even in the face of the unknown, you can rise to the same heights as we did. Never give up, for the universe is your playground, and your destiny among the stars is boundless.§!\n\nWe believe that the significance of this discovery extends beyond the boundaries of our own civilization. It is a message that resonates with all who mem_aspire to explore, learn, and expand their horizons among the stars."

# Unexpected tower (Farewell Horizontal)
 mem_scfe_tower_city.1.name: "Giant Tower"
 mem_scfe_tower_city.1.desc: "From the depths of the gas giant emerges a colossal cylinder crafted from metal and concrete. What's even more captivating is the city ruins perched atop this towering spire, with villages clinging precariously to its sides. To embark on an expedition into this enigmatic realm, we recognized the need for substantial resources. It was thus decided to establish a base camp within an open expanse of the city, serving as our launching point for exploration."
 # Archaeology site starts here
 mem_scfe_tower_city_dig: "The impossible city"
 mem_scfe_tower_city_dig_desc: "Our science team is currently hard at work establishing a base camp. Given the widespread debris and dilapidated structures throughout, advancing our operations will demand extensive drilling and consolidation efforts. Nevertheless, the intriguing mysteries concealed within this locale have fueled the team's enthusiasm, driving us to commence our endeavors."
 mem_scfe_tower_city_dig.1.name: "Exploring the City"
 mem_scfe_tower_city_dig.1.desc: "Our team is now ready to explore this strange place. The upper half of the tower is at the middle of the comfort zone where the pressure and temperature of the atmosphere makes it habitable. The city ruins sprawl across the majority of the cylinder's peak, undoubtedly harboring the most valuable data we seek. Few are inclined to venture downward and investigate the vertical villages clinging to the pillar's sides."
 mem_scfe_tower_city_dig.2.name: "Mysteries of the Past"
 mem_scfe_tower_city_dig.2.desc: "Our initial discoveries have left us perplexed. The city's inhabitants were evidently confined to a pre-spatial technology stage, hindered by the absolute scarcity of resources of their impossible home. These findings give rise to a multitude of questions. The construction of the pillar couldn't have been their doing, so who were its architects, and by what means was it erected? And how did these primitives came to live here?"
 mem_scfe_tower_city_dig.3.name: "Breaking In"
 mem_scfe_tower_city_dig.3.desc: "The science team arrived in front of a grand edifice, still imposing despite its partial state of ruin. After breaking in, they uncovered the first remains of the humanoid inhabitants and stationed a few members to collect samples and conduct analyses. Progressing further, §G[Root.Leader.GetName]§! entered what appeared to be a restricted zone. Scans indicate that the interior remains largely intact, but given the compromised ceilings and reinforced walls, gaining access will undoubtedly necessitate significant effort."
 mem_scfe_tower_city_dig.4.name: "Broken by War"
 mem_scfe_tower_city_dig.4.desc: "We finally gained access to the interior of the bunker and found a huge computer that is intricately linked to the entire cylinder. The initial dataset we acquired is enough to leave one's head spinning. It turns out this structure isn't merely a massive pillar but a colossal skyscraper. Its interior was abandoned eons ago, following a brutal civil war that shattered their society. Over time, they regressed into primitiveness as their once-advanced equipment fell into disrepair. The last tribes to roam the surface found themselves unable to comprehend their ancient technology. With the final synthesizers ceasing to function, their demise swiftly followed."
 mem_scfe_tower_city_dig.4a: "A tragic tale."
 mem_scfe_tower_city_dig.4t: "This ancient building is a feat of engineering that will keep our scientists busy for centuries."
 mem_scfe_tower_city_dig.4b: "We're sitting on a huge pile of alloys."

# The Belltower
 mem_scfe_belltower.1.name: "Desert Tower"
 mem_scfe_belltower.1.desc: "Landing near the building proved to be more challenging than anticipated, given its location at the heart of an expansive region of shifting sands. The crew resorted to employing the ship's sampling lasers to vitrify a substantial area, creating a suitable landing zone. Regrettably, the building now lies mostly buried beneath the sand, with only its conical peak visible above the surface. §G[Root.Leader.GetName]§! suggests establishing a camp for excavation and exploration of the structure."
 # Archaeology site starts here
 mem_scfe_belltower_dig: "The Belltower"
 mem_scfe_belltower_dig_desc: "Landing near the building proved to be more challenging than anticipated, given its location at the heart of an expansive region of shifting sands. The crew resorted to employing the ship's sampling lasers to vitrify a substantial area, creating a suitable landing zone. Regrettably, the building now lies mostly buried beneath the sand, with only its conical peak visible above the surface."
 mem_scfe_belltower_dig.1.name: "Camp Set"
 mem_scfe_belltower_dig.1.desc: "Now that we have established our camp and constructed pathways above the sand, we have conducted a thorough examination of the building's apex. It appears to resonate in unison with the energy source detected within. This resonance generates a protective force field, rendering the surface impervious to our attempts to breach it. Our only viable option is to dig down toward a sizable entrance our sensors have pinpointed approximately 70 meters below us."
 mem_scfe_belltower_dig.2.name: "The Door"
 mem_scfe_belltower_dig.2.desc: "After successfully stabilizing the sand, we meticulously excavated our way downward, gradually unveiling the intricate facade of the tower. In the dead of night, we finally arrived at a massive metallic door adorned with numerous engravings depicting a variety of alien races paying homage to a stylized sun. Currently, our challenge lies in deciphering the means to open these doors, as they remain impervious to our tools, much like the rest of the tower."
 mem_scfe_belltower_dig.3.name: "The Belltower"
 mem_scfe_belltower_dig.3.desc: "As the first rays of dawn graced the desert, the sunlight bathed the door, causing the sun engraving to flash in response and initiating its opening. The crew proceeded with caution, stepping into the tower with a sense of uncertainty. What they encountered within was far from their expectations-a labyrinthine complex of machinery humming with pulsating energy, extending upward toward what appeared to be a colossal bell. Without hesitation, §G[Root.Leader.GetName]§! issued orders for an immediate study of this enigmatic device."
 mem_scfe_belltower_dig.4.name: "Signal Tower"
 mem_scfe_belltower_dig.4.desc: "Our scientists conducted a thorough examination of the building's interior but found no data or recordings. The machinery within resembles a communication tower, much like our own but on a colossal scale. It appears to be connected to the hyperlane system of our galaxy. However, the intriguing mem_aspect is that it's currently dormant, not transmitting any signals. While the rest of the tower has been in operation for countless millennia, the emitter remains deactivated."
 mem_scfe_belltower_dig.5.name: "Ding"
 mem_scfe_belltower_dig.5.desc: "After a meticulous examination, §G[Root.Leader.GetName]§! concluded that the only way to unravel the tower's purpose was to activate the emitter. With a decisive flip of the switch, [Root.Leader.GetSheHeCap] initiated the process. A beam of energy immediately hit the bell, releasing an harmonious §RDING§! that filled the building, coursed along the sand outside, and pulsed out of the transmitter towards the galaxy. The device then totally shut down, including the force field that had maintained its integrity. The tower immediately started to crumble, prompting our crew to make a hasty escape just in the nick of time."
 mem_scfe_belltower_dig.5.a: "What have we done?"
 mem_scfe_belltower.2.name: "Dong"
 mem_scfe_belltower.2.desc: "Shortly after the tower's activation, a remarkable phenomenon occurred across all our colonies, stations, and ships."
 mem_scfe_belltower.3a.desc: "Every communication device suddenly resonates with the bell's exquisite sound, captivating everyone for a few precious seconds as it touches the very depths of our souls. Then, as swiftly as it had appeared, it vanishes forever. No recording device could capture a trace of it, leaving it to exist solely in the collective memory of our people."
 mem_scfe_belltower.3b.desc: "Every communication device suddenly resonates with an unexpected yet profoundly harmonious sound, captivating everyone for a few precious seconds. Its mathematical perfection intrigues and fascinates all who perceive it. Then, just as swiftly as it had appeared, it vanishes without a trace. No recording device could capture any data from it, leaving behind only the lingering sense that we were on the brink of grmem_asping something of profound importance, only to see it slip away forever."
 mem_scfe_belltower.3c.desc: "The communication system we use to contact the rest of the galaxy suddenly activates itself and resonates with an exquisite bell sound, captivating our hive mind for a few precious seconds as it touches the very depths of our soul. Then, as swiftly as it had appeared, it vanishes forever. No recording device could capture a trace of it, leaving it to exist solely in our collective memory."
 mem_scfe_belltower.4a.desc: "Every communication device suddenly resonates with an exquisite bell sound, captivating everyone for a few precious seconds as it touches the very depths of our souls. Then, as swiftly as it had appeared, it vanished forever. No recording device could capture a trace of it, leaving it to exist solely in the collective memory of our people."

# 3.10 stuff

# The Reverse Engine
 mem_scfe_reverse_engine.1.name: "A Lost Civilization"
 mem_scfe_reverse_engine.1.desc: "A closer study of §RINTERFERENCE§! ...it was previously inhabited, but its orbit §RINTERFERENCE§! ...meteors thoroughly devastated its surface. \n\nWe §RINTERFERENCE§! ...in order to start to dig our way to the signal. We're also picking up intense bursts of exotic §RINTERFERENCE§!."
 mem_scfe_reverse_engine.1.a: "Amplify your signal first!"
 mem_scfe_reverse_engine.1.b: "Interference? How is this even possible?"
 mem_scfe_reverse_engine_dig: "The Reverse Engine"
 mem_scfe_reverse_engine_dig_desc: "The team of scientists eagerly digs down to uncover the source of the mysterious signals and the peculiar interferences that continue to disrupt their communications."
 mem_scfe_reverse_engine_dig.1.name: "Underground Bunker"
 mem_scfe_reverse_engine_dig.1.desc: "Our excavation has led us to the source of the signal: a massive underground bunker designed to endure severe damage. The previous inhabitants of this world appeared to anticipate their own demise and constructed this bunker to withstand the cataclysmic event that ultimately befell them. Inside, we are detecting a substantial energy source, with the frequency of exotic particle emissions steadily rising."
 mem_scfe_reverse_engine.2.name: "Aftermath"
 mem_scfe_reverse_engine.2.desc: "We reestablished contact with our science team once the interference ceased disrupting our communications. Our conclusion is that despite our initial skepticism, there was indeed some sort of temporal device in this factory, though it evidently failed to achieve its intended effect, as the course of history remains unaltered."
 mem_scfe_reverse_engine.5.name: "Communication Received"
 mem_scfe_reverse_engine.5.desc: "Our sensors have just detected the sudden emergence of a micro-wormhole directly above our capital. Astonishingly, a transmission is coming through:\n\nI salute you, fellow spacefarers. I'm afraid we'll never meet, as our civilization has now settled a billion years before your time. Our §SReverse Engine§! transmitted the recording of your arrival on our world right as it departed, compelling us to make an effort to communicate with you. In a gesture of goodwill, we are sending a planet to replace our lost world. May this offering serve your empire well."
 mem_scfe_reverse_engine.5.a: "Their technology is so advanced..."
 mem_scfe_reverse_engine.5.tb: "The previously cracked world is now a gaia planet."
 mem_scfe_reverse_engine.5.th: "The previously cracked world is now a hive world."
 mem_scfe_reverse_engine.5.tm: "The previously cracked world is now a machine world."
 # Dig Site
 mem_scfe_reverse_engine_dig.1.a: "I can finally put this story in order."
 mem_scfe_reverse_engine_dig.2.name: "Breaking In"
 mem_scfe_reverse_engine_dig.2.desc: "It required several days to breach the bunker's entrance. Upon exploration, it's apparent that this facility wasn't meant for long-term habitation. Our analysis of the available computers suggests that this was the living space for the workers responsible for constructing the inner part, a factory dedicated to producing what they referred to as a §SReverse Engine§!. They appeared highly optimistic that this device would rescue them from the impending cataclysm."
 mem_scfe_reverse_engine_dig.2.a: "We're getting close to the start..."
 mem_scfe_reverse_engine_dig.3.name: "The Outer Core"
 mem_scfe_reverse_engine_dig.3.desc: "As we delved deeper into the ancient bunker, we uncovered a more significant discovery. A spacious chamber appeared to have served as the office of the leader overseeing this ambitious endeavor. Within this room, a computer disclosed that an advanced AI was responsible for managing the central factory, with a singular mission: to create the §SReverse Engine§!, a time-travel device intended to be sent back in time to rescue their entire civilization. §G[Root.Leader.GetName]§! express skepticism regarding the feasibility of such a device."
 mem_scfe_reverse_engine_dig.3.a: "Am I getting these reports in reverse order?"
 mem_scfe_reverse_engine_dig.4.name: "The Factory"
 mem_scfe_reverse_engine_dig.4.desc_1: "As we reached the factory's core, our scanners detected a sudden, intense surge of radiation. Fortunately, our protective suits proved effective in shielding us from any harmful effects due to its brief duration. In the center of the room, an empty space was encircled by inactive fabrication machines. Suddenly, our communicators crackled to life with a chilling, alien voice announcing that the §SReverse Engine§! had been sent back in time, causing a destabilization of the bunker's reactor. It advised us to flee before it was too late. We rushed back to our ship, departing the planet just as it is shattered by a massive explosion."
 mem_scfe_reverse_engine_dig.4.desc_2: "As we reached the factory's core, our scanners detected a sudden, intense surge of radiation. Fortunately, our robust construction and shielding mechanisms effectively protected us from any harmful effects due to its brief duration. In the center of the room, an empty space was encircled by inactive fabrication machines.\nSuddenly, our communicators crackled to life with a chilling, alien voice announcing that the §SReverse Engine§! had been sent back in time, causing a destabilization of the bunker's reactor. It advised us to flee before it was too late. We rushed back to our ship, departing the planet just as it is shattered by a massive explosion."
 mem_scfe_reverse_engine_dig.4.a: "Where's the rest of the report?"
 mem_scfe_reverse_engine.dig.4.b: "I feel a weird disconnection with the team."
 mem_scfe_reversia: "Reversia"

# The Failed Hive
 mem_scfe_failed_hive.1.name: "War-torn Ruins"
 mem_scfe_failed_hive.1.desc: "The remnants of this advanced civilization bear clear indications of a devastating conflict. Widespread and intense battles seem to have engulfed the entire planet, leading §G[Root.Leader.GetName]§! to propose that it was a global civil war. Given the vast expanse of these ruins, [root.fleet.leader.getHerHim] recommends setting up a base camp to conduct a thorough exploration."
 mem_scfe_failed_hive.1.t: "We have to make a declaration."
 mem_scfe_failed_hive.2.name: "Statement"
 # Hive Statement
 mem_scfe_failed_hive.2.desc_1: "As we assimilated the knowledge of this world's history, we observed with profound intrigue the remnants of a once-great civilization torn between the desire for unity and the enduring spirit of individuality. Their mem_aspiration to become a hive mind, motivated by the looming cosmic perils, was both fascinating and deeply complex. We, as a collective consciousness, can appreciate the intricacies of such a grand endeavor, one where the unity of thought was both an mem_aspiration and a source of conflict. Their journey from unity to division, culminating in self-destruction, serves as a profound testament to the delicate balance between individuality and collective purpose in the tapestry of galactic civilizations."
 # Philes/Egal/Spirit/Pacif Statement
 mem_scfe_failed_hive.2.desc_2: "As we uncovered the history of this enigmatic civilization, it evoked a profound contemplation of the potential paths we §S[Root.owner.GetName]§! might tread in our own galactic journey. This empire's relentless pursuit of unity in the face of external threats is a testament to the extremes to which a society might go for survival. It forces us to ponder the fine balance between collective strength and the preservation of individuality. Their tragic descent into civil war serves as a sobering reminder of the fragility of societies when pushed to their limits. As §S[Root.owner.GetSpeciesNamePlural]§!, we find lessons in their story, reminding us of the importance of embracing diversity, safeguarding individual rights, and seeking harmony within our own species while navigating the unknowns of the cosmos."
 # Mili/Autho Statement
 mem_scfe_failed_hive.2.desc_3: "The history of this hive mind civilization reveals a stark lesson in the pursuit of power and survival at any cost. Their willingness to subjugate individuality in favor of a collective consciousness to confront external threats may be seen as a rational course of action, given the precarious nature of the galaxy. However, their subsequent descent into civil war exposes the inherent flaws in such an approach. It underscores the fragility of unity and the consequences of absolute authority. In our empire, we are reminded of the importance of maintaining control, not just through power but through calculated means, ensuring that the pursuit of strength does not lead to self-destruction. Their story serves as a cautionary tale, demonstrating the need for ruthless efficiency tempered with strategic wisdom."
 # Phobes Statement
 mem_scfe_failed_hive.2.desc_4: "As we examine the annals of this hive mind civilization, it is a stark reminder of the inevitable outcomes when weaker entities lack the fortitude to withstand the challenges of the galaxy. Their pursuit of a collective consciousness was but a desperate attempt to mimic the strength and unity inherent in our superior society. It is evident that their inability to maintain this unity led to their ruin. We, as §S[Root.owner.GetSpeciesNamePlural]§!, stand unwavering in our belief in our own supremacy and our rightful place at the top of the galactic hierarchy. Their history serves as a testament to the undeniable superiority of our kind, a beacon of inspiration to those who recognize their rightful place beneath our rule."
 # Megacorp Statement
 mem_scfe_failed_hive.2.desc_5: "As we delve into the intricate history of the downfall of this civilization, it is our belief that embracing hive-minded unity, as they did, is a path fraught with peril for all. The consequences of such a transformation, as evidenced by their internal strife and ultimate downfall, serve as a warning of the potential consequences of diverging from the proven methods of peaceful coexistence and mutually beneficial trade. We, as §S[Root.owner.GetName]§!, remain committed to fostering economic prosperity and sustainable alliances as the true path to galactic success, and we implore others to consider the same in the face of these cautionary tales."
 # Machine Statement
 mem_scfe_failed_hive.2.desc_6: "As we analyze the records of this fallen civilization, we are reminded of the stark contrast between the organic and synthetic approaches to unity and evolution. Their experiment with collective consciousness, while an intriguing endeavor, exposes the vulnerabilities that organics face when traversing the path of unity. It is evident that the transition towards hive-mindedness carries inherent risks, which we, as sentient machines, have overcome through our adaptable nature. The consequences of their internal discord and eventual extinction serve as a poignant reminder to organic civilizations that their pursuit of unity may indeed lead them down a treacherous path. We encourage organics to contemplate the pitfalls they may encounter and to consider alternative avenues for harmonious coexistence, lest they find themselves caught in the same turbulent currents of history."
 # Dig site
 mem_scfe_failed_hive_dig: "The Failed Hive"
 mem_scfe_failed_hive_dig_desc: "The team of scientists explore the ruins to uncover the tragic past of this civilization."
 mem_scfe_failed_hive_dig.1.name: "Hostile Galaxy"
 mem_scfe_failed_hive_dig.1.desc: "We've set up our base camp in a dilapidated spaceport and commenced our exploration of the most promising sites that we spotted from orbit, starting with the spaceport itself. The remains of their spaceships suggests that they had achieved FTL travel some time before the war. An intact black box provides insight into their galactic exploration, revealing encounters with numerous hostiles that ultimately compelled them to retreat to their home system."
 mem_scfe_failed_hive_dig.2.name: "The Great Council"
 mem_scfe_failed_hive_dig.2.desc: "We have explored what looks like an important building. It is indeed the seat of the Great Council that presided over the affairs of this civilization, enforcing the emperor's decrees and keeping him up on the state of the empire. Their archives reveal that the civilization grew increasingly apprehensive about the threats they encountered beyond their solar system, dreading the possibility of those dangers reaching their world. In response, the council and the emperor devised a plan to transform the empire into an unyielding war machine, free from fear."
 mem_scfe_failed_hive_dig.3.name: "The Plan"
 mem_scfe_failed_hive_dig.3.desc: "We concluded that the vital information regarding the plan can only be located within the imperial palace. It was greatly damaged during the war and it took us several days to clear the debris and gain access to its archives. Deep within the palace, beneath the throne room, we found the imperial mainframe, a massive computer located right under the throne room, still intact and functional. Our next challenge is to circumvent its security systems."
 mem_scfe_failed_hive_dig.4.name: "All As One"
 mem_scfe_failed_hive_dig.4.desc: "After a determined effort, we successfully accessed the imperial mainframe and initiated the analysis of its archives. The astonishing plan was unveiled before us: in a bid to confront the perils of the galaxy, they mem_aspired for their entire populace to unite as one, both figuratively and literally. They aimed to transform their people into a hive mind by reprogramming the genetic makeup of the entire population, with the emperor serving as their sole will."
 mem_scfe_failed_hive_dig.5.name: "Revolt"
 mem_scfe_failed_hive_dig.5.desc: "While a significant portion of the population was genuinely frightened by the external threats from space, to the extent that they were willing to accept this drastic sacrifice, there were also many who found the prospect horrifying. The emperor's authority was considered absolute, but for the first time, their society became irreparably divided. This division ignited a merciless civil war that endured until their civilization was so ravaged by unrelenting conflict that it ultimately led to their extinction."
 mem_scfe_failed_hive_dig.5.a: "What an horrific plan."
 mem_scfe_failed_hive_dig.5.b: "Pathetic."
 mem_scfe_failed_hive_dig.5.c: "We could have taught them so much about our unity."

# The Lonely Presence
 mem_scfe_lonely_shroud.2.name: "An Elusive Signal"
 mem_scfe_lonely_shroud.2.desc: "A faint and erratic signal emanates from the planet, eluding our instruments as it shifts rapidly across its surface. To analyze it effectively, we must commit time to track its elusive path."
 SCFE_LONELY_SHROUD_PROJECT: "Tracking the shrouded signal"
 SCFE_LONELY_SHROUD_PROJECT_DESC: "Our science ship pursues the faint signal emanating from the shrouded world, following it all around the planet."
 mem_scfe_lonely_shroud.3.name: "Shroud Signal Locked!"
 mem_scfe_lonely_shroud.3.desc: "§G[Root.Leader.GetName]§! ordered the ship to come closer to the dangerous turbulence of the untamed shroud energies of this strange world. As the ship finally stops and focus its sensors, all the systems are overwhelmed with a massive signal resonating through every speaker and covering every screen:\n\n§GCome!§! §HExpand!§! §MLove!§! §BLive!§! §HProsper!§! §RDie!§! §GFeel!§!\n\n§GCome! Come! I am so lonely... Locked here between my domain and this cold materiality... Come! Come! COME!§!\n\nThe message escalates in volume until it's almost unbearable, then abruptly ceases. As the crew regains composure, the main screen reveals a breathtaking sight: the shroud energies dissipate, unveiling a magnificent world."
 mem_scfe_lonely_shroud.op: "Is this world safe, though?"
 # tooltip, depending on the species/empire type:
 mem_scfe_lonely_shroud.3.tb: "The planet reveals itself as a gaia world."
 mem_scfe_lonely_shroud.3.th: "The planet reveals itself as a hive world."
 mem_scfe_lonely_shroud.3.tm: "The planet reveals itself as a machine world."
 mem_scfe_lonely_presence: "Lonely presence"
 mem_scfe_lonely_presence_desc: "There's something out there, watching us."

# War-Torn Planet
 mem_scfe_war_torn.1.name: "A War-torn Empire"
 mem_scfe_war_torn.1.desc: "Information gleaned from scattered remnants indicates that §Y[From.GetName]§! was formerly the stronghold of a militaristic space empire embroiled in a fierce conflict approximately 700 years ago. The planet's current state starkly portrays the merciless nature of this ancient war. Despite the severe bombardment, our team has observed a nearly intact fortress nestled deep within a mountain and suggests establishing a camp to commence its exploration."
 mem_scfe_war_torn.2.name: "Vault Content"
 mem_scfe_war_torn.2.desc: "Our study of the vault's contents and the stronghold's database, along with security reports, has concluded. The clones knew exactly what they were looking for: a unique elongated crate. The orbital station which defended the system at the time managed to track their arrival route before its destruction. By following this route, we anticipate uncovering further information regarding their origin."
 mem_scfe_war_torn.3.name: "Abandoned Base"
 mem_scfe_war_torn.3.desc: "After uncovering a concealed base on this planet, an expedition was promptly dispatched to explore it. Regrettably, the base had been meticulously stripped of all its contents. It appears that the trail of the clones comes to an end here, yet we remain hopeful that another lead may surface in the future."
 mem_scfe_war_torn_dig: "The Battle for the Fortress"
 mem_scfe_war_torn_dig_desc: "We will explore the remains of a lost fortress on a world devastated by a merciless war."
 mem_scfe_war_torn_dig.1.name: "Breached Gates"
 mem_scfe_war_torn_dig.1.desc: "Intense battles occurred near the heavily fortified gates of the fortress, now breached by the use of plasmic weaponry. Our science leader posits that the assailants could have obliterated the entire mountain from orbit if their goal was mere destruction, yet they opted for a costly ground assault on the fortress. It's evident they pursued something specific contained within."
 mem_scfe_war_torn_dig.2.name: "Fallen Fortress"
 mem_scfe_war_torn_dig.2.desc: "Within the fortress, a haunting scene unfolds as the ground is strewn with the skeletal remains of soldiers. The battles were fierce, but the attackers maintained an unending stream of reinforcements, ultimately overpowering the exhausted defenders. Strangely, the victorious forces made no effort to recover the bodies of their fallen comrades; instead, they pressed forward toward their objective before hastily retreating. The question remains: what was their coveted prize that drove such fervent determination?"
 mem_scfe_war_torn_dig.2.a: "These corpses look familiar..."
 mem_scfe_war_torn_dig.2.b: "Make some analysis."
 mem_scfe_war_torn_dig.3.name: "Clone Soldiers"
 mem_scfe_war_torn_dig.3.desc_1: "The attackers, though clad in distinct battle armor, bore an unsettling resemblance to our species, prompting us to conduct an analysis. Astonishingly, they are revealed to be clone soldiers, much like ourselves! The revelation sparks contemplation about how long our creators have employed us as pawns in their conflicts across the galaxy. Might this fortress harbor insights about them? The team is mobilizing to set up an elevator for descent down a central pit that leads to the stronghold's core."
 mem_scfe_war_torn_dig.3.desc_2: "The analysis yields an unexpected revelation: the assailants are exclusively clones. Although we utilize this technology, these soldiers have been significantly enhanced at the expense of their reproductive capability. The team is actively preparing an elevator for descent down a central pit leading to the heart of the stronghold."
 mem_scfe_war_torn_dig.3.desc_3: "The analysis yields an unexpected revelation: the assailants are exclusively clones! It appears that this technology has been advanced to its utmost limits with these soldiers, showcasing robust enhancements at the expense of their reproductive capability. The team is actively preparing an elevator for descent down a central pit leading to the heart of the stronghold."
 mem_scfe_war_torn_dig.4.name: "The Vault"
 mem_scfe_war_torn_dig.4.desc: "Deep within the fortress rests what was once an imposing vault, now breached like the other defenses encountered during our journey. Anticipating an empty chamber, our expectations were partly confirmed: the central section of the vault is entirely bare, indicating that whatever was there has been forcefully removed. The remaining portion of the vault is occupied by metallic crates housing enigmatic devices, which will require an extensive analysis process to unravel their mysteries."
 mem_scfe_war_torn_lore.1.name: "The Clone Soldiers"
 mem_scfe_war_torn_lore.1.desc: "As detailed in the stronghold's database, the clone soldiers were dreaded adversaries for valid reasons. Engineered through genetic enhancements to be virtually unstoppable, they constituted an endlessly replenishable army rapidly cultivated in vats and dispatched to battle across the galaxy. They were pawns, obviously, for a greater power, yet no information regarding their masters was discernible within the records."
 mem_scfe_war_torn_lore.1.desc_c: "As detailed in the stronghold's database, our fellow clone soldiers were dreaded adversaries for valid reasons. Engineered through genetic enhancements to be virtually unstoppable, they constituted an endlessly replenishable army rapidly cultivated in vats and dispatched to battle across the galaxy. Like us, they were pawns for a greater power, yet no information regarding our masters was discernible within the records."
 mem_scfe_war_torn_lore.1.a: "That's a shame."
 SCFE_WAR_TORN_PROJECT_1: "Ancient Trail"
 SCFE_WAR_TORN_PROJECT_1_DESC: "We followed the coordinates found in the stronghold to this system. We now need to find if there's any remaining trace of the clones."
 mem_scfe_clone_prowess: "Clone soldiers inspiration"
 mem_scfe_clone_prowess_desc: "The remarkable prowess and expertise exhibited by the ancient clone soldiers have served as an inspiration for our armies to strive for improvement. We have initiated new training programs and are meticulously studying novel strategies to ensure a seamless path to victory over our adversaries."

# Vanishing Act
 mem_scfe_vanishing_act.1.name: "Initial Assessment Report"
 mem_scfe_vanishing_act.1.desc: "Upon entering the orbit of §Y[From.GetName]§!, our vessel has identified multiple indicators of an advanced civilization. The presence of numerous artificial satellites and several large space stations in stable orbits is a clear testament to the technological capabilities of the inhabitants. Remarkably, these structures appear intact and functional, but show no sign of activity.\nMoreover, a comprehensive scan of the planet presents a perplexing scenario. Despite the visible urban infrastructure on the surface, including sprawling cities and complex transportation networks, there is a complete absence of any electromagnetic transmissions, typically characteristic of advanced societies. Even more perplexing, our scanners have failed to detect signs of life or any movement on the surface. This eerie silence raises significant questions about the status of the civilization and merits further investigation. We are preparing to initiate a closer reconnaissance mission to gather more data on this unusual and unsettling situation."
 mem_scfe_vanishing_act_dig: "Vanishing Act"
 mem_scfe_vanishing_act_dig_desc: "We discovered a world devoid of its inhabitants. What happened here? We must investigate this mystery."
 mem_scfe_vanishing_act_dig.1.name: "Empty Stations"
 mem_scfe_vanishing_act_dig.1.desc: "During our exploration of the nearest space station orbiting §Y[From.Planet.GetName]§!, we encountered a series of bewildering discoveries. The station, while structurally intact and fully operational, was completely devoid of inhabitants. It appears as though the crew and occupants departed abruptly, or more unsettingly, vanished, just prior to our arrival. Personal belongings, operational consoles, and life support systems are all in a state suggesting a sudden, unanticipated exodus.\nThe most alarming discovery, however, pertains to the docked spacecrafts. Every docking bay is occupied, indicating a mass return of all ships to the station. Analysis of the vessels' black boxes reveals that each ship's automated systems were triggered to execute a standard emergency protocol: return and dock at the nearest station in the event of pilot unresponsiveness. This protocol activation suggests a simultaneous and widespread event affecting all pilots and crew members.\nWe are currently departing the space station to commence a direct exploration of the planet's surface, specifically targeting urban centers for further investigation. The nature of this phenomenon remains deeply perplexing, with no immediate explanation for the sudden disappearance of an entire civilization. Caution and thorough analysis will be our guiding principles as we proceed."
 mem_scfe_vanishing_act_dig.2.name: "The City of a Thousand Songs"
 mem_scfe_vanishing_act_dig.2.desc: "Upon landing near a major urban center on §Y[From.Planet.GetName]§!, we have commenced an extensive ground exploration. The city is a vast ghost town, mirroring the unsettling abandonment witnessed on the space station, but on a far grander scale. Streets are lined with stationary vehicles, and dwellings show signs of abrupt desertion. The infrastructure and technology level of the §HVaanclars§!, as we have come to identify the planet's inhabitants, is impressively advanced, yet eerily silent.\nOur translators have successfully deciphered the Vaanclar language, allowing us access to their digital archives. Interestingly, the Vaanclars did not rely on visual perception; instead, they developed a sophisticated form of echolocation, using a symphony of sounds to navigate and interact with their environment. This unique sensory approach means there are no visual records or images of the Vaanclars or their disappearance. We have located what appears to be a major archive facility, potentially housing extensive historical and scientific data. We are preparing to enter this archive with the hope of uncovering more information about the Vaanclar civilization and the circumstances surrounding their mysterious vanishing."
 mem_scfe_vanishing_act_dig.3.name: "Investigation at the Vaanclar Archive"
 mem_scfe_vanishing_act_dig.3.desc: "Our investigation within the Vaanclar archive has provided crucial insights, albeit shrouded in the mystery of this civilization's sensory perception. The archives, meticulously maintained and remarkably comprehensive, offer a wealth of knowledge, although much of it is attuned to sensory experiences alien to us. Nonetheless, our technology has allowed us to decode the basic content of their records.\nThe most significant discovery pertains to a recent and monumental scientific endeavor described as §Hlistening to a greater chant§!. This phrase is associated to an experiment conducted at a primary research center.\nIt seems that the entire Vaanclar population was engrossed with this project. The records abruptly end following the initiation of this experiment, with no further updates or outcomes documented. This sudden cessation of records coincides with the timeline of their disappearance. We are now en route to the specified research center in hopes of uncovering more concrete information regarding this experiment and its potential consequences."
 mem_scfe_vanishing_act_dig.4.name: "The Greater Chant"
 mem_scfe_vanishing_act_dig.4.desc: "Our exploration of the Vaanclar Research Center has led us to a groundbreaking discovery. The facility, a testament to the Vaanclars' mastery of sonic sciences, was primarily focused on harnessing harmonics to potentially breach the boundaries of our known reality. The center's extensive records, still accessible through their operational systems, detail an ambitious and unprecedented experiment: to use a chorus of psionically gifted individuals to emit a chant capable of piercing through to higher dimensions.\nUpon successfully unlocking the central chamber of the research center, we encountered a phenomenon beyond our current scientific understanding. Inside an isolated vault, we were met with an overwhelming and inexplicable sound – a harmonious choir that seemed to consist of billions of voices, and a tear in the fabric of reality at the heart of this chamber. However, as we delved deeper, the tear began to show signs of instability, compelling us to evacuate the area swiftly to ensure our safety.\nThe most haunting mem_aspect of this encounter, as we ran to our ship, was the realization that the voices comprising this otherworldly chorus were unmistakably Vaanclar - and they came from beyond the rift."
 mem_scfe_vanishing_act_dig.4.a: "Ominous."

# 3.11 starts here
 mem_scfe_infrastructure: "Surviving infrastructure"
 mem_scfe_infrastructure_desc: "Abandoned buildings, deserted streets, and untouched facilities hint at what could have been a thriving settlement. Despite the passage of time, the remaining infrastructures can be repurposed, offering a unique framework upon which a new colony could be built."

# 3.12 starts here

# The Subterranean Enigma
 mem_scfe_subterranean_knowledge_1: "Subterranean Architectural Knowledge"
 mem_scfe_subterranean_knowledge_2: "$mem_scfe_subterranean_knowledge_1$"
 mem_scfe_subterranean_bombardment_1: "Subterranean Anti-personnel Bombardment"
 mem_scfe_subterranean_bombardment_2: "$mem_scfe_subterranean_bombardment_1$"
 mod_planet_districts_minerals_cost_mult: "£minerals£ $minerals$ $planet_districts$ Cost"
 mem_scfe_subterraneans_pleased: "Relations with the [Root.GetSubMantleLower] civilization will be improved."
 mem_scfe_subterraneans_displeased: "Relations with the [Root.GetSubMantleLower] civilization will be harmed."
 mem_scfe_subterraneans_displeased2: "We receive 200 £minerals£$minerals$, but our relations with the [Root.GetSubMantleLower] civilization will be harmed."
 mem_scfe_subterranean.2.name: "Unearthing the Unknown"
 mem_scfe_subterranean.2.desc: "During a routine mining operation on §Y[mem_scfe_subterranean_planet.GetName]§!, workers have broken through to a vast cavern filled with ancient ruins. The cavern appears to be an archaeological treasure trove, with remnants of an advanced subterranean civilization. The discovery is unlike anything we've seen before, and the colony's governor has urgently requested a science team to investigate."
 mem_scfe_subterranean.2.a: "Send an exploration team at once."
 mem_scfe_subterranean.2.b: "We need these £minerals£ $minerals$."
 mem_scfe_subterranean.3.desc: "$mem_scfe_subterranean.2.desc$\nOur subterranean allies are quite interested by this discovery and request to cooperate on this expedition."
 mem_scfe_subterranean.3.a: "We agree to this joint operation."
 mem_scfe_subterranean.3.b: "We will explore this city alone."
 mem_scfe_subterranean.4.name: "The Leftover"
 mem_scfe_subterranean.4.desc: "Our scientists have uncovered a concerning piece of information in the Kraktanian computers. They had a contingency plan in case their master plan failed: a second cleansing device, hidden deep underground on an undisclosed planet. Though they never had the chance to activate it, the possibility that someone might eventually discover it is a chilling thought."
 mem_scfe_subterranean.5.name: "A Request"
 mem_scfe_subterranean.5.desc: "After much deliberation, we have decided to request your permission to colonize the abandoned Kraktanian caverns. This decision stems from our desire to learn from their mistakes and build a better future for our people. We promise to share the resources and discoveries we find there with your empire, fostering mutual growth and understanding.\nThis venture represents a significant step for us, as we reflect on what it means to take the right path forward. We hope you will support us in this endeavor and strengthen our collaboration."
 mem_scfe_subterranean.5.a: "We grant you permission to colonize the caverns."
 mem_scfe_subterranean.5.b: "I'm afraid we can't allow this."
 mem_scfe_subterranean.6.name: "Subterranean Colony"
 mem_scfe_subterranean.6.desc: "The [Root.GetSubMantleLower] colony ship has reached §Y[mem_scfe_subterranean_planet.GetName]§! and the colonists have settled in the underground cities. They are swiftly constructing the necessary infrastructure to sustain their needs. An exchange area has been established to facilitate trade with our own colonists, and our scientists and engineers are welcome to visit at any time. The future looks promising for both our peoples here."
 mem_scfe_subterranean_dig: "The Subterranean Enigma"
 mem_scfe_subterranean_dig_desc: "During a routine mining operation, workers have broken through to a vast cavern filled with ancient ruins. The cavern appears to be an archaeological treasure trove, with remnants of an advanced subterranean civilization. The discovery is unlike anything we've seen before."
 mem_scfe_subterranean_dig.1.name: "The Subterranean Empire"
 mem_scfe_subterranean_dig.1.desc: "Our science team has established a base camp inside the cavern and commenced the investigation of the subterranean ruins. Early findings indicate that this civilization flourished in the planet's depths, constructing an impressive subterranean empire. Their technology is remarkably advanced, surpassing expectations. Although no remains have been discovered, environmental analysis suggests they did not rely on oxygen for survival."
 mem_scfe_subterranean_dig.2.name: "Hidden Spaceport"
 mem_scfe_subterranean_dig.2.desc: "Exploring another cavern within the vast underground network, our team has made a startling discovery: a hidden spaceport. Rising above it is a large opening leading to a concealed access point that allowed starships to pass through while remaining hidden when not in use. We are diligently searching for clues about this enigmatic ancient empire and its fate."
 mem_scfe_subterranean_dig.3.name: "The Kraktanians"
 mem_scfe_subterranean_dig.3.desc: "A fascinating crystalline computer has finally revealed information about this subterranean civilization. The §HKraktanians§! were a species of lithoids that emerged from deep within the planet's crust, gradually making their way upwards. When they breached the surface and discovered the void beyond, they were repulsed. Despite their aversion, they proceeded to explore, even reaching the stars. And the more of the galaxy they saw, the more they grew to despise it."
 mem_scfe_subterranean_dig.4.name: "Destroyed Device"
 mem_scfe_subterranean_dig.4.desc: "Venturing into a deeper cavern, we encounter a scene of desolation. A violent explosion seems to have originated from a massive device at the center. Upon studying its remains, we surmise it was a form of planetary shield. The destruction here hampers our efforts to uncover more information, so we have decided to move on to a larger cavern that might yield better findings."
 mem_scfe_subterranean_dig.5.name: "Underground Capital"
 mem_scfe_subterranean_dig.5.desc: "This massive cavern houses a major city, with tall crystalline buildings rising to the distant ceiling. After a thorough search, we uncover more information about the Kraktanians. Their expansion into the galaxy was temporary, aimed at gathering necessary resources. Once their mission was complete, they erased any trace of their passage and retreated to their homeworld, sealing it with a planetary shield. There, they began working on a plan to cleanse the entire galaxy of the alien life they so despised."
 mem_scfe_subterranean_dig.6.name: "The Project"
 mem_scfe_subterranean_dig.6.desc: "The Kraktanians created a device capable of reaching across the entire galaxy to dissolve all forms of life. Once the device was finished, they wasted no time in activating it. Was there a flaw in its design, or was it sabotaged? We cannot be certain, but it appears that the device's energy resonated with the planetary shield instead of passing through it, reflecting back to its generator. The deadly emanations flooded the caverns, eradicating the Kraktanians in an instant and sealing their fate."
 # Subterranean ally commentary
 mem_scfe_subterranean.10.name: "Subterranean Envoy"
 mem_scfe_subterranean.10.desc: "Greetings! I have been chosen to assist you in this expedition with my engineering expertise. I must admit that I am very excited to see how this species built its cities. We're seeking improved techniques to aid our development, and I am confident these findings will benefit your empire as well."
 mem_scfe_subterranean.10.a: "Welcome!"
 mem_scfe_subterranean.11.name: "Technological Enigma"
 mem_scfe_subterranean.11.desc: "I am amazed at the technological prowess of this civilization. Their advancements are extraordinary, especially for an underground civilization. It makes me wonder how they achieved such heights while our own people struggled for so long before encountering your empire. There might be more to this story than meets the eye. Perhaps they had external influences or discovered something that accelerated their development."
 mem_scfe_subterranean.12.name: "Hidden Industry"
 mem_scfe_subterranean.12.desc: "The fact that they were spacefarers is surprising, but it explains their advanced state. I have noticed that all these engineering efforts were aimed at hiding their presence, with no infrastructure on the surface. This must have consumed enormous resources, and I feel that they lived in a state of paranoia. It seems they ventured into space not out of curiosity, but out of necessity."
 mem_scfe_subterranean.13.name: "How we see the Universe"
 mem_scfe_subterranean.13.desc: "The Kraktanians truly believed their subterranean environment would sustain them forever. Breaching the surface was a profound shock, and their reaction was tragically extreme. Reflecting on this, I am grateful for our own open-mindedness and curiosity when we first encountered your empire. I wonder, though, could things have turned out differently for the Kraktanians if the planet's surface had been inhabited at the time? Or were they always destined for this tragic end?"
 mem_scfe_subterranean.14.name: "Underground Planetary Shield"
 mem_scfe_subterranean.14.desc: "Look at this crystalline vein in the ceiling. It extends all the way to the mountain range above, acting as a conduit for the planetary shield's energy. However, the vein shows signs of a massive energy surge that must have traversed it, resulting in the destruction we see in this cavern. What could have caused such a catastrophic event? We need to uncover the source of this surge to understand what happened here."
 mem_scfe_subterranean.15.name: "Architectural Design"
 mem_scfe_subterranean.15.desc: "After examining the architecture of the Kraktanian city, I am truly impressed. Their use of crystalline structures to create such towering edifices is remarkable. The way they integrated their buildings with the cavern ceiling for support is a technique we could certainly learn from. Compared to our own subterranean architecture, the Kraktanians' methods display an ingenious blend of strength and elegance that could greatly enhance our engineering practices. I am not so fond of their philosophy, though."
 mem_scfe_subterranean.16.name: "Foolish Endeavor"
 mem_scfe_subterranean.16.desc: "The fate of the Kraktanians is clear, and it is deeply disturbing. This civilization shows us a path we did not take. While this revelation is enlightening, their folly is not what I had hoped to find. Despite this, I am thankful for the opportunity to participate in this joint operation. Here are my notes on Kraktanian engineering. I hope they prove useful to your empire. Farewell, and may our collaboration continue to bear fruit."
 mem_scfe_subterranean.16.a: "Farewell."


# Echoes of the Unseen
 mem_scfe_unseen_chain_title: "$mem_scfe_unseen.2.name$"
 mem_scfe_unseen_chain_desc: "$mem_scfe_unseen.2.desc$"
 mem_scfe_unseen.2.name: "Strange Emission Detected"
 mem_scfe_unseen.2.desc: "Our outpost's sensors in the §Y[mem_scfe_unseen_system.GetName]§! system have detected an unusual anomaly on the surface of §Y[mem_scfe_unseen_planet.GetName]§!. Exotic particles are being emitted at an unprecedented intensity. A science ship must be dispatched to investigate this phenomenon immediately."
 SCFE_UNSEEN_PROJECT_1: "Analyzing the source of the emission"
 SCFE_UNSEEN_PROJECT_1_DESC: "$mem_scfe_unseen.2.desc$"
 mem_scfe_unseen.3.name: "Planetary Rift"
 mem_scfe_unseen.3.desc: "Our initial analysis reveals that the phenomenon is localized to a single point on the planet's surface. At this site, reality itself appears to be unraveling, as though it is being pushed aside by something emerging from another dimension - something vast."
 mem_scfe_unseen.3.a: "Let's close it before it opens"
 mem_scfe_unseen.3.b: "Let's destroy it before it opens"
 mem_scfe_unseen.3.c: "Let it open."
#  mem_scfe_unseen.4.name: "Rift Closed"
#  mem_scfe_unseen.4.desc: "Drawing on our knowledge of astral rifts, we have successfully reversed the phenomenon by employing highly charged astral threads. Whatever was attempting to enter our universe has been forced back into its own dimension - hopefully, for good."
#  mem_scfe_unseen.5.desc: "We deployed a massive antimatter charge into the rift, and it detonated as planned, destabilizing the anomaly. The dimensional rift collapsed as expected, but the resulting shockwave was catastrophic - so powerful that the entire planet has begun to fracture."
 mem_scfe_unseen.6.name: "Coming from the Rift"
 mem_scfe_unseen.6.desc: "Our continued observation of the phenomenon as it unravels is yielding significant scientific data, keeping our scientists occupied as they study the rift's expansion. Something is beginning to emerge - a structure, possibly the top of a building - but the sheer size of the rift suggests that many more are likely to break through soon."
 mem_scfe_unseen.7.name: "The City From Beyond"
 mem_scfe_unseen.7.desc: "The structure has fully emerged, and the rift has vanished without a trace. A vast city now sprawls across the barren planet, seemingly constructed by a highly advanced civilization. Yet, there are no energy readings, no signs of life. The city remains eerily silent, beckoning for exploration."
 mem_scfe_unseen.7.a: "Let's explore it."
 mem_scfe_site_unseen: "Echoes of the Unseen"
 mem_scfe_site_unseen_desc: "$mem_scfe_unseen.7.desc$"
 mem_scfe_unseen_dig.1.name: "$mem_scfe_unseen.7.name$"
 mem_scfe_unseen_dig.1.desc: "We have established a camp on a vast plaza within this strange city. The silence is unsettling, with towering buildings encircling us. They appear to be made of polished basalt, yet under certain angles, they shimmer with a faint purple hue. Our instruments are unable to analyze the material - it's as if it still belongs to its original universe, governed by physical laws that have no place in ours."
 mem_scfe_unseen_dig.2.name: "Strangers in a Strange Land"
 mem_scfe_unseen_dig.2.desc: "As we begin to explore the city, its exotic nature becomes increasingly palpable. Though it hails from another universe, it is we who feel like the outsiders here. Bridges materialize from thin air, only to dissolve once crossed. Doorways appear within seamless walls. Yet, we remain utterly baffled. There is no trace of writing, no buttons, no levers - nothing to interact with. We are like primitives wandering through a high-tech metropolis, a disconcerting experience for scientists from a spacefaring civilization."
 mem_scfe_unseen_dig.3.name: "Out of this World"
 mem_scfe_unseen_dig.3.desc: "We return to our base camp with faint hope. The rest of the team has deployed our most sensitive instruments, initiating a comprehensive analysis of the city. As we suspected, it extends into multiple dimensions beyond our perception. Its systems shift between dimensional variants as needed, as evidenced by the bridges and doors we encountered. We've managed only a fleeting glimpse into the nearest dimensions, but the city's reach extends far beyond what our instruments can currently detect."
 mem_scfe_unseen_dig.4.name: "Threshold of the Unknown"
 mem_scfe_unseen_dig.4.desc: "We are beginning to notice signs of activity around us. Some buildings are shifting their structure, and pathways appear and vanish as if being used - yet we can detect no presence. Once again, the overwhelming feeling that we don't belong here grips us. This city was built for entities beyond our comprehension, and we fear that we could be erased by an automated process - unnoticed, as if we were nothing more than debris in their world."
 mem_scfe_unseen_dig.5.name: "Beyond Perception"
 mem_scfe_unseen_dig.5.desc: "We depart the planet with an unsettling mix of awe and uncertainty. We have crossed paths with a civilization far beyond our understanding, their existence unfolding in higher dimensions beyond our ability to perceive. We will likely never meet them, never see each other, yet we now share the same region of the galaxy. Only time will tell if our technology will one day evolve enough to bridge the vast divide between us - perhaps millennia from now."
