l_english:

# Ziaskehorn: an Ancient Relics Story


 mem_scfe_shard_ziaskehorn: "Shard of Ziaskehorn"
 mem_scfe_shard_ziaskehorn_desc_short: "This shard, a crystal fragment from the scorched surface of a planet ravaged by the enigmatic Fires of Ziaskehorn, exudes an intense and enduring heat"
 mem_scfe_shard_ziaskehorn_desc_details: "Discovered amidst the smoldering remains of this planet, the crystal's temperature has shown no signs of diminishing since it was collected."


 r_mem_scfe_ziaskehorn_fire: "Ziaskehorn Flame"
 r_mem_scfe_ziaskehorn_fire_desc: "Excerpt, Prophecies of Zia (Pehizidii Tablet of Origins, 1st Edition, Unpublished):\n\nZiaskehorn Flame (Section 12)\nLet the seas boil, let the stars fade. Though it takes the last drop of my blood, I will see the fire freed once more! And if I can not, then let the GALAXY BURRRRRRRRN!."
 # activation events
 mem_scfe_ziaskehorn_relic_active: "Burning Fires of Ziaskehorn"
 mem_scfe_ziaskehorn.01.name: "Igniting the Flame"
 mem_scfe_ziaskehorn.01.desc: "As the Flame clung to its newly found kindling, it quickly spread into the Fires of Ziaskehorn. Almost immediately, our generals felt the heat of the newly living fires spreading through their bodies. The aftermath is an array of unimaginably powerful armies, enhanced by the Fires of Ziaskehorn, able to use its power in their combats."
 mem_scfe_ziaskehorn.02.name: "Too Much To Handle"
 mem_scfe_ziaskehorn.02.desc: "As the Ziaskehorn Flame's power waned from our armies, it departed having taken more than it bestowed. An unquenchable fire now rages in our commanders' hearts, their minds engulfed by the Ziaskehorn Fires. All notions of restraint have been incinerated, scattered to the winds by the fervor of the once wielded power."
 mem_scfe_ziaskehorn.02.b: "Our fire can not be quenched."
 mem_scfe_ziaskehorn.02.tooltip: "All of our commanders gain the traits ['leader_trait:leader_trait_victory_or_death'] and ['leader_trait:leader_trait_reckless'] and lose all restraint."
 mem_scfe_ziaskehorn_site: "The Fires of Ziaskehorn"
 mem_scfe_ziaskehorn_site_desc: "The surface of §Y[From.Planet.GetName]§! seems as it once was inhabited, but today it is nothing more than an inhospitable, volcanic rock. Several satellites still orbit around the planet but no further trace of FTL-technologies. The presumely pre-FTL civilization that once lived on [From.Planet.GetName] seems to disappeard. All that remains are large cities slowly melting away."
 # discover event
 mem_scfe_ziaskehorn.99.name: "Life Under Lava" 
 mem_scfe_ziaskehorn.99.desc: "Preliminary surveys of §Y[FROMFROM.Planet.GetName]§! uncovered evidence that the planet was once inhabited. Large urban centers rest torn apart and overran by flowing lava, significantly damaged and slowly melting. Nuclear radition concentrated around small towers indicate atomic-level technology. The lava is slowly devouring away any evidence we could study."
 # digsite events
 mem_scfe_ziaskehorn.11.name: "A Fiery End"
 mem_scfe_ziaskehorn.11.desc: "Preliminary investigations down on §Y[From.Planet.GetName]§! indicate that the current volcanic state of the planet is due to a cataclysmic event that occurred at least 311,000 years ago. The [Root.Owner.GetArchaeologistPlural] noticed a repeatation of a single word around the sites. After barely understanding the native languages, the single word translates to §rZiaskehorn§!. Since the mention of this word and the last moments overlap, first theories link the end to the appearance of Ziaskehor."
 mem_scfe_ziaskehorn.11.a: "See what else you can find."
 mem_scfe_ziaskehorn.11.b: "The fire rises!"
 mem_scfe_ziaskehorn.12.name: "War Never Changes"
 mem_scfe_ziaskehorn.12.desc: "Delving deeper into the scorched remains of §Y[From.Planet.GetName]§!, the [Root.Owner.GetArchaeologistPlural] has recovered fragments of the recent history of the inhabitants of the planet, now known as the Phezidii. For the better part of one-hundred years, four Phezidiian countries were locked in a state of indiscriminate total war among each other.\n\nDuring that conflict a single nation, the Aztiel Commonwealth, obtained nuclear weaponry. In response to the technological progression their main rival, the Nipa, desperately sought equal power to match theirs. Instead of replicating atomics technologies the deeply religous Nipa found a hint in ancient Phezidiian religious sites."
 mem_scfe_ziaskehorn.12.a: "Keep digging!"
 mem_scfe_ziaskehorn.13.name: "Ancient Gods"
 mem_scfe_ziaskehorn.13.desc: "Having been able to uncover some of the ancient texts hidden away in the remnants of §Y[From.Planet.GetName]§! describing the new Nipa weapon, we have found a rough timeline of the events. §rThe Fires of Ziaskehorn§! are a two-thousand year old prophecy depicting the end of the world, first seen in early Phezidiian writing and religion. The Fires would ignite after an individual had received the Ziaskehorn Flame from the ancient Phezidiian goddess of fire, Zia. Apparently Zia would have given the flame to an individual to end the great war as a shining light.\n\nKeeping with the prophecy, that individual had, since the moment they were born, always been destined to receive the Flame from Zia and unleash Ziaskehorn."
 mem_scfe_ziaskehorn.13.a: "Disconcerting."
 mem_scfe_ziaskehorn.13.b: "Burn bright!"
 mem_scfe_ziaskehorn.14.name: "The Ziaskehorn Flame"
 mem_scfe_ziaskehorn.14.desc: "The Nippa, in the hopes of winning the ever-lasting battle against the Aztiel Commonwealth searched for the Fires of Ziaskehorn and performed the ritual to summon the goddess Zia which followed the prophecy and gave their ruler the Flame. Unable to detain the raging fire, the flame quickly became unstable and the fires quickly consumed the entire planet, killing all inhabitants and rendering its surface covered in lava. The war ended and the prophecy fulfilled. Ziaskehorn had unfolded across the planet.\n\nIronically, the last traces of Phezidii society are what  was left of the Ziaskehorn Flame, a small orb burning with the same intensity of stars."
 mem_scfe_ziaskehorn.14.a: "Fascinating."
 mem_scfe_ziaskehorn.14.b: "Illuminate the dark skies!"
 # random events
 mem_scfe_ziaskehorn.21.name: "Curse of the Ziaskehorn Flame"
 mem_scfe_ziaskehorn.21.desc: "While excavating the ruins on §Y[From.Planet.GetName]§!, Science Officer §G[Root.Leader.GetName]§! felt a chilling sensation throughout their entire body. Albeit odd on a planet as blazing as is sun, [Root.Leader.GetHeShe] assures us that they are fine. The rest of the digsite team, however, disagrees. Our Science Officer is nothing more than a shadow of the great leader they once were, slowly withering away."
 mem_scfe_ziaskehorn.22.name: "Volcanic Eruption"
 mem_scfe_ziaskehorn.22.desc: "Many [Root.Owner.GetArchaeologistPlural] were recently killed when a volcano erupted near the digsite on §Y[From.Planet.GetName]§!. §G[Root.Leader.GetName]§! emerged unscathed from the aftermath, but work at the site has been momentarily halted as the expedition teams attempt to re-establish order and cleanup the remaining debris."
 mem_scfe_ziaskehorn.23.name: "Hot Room"
 mem_scfe_ziaskehorn.23.desc: "Our [Root.Owner.GetArchaeologistPlural] working on §Y[From.Planet.GetName]§! have stumbled into a building with thick, hot fog densely clouding every room within it. It's unclear whether or not this is due to the planet's volcanic surface or past events. Nevertheless, Science Officer §G[Root.Leader.GetName]§! assures us this will help the team with uncovering the past secrets of §Y[From.Planet.GetName]§!."
 mem_scfe_ziaskehorn.24.name: "Magma Overflow"
 mem_scfe_ziaskehorn.24.desc: "Our archaeological expedition on §Y[From.Planet.GetName]§! has encountered significant difficulties while attempting to dig through some of the urban area taken over by the burning surface of the planet. Science Officer §Y[Root.Leader.GetName]§! reports that they require some resources and equipment in order to remove a severe overflow of underground magma and continue with the exploration or risk momentarily halting all work at the digsite."
 mem_scfe_embers_of_ziaskehorn: "Embers of Ziaskehorn"
 mem_scfe_embers_of_ziaskehorn_desc: "The Ziaskehorn Flame has left us, leaving our armies exhausted and troubled. It will take time for them to recover."
