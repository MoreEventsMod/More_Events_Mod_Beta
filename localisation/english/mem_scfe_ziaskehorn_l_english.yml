l_english:

# Ziaskehorn: an Ancient Relics Story


 mem_scfe_shard_ziaskehorn: "Shard of Ziaskehorn"
 mem_scfe_shard_ziaskehorn_desc_short: "This shard, a crystal fragment from the scorched surface of a planet ravaged by the enigmatic 'Fires of Ziaskehorn', exudes an intense and enduring heat"
 mem_scfe_shard_ziaskehorn_desc_details: "Discovered amidst the smoldering remains of that world, the crystal's temperature has shown no signs of diminishing since it was collected."


 r_mem_scfe_ziaskehorn_fire: "Ziaskehorn Flame"
 r_mem_scfe_ziaskehorn_fire_desc: "Excerpt, Prophecies of Zia (Pehizidii Tablet of Origins, 1st Edition, Unpublished):\n\nZiaskehorn Flame (Section 12)\nLet the seas boil, let the stars fade. Though it takes the last drop of my blood, I will see the fire freed once more! And if I can not, then let the GALAXY BURRRRRRRRN!"
 # activation events
 mem_scfe_ziaskehorn_relic_active: "Burning Fires of Ziaskehorn"
 mem_scfe_ziaskehorn.01.name: "Igniting the Flame"
 mem_scfe_ziaskehorn.01.desc: "As the flame clung to its newly found kindling, it quickly spread into the 'Fires of Ziaskehorn'. Almost immediately, our soldiers felt the heat of the newly invigorated fires spreading through their bodies. The aftermath was an array of unimaginably powerful armies, enhanced by the 'Fires of Ziaskehorn', able to utilize its power in battle."
 mem_scfe_ziaskehorn.02.name: "Too Much to Handle"
 mem_scfe_ziaskehorn.02.desc: "As the 'Ziaskehorn Flame's power waned from our armies, it departed having taken more than it had bestowed. An unquenchable fire now rages in our soldiers' hearts, their minds engulfed by the 'Ziaskehorn Fires'. All notions of restraint have been incinerated, scattered to the winds by the fervor of the once wielded power."
 mem_scfe_ziaskehorn.02.b: "Our fire can not be quenched."
 mem_scfe_ziaskehorn.02.tooltip: "All of our commanders gain the traits ['leader_trait:leader_trait_victory_or_death'] and ['leader_trait:leader_trait_reckless'] and lose all restraint."
 mem_scfe_ziaskehorn_site: "The Fires of Ziaskehorn"
 mem_scfe_ziaskehorn_site_desc: "The surface of §Y[From.Planet.GetName]§! seems as if once it had been inhabited, but now is nothing more than an inhospitable, volcanic rock. Multiple satellites still orbit the planet, but no trace of FTL-technologies is to be found. The presumedly pre-FTL civilization which once existed on [From.Planet.GetName] appears to have gone extinct. All that remains are ruins of large cities, charred and burned."
 # discover event
 mem_scfe_ziaskehorn.99.name: "Buried Under Lava" 
 mem_scfe_ziaskehorn.99.desc: "Preliminary surveys of §Y[FROMFROM.Planet.GetName]§! uncovered evidence that the planet was once inhabited. Large urban centers rest torn apart and overrun by flowing lava, significantly damaged and slowly melting. Nuclear radition concentrated around small towers indicate nuclear technology. The lava is slowly but surely devouring any evidence we could study."
 # digsite events
 mem_scfe_ziaskehorn.11.name: "A Fiery End"
 mem_scfe_ziaskehorn.11.desc: "Preliminary investigations down on §Y[From.Planet.GetName]§! indicate that the current volcanic state of the planet is due to a cataclysmic event which occurred at least 3,000 years ago. The [Root.Owner.GetArchaeologistPlural] noticed a repetition of a single word found around various sites. After barely understanding the native languages, this single word '§rZiaskehorn§!' appears to have no translation. Instead it seems to be a name. Since its mention is not limited to a single location, it must have held significant meaning for the former inhabitants, though what it was eludes us for the time being."
 mem_scfe_ziaskehorn.11.a: "See what else you can find."
 mem_scfe_ziaskehorn.11.b: "The fire rises!"
 mem_scfe_ziaskehorn.12.name: "War Never Changes"
 mem_scfe_ziaskehorn.12.desc: "Delving deeper into the scorched remains of §Y[From.Planet.GetName]§!, the [Root.Owner.GetArchaeologistPlural] have recovered data-crystals containing fragments of the most recent history of the inhabitants of the planet, now known as the Phezidii. For the better part of a century, four Phezidiian countries were locked in a state of indiscriminate total war among each other.\n\nDuring said conflict a single nation, the Aztiel Commonwealth, obtained nuclear weaponry. In response to the technological progression their main rival, the Nipa, desperately sought equal power to match theirs. Yet, instead of replicating nuclear technologies, the deeply religous Nipa followed a different lead provided by ancient Phezidiian religious texts. Again, the term 'Ziaskehorn' was mentioned prominently."
 mem_scfe_ziaskehorn.12.a: "Keep digging!"
 mem_scfe_ziaskehorn.13.name: "Ancient Gods"
 mem_scfe_ziaskehorn.13.desc: "Having been able to uncover some of the ancient texts hidden away in the remnant ruins of §Y[From.Planet.GetName]§! describing the new weapon employed by the Nipa, we have been albe to establish a rough timeline of the events. §rThe Fires of Ziaskehorn§!, apparently an at the time two millenia old prophecy depicting the end of the world, first appearing in early Phezidiian writing and religion, would ignite after an individual had received the Ziaskehorn Flame from the ancient Phezidiian goddess of fire, Zia. According to the prophecy, Zia would bestow the flame to a worthy individual to become as a shining beacon and end the great war."
 mem_scfe_ziaskehorn.13.a: "Disconcerting."
 mem_scfe_ziaskehorn.13.b: "Burn bright!"
 mem_scfe_ziaskehorn.14.name: "The Ziaskehorn Flame"
 mem_scfe_ziaskehorn.14.desc: "The Nippa, in the hopes of winning the ever-lasting war against the Aztiel Commonwealth searched for the 'Fires of Ziaskehorn' and performed a ritual to summon goddess Zia. According to the accounts, the ritual was successful and their ruler was given the Flame. Yet, unable to contain the raging fire within him, the flame became unstable and the rapidly consumed the entire world, killing all inhabitants cleansening firestorm. The war ended and the prophecy was fulfilled. Ziaskehorn had unfolded across the planet.\n\nIronically, the last fully intact relic of Phezidii society is what was left of the Ziaskehorn Flame, a small orb burning with the same intensity a miniature star would."
 mem_scfe_ziaskehorn.14.a: "Fascinating."
 mem_scfe_ziaskehorn.14.b: "Illuminate the dark skies!"
 # random events
 mem_scfe_ziaskehorn.21.name: "Curse of the Ziaskehorn Flame"
 mem_scfe_ziaskehorn.21.desc: "While excavating the ruins on §Y[From.Planet.GetName]§!, Science Officer §G[Root.Leader.GetName]§! felt a chilling sensation throughout [Root.Leader.GetHisHer] entire body. Albeit odd on a planet as blazing as is sun, [Root.Leader.GetHeShe] assures us that [Root.Leader.GetHeShe] is fine. The rest of the digsite team, however, disagrees. Our Science Officer is nothing more than a shadow of the great leader [Root.Leader.GetHeShe] once was, slowly withering away."
 mem_scfe_ziaskehorn.22.name: "Volcanic Eruption"
 mem_scfe_ziaskehorn.22.desc: "Many [Root.Owner.GetArchaeologistPlural] were killed when a volcano erupted near the digsite on §Y[From.Planet.GetName]§!. Miraculously, §G[Root.Leader.GetName]§! emerged unscathed from the aftermath, but work at the site has been momentarily halted as the expedition team attempts to re-establish order and proceeds to clean up the remaining debris."
 mem_scfe_ziaskehorn.23.name: "Hot Room"
 mem_scfe_ziaskehorn.23.desc: "Our [Root.Owner.GetArchaeologistPlural] working on §Y[From.Planet.GetName]§! have stumbled into a half-buried building filled with persistent thick, hot smoke densely clouding every room within. Any attempts to clear this strange smoke failed, leaving our team no alternative than to stumble through it with barely any vision whatsoever.\n\nNevertheless, Science Officer §G[Root.Leader.GetName]§! assures us, this will help the team with uncovering the past secrets of §Y[From.Planet.GetName]§!."
 mem_scfe_ziaskehorn.24.name: "Magma Overflow"
 mem_scfe_ziaskehorn.24.desc: "Our archaeological expedition on §Y[From.Planet.GetName]§! has encountered significant difficulties while attempting to dig through some of the urban area taken over by the burning surface of the planet. Science Officer §Y[Root.Leader.GetName]§! reports that they require some resources and additional equipment in order to remove a severe lava-overflow to continue with the exploration or risk significant delays at the digsite."
 mem_scfe_embers_of_ziaskehorn: "Embers of Ziaskehorn"
 mem_scfe_embers_of_ziaskehorn_desc: "The Ziaskehorn Flame has left us, leaving our armies exhausted and troubled. It will take time for them to recover."
