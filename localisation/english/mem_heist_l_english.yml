 sm_mem_heist_system_complex_mem_aevum_system_desc:0 "The temporal fluctations of real space in this system are worth to study."
 sm_mem_heist_system_complex_mem_broken_clock_system_desc:0 "Their is an odd disturbance of time-space in this system. "
 sm_mem_heist_system_complex_mem_descended_system_desc:0 "All over the system we find traces of otherworldy activity that are worth a study. "
 sm_mem_heist_system_complex_mem_ceaseless_mirror_system_desc:0 "This system seems heavily disturbed by the massive gravitional the wormhole produces."
 sm_mem_heist_system_complex_mem_vazuran_homesystem_desc:0 "Searching through the leftovers of the Vazurans might yield interesting discoveries."
 sm_mem_heist_system_complex_mem_wargame_system_desc:0 "A wartorn system with little to no uniqueness, yet we might find hidden knowledge."
 sm_mem_heist_system_complex_mem_es_system_desc:0 "This system seems strangly familiar, as if it would reference something from history."
 sm_mem_heist_system_complex_lcluster1_desc:0 "This gateway and everything inside the cluster seems connected the nanites and their potential."
 sm_mem_heist_system_complex_amoeba_home_system_desc:0 "Many mysteries shroud this system and a thorough search might reveal the Amoeba`s secretes."
 sm_mem_heist_system_complex_surveillance_supercomputer_system_desc:0 "A massive world filled with machine filled to the brim. They observed us for eternity and know so much about our galaxy."
 sm_mem_heist_system_complex_formless_system_desc:0 "Everything about this system seems strange. It is only logical to dedicate an entire research team here."
 sm_mem_heist_system_complex_tiyanki_home_system_desc:0 "Many mysteries shroud this system and a thorough search might reveal the Tiyanki`s secretes."
 sm_mem_heist_system_complex_tiyanki_graveyard_system_desc:0 "Many mysteries shroud this system and a thorough search might reveal the Tiyanki`s secretes."
 sm_mem_heist_system_complex_crystal_home_system_desc:0 "Many mysteries shroud this system and a thorough search might reveal the Crystaline Entities`s secretes."

