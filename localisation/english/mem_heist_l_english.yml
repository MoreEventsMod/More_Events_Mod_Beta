 ap_mem_heist:0 "Cosmic Phenomena"
 ap_mem_heist_desc:0 "The galaxy is vast and full of wonders. Studying the world around us will inevitably help us understand ourself better. We should take a closer look at all those bizarre systems around us and study the phenomena presented to us."
