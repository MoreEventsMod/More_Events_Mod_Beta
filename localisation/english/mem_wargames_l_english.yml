 mem_wargame.1.name:0 "Ancient Battlefield"
 mem_wargame.1.desc:0 "The trinary §Y[From.GetName] System§! is quite an unusual sight. \n\nLittered with debris, it nevertheless is also filled with life, and multiple planets in the system seem to host primitive civilizations. \n\nWe are detecting an abandoned station orbiting one of the isolated planets, quietly watching over the system."
 mem_wargame.1.a:0 "We should investigate."

 MEM_WARGAME_EXPLORE_STATION:0 "Exploring Abandoned Station"
 MEM_WARGAME_EXPLORE_STATION_DESC:0 "While surveying the §Y[mem_wargame_system.GetName] system§! we've encountered an abandoned station orbiting one of the planets. It might hold interesting information regarding the system's past."

 mem_wargame.2.name:0 "War Games"
 mem_wargame.2.desc:0 "[Root.GetName] reports a successful investigation of a strange station orbiting [mem_wargate_station_planet.GetName]. \n\nJudging by the surviving data cores, the system was set up as a massive experiment, or possibly a form of entertainment. \n\nFour species were uplifted by an unknown party, provided with FTL-incapable warships and set to fight each other, while their benefactors could watch from a safely hidden location on the system's outskirts. \n\nThe experiment has come to an abrupt end when a group of conspirators from all four species has infiltrated the station and massacred everyone on board. Strangely, no retaliation has followed, and the natives, lacking the practical knowledge required to maintain the technology they had been gifted, soon settled back into a primitive life."

 # New Content for 2.3 dig

 mem_wargames_station_site: "Abandoned Station"
 mem_wargames_station_site_desc: "Tucked away on the outskirts of the system, hidden by the atmosphere of a gas giant, this abandoned station definitely warrants a study."

 mem_wargame.3.name: "The Hangar"
 mem_wargame.3.desc: "It wasn't that hard to find an entry point to the station. A shuttle hangar is left wide open, and the air has been vented, leaving no atmosphere in this section of the station. \n\nScorch marks from energy weapons are seen on some of the walls, along with, surprisingly enough, the impacts from chemically propelled ballistic weaponry. The reason for the air venting remains unclear for now - but it was definitely not due to fighting."
 mem_wargame.4.name: "The Viewing Hall"
 mem_wargame.4.desc: "Archaeologists are making progress inside the station orbiting [From.Planet.GetName]. \n\nTheir most recent discovery is a large room, with walls covered in large screens and filled with amenities for a large number of viewers. A bar, tables and seating are identifiable. Minor signs of fighting, such as shattered glasses and broken screens, can also be seen."
 mem_wargame.5.name: "War Games"
 mem_wargame.5.desc: "[Leader.GetName] reports a successful investigation of a strange station orbiting [From.Planet.GetName]. \n\nJudging by the surviving data cores, the system was set up as a massive experiment, or possibly a form of entertainment. \n\nFour species were uplifted by an unknown party, provided with FTL-incapable warships and set to fight each other, while their benefactors could watch from a safely hidden location on the system's outskirts. \n\nThe experiment came to an abrupt end when a group of conspirators from all four species has infiltrated the station and massacred everyone on board. Strangely, no retaliation has followed, and the natives, lacking the practical knowledge required to maintain the technology they had been gifted, soon settled back into a primitive life."

 mem_wargame.5.ega: "It's all fun and games until someone gets thrown out of the airlock."
 mem_wargame.5.pac: "Such barbarism..."
 mem_wargame.5.pacphobe: "Play stupid games - win stupid prizes."
 mem_wargame.5.mil: "Sounds fun."
 mem_wargame.5.mat: "It was probably very educational."

 mem_wargames_comprehensive_study: "Comprehensive Psychohistory"
 mem_wargames_comprehensive_study_desc: "Data recovered from the Wargame-observing station has changed a lot of what we understand as primitive civilizations."



 astral_rift_mem_warzone_rift:0 "Storm of Steel"

mem_rift_warzone.1.name:0 "Storm of Steel"
mem_rift_warzone.1.desc:0 "We have arrived to a surface of an inhabited planet.\n\nSpecifically, we have landed in a middle of a ruined city, constructed using early industrial technology. We can hear remote detonations and occasionally detect primitive fixed wing heavier than air aircrafts flying overhead, but our direct observation capabilities are obstructed the surrounding ruins. The natives are also oblivious to our presence, at least for now."

mem_rift_warzone.1.a:0 "Get our bearings"

mem_rift_warzone.10.name:0 "Stalemate"
mem_rift_warzone.10.desc:0 "With the modern technology at our disposal, observing the primitives was not difficult. Using the drones for covert aerial surveillance and tapping into their primitive wireless communications, we have managed to compose a fairly comprehensive picture of what was going on.\n\nThe world is populated by a primitive mammalian species that is currently embroiled in a massive military conflict. Although the belligerents are two massive alliances involving, directly or indirectly a majority of world's powers, the main conflict (Or at least the conflict we landed in the middle of) is being thought between the two: one rallied under a blue banner with some kind of heraldic avian creature, while the other represents itself with a red banner with an image of an arthropod. The ideological and cultural differences between the two, although no doubt significant to them, are trivial and obscure to us.\n\nAs it currently stands, the conflict is in a bloody stalemate, and we have landed right in the middle of so-called "no-man's land" - a treaterous stretch of terrain that neither side dares to cross to attack - for now."

mem_rift_warzone.10.a:0 "Survey the warzone without interfering"
mem_rift_warzone.10.b:0 "Attempt to contact the belligerent"
mem_rift_warzone.10.c:0 "Attack Reds"
mem_rift_warzone.10.d:0 "Attack Blues"
mem_rift_warzone.10.e:0 "Attack Both"

mem_rift_warzone.30.name:0 "Insights"
mem_rift_warzone.30.desc:0 "We spent a considerable effort surveying the battlefield, noting the logistics, troop manoeuvres and attempted engagements.\n\nHowever, it seems the rift is gradually losing stability, and we will be forced to leave, or risk getting stranded forever. From now on, our ability to observe the planet will be extremely limited."
mem_rift_warzone.30.a:0 "Depart"

mem_rift_warzone.31.name:0 "Truce"
mem_rift_warzone.31.desc:0 "After the first few attempts to contact the locals through their radio channels were brushed off as "enemy machinations", we deployed long-ranged recon drones to reach and communicate with the two sides through audio channels.\n\nAlthough at first we were met with the same kind of denial, we soon managed to convince them through demonstrating the superiority of our technology. Eventually the two sides agreed to call the truce and approach our sphere's position."

mem_rift_warzone.31.a:0 "Let us meet them"

mem_rift_warzone.32.name:0 "Hostiles Incoming"
mem_rift_warzone.32.desc:0 "The rift sphere is not, strictly speaking, a weapon platform, due to need to fit as much scientific equipment as possible into a relatively small vessel.\n\nHowever, against such a primitive target, it doesn't really matter. Even the most basic autonomous probe, carrying equipment usually used for sample-taking can easily destroy the local forces. The targeting protocols were drafted to both maximising the casualties among their personnel, or, conversely, focus on neutralising their hardware while keeping loss of life as low as possible."

mem_rift_warzone.32.a:0 "Kill their soldiers"
mem_rift_warzone.32.b:0 "Destroy their weapons"

mem_rift_warzone.40.name:0 "Eradicated Frontlines"
mem_rift_warzone.40.desc:0 "The [this.MemGetTargetedSide] soldiers were completely helpless against our drone strikes. No matter what they tried to use to shoot them down or hide from them, we were wiping them, sometimes entire platoons at the time."

mem_rift_warzone.40.a:0 "Good"

mem_rift_warzone.41.name:0 "Destroyed Hardware"
mem_rift_warzone.41.desc:0 "The primitive internal combustion powered vehicles, gunpowder weaponry and basic low explosive stockpiles were easily devastated by our drones. Regardless of what kind of defences the [this.MemGetTargetedSide] forces attempted to implement, we easily bypassed them, neutralising most of their weaponry on the spot."

mem_rift_warzone.41.a:0 "Good"

mem_rift_warzone.43.name:0 "Panic"
mem_rift_warzone.43.desc:0 "The panic spread among the [this.MemGetTargetedSide] forces, in a belief that the [this.MemGetTargetedSide] forces are deploying some kind of invincible superweapon against them. Our monitoring of the latter's channels shows confusion, as they are not aware of any such weapons themselves, though many settled on assuming some kind of secret project was deployed."

mem_rift_warzone.43.a:0 "Revel in their fear"
mem_rift_warzone.43.b:0 "Nice"

mem_rift_warzone.44.name:0 "Panic"
mem_rift_warzone.44.desc:0 "Initially, both sides panicked, assuming that the other side has deployed some kind of advanced superweapon. Soon, however, it became apparent to them that a third, far more advanced side has involved itself into a conflict."

mem_rift_warzone.44.a:0 "We got found out"

mem_rift_warzone.50.name:0 "Advancing Forces"
mem_rift_warzone.50.desc:0 "The stalemate on this segment of the front has ended. [this.MemGetTargetedSide] side is moving in. This means we no longer remain concealed.\n\nThe advanced forces have discovered our rift sphere and set up a heavily perimeter around it. Although their weapons are very primitive by our standards, sustained attacks they are planning to smoke us out do pose considerable risk, so we need to do something now."

mem_rift_warzone.50.a:0 "Charge!"

mem_rift_warzone.51.name:0 "Joined Venture"
mem_rift_warzone.51.desc:0 "Aware of our presence on the battlefield, the two sides have called a temporary truce. Now both Red and Blue forces are approaching our rift sphere, carrying as much heavy ordinance as possible in order to break inside, if they have to. Although their technology is very primitive by our standards, we need to take action before they succeed in damaging the rift sphere."

mem_rift_warzone.51.a:0 "Pull the cord and depart"
mem_rift_warzone.51.b:0 "Introduce ourselves"
mem_rift_warzone.51.c:0 "Broadcast message commending their courage"
mem_rift_warzone.51.d:0 "Broadcast message denouncing their savagery"
mem_rift_warzone.51.e:0 "Deploy a plasma charge to incinirate everyone"

mem_rift_warzone.60.name:0 "Departure"
mem_rift_warzone.60.desc:0 "A primitive ground war might be illuminating to observe, but risk of direct involvement is not worth the reward.\n\nThe locals will, no doubt, spend a lot of time wondering what exactly happened during their war, and likely will never find the answer."

mem_rift_warzone.60.a:0 "Lingering attracts trouble"

mem_rift_warzone.61.name:0 "Audio Chatter"
mem_rift_warzone.61.desc:0 "We are setting up the communication system that will allow us to remain safely within the sphere and communicate with the locals through audio channels. Aware now of our alien nature, they are waiting us to say something regarding their war."

mem_rift_warzone.61.a:0 "Offer to mediate peace talk"
mem_rift_warzone.61.b:0 "Encourage them to keep fighting"
mem_rift_warzone.61.c:0 "Ask to buy their hardware"

mem_rift_warzone.62.name:0 "No Survivors"
mem_rift_warzone.62.desc:0 "Venting plasma engulfed the surrounding area in a massive fireball. It is harmless to us, but every soldier in the vicinity was instantly vaporised, leaving no credible witnesses to our presence. The surrounding area will be inaccessible for a time being, allowing us to continue observation in peace."

mem_rift_warzone.62.a:0 "Nice"

mem_rift_warzone.70.name:0 "Peace Talks"
mem_rift_warzone.70.desc:0 "The commanders of [this.MemGetTargetedSide] seemed receptive to our urging for peace, seeing little point in continued fighting in wake of their discoveries.\n\nYet, they confess that they have little hope in convincing their national leaders in opening the negotiations, and worry that this whole incident will be suppressed just so the war could continue. Since we can't follow them due to position of the rift and properties of this plane, we can't directly influence them either."

mem_rift_warzone.70.a:0 "Wish them luck anyway"
mem_rift_warzone.70.b:0 "Tell them to testify of destructive power beyond their world"
mem_rift_warzone.70.c:0 "Tell them to testify of wonders beyond their world"

mem_rift_warzone.71.name:0 "The Victory is at Hand"
mem_rift_warzone.71.desc:0 "The hostilities soon resumed, and the [this.MemGetTargetedSide] forced eventually pushed the [this.MemGetTargetedSide] forces backwards and out of our remote surveillance range, passing the Rift Sphere as they advanced. Judging by radio intercepts, the [this.MemGetTargetedSide] military efforts are tethering on the brink of collapse.\n\nNow located in the rear of their army, the sphere is placed under constant guard by the [this.MemGetTargetedSide] troops. Even though they did not make any attempts to breach it so far, we expect them to try something eventually. The direct observation of their world is no longer productive. It's time to leave."

mem_rift_warzone.71.a:0 "Fascinating, indeed"

mem_rift_warzone.72.name:0 "Indecisive and Pointless"
mem_rift_warzone.72.desc:0 "The two armies have withdrawn to their original positions and the fighting continued. The [this.MemGetTargetedSide] terratorial gains did not last and they were eventually pushed back, turning area around the sphere into contested groundWe maintained passive observation for a considerable amount of time, but neither side was able to achieve a meaningful breakthrough. We have exhausted most avenues of study a direct observation could provide. Time to depart."

mem_rift_warzone.72.a:0 "REPLACE_ME"

