 mem_scfe_shard_ziaskehorn: "Shard of Ziaskehorn"
 mem_scfe_shard_ziaskehorn_desc_short: "This shard, a crystal fragment from the scorched surface of a planet ravaged by the enigmatic Fires of Ziaskehorn, exudes an intense and enduring heat"
